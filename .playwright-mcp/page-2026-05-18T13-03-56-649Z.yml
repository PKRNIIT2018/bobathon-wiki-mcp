              - text: "]"
          - figure "The State Theater (Ann Arbor, MI) shows a double feature of Kill Bill Volume 1 and Volume 2." [ref=e730]:
            - link [ref=e731] [cursor=pointer]:
              - /url: /wiki/File:State_Theater_Ann_Arbor,_MI.jpg
              - img [ref=e732]
            - generic [ref=e733]:
              - text: The
              - link "State Theater (Ann Arbor, MI)" [ref=e734] [cursor=pointer]:
                - /url: /wiki/State_Theatre_(Ann_Arbor,_Michigan)
              - text: shows a double feature of Kill Bill Volume 1 and Volume 2.
          - paragraph [ref=e735]:
            - text: "Kill Bill: Volume 1 was released in theaters on October 10, 2003. It was the first Tarantino film in six years, following"
            - link "Jackie Brown" [ref=e737] [cursor=pointer]:
              - /url: /wiki/Jackie_Brown
            - text: in 1997.
            - superscript [ref=e738]:
              - link "[32]" [ref=e739] [cursor=pointer]:
                - /url: "#cite_note-slays-32"
            - text: In the United States and Canada, Volume 1 was released in 3,102 theaters and grossed $22 million on its opening weekend.
            - superscript [ref=e740]:
              - link "[2]" [ref=e741] [cursor=pointer]:
                - /url: "#cite_note-Bomvol1-2"
            - text: Paul Dergarabedian, president of Exhibitor Relations, said Volume 1's opening weekend gross was significant for a "very genre specific and very violent" film that in the United States was restricted to theatergoers 17 years old and up.
            - superscript [ref=e742]:
              - link "[33]" [ref=e743] [cursor=pointer]:
                - /url: "#cite_note-gory-33"
            - text: It ranked first at the box office, beating
            - link "School of Rock" [ref=e745] [cursor=pointer]:
              - /url: /wiki/School_of_Rock
            - text: (in its second weekend) and
            - link "Intolerable Cruelty" [ref=e747] [cursor=pointer]:
              - /url: /wiki/Intolerable_Cruelty
            - text: (in its first). Volume 1 had the widest theatrical release
            - superscript [ref=e748]:
              - link "[33]" [ref=e749] [cursor=pointer]:
                - /url: "#cite_note-gory-33"
            - text: and highest-grossing opening weekend of a Tarantino film to date; Jackie Brown and
            - link "Pulp Fiction" [ref=e751] [cursor=pointer]:
              - /url: /wiki/Pulp_Fiction
            - text: (1994) had each grossed $9.3 million on their opening weekends.
            - superscript [ref=e752]:
              - link "[32]" [ref=e753] [cursor=pointer]:
                - /url: "#cite_note-slays-32"
            - text: According to the studio, exit polls showed that 90% of the audience was interested in seeing the second Kill Bill after seeing the first.
            - superscript [ref=e754]:
              - link "[34]" [ref=e755] [cursor=pointer]:
                - /url: "#cite_note-34"
          - paragraph [ref=e756]:
            - text: "Outside the United States and Canada, Kill Bill: Volume 1 was released in 20 territories. The film outperformed its main competitor Intolerable Cruelty in Norway, Denmark and Finland, though it ranked second in Italy. Volume 1 had a record opening in Japan, though expectations were higher due to the film being partially set there and because of its homages to Japanese martial arts cinema. It had \"a muted entry\" in the United Kingdom and Germany due to its 18 certificate, but \"experienced acceptable drops\" after its opening weekend in the two territories. By November 2, 2003, it had made $31 million in the 20 territories."
            - superscript [ref=e757]:
              - link "[35]" [ref=e758] [cursor=pointer]:
                - /url: "#cite_note-35"
            - text: It grossed a total of $70 million in the United States and Canada and $110.9 million in other territories for a worldwide total of $180.9 million.
            - superscript [ref=e759]:
              - link "[2]" [ref=e760] [cursor=pointer]:
                - /url: "#cite_note-Bomvol1-2"
            - text: A single film combining both parts,
            - 'link "Kill Bill: The Whole Bloody Affair" [ref=e762] [cursor=pointer]':
              - /url: /wiki/Kill_Bill:_The_Whole_Bloody_Affair
            - text: ", was theatrically released on December 5, 2025."
            - superscript [ref=e763]:
              - link "[36]" [ref=e764] [cursor=pointer]:
                - /url: "#cite_note-36"
          - generic [ref=e765]:
            - heading "Home media" [level=3] [ref=e766]
            - generic [ref=e767]:
              - text: "["
              - link "edit" [ref=e768] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=11
              - text: "]"
          - paragraph [ref=e769]:
            - text: In the United States, Volume 1 was released on
            - link "DVD" [ref=e770] [cursor=pointer]:
              - /url: /wiki/DVD
            - text: and
            - link "VHS" [ref=e771] [cursor=pointer]:
              - /url: /wiki/VHS
            - text: on April 13, 2004, the week Volume 2 was released in theaters. In a December 2005 interview, Tarantino addressed the lack of a special edition DVD for Kill Bill by stating "I've been holding off because I've been working on it for so long that I just wanted a year off from Kill Bill and then I'll do the big supplementary DVD package."
            - superscript [ref=e772]:
              - link "[37]" [ref=e773] [cursor=pointer]:
                - /url: "#cite_note-DVD1-37"
            - text: After one week of release, the film's DVD sales had surpassed its $70 million US box office gross.
            - superscript [ref=e774]:
              - link "[38]" [ref=e775] [cursor=pointer]:
                - /url: "#cite_note-38"
          - paragraph [ref=e776]:
            - text: The United States does not have a DVD boxed set of Kill Bill, though box sets of the two separate volumes are available in other countries, such as France, Japan and the United Kingdom. Upon the DVD release of Volume 2 in the US, however,
            - link "Best Buy" [ref=e777] [cursor=pointer]:
              - /url: /wiki/Best_Buy
            - text: did offer an exclusive box set slipcase to house the two individual releases together.
            - superscript [ref=e778]:
              - link "[39]" [ref=e779] [cursor=pointer]:
                - /url: "#cite_note-DVD3-39"
            - text: Volume 1, along with Volume 2, was released in
            - link "High Definition" [ref=e780] [cursor=pointer]:
              - /url: /wiki/High-definition_video
            - text: "on"
            - link "Blu-ray" [ref=e781] [cursor=pointer]:
              - /url: /wiki/Blu-ray_Disc
            - text: on September 9, 2008, in the United States. As of March 2012, Volume 1 sold 141,456 Blu-ray units in the US, grossing $1,477,791.
            - superscript [ref=e782]:
              - link "[40]" [ref=e783] [cursor=pointer]:
                - /url: "#cite_note-40"
          - paragraph [ref=e784]:
            - text: After
            - link "Disney" [ref=e785] [cursor=pointer]:
              - /url: /wiki/The_Walt_Disney_Company
            - text: sold
            - link "Miramax" [ref=e786] [cursor=pointer]:
              - /url: /wiki/Miramax
            - text: to
            - link "Filmyard Holdings" [ref=e787] [cursor=pointer]:
              - /url: /wiki/Filmyard_Holdings
            - text: in 2010, the home media and streaming rights for both Kill Bill films were sold to
            - link "Lionsgate" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Lionsgate_Films
            - text: ", who reissued the Blu-ray and DVD releases on April 26, 2011."
            - superscript [ref=e789]:
              - link "[41]" [ref=e790] [cursor=pointer]:
                - /url: "#cite_note-41"
            - text: A limited edition steelbook release sold exclusively in Best Buy stores was released on November 24, 2013.
            - superscript [ref=e791]:
              - link "[42]" [ref=e792] [cursor=pointer]:
                - /url: "#cite_note-42"
            - text: Following
            - link "Paramount Global" [ref=e793] [cursor=pointer]:
              - /url: /wiki/Paramount_Global
            - text: "'s 49% stake in Miramax, the film was reissued on Blu-ray and DVD by"
            - link "Paramount Pictures Home Entertainment" [ref=e794] [cursor=pointer]:
              - /url: /wiki/Paramount_Pictures_Home_Entertainment
            - text: on September 22, 2020.
            - superscript [ref=e795]:
              - link "[43]" [ref=e796] [cursor=pointer]:
                - /url: "#cite_note-43"
            - text: In 2023, Lionsgate announced that they had purchased the distribution rights to both Kill Bill films, along with
            - link "Jackie Brown" [ref=e798] [cursor=pointer]:
              - /url: /wiki/Jackie_Brown
            - text: ", and announced a UHD release for the film's 20th anniversary; all three films were released on Blu-ray and DVD on October 10, 2023, and in 4K on physical and digital on January 21, 2025, with both Kill Bill films upscaled to 4K."
            - superscript [ref=e799]:
              - link "[44]" [ref=e800] [cursor=pointer]:
                - /url: "#cite_note-44"
            - superscript [ref=e801]:
              - link "[45]" [ref=e802] [cursor=pointer]:
                - /url: "#cite_note-45"
            - superscript [ref=e803]:
              - link "[46]" [ref=e804] [cursor=pointer]:
                - /url: "#cite_note-46"
          - generic [ref=e805]:
            - heading "Reception" [level=2] [ref=e806]
            - generic [ref=e807]:
              - text: "["
              - link "edit" [ref=e808] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=12
              - text: "]"
          - paragraph [ref=e809]:
            - text: On the review aggregator
            - link "Rotten Tomatoes" [ref=e810] [cursor=pointer]:
              - /url: /wiki/Rotten_Tomatoes
            - text: ", Kill Bill: Volume 1 has a score of 85% based on reviews from 238 critics. Its consensus reads: \"Kill Bill is admittedly little more than a stylish revenge thriller – albeit one that benefits from a wildly inventive surfeit of style.\""
            - superscript [ref=e811]:
              - link "[47]" [ref=e812] [cursor=pointer]:
                - /url: "#cite_note-47"
            - text: At
            - link "Metacritic" [ref=e813] [cursor=pointer]:
              - /url: /wiki/Metacritic
            - text: ", which assigns a weighted average score 69 out of 100 based on 43 reviews from mainstream critics, indicating \"generally favorable\" reviews."
            - superscript [ref=e814]:
              - link "[48]" [ref=e815] [cursor=pointer]:
                - /url: "#cite_note-48"
            - text: Audiences polled by
            - link "CinemaScore" [ref=e816] [cursor=pointer]:
              - /url: /wiki/CinemaScore
            - text: gave the film an average grade of "B+" on an A+ to F scale.
            - superscript [ref=e817]:
              - link "[49]" [ref=e818] [cursor=pointer]:
                - /url: "#cite_note-CinemaScore-49"
          - paragraph [ref=e819]:
            - link "A. O. Scott" [ref=e820] [cursor=pointer]:
              - /url: /wiki/A._O._Scott
            - text: of
            - link "The New York Times" [ref=e822] [cursor=pointer]:
              - /url: /wiki/The_New_York_Times
            - text: "wrote:"
          - blockquote [ref=e823]:
            - paragraph [ref=e824]:
              - text: While being so relentlessly exposed to a filmmaker's idiosyncratic turn-ons can be tedious and off-putting, the undeniable passion that drives Kill Bill is fascinating, even, strange to say it, endearing. Mr. Tarantino is an irrepressible showoff, recklessly flaunting his formal skills as a choreographer of high-concept violence, but he is also an unabashed cinephile, and the sincerity of his enthusiasm gives this messy, uneven spectacle an odd, feverish integrity.
              - superscript [ref=e825]:
                - link "[50]" [ref=e826] [cursor=pointer]:
                  - /url: "#cite_note-50"
          - paragraph [ref=e827]:
            - link "Manohla Dargis" [ref=e828] [cursor=pointer]:
              - /url: /wiki/Manohla_Dargis
            - text: of the
            - link "Los Angeles Times" [ref=e830] [cursor=pointer]:
              - /url: /wiki/Los_Angeles_Times
            - text: "called Kill Bill: Volume 1 a \"blood-soaked valentine to movies. ... It's apparent that Tarantino is striving for more than an off-the-rack mash note or a pastiche of golden oldies. It is, rather, his homage to movies shot in celluloid and wide, wide, wide, wide screen — an ode to the time right before movies were radically secularized.\" She also recognized Tarantino's technical talent, but thought the film's appeal was too limited to popular culture references, calling its story \"the least interesting part of the whole equation\"."
            - superscript [ref=e831]:
              - link "[51]" [ref=e832] [cursor=pointer]:
                - /url: "#cite_note-51"
            - link "Roger Ebert" [ref=e833] [cursor=pointer]:
              - /url: /wiki/Roger_Ebert
            - text: of the
            - link "Chicago Sun-Times" [ref=e835] [cursor=pointer]:
              - /url: /wiki/Chicago_Sun-Times
            - text: "gave it 4 out of 4, describing Tarantino as \"effortlessly and brilliantly in command of his technique\". He wrote: \"The movie is not about anything at all except the skill and humor of its making. It's kind of brilliant.\""
            - superscript [ref=e836]:
              - link "[52]" [ref=e837] [cursor=pointer]:
                - /url: "#cite_note-52"
          - paragraph [ref=e838]:
            - text: Cultural historian
            - link "Maud Lavin" [ref=e839] [cursor=pointer]:
              - /url: /wiki/Maud_Lavin
            - text: states that the Bride's embodiment of revenge taps into viewers' personal fantasies of committing violence. For audiences, particularly women viewers, the character provides a complex site for identification with one's own aggression.
            - superscript [ref=e840]:
              - link "[53]" [ref=e841] [cursor=pointer]:
                - /url: "#cite_note-53"
          - generic [ref=e842]:
            - heading "Accolades" [level=3] [ref=e843]
            - generic [ref=e844]:
              - text: "["
              - link "edit" [ref=e845] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=13
              - text: "]"
          - paragraph [ref=e846]:
            - link "Uma Thurman" [ref=e847] [cursor=pointer]:
              - /url: /wiki/Uma_Thurman
            - text: received a
            - link "Golden Globe Best Actress" [ref=e848] [cursor=pointer]:
              - /url: /wiki/Golden_Globe_Award_for_Best_Actress_%E2%80%93_Motion_Picture_Drama
            - text: nomination in 2004. She was also nominated in 2004 for a
            - link "BAFTA Award for Best Actress in a Leading Role" [ref=e849] [cursor=pointer]:
              - /url: /wiki/BAFTA_Award_for_Best_Actress_in_a_Leading_Role
            - text: ", in addition with four other"
            - link "BAFTA" [ref=e850] [cursor=pointer]:
              - /url: /wiki/BAFTA
            - text: "nominations. Kill Bill: Volume 1 was placed in"
            - link "Empire" [ref=e852] [cursor=pointer]:
              - /url: /wiki/Empire_(film_magazine)
            - text: Magazine's list of the 500 Greatest Films of All Time at number 325 and the Bride was also ranked number 66 in Empire magazine's "100 Greatest Movie Characters".
            - superscript [ref=e853]:
              - link "[54]" [ref=e854] [cursor=pointer]:
                - /url: "#cite_note-54"
            - text: In 2025, the film ranked number 61 on
            - link "The New York Times" [ref=e856] [cursor=pointer]:
              - /url: /wiki/The_New_York_Times
            - text: "' list of \"The 100 Best Movies of the 21st Century\" and number 48 on the \"Readers' Choice\" edition of the list."
            - superscript [ref=e857]:
              - link "[55]" [ref=e858] [cursor=pointer]:
                - /url: "#cite_note-55"
            - superscript [ref=e859]:
              - link "[56]" [ref=e860] [cursor=pointer]:
                - /url: "#cite_note-Times-56"
            - text: Neither Kill Bill movie received any
            - link "Academy Awards" [ref=e861] [cursor=pointer]:
              - /url: /wiki/Academy_Awards
            - text: (Oscars) nominations.
          - table [ref=e862]:
            - rowgroup [ref=e863]:
              - row "Awards" [ref=e864]:
                - columnheader "Awards" [ref=e865]
              - row "Award Category Recipient(s) Outcome" [ref=e866]:
                - columnheader "Award" [ref=e867]
                - columnheader "Category" [ref=e868]
                - columnheader "Recipient(s)" [ref=e869]
