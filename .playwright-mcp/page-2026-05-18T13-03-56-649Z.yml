            - generic [ref=e516]: The chapel used in the opening sequence
          - paragraph [ref=e517]:
            - link "Quentin Tarantino" [ref=e518] [cursor=pointer]:
              - /url: /wiki/Quentin_Tarantino
            - text: and Uma Thurman conceived the Bride character during the production of Tarantino's 1994 film
            - link "Pulp Fiction" [ref=e520] [cursor=pointer]:
              - /url: /wiki/Pulp_Fiction
            - text: ; Kill Bill credits the Bride character to "Q & U".
            - superscript [ref=e521]:
              - link "[4]" [ref=e522] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - text: Tarantino spent a year and a half writing the script while he was living in New York City in 2000 and 2001, spending time with Thurman and her newborn daughter
            - link "Maya" [ref=e523] [cursor=pointer]:
              - /url: /wiki/Maya_Hawke
            - text: .
            - superscript [ref=e524]:
              - link "[4]" [ref=e525] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - superscript [ref=e526]:
              - link "[5]" [ref=e527] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: Reuniting with the more mature Thurman, now a mother, influenced the way Tarantino wrote the Bride character. He did not realize that her child could still be alive until the end of the writing process.
            - superscript [ref=e528]:
              - link "[4]" [ref=e529] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
          - paragraph [ref=e530]:
            - text: Tarantino developed many of the Bride's characteristics for the character of
            - link "Shosanna Dreyfus" [ref=e531] [cursor=pointer]:
              - /url: /wiki/Inglourious_Basterds#Shosanna_Dreyfus
            - text: in his 2009 film
            - generic [ref=e532]:
              - link "Inglourious Basterds" [ref=e533] [cursor=pointer]:
                - /url: /wiki/Inglourious_Basterds
              - text: ","
            - text: which he worked on before Kill Bill. Dreyfus was to be an assassin with a list of Nazis she would cross off as she killed. Tarantino switched the character to the Bride and redeveloped Dreyfus.
            - superscript [ref=e534]:
              - link "[6]" [ref=e535] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: Thurman cited
            - link "Clint Eastwood" [ref=e536] [cursor=pointer]:
              - /url: /wiki/Clint_Eastwood
            - text: "'s performance as"
            - link "Blondie" [ref=e537] [cursor=pointer]:
              - /url: /wiki/Man_with_No_Name
            - text: in the 1966 film
            - link "The Good, the Bad and the Ugly" [ref=e539] [cursor=pointer]:
              - /url: /wiki/The_Good,_the_Bad_and_the_Ugly
            - text: as an inspiration. In her words, Eastwood "says almost nothing but somehow manages to portray a whole character".
            - superscript [ref=e540]:
              - link "[7]" [ref=e541] [cursor=pointer]:
                - /url: "#cite_note-7"
          - paragraph [ref=e542]:
            - text: Tarantino originally wrote Bill for
            - link "Warren Beatty" [ref=e543] [cursor=pointer]:
              - /url: /wiki/Warren_Beatty
            - text: ", but as the character developed and the role required greater screen time and martial arts training, he rewrote it for"
            - link "David Carradine" [ref=e544] [cursor=pointer]:
              - /url: /wiki/David_Carradine
            - text: .
            - superscript [ref=e545]:
              - link "[8]" [ref=e546] [cursor=pointer]:
                - /url: "#cite_note-bbc.co.uk-8"
            - text: Beatty said he turned the role down, as he did not want to be away from his family while shooting in China.
            - superscript [ref=e547]:
              - link "[9]" [ref=e548] [cursor=pointer]:
                - /url: "#cite_note-9"
            - text: Tarantino also considered
            - link "Bruce Willis" [ref=e549] [cursor=pointer]:
              - /url: /wiki/Bruce_Willis
            - text: for the role.
            - superscript [ref=e550]:
              - link "[10]" [ref=e551] [cursor=pointer]:
                - /url: "#cite_note-10"
            - text: He cast Daryl Hannah as Elle Driver after seeing her performance in the television film
            - link "First Target" [ref=e553] [cursor=pointer]:
              - /url: /wiki/First_Target
            - text: . The physical similarities between Thurman and Hannah inspired how he wrote the rivalry between the characters.
            - superscript [ref=e554]:
              - link "[11]" [ref=e555] [cursor=pointer]:
                - /url: "#cite_note-PressConference-11"
            - link "Michelle Yeoh" [ref=e556] [cursor=pointer]:
              - /url: /wiki/Michelle_Yeoh
            - text: met with Tarantino about a role.
            - superscript [ref=e557]:
              - link "[12]" [ref=e558] [cursor=pointer]:
                - /url: "#cite_note-12"
          - paragraph [ref=e559]:
            - text: An early draft included a chapter set after the confrontation with Vernita in which the Bride has a gunfight with Gogo Yubari's vengeful sister Yuki. It was cut because it would have made the film overlong and added $1 million to the budget. Taraninto later adapted the chapter as the short animation
            - 'link "The Lost Chapter: Yuki''s Revenge" [ref=e561] [cursor=pointer]':
              - /url: /wiki/The_Lost_Chapter:_Yuki%27s_Revenge
            - text: ", released in 2025."
            - superscript [ref=e562]:
              - link "[4]" [ref=e563] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - text: Another draft featured a scene in which the Bride's car is blown up by Elle Driver.
            - superscript [ref=e564]:
              - link "[4]" [ref=e565] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
          - generic [ref=e566]:
            - heading "Filming" [level=3] [ref=e567]
            - generic [ref=e568]:
              - text: "["
              - link "edit" [ref=e569] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=5
              - text: "]"
          - figure "Reproduction of the katana used by the Bride" [ref=e570]:
            - link [ref=e571] [cursor=pointer]:
              - /url: /wiki/File:Kill_Bill_katana-P5120166-gradient.jpg
              - img [ref=e572]
            - generic [ref=e573]: Reproduction of the katana used by the Bride
          - paragraph [ref=e574]:
            - text: "When Thurman became pregnant as shooting was ready to begin, Tarantino delayed the production, saying: \"If"
            - link "Josef Von Sternberg" [ref=e575] [cursor=pointer]:
              - /url: /wiki/Josef_von_Sternberg
            - text: is getting ready to make
            - link "Morocco" [ref=e577] [cursor=pointer]:
              - /url: /wiki/Morocco_(film)
            - text: and
            - link "Marlene Dietrich" [ref=e578] [cursor=pointer]:
              - /url: /wiki/Marlene_Dietrich
            - text: gets pregnant, he waits for Dietrich!"
            - superscript [ref=e579]:
              - link "[8]" [ref=e580] [cursor=pointer]:
                - /url: "#cite_note-bbc.co.uk-8"
            - text: Principal photography began in 2002.
            - superscript [ref=e581]:
              - link "[13]" [ref=e582] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: Although the scenes are presented out of chronological order, the film was shot in sequence.
            - superscript [ref=e583]:
              - link "[4]" [ref=e584] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - text: The choreographer
            - link "Yuen Woo-Ping" [ref=e585] [cursor=pointer]:
              - /url: /wiki/Yuen_Woo-ping
            - text: ", whose credits included"
            - link "The Matrix" [ref=e587] [cursor=pointer]:
              - /url: /wiki/The_Matrix
            - text: ", was the martial arts advisor."
            - superscript [ref=e588]:
              - link "[14]" [ref=e589] [cursor=pointer]:
                - /url: "#cite_note-www.film4.com-14"
            - text: The
            - link "anime" [ref=e590] [cursor=pointer]:
              - /url: /wiki/Anime
            - text: sequence, covering O-Ren Ishii's backstory, was directed by
            - link "Kazuto Nakazawa" [ref=e591] [cursor=pointer]:
              - /url: /wiki/Kazuto_Nakazawa
            - text: and produced by
            - link "Production I.G" [ref=e592] [cursor=pointer]:
              - /url: /wiki/Production_I.G
            - text: ", which had produced films including"
            - link "Ghost in the Shell" [ref=e594] [cursor=pointer]:
              - /url: /wiki/Ghost_in_the_Shell_(1995_film)
            - text: and
            - 'link "Blood: The Last Vampire" [ref=e596] [cursor=pointer]':
              - /url: /wiki/Blood:_The_Last_Vampire
            - text: .
            - superscript [ref=e597]:
              - link "[15]" [ref=e598] [cursor=pointer]:
                - /url: "#cite_note-15"
            - text: The combined production lasted 155 days and had a budget of $55 million.
            - superscript [ref=e599]:
              - link "[16]" [ref=e600] [cursor=pointer]:
                - /url: "#cite_note-Snyder-16"
          - paragraph [ref=e601]:
            - text: According to Tarantino, the most difficult part of making the film was "trying to take myself to a different place as a filmmaker and throw my hat in the ring with other great action directors", as opposed to the dialogue scenes he was known for.
            - superscript [ref=e602]:
              - link "[4]" [ref=e603] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - text: The House of Blue Leaves sequence, in which the Bride battles dozens of yakuza soldiers, took eight weeks to film, six weeks over schedule. Tarantino wanted to create "one of the greatest, most exciting sequences in the history of cinema".
            - superscript [ref=e604]:
              - link "[14]" [ref=e605] [cursor=pointer]:
                - /url: "#cite_note-www.film4.com-14"
            - text: The crew eschewed
            - link "computer-generated imagery" [ref=e606] [cursor=pointer]:
              - /url: /wiki/Computer-generated_imagery
            - text: in favor of
            - link "practical effects" [ref=e607] [cursor=pointer]:
              - /url: /wiki/Practical_effect
            - text: used in 1970s
            - link "Chinese cinema" [ref=e608] [cursor=pointer]:
              - /url: /wiki/Cinema_of_China
            - text: ", particularly by the director"
            - link "Chang Cheh" [ref=e609] [cursor=pointer]:
              - /url: /wiki/Chang_Cheh
            - text: ", including the use of fire extinguishers and condoms to create spurts and explosions of blood. Tarantino told his crew: \"Let's pretend we're little kids and we're making a"
            - link "Super 8" [ref=e610] [cursor=pointer]:
              - /url: /wiki/Super_8_film
            - text: movie in our back yard, and you don't have all this shit. How would you achieve this effect? Ingenuity is important here!"
            - superscript [ref=e611]:
              - link "[14]" [ref=e612] [cursor=pointer]:
                - /url: "#cite_note-www.film4.com-14"
            - superscript [ref=e613]:
              - link "[17]" [ref=e614] [cursor=pointer]:
                - /url: "#cite_note-17"
          - paragraph [ref=e615]:
            - text: Near the end of filming, Thurman was injured in a car crash while filming the scene in which she drives to Bill. According to Thurman, she was uncomfortable driving the car and asked that a stunt driver do it. Tarantino assured her that the car and road were safe. She lost control of the car and hit a tree, suffering a concussion and knee injuries.
            - superscript [ref=e616]:
              - link "[18]" [ref=e617] [cursor=pointer]:
                - /url: "#cite_note-Dowd1-18"
            - text: According to Thurman, Miramax would only give her the crash footage if she signed a document "releasing them of any consequences of [Thurman's] future pain and suffering". Tarantino was apologetic, but their relationship became bitter for years afterwards. Thurman said that after the car crash she "went from being a creative contributor and performer to being like a broken tool". Miramax released the footage in 2018 after Thurman went to police following the
            - link "accusations of sexual abuse" [ref=e618] [cursor=pointer]:
              - /url: /wiki/Harvey_Weinstein_sexual_abuse_allegations
            - text: against the producer,
            - link "Harvey Weinstein" [ref=e619] [cursor=pointer]:
              - /url: /wiki/Harvey_Weinstein
            - text: .
            - superscript [ref=e620]:
              - link "[18]" [ref=e621] [cursor=pointer]:
                - /url: "#cite_note-Dowd1-18"
            - superscript [ref=e622]:
              - link "[19]" [ref=e623] [cursor=pointer]:
                - /url: "#cite_note-19"
          - generic [ref=e624]:
            - heading "Editing" [level=3] [ref=e625]
            - generic [ref=e626]:
              - text: "["
              - link "edit" [ref=e627] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=6
              - text: "]"
          - paragraph [ref=e628]:
            - text: Kill Bill was planned and filmed as a single film.
            - superscript [ref=e629]:
              - link "[16]" [ref=e630] [cursor=pointer]:
                - /url: "#cite_note-Snyder-16"
            - text: After editing began, Weinstein, who was known for pressuring filmmakers to shorten their films, suggested that Tarantino split the film in two.
            - superscript [ref=e631]:
              - link "[16]" [ref=e632] [cursor=pointer]:
                - /url: "#cite_note-Snyder-16"
            - text: This meant Tarantino did not have to cut scenes, such as the anime sequence. Tarantino told
            - link "IGN" [ref=e634] [cursor=pointer]:
              - /url: /wiki/IGN
            - text: ": \"I'm talking about scenes that are some of the best scenes in the movie, but in this hurdling pace where you're trying to tell only one story, that would have been the stuff that would have had to go. But to me, that's kind of what the movie was, are these little detours and these little grace notes.\""
            - superscript [ref=e635]:
              - link "[4]" [ref=e636] [cursor=pointer]:
                - /url: "#cite_note-Otto-2004-4"
            - text: The decision to split the film was announced in July 2003.
            - superscript [ref=e637]:
              - link "[16]" [ref=e638] [cursor=pointer]:
                - /url: "#cite_note-Snyder-16"
            - text: Tarantino saved most of the Bride's character development for the second film, saying he wanted to make her scary rather than sympathetic for Volume 1.
            - superscript [ref=e639]:
              - link "[20]" [ref=e640] [cursor=pointer]:
                - /url: "#cite_note-20"
            - text: Tarantino opted to have the scene of the Bride meeting the Crazy 88s in black and white to avoid an
            - link "NC-17" [ref=e641] [cursor=pointer]:
              - /url: /wiki/NC-17
            - text: rating.
            - superscript [ref=e642]:
              - link "[21]" [ref=e643] [cursor=pointer]:
                - /url: "#cite_note-21"
