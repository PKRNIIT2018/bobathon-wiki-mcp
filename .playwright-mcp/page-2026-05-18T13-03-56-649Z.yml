          - paragraph [ref=e661]:
            - text: Kill Bill was inspired by
            - link "exploitation films" [ref=e662] [cursor=pointer]:
              - /url: /wiki/Exploitation_film
            - text: that played in
            - link "cheap US theaters" [ref=e663] [cursor=pointer]:
              - /url: /wiki/Grindhouse
            - text: in the 1970s, including
            - link "martial arts" [ref=e664] [cursor=pointer]:
              - /url: /wiki/Martial_arts_film
            - text: films,
            - link "samurai cinema" [ref=e665] [cursor=pointer]:
              - /url: /wiki/Samurai_cinema
            - text: ","
            - link "blaxploitation" [ref=e666] [cursor=pointer]:
              - /url: /wiki/Blaxploitation
            - text: films and
            - link "spaghetti westerns" [ref=e667] [cursor=pointer]:
              - /url: /wiki/Spaghetti_Western
            - text: .
            - superscript [ref=e668]:
              - link "[23]" [ref=e669] [cursor=pointer]:
                - /url: "#cite_note-Rose,_Steve-2004-23"
            - text: It pays homage to the
            - link "Shaw Brothers Studio" [ref=e670] [cursor=pointer]:
              - /url: /wiki/Shaw_Brothers_Studio
            - text: ", known for its martial arts films, with the inclusion of the ShawScope logo in the opening titles and the \"crashing zoom\", a fast"
            - link "zoom" [ref=e671] [cursor=pointer]:
              - /url: /wiki/Zooming_(filmmaking)
            - text: usually ending in a
            - link "close-up" [ref=e672] [cursor=pointer]:
              - /url: /wiki/Close-up
            - text: commonly used in Shaw Brothers films.
            - superscript [ref=e673]:
              - link "[24]" [ref=e674] [cursor=pointer]:
                - /url: "#cite_note-Bordwell-2009-24"
            - text: The Bride's yellow tracksuit, helmet and motorcycle resemble those used by
            - link "Bruce Lee" [ref=e675] [cursor=pointer]:
              - /url: /wiki/Bruce_Lee
            - text: in the 1972 martial arts film
            - link "Game of Death" [ref=e677] [cursor=pointer]:
              - /url: /wiki/Game_of_Death
            - text: .
            - superscript [ref=e678]:
              - link "[25]" [ref=e679] [cursor=pointer]:
                - /url: "#cite_note-25"
          - paragraph [ref=e680]:
            - text: The animated sequence pays homage to the
            - link "anime" [ref=e681] [cursor=pointer]:
              - /url: /wiki/Anime
            - text: ultraviolence shown in
            - 'link "Golgo 13: The Professional" [ref=e683] [cursor=pointer]':
              - /url: /wiki/Golgo_13:_The_Professional
            - text: (1983) as well as the
            - link "urban gothic" [ref=e684] [cursor=pointer]:
              - /url: /wiki/Urban_Gothic
            - text: elements of
            - link "Wicked City" [ref=e686] [cursor=pointer]:
              - /url: /wiki/Wicked_City_(1987_film)
            - text: (1987).
            - superscript [ref=e687]:
              - link "[26]" [ref=e688] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: Tarantino stated in the supplementary material on the Kill Bill DVD that the character Hattori Hanzō was named in tribute to Sonny Chiba's former role as Hattori Hanzō (the historical 16th-century
            - link "Iga ninja" [ref=e689] [cursor=pointer]:
              - /url: /wiki/Iga-ry%C5%AB
            - text: ) in the 1980s Japanese TV series
            - link "Shadow Warriors" [ref=e691] [cursor=pointer]:
              - /url: /wiki/Shadow_Warriors_(TV_series)
            - text: .
            - superscript [ref=e692]:
              - text: "["
              - link "citation needed" [ref=e694] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
            - text: Tarantino also referenced the horror film
            - link "Goke, Body Snatcher from Hell" [ref=e696] [cursor=pointer]:
              - /url: /wiki/Goke,_Body_Snatcher_from_Hell
            - text: (1968) by mirroring its opening sequence with an almost identical shot of a plane flying against a vivid, eerie red sky, which he filmed at a Japanese studio.
            - superscript [ref=e697]:
              - link "[27]" [ref=e698] [cursor=pointer]:
                - /url: "#cite_note-27"
            - text: For the Bride's arrival in Tokyo, the production repurposed the miniature
            - link "Yokohama" [ref=e699] [cursor=pointer]:
              - /url: /wiki/Yokohama
            - text: skyline from
            - 'link "Godzilla, Mothra and King Ghidorah: Giant Monsters All-Out Attack" [ref=e701] [cursor=pointer]':
              - /url: /wiki/Godzilla,_Mothra_and_King_Ghidorah:_Giant_Monsters_All-Out_Attack
            - text: (2001), redressing it to double as Tokyo. This subtle homage was arranged by production coordinator
            - link "Shinji Higuchi" [ref=e702] [cursor=pointer]:
              - /url: /wiki/Shinji_Higuchi
            - text: ", who had worked on both films."
            - superscript [ref=e703]:
              - link "[28]" [ref=e704] [cursor=pointer]:
                - /url: "#cite_note-28"
            - superscript [ref=e705]:
              - link "[29]" [ref=e706] [cursor=pointer]:
                - /url: "#cite_note-Ryfle-Godziszewski-29"
          - paragraph [ref=e707]:
            - link "The Guardian" [ref=e709] [cursor=pointer]:
              - /url: /wiki/The_Guardian
            - text: wrote that Kill Bill's plot shares similarities with the 1973 Japanese film
            - link "Lady Snowblood" [ref=e711] [cursor=pointer]:
              - /url: /wiki/Lady_Snowblood_(film)
            - text: ", in which a woman kills off the gang who murdered her family, and observed that like how Lady Snowblood uses stills and illustration for \"parts of the narrative that were too expensive to film\", Kill Bill similarly uses \"Japanese-style animation to break up the narrative\"."
            - superscript [ref=e712]:
              - link "[23]" [ref=e713] [cursor=pointer]:
                - /url: "#cite_note-Rose,_Steve-2004-23"
            - text: The plot also resembles the 1968 French film
            - generic [ref=e714]:
              - link "The Bride Wore Black" [ref=e715] [cursor=pointer]:
                - /url: /wiki/The_Bride_Wore_Black
              - text: ","
            - text: in which a bride seeks revenge on five gang members and strikes them off a list as she kills them.
            - superscript [ref=e716]:
              - link "[30]" [ref=e717] [cursor=pointer]:
                - /url: "#cite_note-30"
            - text: According to Tarantino, the animated sequence was inspired by the 2001 Indian film
            - link "Aalavandhan" [ref=e719] [cursor=pointer]:
              - /url: /wiki/Aalavandhan
            - text: .
            - superscript [ref=e720]:
              - link "[31]" [ref=e721] [cursor=pointer]:
                - /url: "#cite_note-31"
