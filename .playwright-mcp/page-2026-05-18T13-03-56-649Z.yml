          - paragraph [ref=e376]:
            - generic [ref=e377]: "Kill Bill: Volume 1"
            - text: is a 2003 American
            - link "martial arts film" [ref=e378] [cursor=pointer]:
              - /url: /wiki/Martial_arts_film
            - text: written and directed by
            - link "Quentin Tarantino" [ref=e379] [cursor=pointer]:
              - /url: /wiki/Quentin_Tarantino
            - text: . It stars
            - link "Uma Thurman" [ref=e380] [cursor=pointer]:
              - /url: /wiki/Uma_Thurman
            - text: as
            - link "Beatrix \"the Bride\" Kiddo" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Beatrix_%22the_Bride%22_Kiddo
            - text: ", a mercenary who swears revenge on a group of assassins ("
            - link "Lucy Liu" [ref=e382] [cursor=pointer]:
              - /url: /wiki/Lucy_Liu
            - text: ","
            - link "Daryl Hannah" [ref=e383] [cursor=pointer]:
              - /url: /wiki/Daryl_Hannah
            - text: ","
            - link "Vivica A. Fox" [ref=e384] [cursor=pointer]:
              - /url: /wiki/Vivica_A._Fox
            - text: and
            - link "Michael Madsen" [ref=e385] [cursor=pointer]:
              - /url: /wiki/Michael_Madsen
            - text: ) and their leader, Bill (
            - link "David Carradine" [ref=e386] [cursor=pointer]:
              - /url: /wiki/David_Carradine
            - text: ), after they try to kill her and her unborn child. Her journey takes her to Tokyo, where she battles the
            - link "yakuza" [ref=e387] [cursor=pointer]:
              - /url: /wiki/Yakuza
            - text: .
          - paragraph [ref=e388]:
            - text: Kill Bill was inspired by 1970s
            - link "exploitation films" [ref=e389] [cursor=pointer]:
              - /url: /wiki/Exploitation_film
            - text: and
            - link "martial arts films" [ref=e390] [cursor=pointer]:
              - /url: /wiki/Martial_arts_film
            - text: . It features an
            - link "anime" [ref=e391] [cursor=pointer]:
              - /url: /wiki/Anime
            - text: sequence by
            - link "Production I.G" [ref=e392] [cursor=pointer]:
              - /url: /wiki/Production_I.G
            - text: and a
            - link "black-and-white" [ref=e393] [cursor=pointer]:
              - /url: /wiki/Black-and-white_film
            - text: sequence. Volume 1 is the first of two Kill Bill films made in a single production;
            - link "Volume 2" [ref=e395] [cursor=pointer]:
              - /url: /wiki/Kill_Bill:_Volume_2
            - text: was released six months later. They were originally set for a single release, but the film, with a runtime of over four hours, was divided in two. This meant Tarantino did not have to cut scenes.
          - paragraph [ref=e396]:
            - text: Kill Bill was theatrically released by
            - link "Miramax Films" [ref=e397] [cursor=pointer]:
              - /url: /wiki/Miramax_Films
            - text: in the United States on October 10, 2003. It received positive reviews and grossed $180.9 million worldwide on a $30 million budget, achieving the highest-grossing opening weekend of a Tarantino film to that point. A single film combining both parts,
            - 'link "Kill Bill: The Whole Bloody Affair" [ref=e399] [cursor=pointer]':
              - /url: /wiki/Kill_Bill:_The_Whole_Bloody_Affair
            - text: ", was theatrically released on December 5, 2025."
          - generic [ref=e400]:
            - heading "Plot" [level=2] [ref=e401]
            - generic [ref=e402]:
              - text: "["
              - link "edit" [ref=e403] [cursor=pointer]:
                - /url: /w/index.php?title=Kill_Bill:_Volume_1&action=edit&section=1
              - text: "]"
          - paragraph [ref=e404]:
            - text: In 1999,
            - link "the Bride" [ref=e405] [cursor=pointer]:
              - /url: /wiki/The_Bride_(Kill_Bill)
            - text: ", a former member of the Deadly Viper assassination squad, is rehearsing her marriage at a chapel in rural"
            - link "El Paso, Texas" [ref=e406] [cursor=pointer]:
              - /url: /wiki/El_Paso,_Texas
            - text: . The Deadly Vipers, led by Bill, attack the chapel, shooting everyone. As the Bride lies wounded, she tells Bill he is the father of her unborn child just as he shoots her in the head.
          - paragraph [ref=e407]: The Bride falls into a coma. In the hospital, Elle Driver, one of the Deadly Vipers, prepares to assassinate her via lethal injection. Bill aborts the mission at the last minute, as he considers it dishonorable to kill her while she is defenseless. The Bride awakens four years later and is horrified to discover she is no longer pregnant. She kills a man who intends to rape her, and a hospital worker who has been selling her body while she was comatose. She takes the hospital worker's truck and vows to kill Bill and the other Deadly Vipers.
          - paragraph [ref=e408]: The Bride goes to the home of Vernita Green, a former Deadly Viper who now leads a normal suburban life. They engage in a knife fight, which is interrupted when Vernita's young daughter arrives home. When Vernita tries to shoot the Bride with a pistol hidden in a box of cereal, the Bride throws a knife into her chest, killing her.
          - paragraph [ref=e409]:
            - text: The Bride goes to Okinawa to obtain a sword from the legendary swordsmith
            - link "Hattori Hanzō" [ref=e410] [cursor=pointer]:
              - /url: "#Hattori_Hanzō"
            - text: ", who has sworn never to forge a sword again. After learning that her target is Bill, his former student, he crafts his finest sword for her. The Bride travels to Tokyo to find another Deadly Viper, O-Ren Ishii, now the leader of the Tokyo"
            - link "yakuza" [ref=e411] [cursor=pointer]:
              - /url: /wiki/Yakuza
            - text: . After witnessing the yakuza murder her parents when she was a child, O-Ren took vengeance on the yakuza boss and replaced him after training as an elite assassin.
          - paragraph [ref=e412]:
            - text: The Bride tracks O-Ren Ishii to a restaurant, where she mutilates O-Ren's French majordomo and lawyer, Sofie Fatale, by amputating her arm. The Bride defeats O-Ren's squad of elite fighters, the Crazy 88, and kills O-Ren's bodyguard, the schoolgirl Gogo Yubari. O-Ren and the Bride duel in the restaurant's
            - link "Japanese garden" [ref=e413] [cursor=pointer]:
              - /url: /wiki/Japanese_garden
            - text: . The Bride kills O-Ren by slicing off the top of her head. She tortures Sofie for information about the other Deadly Vipers, and leaves her alive as a threat. Bill finds Sofie and asks her if the Bride knows that her daughter is alive.
          - generic [ref=e414]:
            - heading "Cast" [level=2] [ref=e415]
