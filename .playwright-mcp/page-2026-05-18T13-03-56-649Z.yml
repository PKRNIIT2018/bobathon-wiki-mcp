          - paragraph [ref=e1029]:
            - link "Kill Buljo" [ref=e1031] [cursor=pointer]:
              - /url: /wiki/Kill_Buljo
            - text: is a 2007 Norwegian parody of Kill Bill set in
            - link "Finnmark" [ref=e1032] [cursor=pointer]:
