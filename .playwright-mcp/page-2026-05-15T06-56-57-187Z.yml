          - paragraph [ref=e254]:
            - text: Web scraping, web harvesting, or web data extraction is
            - link "data scraping" [ref=e255] [cursor=pointer]:
              - /url: /wiki/Data_scraping
            - text: used for
            - link "extracting data" [ref=e256] [cursor=pointer]:
              - /url: /wiki/Data_extraction
            - text: from
            - link "websites" [ref=e257] [cursor=pointer]:
              - /url: /wiki/Website
            - text: .
            - superscript [ref=e258]:
              - link "[1]" [ref=e259] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: Web scraping software may directly access the
            - link "World Wide Web" [ref=e260] [cursor=pointer]:
              - /url: /wiki/World_Wide_Web
            - text: using the
            - link "Hypertext Transfer Protocol" [ref=e261] [cursor=pointer]:
              - /url: /wiki/Hypertext_Transfer_Protocol
            - text: or a web browser. While web scraping can be done manually by a software user, the term typically refers to automated processes implemented using a
            - link "bot" [ref=e262] [cursor=pointer]:
              - /url: /wiki/Internet_bot
            - text: or
            - link "web crawler" [ref=e263] [cursor=pointer]:
              - /url: /wiki/Web_crawler
            - text: . It is a form of copying in which specific data is gathered and copied from the web, typically into a central local
            - link "database" [ref=e264] [cursor=pointer]:
              - /url: /wiki/Database
            - text: or
            - link "spreadsheet" [ref=e265] [cursor=pointer]:
              - /url: /wiki/Spreadsheet
            - text: ", for later"
            - link "retrieval" [ref=e266] [cursor=pointer]:
              - /url: /wiki/Data_retrieval
            - text: or
            - link "analysis" [ref=e267] [cursor=pointer]:
              - /url: /wiki/Data_analysis
            - text: .
          - paragraph [ref=e268]:
            - text: Scraping a web page involves fetching it and then extracting data from it. Fetching is the downloading of a page (which a browser does when a user views a page). Therefore, web crawling is a main component of web scraping, to fetch pages for later processing. Having fetched, extraction can take place. The content of a page may be
            - link "parsed" [ref=e269] [cursor=pointer]:
              - /url: /wiki/Parsing
            - text: ", searched and reformatted, and its data copied into a spreadsheet or loaded into a database. Web scrapers typically take something out of a page, to make use of it for another purpose somewhere else. An example would be finding and copying names and telephone numbers, companies and their URLs, or e-mail addresses to a list (contact scraping). Another example is collecting competitors product prices for marketing purposes, which can involve gathering large-scale pricing datasets from e-commerce websites and analysing them using data science techniques such as trend analysis, predictive modelling, and competitive benchmarking."
          - paragraph [ref=e270]:
            - link "Contact scraping" [ref=e271] [cursor=pointer]:
              - /url: /wiki/Contact_scraping
            - text: is a type of web scraping that is used as a component of applications used for
            - link "web indexing" [ref=e272] [cursor=pointer]:
              - /url: /wiki/Web_indexing
            - text: ","
            - link "web mining" [ref=e273] [cursor=pointer]:
              - /url: /wiki/Web_mining
            - text: and
            - link "data mining" [ref=e274] [cursor=pointer]:
              - /url: /wiki/Data_mining
            - text: ", online price change monitoring and"
            - link "price comparison" [ref=e275] [cursor=pointer]:
              - /url: /wiki/Comparison_shopping_website
            - text: ", product review scraping (to watch the competition), gathering real estate listings, weather data monitoring,"
            - link "website change detection" [ref=e276] [cursor=pointer]:
              - /url: /wiki/Change_detection_and_notification
            - text: ", research, tracking online presence and reputation,"
            - link "web mashup" [ref=e277] [cursor=pointer]:
              - /url: /wiki/Web_mashup
            - text: ", and"
            - link "web data integration" [ref=e278] [cursor=pointer]:
              - /url: /wiki/Web_data_integration
            - text: .
          - paragraph [ref=e279]:
            - link "Web pages" [ref=e280] [cursor=pointer]:
              - /url: /wiki/Web_page
            - text: are built using text-based
            - link "markup languages" [ref=e281] [cursor=pointer]:
              - /url: /wiki/Markup_languages
            - text: (
            - link "HTML" [ref=e282] [cursor=pointer]:
              - /url: /wiki/HTML
            - text: and
            - link "XHTML" [ref=e283] [cursor=pointer]:
              - /url: /wiki/XHTML
            - text: ), and frequently contain a wealth of useful data in text form. However, most web pages are designed for human
            - link "end-users" [ref=e284] [cursor=pointer]:
              - /url: /wiki/End-user_(computer_science)
            - text: and not for ease of automated use. As a result, specialized tools and software have been developed to facilitate the scraping of web pages. Web scraping applications include
            - link "market research" [ref=e285] [cursor=pointer]:
              - /url: /wiki/Market_research
            - text: ", price comparison, content monitoring and"
            - link "artificial intelligence" [ref=e286] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: . Businesses rely on web scraping services to efficiently gather and utilize this data.
          - paragraph [ref=e287]:
            - text: Newer forms of web scraping involve monitoring
            - link "data feeds" [ref=e288] [cursor=pointer]:
              - /url: /wiki/Data_feed
            - text: from
            - link "web servers" [ref=e289] [cursor=pointer]:
              - /url: /wiki/Web_servers
            - text: . For example,
            - link "JSON" [ref=e290] [cursor=pointer]:
              - /url: /wiki/JSON
            - text: is commonly used as a transport mechanism between the client and the web server.
          - paragraph [ref=e291]:
            - text: There are methods that some websites use to prevent web scraping, such as detecting and disallowing bots from crawling (viewing) their pages. In response, web scraping systems use techniques involving
            - link "DOM" [ref=e292] [cursor=pointer]:
              - /url: /wiki/Document_Object_Model
            - text: parsing,
            - link "computer vision" [ref=e293] [cursor=pointer]:
              - /url: /wiki/Computer_vision
            - text: and
            - link "natural language processing" [ref=e294] [cursor=pointer]:
              - /url: /wiki/Natural_language_processing
            - text: to simulate human-like browsing to enable gathering web page content for offline parsing.
          - generic [ref=e295]:
            - heading "History" [level=2] [ref=e296]
            - generic [ref=e297]:
              - text: "["
              - link "edit" [ref=e298] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=1
              - text: "]"
          - paragraph [ref=e299]:
            - text: After the
            - link "birth of the World Wide Web" [ref=e300] [cursor=pointer]:
              - /url: /wiki/History_of_the_World_Wide_Web
            - text: in 1989, the first web robot,
            - superscript [ref=e301]:
              - link "[2]" [ref=e302] [cursor=pointer]:
                - /url: "#cite_note-2"
            - link "World Wide Web Wanderer" [ref=e303] [cursor=pointer]:
              - /url: /wiki/World_Wide_Web_Wanderer
            - text: ", was created in June 1993, which was intended only to measure the size of the web."
          - paragraph [ref=e304]:
            - text: In December 1993, the first crawler-based web search engine,
            - link "JumpStation" [ref=e305] [cursor=pointer]:
              - /url: /wiki/JumpStation
            - text: ", was launched."
            - superscript [ref=e306]:
              - text: "["
              - link "citation needed" [ref=e308] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
            - text: As there were fewer websites available on the web, search engines at that time used to rely on human administrators to collect and format links. In comparison, Jump Station was the first WWW search engine to rely on a web robot.
          - paragraph [ref=e309]:
            - text: In 2000, the first Web
            - link "API" [ref=e310] [cursor=pointer]:
              - /url: /wiki/API
            - text: and
            - link "API" [ref=e311] [cursor=pointer]:
              - /url: /wiki/API
            - text: crawler were created. In 2000,
            - link "Salesforce" [ref=e312] [cursor=pointer]:
              - /url: /wiki/Salesforce.com
            - text: and
            - link "eBay" [ref=e313] [cursor=pointer]:
              - /url: /wiki/EBay
            - text: launched their own API, with which programmers could access and download some of the data available to the public.
            - superscript [ref=e314]:
              - link "[3]" [ref=e315] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: Since then, many websites offer web APIs for people to access their public database.
          - generic [ref=e316]:
            - heading "Techniques" [level=2] [ref=e317]
            - generic [ref=e318]:
              - text: "["
              - link "edit" [ref=e319] [cursor=pointer]:
