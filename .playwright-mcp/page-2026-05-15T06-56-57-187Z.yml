            - generic [ref=e332]: (October 2025)
          - paragraph [ref=e333]:
            - text: Data extraction techniques range from manual collection to sophisticated automated systems. Advanced methods analyze the underlying structure of web pages to transform unstructured content into a
            - link "machine-readable format" [ref=e334] [cursor=pointer]:
              - /url: /wiki/Machine-readable_medium_and_data
            - text: . These techniques utilize
            - link "text processing" [ref=e335] [cursor=pointer]:
              - /url: /wiki/Text_processing
            - text: or
            - link "artificial intelligence" [ref=e336] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: ", aligning with the technical goals of the"
            - link "Semantic Web" [ref=e337] [cursor=pointer]:
              - /url: /wiki/Semantic_Web
            - text: .
          - generic [ref=e338]:
            - heading "Human copy-and-paste" [level=3] [ref=e339]
            - generic [ref=e340]:
              - text: "["
              - link "edit" [ref=e341] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=3
              - text: "]"
          - paragraph [ref=e342]: The simplest form of web scraping is manual copying and pasting of data from a web page into a text file or spreadsheet. This approach requires no technical tools and can be used when automated scraping is blocked by website restrictions or when human judgment is necessary to interpret complex content. However, manual scraping is highly inefficient for large datasets, as it is time-consuming, prone to human error, and mentally exhausting. For this reason, it is generally considered impractical compared to automated methods, except in cases where automation is not feasible.
          - generic [ref=e343]:
            - heading "Text pattern matching" [level=3] [ref=e344]
            - generic [ref=e345]:
              - text: "["
              - link "edit" [ref=e346] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=4
              - text: "]"
          - paragraph [ref=e347]:
            - text: A simple yet capable approach to extract information from web pages is to use the UNIX
            - link "grep" [ref=e348] [cursor=pointer]:
              - /url: /wiki/Grep
            - text: command or
            - link "regular expression" [ref=e349] [cursor=pointer]:
              - /url: /wiki/Regular_expression
            - text: "-matching facilities of programming languages (for instance"
            - link "Perl" [ref=e350] [cursor=pointer]:
              - /url: /wiki/Perl
            - text: or
            - link "Python" [ref=e351] [cursor=pointer]:
              - /url: /wiki/Python_(programming_language)
            - text: ), in order to find text matching a specified pattern.
          - generic [ref=e352]:
            - heading "HTTP programming" [level=3] [ref=e353]
            - generic [ref=e354]:
              - text: "["
              - link "edit" [ref=e355] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=5
              - text: "]"
          - paragraph [ref=e356]:
            - link "Static" [ref=e357] [cursor=pointer]:
              - /url: /wiki/Static_web_page
            - text: and
            - link "dynamic web pages" [ref=e358] [cursor=pointer]:
              - /url: /wiki/Dynamic_web_page
            - text: can be retrieved by posting HTTP requests to the remote web server using
            - link "socket programming" [ref=e359] [cursor=pointer]:
              - /url: /wiki/Socket_programming
            - text: .
          - generic [ref=e360]:
            - heading "HTML parsing" [level=3] [ref=e361]
            - generic [ref=e362]:
              - text: "["
              - link "edit" [ref=e363] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=6
              - text: "]"
          - paragraph [ref=e364]:
            - text: Many websites have large collections of pages generated dynamically from an underlying structured source like a database. Data of the same category are typically encoded into similar pages by a common script or template. In data mining, a program that detects such templates in a particular information source, extracts its content, and translates it into a relational form, is called a
            - link "wrapper" [ref=e365] [cursor=pointer]:
              - /url: /wiki/Wrapper_(data_mining)
            - text: . Wrapper generation algorithms assume that input pages of a wrapper induction system conform to a common template and that they can be easily identified in terms of a URL common scheme.
            - superscript [ref=e366]:
              - link "[4]" [ref=e367] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: Moreover, some
            - link "semi-structured data" [ref=e368] [cursor=pointer]:
              - /url: /wiki/Semi-structured_data
            - text: query languages, such as
            - link "XQuery" [ref=e369] [cursor=pointer]:
              - /url: /wiki/XQuery
            - text: and the HTQL, can be used to parse HTML pages and to retrieve and transform page content.
          - generic [ref=e370]:
            - heading "DOM parsing" [level=3] [ref=e371]
            - generic [ref=e372]:
              - text: "["
              - link "edit" [ref=e373] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=7
              - text: "]"
          - note [ref=e374]:
            - text: "Further information:"
            - link "Document Object Model" [ref=e375] [cursor=pointer]:
              - /url: /wiki/Document_Object_Model
          - paragraph [ref=e376]:
            - text: By using a program such as
            - link "Selenium" [ref=e377] [cursor=pointer]:
              - /url: /wiki/Selenium_(software)
            - text: or
            - link "Playwright" [ref=e378] [cursor=pointer]:
              - /url: /wiki/Playwright_(software)
            - text: ", developers can control a web browser such as"
            - link "Chrome" [ref=e379] [cursor=pointer]:
              - /url: /wiki/ChromeOS
            - text: or
            - link "Firefox" [ref=e380] [cursor=pointer]:
              - /url: /wiki/Firefox
            - text: wherein they can load, navigate, and retrieve data from websites. This method can be especially useful for scraping data from dynamic sites since a web browser will fully load each page. Once an entire page is loaded, you can access and parse the
            - link "DOM" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Document_Object_Model
            - text: using an expression language such as
            - link "XPath" [ref=e382] [cursor=pointer]:
              - /url: /wiki/XPath
            - text: .
          - generic [ref=e383]:
            - heading "Vertical aggregation" [level=3] [ref=e384]
            - generic [ref=e385]:
              - text: "["
              - link "edit" [ref=e386] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=8
              - text: "]"
          - paragraph [ref=e387]:
            - text: There are several companies that have developed vertical specific harvesting platforms. These platforms create and monitor a multitude of "bots" for specific verticals with no "man in the loop" (no direct human involvement), and no work related to a specific target site. The preparation involves establishing the knowledge base for the entire vertical and then the platform creates the bots automatically. The platform's robustness is measured by the quality of the information it retrieves (usually number of fields) and its scalability (how quick it can scale up to hundreds or thousands of sites). This scalability is mostly used to target the
            - link "Long Tail" [ref=e388] [cursor=pointer]:
              - /url: /wiki/Long_Tail
            - text: of sites that common aggregators find complicated or too labor-intensive to harvest content from.
          - generic [ref=e389]:
            - heading "Semantic annotation recognizing" [level=3] [ref=e390]
            - generic [ref=e391]:
              - text: "["
              - link "edit" [ref=e392] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=9
              - text: "]"
          - paragraph [ref=e393]:
            - text: The pages being scraped may embrace
            - link "metadata" [ref=e394] [cursor=pointer]:
              - /url: /wiki/Metadata
            - text: or semantic markups and annotations, which can be used to locate specific data snippets. If the annotations are embedded in the pages, as
            - link "Microformat" [ref=e395] [cursor=pointer]:
              - /url: /wiki/Microformat
            - text: does, this technique can be viewed as a special case of DOM parsing. In another case, the annotations, organized into a semantic layer,
            - superscript [ref=e396]:
              - link "[5]" [ref=e397] [cursor=pointer]:
                - /url: "#cite_note-5"
            - text: are stored and managed separately from the web pages, so the scrapers can retrieve data schema and instructions from this layer before scraping the pages.
          - generic [ref=e398]:
            - heading "Computer vision web-page analysis" [level=3] [ref=e399]
            - generic [ref=e400]:
              - text: "["
              - link "edit" [ref=e401] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=10
              - text: "]"
          - paragraph [ref=e402]:
            - text: There are efforts using
            - link "machine learning" [ref=e403] [cursor=pointer]:
              - /url: /wiki/Machine_learning
            - text: and
            - link "computer vision" [ref=e404] [cursor=pointer]:
              - /url: /wiki/Computer_vision
            - text: that attempt to identify and extract information from web pages by interpreting pages visually as a human being might.
            - superscript [ref=e405]:
              - link "[6]" [ref=e406] [cursor=pointer]:
                - /url: "#cite_note-6"
          - generic [ref=e407]:
            - heading "Legal issues" [level=2] [ref=e408]
            - generic [ref=e409]:
              - text: "["
              - link "edit" [ref=e410] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=11
              - text: "]"
          - img "Globe icon." [ref=e414]
          - generic [ref=e415]:
            - text: The examples and perspective in this section
            - generic [ref=e416]:
              - text: deal primarily with the United States and do not represent a
              - link "worldwide view" [ref=e417] [cursor=pointer]:
                - /url: /wiki/Wikipedia:WikiProject_Countering_systemic_bias
              - text: of the subject
            - text: .
            - generic [ref=e418]:
              - text: You may
              - link "improve this section" [ref=e419] [cursor=pointer]:
                - /url: https://en.wikipedia.org/w/index.php?title=Web_scraping&action=edit
              - text: ", discuss the issue on the"
              - link "talk page" [ref=e420] [cursor=pointer]:
                - /url: /wiki/Talk:Web_scraping
              - text: ", or create a new section, as appropriate."
            - generic [ref=e422]: (October 2015)
            - generic [ref=e424]:
              - text: (
              - link "Learn how and when to remove this message" [ref=e426] [cursor=pointer]:
                - /url: /wiki/Help:Maintenance_template_removal
              - text: )
          - paragraph [ref=e427]:
            - text: The legality of web scraping varies across the world. In general, web scraping may be against the
            - link "terms of service" [ref=e428] [cursor=pointer]:
              - /url: /wiki/Terms_of_service
            - text: of some websites, but the enforceability of these terms is unclear.
            - superscript [ref=e429]:
              - link "[7]" [ref=e430] [cursor=pointer]:
                - /url: "#cite_note-7"
          - generic [ref=e431]:
            - heading "United States" [level=3] [ref=e432]
            - generic [ref=e433]:
              - text: "["
              - link "edit" [ref=e434] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=12
              - text: "]"
          - paragraph [ref=e435]:
            - text: In the United States, website owners can use three major
            - link "legal claims" [ref=e436] [cursor=pointer]:
              - /url: /wiki/Cause_of_action
            - text: "to prevent undesired web scraping: (1) copyright infringement (compilation), (2) violation of the"
            - link "Computer Fraud and Abuse Act" [ref=e437] [cursor=pointer]:
              - /url: /wiki/Computer_Fraud_and_Abuse_Act
            - text: ("CFAA"), and (3)
            - link "trespass to chattel" [ref=e438] [cursor=pointer]:
              - /url: /wiki/Trespass_to_chattels
            - text: .
            - superscript [ref=e439]:
              - link "[8]" [ref=e440] [cursor=pointer]:
                - /url: "#cite_note-8"
            - text: However, the effectiveness of these claims relies upon meeting various criteria, and the case law is still evolving. For example, with regard to copyright, while outright duplication of original expression will in many cases be illegal, in the United States the courts ruled in
            - link "Feist Publications v. Rural Telephone Service" [ref=e441] [cursor=pointer]:
              - /url: /wiki/Feist_Publications,_Inc.,_v._Rural_Telephone_Service_Co.
            - text: that duplication of facts is allowable.
          - paragraph [ref=e442]:
            - text: U.S. courts have acknowledged that users of "scrapers" or "robots" may be held liable for committing
            - link "trespass to chattels" [ref=e443] [cursor=pointer]:
              - /url: /wiki/Trespass_to_chattels
            - text: ","
            - superscript [ref=e444]:
              - link "[9]" [ref=e445] [cursor=pointer]:
                - /url: "#cite_note-9"
            - superscript [ref=e446]:
              - link "[10]" [ref=e447] [cursor=pointer]:
                - /url: "#cite_note-10"
            - text: which involves a computer system itself being considered personal property upon which the user of a scraper is trespassing. The best known of these cases,
            - link "eBay v. Bidder's Edge" [ref=e449] [cursor=pointer]:
              - /url: /wiki/EBay_v._Bidder%27s_Edge
            - text: ", resulted in an injunction ordering Bidder's Edge to stop accessing, collecting, and indexing auctions from the eBay web site. This case involved automatic placing of bids, known as"
            - link "auction sniping" [ref=e450] [cursor=pointer]:
              - /url: /wiki/Auction_sniping
            - text: . However, in order to succeed on a claim of trespass to
            - link "chattels" [ref=e451] [cursor=pointer]:
              - /url: /wiki/Personal_property
            - text: ", the"
            - link "plaintiff" [ref=e452] [cursor=pointer]:
              - /url: /wiki/Plaintiff
            - text: must demonstrate that the
            - link "defendant" [ref=e453] [cursor=pointer]:
              - /url: /wiki/Defendant
            - text: intentionally and without authorization interfered with the plaintiff's possessory interest in the computer system and that the defendant's unauthorized use caused damage to the plaintiff. Not all cases of web spidering brought before the courts have been considered trespass to chattels.
            - superscript [ref=e454]:
              - link "[11]" [ref=e455] [cursor=pointer]:
                - /url: "#cite_note-11"
          - paragraph [ref=e456]:
            - text: One of the first major tests of
            - link "screen scraping" [ref=e457] [cursor=pointer]:
              - /url: /wiki/Screen_scraping
            - text: involved
            - link "American Airlines" [ref=e458] [cursor=pointer]:
              - /url: /wiki/American_Airlines
            - text: (AA), and a firm called FareChase.
            - superscript [ref=e459]:
              - link "[12]" [ref=e460] [cursor=pointer]:
                - /url: "#cite_note-12"
            - text: AA successfully obtained an
            - link "injunction" [ref=e461] [cursor=pointer]:
              - /url: /wiki/Injunction
            - text: from a Texas trial court, stopping FareChase from selling software that enables users to compare online fares if the software also searches AA's website. The airline argued that FareChase's websearch software trespassed on AA's servers when it collected the publicly available data. FareChase filed an appeal in March 2003. By June, FareChase and AA agreed to settle and the appeal was dropped.
            - superscript [ref=e462]:
              - link "[13]" [ref=e463] [cursor=pointer]:
                - /url: "#cite_note-13"
          - paragraph [ref=e464]:
            - link "Southwest Airlines" [ref=e465] [cursor=pointer]:
              - /url: /wiki/Southwest_Airlines
            - text: has also challenged screen-scraping practices, and has involved both FareChase and another firm, Outtask, in a legal claim. Southwest Airlines charged that the screen-scraping is Illegal since it is an example of "Computer Fraud and Abuse" and has led to "Damage and Loss" and "Unauthorized Access" of Southwest's site. It also constitutes "Interference with Business Relations", "Trespass", and "Harmful Access by Computer". They also claimed that screen-scraping constitutes what is legally known as "Misappropriation and Unjust Enrichment", as well as being a breach of the web site's user agreement. Outtask denied all these claims, claiming that the prevailing law, in this case, should be
            - link "US Copyright law" [ref=e466] [cursor=pointer]:
              - /url: /wiki/US_Copyright_law
            - text: and that under copyright, the pieces of information being scraped would not be subject to copyright protection. Although the cases were never resolved in the
            - link "Supreme Court of the United States" [ref=e467] [cursor=pointer]:
              - /url: /wiki/Supreme_Court_of_the_United_States
            - text: ", FareChase was eventually shuttered by parent company"
            - link "Yahoo!" [ref=e468] [cursor=pointer]:
              - /url: /wiki/Yahoo!
            - text: ", and Outtask was purchased by travel expense company Concur."
            - superscript [ref=e469]:
              - link "[14]" [ref=e470] [cursor=pointer]:
                - /url: "#cite_note-impervawp2011-14"
            - text: In 2012, a startup called 3Taps scraped classified housing ads from Craigslist. Craigslist sent 3Taps a cease-and-desist letter and blocked their IP addresses and later sued, in
            - link "Craigslist v. 3Taps" [ref=e472] [cursor=pointer]:
              - /url: /wiki/Craigslist_v._3Taps
            - text: . The court held that the cease-and-desist letter and IP blocking was sufficient for Craigslist to properly claim that 3Taps had violated the
            - link "Computer Fraud and Abuse Act" [ref=e473] [cursor=pointer]:
              - /url: /wiki/Computer_Fraud_and_Abuse_Act
            - text: (CFAA).
          - paragraph [ref=e474]:
            - text: Although these are early scraping decisions, and the theories of liability are not uniform, it is difficult to ignore a pattern emerging that the courts are prepared to protect proprietary content on commercial sites from uses which are undesirable to the owners of such sites. However, the degree of protection for such content is not settled and will depend on the type of access made by the scraper, the amount of information accessed and copied, the degree to which the access adversely affects the site owner's system and the types and manner of prohibitions on such conduct.
            - superscript [ref=e475]:
              - link "[15]" [ref=e476] [cursor=pointer]:
                - /url: "#cite_note-15"
          - paragraph [ref=e477]:
            - text: While the law in this area becomes more settled, entities contemplating using scraping programs to access a public web site should also consider whether such action is authorized by reviewing the terms of use and other terms or notices posted on or made available through the site. In
            - generic [ref=e478]:
              - link "Cvent Inc." [ref=e479] [cursor=pointer]:
                - /url: /wiki/Cvent
              - text: v.
              - link "Eventbrite Inc." [ref=e480] [cursor=pointer]:
                - /url: /wiki/Eventbrite
            - text: (2010), the United States
            - link "district court for the eastern district of Virginia" [ref=e481] [cursor=pointer]:
              - /url: /wiki/United_States_District_Court_for_the_Eastern_District_of_Virginia
            - text: ", ruled that the terms of use should be brought to the users' attention in order for a"
            - link "browsewrap" [ref=e482] [cursor=pointer]:
              - /url: /wiki/Browsewrap
            - text: contract or license to be enforceable.
            - superscript [ref=e483]:
              - link "[16]" [ref=e484] [cursor=pointer]:
                - /url: "#cite_note-16"
            - text: In a 2014 case, filed in the
            - link "United States District Court for the Eastern District of Pennsylvania" [ref=e485] [cursor=pointer]:
              - /url: /wiki/United_States_District_Court_for_the_Eastern_District_of_Pennsylvania
            - text: ","
            - superscript [ref=e486]:
              - link "[17]" [ref=e487] [cursor=pointer]:
                - /url: "#cite_note-17"
            - text: e-commerce site
            - link "QVC" [ref=e488] [cursor=pointer]:
              - /url: /wiki/QVC
            - text: objected to the Pinterest-like shopping aggregator Resultly's 'scraping of QVC's site for real-time pricing data. QVC alleges that Resultly "excessively crawled" QVC's retail site (allegedly sending 200-300 search requests to QVC's website per minute, sometimes to up to 36,000 requests per minute) which caused QVC's site to crash for two days, resulting in lost sales for QVC.
            - superscript [ref=e489]:
              - link "[18]" [ref=e490] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: QVC's complaint alleges that the defendant disguised its web crawler to mask its source IP address and thus prevented QVC from quickly repairing the problem. This is a particularly interesting scraping case because QVC is seeking damages for the unavailability of their website, which QVC claims was caused by Resultly.
          - paragraph [ref=e491]:
            - text: In the plaintiff's web site during the period of this trial, the terms of use link are displayed among all the links of the site, at the bottom of the page as most sites on the internet. This ruling contradicts the Irish ruling described below. The court also rejected the plaintiff's argument that the browse-wrap restrictions were enforceable in view of Virginia's adoption of the Uniform Computer Information Transactions Act (UCITA)—a uniform law that many believed was in favor on common browse-wrap contracting practices.
            - superscript [ref=e492]:
              - link "[19]" [ref=e493] [cursor=pointer]:
                - /url: "#cite_note-19"
          - paragraph [ref=e494]:
            - text: In
            - link "Facebook, Inc. v. Power Ventures, Inc." [ref=e496] [cursor=pointer]:
              - /url: /wiki/Facebook,_Inc._v._Power_Ventures,_Inc.
            - text: ", a district court ruled in 2012 that Power Ventures could not scrape Facebook pages on behalf of a Facebook user. The case is on appeal, and the"
            - link "Electronic Frontier Foundation" [ref=e497] [cursor=pointer]:
              - /url: /wiki/Electronic_Frontier_Foundation
            - text: filed a brief in 2015 asking that it be overturned.
            - superscript [ref=e498]:
              - link "[20]" [ref=e499] [cursor=pointer]:
                - /url: "#cite_note-20"
            - superscript [ref=e500]:
              - link "[21]" [ref=e501] [cursor=pointer]:
                - /url: "#cite_note-21"
            - text: In
            - link "Associated Press v. Meltwater U.S. Holdings, Inc." [ref=e503] [cursor=pointer]:
              - /url: /wiki/Associated_Press_v._Meltwater_U.S._Holdings,_Inc.
            - text: ", a court in the US held Meltwater liable for scraping and republishing news information from the Associated Press, but a court in the United Kingdom held in favor of Meltwater."
          - paragraph [ref=e504]:
            - text: The
            - link "Ninth Circuit" [ref=e505] [cursor=pointer]:
              - /url: /wiki/Ninth_Circuit
            - text: ruled in 2019 that web scraping did not violate the CFAA in
            - link "hiQ Labs v. LinkedIn" [ref=e507] [cursor=pointer]:
              - /url: /wiki/HiQ_Labs_v._LinkedIn
            - text: . The case was appealed to the
            - link "United States Supreme Court" [ref=e508] [cursor=pointer]:
              - /url: /wiki/United_States_Supreme_Court
            - text: ", which returned the case to the Ninth Circuit to reconsider the case in light of the 2021 Supreme Court decision in"
            - link "Van Buren v. United States" [ref=e510] [cursor=pointer]:
              - /url: /wiki/Van_Buren_v._United_States
            - text: which narrowed the applicability of the CFAA.
            - superscript [ref=e511]:
              - link "[22]" [ref=e512] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: On this review, the Ninth Circuit upheld their prior decision.
            - superscript [ref=e513]:
              - link "[23]" [ref=e514] [cursor=pointer]:
                - /url: "#cite_note-23"
          - paragraph [ref=e515]:
            - link "Internet Archive" [ref=e516] [cursor=pointer]:
              - /url: /wiki/Internet_Archive
            - text: collects and distributes a significant number of publicly available web pages without being considered to be in violation of copyright laws.
            - superscript [ref=e517]:
              - text: "["
              - link "citation needed" [ref=e519] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - generic [ref=e520]:
            - heading "European Union" [level=3] [ref=e521]
            - generic [ref=e522]:
              - text: "["
              - link "edit" [ref=e523] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=13
              - text: "]"
          - paragraph [ref=e524]:
            - text: In February 2006, the
            - link "Danish Maritime and Commercial Court" [ref=e525] [cursor=pointer]:
              - /url: /wiki/Maritime_and_Commercial_Court_(Denmark)
            - text: (Copenhagen) ruled that systematic crawling, indexing, and deep linking by portal site ofir.dk of real estate site Home.dk does not conflict with Danish law or the database directive of the European Union.
            - superscript [ref=e526]:
              - link "[24]" [ref=e527] [cursor=pointer]:
                - /url: "#cite_note-24"
          - paragraph [ref=e528]:
            - text: Ethical data scraping supports offmarket sourcing in business but must comply with GDPR to avoid privacy violations in automated data collection.
            - superscript [ref=e529]:
              - link "[25]" [ref=e530] [cursor=pointer]:
                - /url: "#cite_note-25"
          - paragraph [ref=e531]:
            - text: In a February 2010 case complicated by matters of jurisdiction, Ireland's High Court delivered a verdict that illustrates the
            - link "inchoate" [ref=e532] [cursor=pointer]:
              - /url: /wiki/Inchoate_offense
            - text: state of developing case law. In the case of Ryanair Ltd v Billigfluege.de GmbH, Ireland's High Court ruled
            - link "Ryanair's" [ref=e533] [cursor=pointer]:
              - /url: /wiki/Ryanair
            - text: "\""
            - link "click-wrap" [ref=e534] [cursor=pointer]:
              - /url: /wiki/Clickwrap
            - text: "\" agreement to be legally binding. In contrast to the findings of the United States District Court Eastern District of Virginia and those of the Danish Maritime and Commercial Court, Justice"
            - link "Michael Hanna" [ref=e535] [cursor=pointer]:
              - /url: /wiki/Michael_Hanna_(judge)
            - text: ruled that the hyperlink to Ryanair's terms and conditions was plainly visible, and that placing the onus on the user to agree to terms and conditions in order to gain access to online services is sufficient to comprise a contractual relationship.
            - superscript [ref=e536]:
              - link "[26]" [ref=e537] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: The decision is under appeal in Ireland's Supreme Court.
            - superscript [ref=e538]:
              - link "[27]" [ref=e539] [cursor=pointer]:
                - /url: "#cite_note-27"
          - paragraph [ref=e540]:
            - text: On April 30, 2020, the French Data Protection Authority (CNIL) released new guidelines on web scraping.
            - superscript [ref=e541]:
              - link "[28]" [ref=e542] [cursor=pointer]:
                - /url: "#cite_note-28"
            - text: The CNIL guidelines made it clear that publicly available data is still personal data and cannot be repurposed without the knowledge of the person to whom that data belongs.
            - superscript [ref=e543]:
              - link "[29]" [ref=e544] [cursor=pointer]:
                - /url: "#cite_note-29"
          - generic [ref=e545]:
            - heading "Australia" [level=3] [ref=e546]
            - generic [ref=e547]:
              - text: "["
              - link "edit" [ref=e548] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=14
              - text: "]"
          - paragraph [ref=e549]:
            - text: In Australia, the
            - link "Spam Act 2003" [ref=e550] [cursor=pointer]:
              - /url: /wiki/Spam_Act_2003
            - text: outlaws some forms of web harvesting, although this only applies to email addresses.
            - superscript [ref=e551]:
              - link "[30]" [ref=e552] [cursor=pointer]:
                - /url: "#cite_note-30"
            - superscript [ref=e553]:
              - link "[31]" [ref=e554] [cursor=pointer]:
                - /url: "#cite_note-31"
          - generic [ref=e555]:
            - heading "India" [level=3] [ref=e556]
            - generic [ref=e557]:
              - text: "["
              - link "edit" [ref=e558] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=15
              - text: "]"
          - paragraph [ref=e559]:
            - text: Leaving a few cases dealing with IPR infringement, Indian courts have not expressly ruled on the legality of web scraping. However, since all common forms of electronic contracts are enforceable in India, violating the terms of use prohibiting data scraping will be a violation of the contract law. It will also violate the
            - link "Information Technology Act, 2000" [ref=e560] [cursor=pointer]:
              - /url: /wiki/Information_Technology_Act,_2000#:~:text=From_Wikipedia,_the_free_encyclopedia_The_Information_Technology,in_India_dealing_with_cybercrime_and_electronic_commerce.
            - text: ", which penalizes unauthorized access to a computer resource or extracting data from a computer resource."
          - generic [ref=e561]:
            - heading "Methods to prevent web scraping" [level=2] [ref=e562]
            - generic [ref=e563]:
              - text: "["
              - link "edit" [ref=e564] [cursor=pointer]:
                - /url: /w/index.php?title=Web_scraping&action=edit&section=16
              - text: "]"
          - paragraph [ref=e565]: "The administrator of a website can use various measures to stop or slow a bot. Some techniques include:"
          - list [ref=e566]:
            - listitem [ref=e567]:
              - text: Blocking an
              - link "IP address" [ref=e568] [cursor=pointer]:
                - /url: /wiki/IP_address
              - text: either manually or based on criteria such as
              - link "geolocation" [ref=e569] [cursor=pointer]:
                - /url: /wiki/Geolocation
              - text: and
              - link "DNSRBL" [ref=e570] [cursor=pointer]:
                - /url: /wiki/DNSBL
              - text: . This will also block all browsing from that address.
            - listitem [ref=e571]:
              - text: Disabling any
              - link "web service" [ref=e572] [cursor=pointer]:
                - /url: /wiki/Web_service
              - link "API" [ref=e573] [cursor=pointer]:
                - /url: /wiki/Application_programming_interface
              - text: that the website's system might expose.
            - listitem [ref=e574]:
              - text: Bots sometimes declare who they are (using
              - link "user agent" [ref=e575] [cursor=pointer]:
                - /url: /wiki/User_agent
              - link "strings" [ref=e576] [cursor=pointer]:
                - /url: /wiki/String_(computer_science)
              - text: ) and can be blocked on that basis using
              - link "robots.txt" [ref=e577] [cursor=pointer]:
                - /url: /wiki/Robots_exclusion_standard
              - text: ; '
              - link "googlebot" [ref=e578] [cursor=pointer]:
                - /url: /wiki/Googlebot
              - text: "' is an example. Other bots make no distinction between themselves and a human using a browser."
            - listitem [ref=e579]: Bots can be blocked by monitoring excess traffic.
            - listitem [ref=e580]:
              - text: Bots can sometimes be blocked with tools to verify that it is a real person accessing the site, like a
              - link "CAPTCHA" [ref=e581] [cursor=pointer]:
                - /url: /wiki/CAPTCHA
              - text: ". Bots are sometimes coded to explicitly break specific CAPTCHA patterns or may employ third-party services that utilize human labor to read and respond in real-time to CAPTCHA challenges. They can be triggered because the bot is: 1) making too many requests in a short time, 2) using low-quality proxies, or 3) not covering the web scraper’s fingerprint properly."
              - superscript [ref=e582]:
                - link "[32]" [ref=e583] [cursor=pointer]:
                  - /url: "#cite_note-32"
            - listitem [ref=e584]:
              - text: "Commercial anti-bot services: Companies offer anti-bot and anti-scraping services for websites. A few web"
              - link "application firewalls" [ref=e585] [cursor=pointer]:
                - /url: /wiki/Application_firewall
              - text: have limited bot detection capabilities as well. However, many such solutions are not very effective.
              - superscript [ref=e586]:
                - link "[33]" [ref=e587] [cursor=pointer]:
                  - /url: "#cite_note-33"
            - listitem [ref=e588]:
              - text: Locating bots with a
              - link "honeypot" [ref=e589] [cursor=pointer]:
                - /url: /wiki/Honeypot_(computing)
              - text: or other method to identify the IP addresses of automated crawlers.
            - listitem [ref=e590]:
              - link "Obfuscation" [ref=e591] [cursor=pointer]:
                - /url: /wiki/Obfuscation
              - text: using
              - link "CSS sprites" [ref=e592] [cursor=pointer]:
                - /url: /wiki/CSS_sprite
              - text: to display such data as telephone numbers or email addresses, at the cost of
              - link "accessibility" [ref=e593] [cursor=pointer]:
                - /url: /wiki/Web_accessibility
              - text: to
              - link "screen reader" [ref=e594] [cursor=pointer]:
                - /url: /wiki/Screen_reader
              - text: users.
            - listitem [ref=e595]:
              - text: Because bots rely on consistency in the front-end code of a target website, adding small variations to the HTML/CSS surrounding important data and navigation elements would require more human involvement in the initial set up of a bot and if done effectively may render the target website too difficult to scrape due to the diminished ability to automate the scraping process.
              - superscript [ref=e596]:
                - link "[34]" [ref=e597] [cursor=pointer]:
                  - /url: "#cite_note-34"
            - listitem [ref=e598]:
              - text: Websites can declare if crawling is allowed or not in the
              - link "robots.txt" [ref=e599] [cursor=pointer]:
                - /url: /wiki/Robots_exclusion_standard
              - text: file and allow partial access, limit the crawl rate, specify the optimal time to crawl and more.
            - listitem [ref=e600]:
              - text: Trapping bots in a
              - link "tarpit" [ref=e601] [cursor=pointer]:
                - /url: /wiki/Tarpit_(networking)
              - text: ", feeding them nonsensical data to"
              - link "poison their dataset" [ref=e602] [cursor=pointer]:
                - /url: /wiki/Data_poisoning
              - text: . This method is particularly effective against bots which ignore robots.txt files.
              - superscript [ref=e603]:
                - link "[35]" [ref=e604] [cursor=pointer]:
                  - /url: "#cite_note-35"
            - listitem [ref=e605]:
              - text: "TLS Fingerprinting: Modern security systems analyze the"
              - link "Transport Layer Security" [ref=e606] [cursor=pointer]:
                - /url: /wiki/Transport_Layer_Security
              - text: (TLS) handshake to identify the client application. Different clients (e.g.,
              - link "Google Chrome" [ref=e607] [cursor=pointer]:
                - /url: /wiki/Google_Chrome
              - text: vs. a
              - link "Python" [ref=e608] [cursor=pointer]:
                - /url: /wiki/Python_(programming_language)
              - text: script) send
              - link "cryptographic ciphers" [ref=e609] [cursor=pointer]:
                - /url: /wiki/Cipher_suite
              - text: and extensions in unique orders. This creates a unique "fingerprint" (such as a JA3 signature) that allows servers to detect and block automated scripts regardless of their
              - link "IP address" [ref=e610] [cursor=pointer]:
                - /url: /wiki/IP_address
              - text: .
              - superscript [ref=e611]:
                - link "[36]" [ref=e612] [cursor=pointer]:
                  - /url: "#cite_note-SalesforceJA3-36"
              - superscript [ref=e613]:
                - link "[37]" [ref=e614] [cursor=pointer]:
                  - /url: "#cite_note-HasDataTLS-37"
