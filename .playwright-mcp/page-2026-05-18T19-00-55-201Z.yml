          - paragraph [ref=e358]:
            - text: Hockey Club Slovan Bratislava (
            - link "Slovak" [ref=e359] [cursor=pointer]:
              - /url: /wiki/Slovak_language
            - text: ": Hokejový klub Slovan Bratislava) is a professional"
            - link "ice hockey" [ref=e360] [cursor=pointer]:
              - /url: /wiki/Ice_hockey
            - text: club based in
            - link "Bratislava" [ref=e361] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ", Slovakia. In 2012, it left the"
            - link "Slovak Extraliga" [ref=e362] [cursor=pointer]:
              - /url: /wiki/Tipsport_Liga_(hockey)
            - text: and joined the international
            - link "Kontinental Hockey League" [ref=e363] [cursor=pointer]:
              - /url: /wiki/Kontinental_Hockey_League
            - text: (KHL). In 2019, it returned to the Tipos Extraliga. The club has won nine Slovak championships (most recently in 2022), one Czechoslovak championship (1979) and one IIHF Continental Cup (2004), making it the second most successful hockey club in Slovak history after their biggest rival
            - link "HC Košice" [ref=e364] [cursor=pointer]:
              - /url: /wiki/HC_Ko%C5%A1ice
            - text: . The team plays its home games at
            - link "Ondrej Nepela Arena" [ref=e365] [cursor=pointer]:
              - /url: /wiki/Ondrej_Nepela_Arena
            - text: ", also known as Tipos Arena. The team is nicknamed Belasí, which means the \"sky blues\" in English."
          - generic [ref=e366]:
            - heading "History" [level=2] [ref=e367]
            - generic [ref=e368]:
              - text: "["
              - link "edit" [ref=e369] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=1
              - text: "]"
          - paragraph [ref=e370]:
            - text: The sports club Slovan Bratislava was founded in 1919 as a football club, then called 1.CsSK Bratislava. In 1921, a hockey section was founded as "CsSK hockey". It played its first game in December 1924 against
            - link "Wiener EV" [ref=e371] [cursor=pointer]:
              - /url: /wiki/Wiener_EV
            - text: from
            - link "Vienna" [ref=e372] [cursor=pointer]:
              - /url: /wiki/Vienna
            - text: ", losing 6–1. In 1948, the name of the club was changed to Slovan Bratislava, which has been kept until today."
            - superscript [ref=e373]:
              - link "[3]" [ref=e374] [cursor=pointer]:
                - /url: "#cite_note-history-3"
          - paragraph [ref=e375]:
            - text: For many years following World War II, Slovan was the only Slovak representative in the highest Czechoslovak league, and achieved several second-place finishes in the championship. The only title in the
            - link "Czechoslovak First Ice Hockey League" [ref=e376] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_First_Ice_Hockey_League
            - text: was achieved under coach Ladislav Horsky in the 1978–79 season. Additionally, the youth teams won several championships.
            - superscript [ref=e377]:
              - link "[3]" [ref=e378] [cursor=pointer]:
                - /url: "#cite_note-history-3"
          - paragraph [ref=e379]:
            - text: After the
            - link "separation of Slovakia and the Czech Republic" [ref=e380] [cursor=pointer]:
              - /url: /wiki/Dissolution_of_Czechoslovakia
            - text: in 1993, Slovan played in the
            - link "Slovak Extraliga" [ref=e381] [cursor=pointer]:
              - /url: /wiki/Tipos_Extraliga_(hockey)
            - text: and won eight championship titles over 19 years.
            - superscript [ref=e382]:
              - link "[3]" [ref=e383] [cursor=pointer]:
                - /url: "#cite_note-history-3"
          - paragraph [ref=e384]:
            - text: In addition to the success achieved in Slovakia, Slovan also performed well internationally, with three
            - link "Spengler Cup" [ref=e385] [cursor=pointer]:
              - /url: /wiki/Spengler_Cup
            - text: wins in a row in 1972, 1973 and 1974. It is also one of only four clubs to play all four seasons of the
            - link "European Hockey League" [ref=e386] [cursor=pointer]:
              - /url: /wiki/European_Hockey_League
            - text: ", progressing to the playoff stage each year. Another highlight was winning the"
            - link "IIHF Continental Cup" [ref=e387] [cursor=pointer]:
              - /url: /wiki/IIHF_Continental_Cup
            - text: in the
            - link "2003–04 season" [ref=e388] [cursor=pointer]:
              - /url: /wiki/2003%E2%80%9304_IIHF_Continental_Cup
            - text: . From 2011 to 2013, Slovan participated in the
            - link "European Trophy" [ref=e389] [cursor=pointer]:
              - /url: /wiki/European_Trophy
            - text: international pre-season tournament.
            - superscript [ref=e390]:
              - link "[3]" [ref=e391] [cursor=pointer]:
                - /url: "#cite_note-history-3"
          - generic [ref=e392]:
            - heading "KHL" [level=3] [ref=e393]
            - generic [ref=e394]:
              - text: "["
              - link "edit" [ref=e395] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=2
              - text: "]"
          - paragraph [ref=e396]:
            - text: In March 2012, Slovan filed an application to play in the
            - link "Kontinental Hockey League" [ref=e397] [cursor=pointer]:
              - /url: /wiki/Kontinental_Hockey_League
            - text: (KHL).
            - superscript [ref=e398]:
              - link "[4]" [ref=e399] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: On 21 June 2012, Slovan Bratislava was officially admitted to the KHL, after they fulfilled all necessary conditions. Founded in 1921, they were the oldest KHL team by a large margin, as there were no ice hockey leagues in the former
            - link "Union of Soviet Socialist Republics" [ref=e400] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: prior to 1946.
            - superscript [ref=e401]:
              - link "[5]" [ref=e402] [cursor=pointer]:
                - /url: "#cite_note-5"
          - generic [ref=e403]:
            - heading "2012–13 season" [level=4] [ref=e404]: 2012–13 season
            - generic [ref=e405]:
              - text: "["
              - link "edit" [ref=e406] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=3
              - text: "]"
          - note [ref=e407]:
            - text: "See also:"
            - link "2012–13 HC Slovan Bratislava season" [ref=e408] [cursor=pointer]:
              - /url: /wiki/2012%E2%80%9313_HC_Slovan_Bratislava_season
          - paragraph [ref=e409]:
            - text: In May, Slovan signed Rostislav Čada as the new head coach for the first KHL season, who had had a KHL experience from working at
            - link "Avangard Omsk" [ref=e410] [cursor=pointer]:
              - /url: /wiki/Avangard_Omsk
            - text: .
            - superscript [ref=e411]:
              - link "[6]" [ref=e412] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: After playing two friendly matches against KHL teams and the
            - link "European Trophy" [ref=e413] [cursor=pointer]:
              - /url: /wiki/European_Trophy
            - text: during the summer months, Slovan opened the
            - link "2012–13 season" [ref=e414] [cursor=pointer]:
              - /url: /wiki/2012%E2%80%9313_KHL_season
            - text: with a home game against Ukrainian
            - link "HC Donbass" [ref=e415] [cursor=pointer]:
              - /url: /wiki/HC_Donbass
            - text: on 6 September 2012, losing 2–4 in front of a capacity crowd. The first win was achieved 4 days later by defeating
            - link "Spartak Moscow" [ref=e416] [cursor=pointer]:
              - /url: /wiki/HC_Spartak_Moscow
            - text: 2–1 after a
            - link "shootout" [ref=e417] [cursor=pointer]:
              - /url: /wiki/Overtime_(ice_hockey)#Shootout
            - text: . During the
            - link "NHL lockout" [ref=e418] [cursor=pointer]:
              - /url: /wiki/2012%E2%80%9313_NHL_lockout
            - text: between September 2012 and January 2013, the two defenders
            - link "Ľubomír Višňovský" [ref=e419] [cursor=pointer]:
              - /url: /wiki/%C4%BDubom%C3%ADr_Vi%C5%A1%C5%88ovsk%C3%BD
            - text: and
            - link "Andrej Sekera" [ref=e420] [cursor=pointer]:
              - /url: /wiki/Andrej_Sekera
            - text: enhanced the team. Slovan ended the season with 78 points as 6th of the Western conference and thus clinched a
            - link "play-off" [ref=e421] [cursor=pointer]:
              - /url: /wiki/Playoffs
            - text: spot in their first KHL season.
            - superscript [ref=e422]:
              - link "[7]" [ref=e423] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: In the first play-off round, Slovan played against then-defending champion
            - link "Dynamo Moscow" [ref=e424] [cursor=pointer]:
              - /url: /wiki/HC_Dynamo_Moscow
            - text: and lost all four matches.
          - paragraph [ref=e425]:
            - text: During the regular season, Slovan had sold out 25 out of its 26 home games with an average attendance of 9,977 spectators, which was the seventh-highest average attendance in Europe that season.
            - superscript [ref=e426]:
              - link "[8]" [ref=e427] [cursor=pointer]:
                - /url: "#cite_note-8"
          - generic [ref=e428]:
            - heading "Mascot" [level=2] [ref=e429]
            - generic [ref=e430]:
              - text: "["
              - link "edit" [ref=e431] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=4
              - text: "]"
          - paragraph [ref=e432]:
            - text: Before the start of
            - link "2013–14" [ref=e433] [cursor=pointer]:
              - /url: /wiki/2013%E2%80%9314_KHL_season
            - text: season, it was announced that the franchise will have a new mascot called Harvy. The mascot's name was determined by fans and its appearance will be of a
            - link "bald eagle" [ref=e434] [cursor=pointer]:
              - /url: /wiki/Bald_eagle
            - text: ", which is also on HC Slovan's logo."
            - superscript [ref=e435]:
              - link "[9]" [ref=e436] [cursor=pointer]:
                - /url: "#cite_note-9"
          - generic [ref=e437]:
            - heading "Logo" [level=2] [ref=e438]
            - generic [ref=e439]:
              - text: "["
              - link "edit" [ref=e440] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=5
              - text: "]"
          - figure "The previous HC Slovan Bratislava logo" [ref=e441]:
            - link [ref=e442] [cursor=pointer]:
              - /url: /wiki/File:Slovan_Bratislava_Logo.svg
              - img [ref=e443]
            - generic [ref=e444]: The previous HC Slovan Bratislava logo
          - paragraph [ref=e445]:
            - text: The rebranding of four leading Bratislava clubs in three sports –
            - link "ice hockey" [ref=e446] [cursor=pointer]:
              - /url: /wiki/Ice_hockey
            - text: ","
            - link "basketball" [ref=e447] [cursor=pointer]:
              - /url: /wiki/Basketball
            - text: ", and"
            - link "volleyball" [ref=e448] [cursor=pointer]:
              - /url: /wiki/Volleyball
            - text: "– marks the completion of their unification under the new owner, JTRE Sports & Entertainment. This is reflected in a shared name and visual identity. From june 2025, the clubs operated under a single name: Slovan Bratislava"
            - superscript [ref=e449]:
              - link "[10]" [ref=e450] [cursor=pointer]:
                - /url: "#cite_note-10"
            - superscript [ref=e451]:
              - link "[11]" [ref=e452] [cursor=pointer]:
                - /url: "#cite_note-11"
          - paragraph [ref=e453]:
            - text: The new visual identity was created by the agency 2:Score, which has extensive experience with sports projects. The agency is behind, for example, the rebranding of football club
            - link "Sparta Prague" [ref=e454] [cursor=pointer]:
              - /url: /wiki/AC_Sparta_Prague
            - text: and ice hockey club
            - link "Kometa Brno" [ref=e455] [cursor=pointer]:
              - /url: /wiki/HC_Kometa_Brno
            - text: ", the anniversary season of"
            - link "FC Hradec Králové" [ref=e456] [cursor=pointer]:
              - /url: /wiki/FC_Hradec_Kr%C3%A1lov%C3%A9
            - text: ", as well as a long-term partnership with the"
            - link "Chance League" [ref=e457] [cursor=pointer]:
              - /url: /wiki/Czech_First_League
            - text: – the top Czech football competition, which launched its biggest branding campaign, Fenomén, this summer.
          - generic [ref=e458]:
            - heading "Rivalries" [level=2] [ref=e459]
            - generic [ref=e460]:
              - text: "["
              - link "edit" [ref=e461] [cursor=pointer]:
                - /url: /w/index.php?title=HC_Slovan_Bratislava&action=edit&section=6
              - text: "]"
          - paragraph [ref=e462]:
            - text: While competing in the Czechoslovak league, Slovan's main rival was
            - link "HK Dukla Trenčín" [ref=e463] [cursor=pointer]:
              - /url: /wiki/HK_Dukla_Tren%C4%8D%C3%ADn
            - text: . While competing in the
            - link "Slovak Extraliga" [ref=e464] [cursor=pointer]:
              - /url: /wiki/Tipos_Extraliga_(hockey)
            - text: ", Slovan has various rivals around the country, most notably"
            - link "HC Košice" [ref=e465] [cursor=pointer]:
              - /url: /wiki/HC_Ko%C5%A1ice
            - text: ","
            - link "HK Dukla Trenčín" [ref=e466] [cursor=pointer]:
              - /url: /wiki/HK_Dukla_Tren%C4%8D%C3%ADn
            - text: and
            - link "HK Nitra" [ref=e467] [cursor=pointer]:
              - /url: /wiki/HK_Nitra
            - text: .
          - paragraph [ref=e468]:
            - text: In Slovan's first two seasons in the
            - link "KHL" [ref=e469] [cursor=pointer]:
              - /url: /wiki/Kontinental_Hockey_League
            - text: ", its biggest rival was"
            - link "Lev Prague" [ref=e470] [cursor=pointer]:
              - /url: /wiki/HC_Lev_Praha
            - text: . The rivalry started when, in their first game,
            - link "HC Lev" [ref=e471] [cursor=pointer]:
              - /url: /wiki/HC_Lev_Praha
            - text: "'s"
            - link "Zdeno Chára" [ref=e472] [cursor=pointer]:
              - /url: /wiki/Zdeno_Ch%C3%A1ra
            - text: body-checked Slovan's team captain
            - link "Miroslav Šatan" [ref=e473] [cursor=pointer]:
              - /url: /wiki/Miroslav_%C5%A0atan
            - text: ", after which Šatan was out of the lineup for the rest of the season."
            - superscript [ref=e474]:
              - link "[12]" [ref=e475] [cursor=pointer]:
                - /url: "#cite_note-12"
            - text: The fairness of this hit was the centre of many discussions. The games between Slovan and Lev were among the most anticipated of the season for both teams.
            - superscript [ref=e476]:
              - link "[13]" [ref=e477] [cursor=pointer]:
                - /url: "#cite_note-SlovanLevGames-13"
            - text: However, Lev Praha folded after the 2013–14 season.
