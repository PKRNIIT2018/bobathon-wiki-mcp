          - generic [ref=e1499]:
            - heading "Software" [level=3] [ref=e1500]
            - generic [ref=e1501]:
              - text: "["
              - link "edit" [ref=e1502] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=16
              - text: "]"
          - paragraph [ref=e1503]:
            - text: Since 2009, IBM has owned
            - link "SPSS" [ref=e1504] [cursor=pointer]:
              - /url: /wiki/SPSS
            - text: ", a software package used for"
            - link "statistical analysis" [ref=e1505] [cursor=pointer]:
              - /url: /wiki/Statistical_analysis
            - text: in the
            - link "social sciences" [ref=e1506] [cursor=pointer]:
              - /url: /wiki/Social_science
            - text: .
            - superscript [ref=e1507]:
              - link "[170]" [ref=e1508] [cursor=pointer]:
                - /url: "#cite_note-172"
            - text: IBM also owned
            - link "The Weather Company" [ref=e1509] [cursor=pointer]:
              - /url: /wiki/The_Weather_Company
            - text: ", which provides weather forecasting and includes"
            - link "weather.com" [ref=e1510] [cursor=pointer]:
              - /url: /wiki/Weather.com
            - text: and
            - link "Weather Underground" [ref=e1511] [cursor=pointer]:
              - /url: /wiki/Weather_Underground_(weather_service)
            - text: ","
            - superscript [ref=e1512]:
              - link "[171]" [ref=e1513] [cursor=pointer]:
                - /url: "#cite_note-173"
            - text: which was sold in 2024.
          - generic [ref=e1514]:
            - heading "Cloud services" [level=3] [ref=e1515]
            - generic [ref=e1516]:
              - text: "["
              - link "edit" [ref=e1517] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=17
              - text: "]"
          - paragraph [ref=e1518]:
            - link "IBM Cloud" [ref=e1519] [cursor=pointer]:
              - /url: /wiki/IBM_Cloud
            - text: includes
            - link "infrastructure as a service" [ref=e1520] [cursor=pointer]:
              - /url: /wiki/Infrastructure_as_a_service
            - text: (IaaS),
            - link "software as a service" [ref=e1521] [cursor=pointer]:
              - /url: /wiki/Software_as_a_service
            - text: (SaaS) and
            - link "platform as a service" [ref=e1522] [cursor=pointer]:
              - /url: /wiki/Platform_as_a_service
            - text: (PaaS) offered through public, private and hybrid
            - link "cloud delivery models" [ref=e1523] [cursor=pointer]:
              - /url: /wiki/Cloud_computing#Deployment_models
            - text: . For instance, the IBM
            - link "Bluemix" [ref=e1524] [cursor=pointer]:
              - /url: /wiki/Bluemix
            - text: PaaS enables developers to quickly create complex websites on a pay-as-you-go model. IBM
            - link "SoftLayer" [ref=e1525] [cursor=pointer]:
              - /url: /wiki/SoftLayer
            - text: is a
            - link "dedicated server" [ref=e1526] [cursor=pointer]:
              - /url: /wiki/Dedicated_server
            - text: ","
            - link "managed hosting" [ref=e1527] [cursor=pointer]:
              - /url: /wiki/Managed_hosting
            - text: and
            - link "cloud computing" [ref=e1528] [cursor=pointer]:
              - /url: /wiki/Cloud_computing
            - text: provider, which in 2011 reported hosting more than 81,000 servers for more than 26,000 customers.
            - superscript [ref=e1529]:
              - link "[172]" [ref=e1530] [cursor=pointer]:
                - /url: "#cite_note-174"
            - text: IBM also provides Cloud Data Encryption Services (ICDES), using
            - link "cryptographic splitting" [ref=e1531] [cursor=pointer]:
              - /url: /wiki/Cryptographic_splitting
            - text: to secure customer data.
            - superscript [ref=e1532]:
              - link "[173]" [ref=e1533] [cursor=pointer]:
                - /url: "#cite_note-175"
          - paragraph [ref=e1534]:
            - text: In May 2022, IBM announced the company had signed a multi-year Strategic Collaboration Agreement with
            - link "Amazon Web Services" [ref=e1535] [cursor=pointer]:
              - /url: /wiki/Amazon_Web_Services
            - text: to make a wide variety of IBM software available as a service on AWS Marketplace. Additionally, the deal includes both companies making joint investments that make it easier for companies to consume IBM's offering and integrate them with AWS, including developer training and software development for select markets.
            - superscript [ref=e1536]:
              - link "[174]" [ref=e1537] [cursor=pointer]:
                - /url: "#cite_note-176"
          - generic [ref=e1538]:
            - heading "Artificial intelligence" [level=3] [ref=e1539]
            - generic [ref=e1540]:
              - text: "["
              - link "edit" [ref=e1541] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=18
              - text: "]"
          - paragraph [ref=e1542]:
            - link "IBM Watson" [ref=e1543] [cursor=pointer]:
              - /url: /wiki/IBM_Watson
            - text: is a technology platform that uses
            - link "natural language processing" [ref=e1544] [cursor=pointer]:
              - /url: /wiki/Natural_language_processing
            - text: and machine learning to reveal insights from large amounts of
            - link "unstructured data" [ref=e1545] [cursor=pointer]:
              - /url: /wiki/Unstructured_data
            - text: .
            - superscript [ref=e1546]:
              - link "[175]" [ref=e1547] [cursor=pointer]:
                - /url: "#cite_note-177"
            - text: Watson was debuted in 2011 on the American game show
            - link "Jeopardy!" [ref=e1549] [cursor=pointer]:
              - /url: /wiki/Jeopardy!
            - text: ", where it competed against champions"
            - link "Ken Jennings" [ref=e1550] [cursor=pointer]:
              - /url: /wiki/Ken_Jennings
            - text: and
            - link "Brad Rutter" [ref=e1551] [cursor=pointer]:
              - /url: /wiki/Brad_Rutter
            - text: in a three-game tournament and won. Watson has since been applied to business, healthcare, developers, and universities. For example, IBM has partnered with
            - link "Memorial Sloan Kettering Cancer Center" [ref=e1552] [cursor=pointer]:
              - /url: /wiki/Memorial_Sloan_Kettering_Cancer_Center
            - text: to assist with considering treatment options for
            - link "oncology" [ref=e1553] [cursor=pointer]:
              - /url: /wiki/Oncology
            - text: patients and for doing
            - link "melanoma" [ref=e1554] [cursor=pointer]:
              - /url: /wiki/Melanoma
            - text: screenings.
            - superscript [ref=e1555]:
              - link "[176]" [ref=e1556] [cursor=pointer]:
                - /url: "#cite_note-178"
            - text: Several companies use Watson for call centers, either replacing or assisting customer service agents.
            - superscript [ref=e1557]:
              - link "[177]" [ref=e1558] [cursor=pointer]:
                - /url: "#cite_note-179"
          - paragraph [ref=e1559]:
            - text: IBM also provides infrastructure for the
            - link "New York City Police Department" [ref=e1560] [cursor=pointer]:
              - /url: /wiki/New_York_City_Police_Department
            - text: through its
            - link "IBM Cognos Analytics" [ref=e1561] [cursor=pointer]:
              - /url: /wiki/IBM_Cognos_Analytics
            - text: to perform data visualizations of
            - link "CompStat" [ref=e1562] [cursor=pointer]:
              - /url: /wiki/CompStat
            - text: crime data.
            - superscript [ref=e1563]:
              - link "[178]" [ref=e1564] [cursor=pointer]:
                - /url: "#cite_note-180"
          - paragraph [ref=e1565]:
            - text: In June 2020, IBM announced that it was exiting the facial recognition business. In a letter to congress,
            - superscript [ref=e1566]:
              - link "[179]" [ref=e1567] [cursor=pointer]:
                - /url: "#cite_note-181"
            - text: IBM's Chief Executive Officer Arvind Krishna told lawmakers, "now is the time to begin a national dialogue on whether and how facial recognition technology should be employed by domestic law enforcement agencies."
            - superscript [ref=e1568]:
              - link "[180]" [ref=e1569] [cursor=pointer]:
                - /url: "#cite_note-182"
          - paragraph [ref=e1570]:
            - text: In May 2023, IBM revealed
            - link "Watsonx" [ref=e1571] [cursor=pointer]:
              - /url: /wiki/IBM_Watsonx
            - text: ", a"
            - link "Generative AI" [ref=e1572] [cursor=pointer]:
              - /url: /wiki/Generative_AI
            - text: toolkit that is powered by IBM's own
            - link "Granite" [ref=e1573] [cursor=pointer]:
              - /url: /wiki/IBM_Granite
            - text: models with option to use other publicly available
            - link "LLMs" [ref=e1574] [cursor=pointer]:
              - /url: /wiki/Large_language_model
            - text: . Watsonx has multiple services for training and
            - link "fine tuning" [ref=e1575] [cursor=pointer]:
              - /url: /wiki/Fine-tuning_(deep_learning)
            - text: models based on confidential data.
            - superscript [ref=e1576]:
              - link "[181]" [ref=e1577] [cursor=pointer]:
                - /url: "#cite_note-183"
            - text: A year later, IBM
            - link "open-sourced" [ref=e1578] [cursor=pointer]:
              - /url: /wiki/Open_source
            - text: Granite code models and put them on
            - link "Hugging Face" [ref=e1579] [cursor=pointer]:
              - /url: /wiki/Hugging_Face
            - text: for public use.
            - superscript [ref=e1580]:
              - link "[182]" [ref=e1581] [cursor=pointer]:
                - /url: "#cite_note-184"
            - text: In October 2024, IBM introduced Granite 3.0, an open-source large language model designed for enterprise AI applications.
            - superscript [ref=e1582]:
              - link "[183]" [ref=e1583] [cursor=pointer]:
                - /url: "#cite_note-185"
          - generic [ref=e1584]:
            - heading "Consulting" [level=3] [ref=e1585]
            - generic [ref=e1586]:
              - text: "["
              - link "edit" [ref=e1587] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=19
              - text: "]"
          - note [ref=e1588]:
            - text: "Main article:"
            - link "IBM Consulting" [ref=e1589] [cursor=pointer]:
              - /url: /wiki/IBM_Consulting
          - paragraph [ref=e1590]:
            - text: With 160,000 consultants globally as of 2024, IBM is one of the ten largest consulting companies in the world, with capabilities spanning strategy and
            - link "management consulting" [ref=e1591] [cursor=pointer]:
              - /url: /wiki/Management_consulting
            - text: ", experience design, technology and"
            - link "systems integration" [ref=e1592] [cursor=pointer]:
              - /url: /wiki/System_integration
            - text: ", and operations."
            - superscript [ref=e1593]:
              - link "[184]" [ref=e1594] [cursor=pointer]:
                - /url: "#cite_note-186"
            - text: IBM's consulting business was valued at $20 billion, as of 2024.
            - superscript [ref=e1595]:
              - link "[185]" [ref=e1596] [cursor=pointer]:
                - /url: "#cite_note-:1-187"
          - generic [ref=e1597]:
            - heading "Research" [level=2] [ref=e1598]
            - generic [ref=e1599]:
              - text: "["
              - link "edit" [ref=e1600] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=20
              - text: "]"
          - figure "The Thomas J. Watson Research Center in Yorktown Heights, New York, is one of 11 IBM research labs worldwide." [ref=e1601]:
            - link [ref=e1602] [cursor=pointer]:
              - /url: /wiki/File:IBM_Yorktown_Heights.jpg
              - img [ref=e1603]
            - generic [ref=e1604]:
              - text: The
              - link "Thomas J. Watson Research Center" [ref=e1605] [cursor=pointer]:
                - /url: /wiki/Thomas_J._Watson_Research_Center
              - text: in
              - link "Yorktown Heights, New York" [ref=e1606] [cursor=pointer]:
                - /url: /wiki/Yorktown_Heights,_New_York
              - text: ", is one of 11 IBM research labs worldwide."
          - figure "Benoit Mandelbrot, an IBM Fellow, discusses fractal geometry, 2010." [ref=e1607]:
            - link [ref=e1608] [cursor=pointer]:
              - /url: /wiki/File:Benoit_Mandelbrot,_TED_2010.jpg
              - img [ref=e1609]
            - generic [ref=e1610]:
              - link "Benoit Mandelbrot" [ref=e1611] [cursor=pointer]:
                - /url: /wiki/Benoit_Mandelbrot
              - text: ", an"
              - link "IBM Fellow" [ref=e1612] [cursor=pointer]:
                - /url: /wiki/IBM_Fellow
              - text: ", discusses"
              - link "fractal geometry" [ref=e1613] [cursor=pointer]:
                - /url: /wiki/Fractal_geometry
              - text: ", 2010."
          - paragraph [ref=e1614]:
            - text: Research has been part of IBM since its founding, and its organized efforts trace their roots back to 1945, when the Watson Scientific Computing Laboratory was founded at
            - link "Columbia University" [ref=e1615] [cursor=pointer]:
              - /url: /wiki/Columbia_University
            - text: in New York City, converting a renovated fraternity house on Manhattan's West Side into IBM's first laboratory. Now,
            - link "IBM Research" [ref=e1616] [cursor=pointer]:
              - /url: /wiki/IBM_Research
            - text: constitutes the largest industrial research organization in the world, with 12 labs on 6 continents.
            - superscript [ref=e1617]:
              - link "[186]" [ref=e1618] [cursor=pointer]:
                - /url: "#cite_note-188"
            - text: IBM Research is headquartered at the
            - link "Thomas J. Watson Research Center" [ref=e1619] [cursor=pointer]:
              - /url: /wiki/Thomas_J._Watson_Research_Center
            - text: in New York, and facilities include the
            - link "Almaden lab" [ref=e1620] [cursor=pointer]:
              - /url: /wiki/IBM_Almaden_Research_Center
            - text: in California, Austin lab in Texas,
            - link "Australia lab" [ref=e1621] [cursor=pointer]:
              - /url: /wiki/IBM_Research-Australia
            - text: in Melbourne,
            - link "Brazil lab" [ref=e1622] [cursor=pointer]:
              - /url: /wiki/IBM_Research_%E2%80%93_Brazil
            - text: in São Paulo and Rio de Janeiro, China lab in Beijing and Shanghai, Ireland lab in Dublin,
            - link "Haifa lab" [ref=e1623] [cursor=pointer]:
              - /url: /wiki/IBM_Haifa_Research_Laboratory
            - text: in Israel, India lab in Delhi and
            - link "Bangalore" [ref=e1624] [cursor=pointer]:
              - /url: /wiki/Bangalore
            - text: ","
            - link "Tokyo lab" [ref=e1625] [cursor=pointer]:
              - /url: /wiki/IBM_Tokyo_Research_Laboratory
            - text: ","
            - link "Zurich lab" [ref=e1626] [cursor=pointer]:
              - /url: /wiki/IBM_Zurich_Research_Laboratory
            - text: and Africa lab in
            - link "Nairobi" [ref=e1627] [cursor=pointer]:
              - /url: /wiki/Nairobi
            - text: .
          - paragraph [ref=e1628]:
            - text: In terms of investment, IBM's
            - link "R&D" [ref=e1629] [cursor=pointer]:
              - /url: /wiki/R%26D
            - text: expenditure totals several billion dollars each year. In 2012, that expenditure was approximately $6.9 billion.
            - superscript [ref=e1630]:
              - link "[187]" [ref=e1631] [cursor=pointer]:
                - /url: "#cite_note-189"
            - text: Recent allocations have included $1 billion to create a business unit for
            - link "Watson" [ref=e1632] [cursor=pointer]:
              - /url: /wiki/IBM_Watson
            - text: in 2014, and $3 billion to create a next-gen semiconductor along with $4 billion towards growing the company's "strategic imperatives" (cloud, analytics, mobile, security, social) in 2015.
            - superscript [ref=e1633]:
              - link "[188]" [ref=e1634] [cursor=pointer]:
                - /url: "#cite_note-190"
            - text: In 2024, IBM reported research and development expenditures of $7.48 billion, representing an increase of approximately 10.3% compared to the previous year’s expenditure of $6.78 billion.
            - superscript [ref=e1635]:
              - link "[189]" [ref=e1636] [cursor=pointer]:
                - /url: "#cite_note-191"
          - paragraph [ref=e1637]:
            - text: IBM has been a leading proponent of the
            - link "Open Source Initiative" [ref=e1638] [cursor=pointer]:
              - /url: /wiki/Open_Source_Initiative
            - text: ", and began supporting"
            - link "Linux" [ref=e1639] [cursor=pointer]:
              - /url: /wiki/Linux
            - text: in 1998.
            - superscript [ref=e1640]:
              - link "[190]" [ref=e1641] [cursor=pointer]:
                - /url: "#cite_note-192"
            - text: The company invests billions of dollars in services and software based on Linux through the IBM
            - link "Linux Technology Center" [ref=e1642] [cursor=pointer]:
              - /url: /wiki/Linux_Technology_Center
            - text: ", which includes over 300"
            - link "Linux kernel" [ref=e1643] [cursor=pointer]:
              - /url: /wiki/Linux_kernel
            - text: developers.
            - superscript [ref=e1644]:
              - link "[191]" [ref=e1645] [cursor=pointer]:
                - /url: "#cite_note-193"
            - text: IBM has also released code under different
            - link "open-source licenses" [ref=e1646] [cursor=pointer]:
              - /url: /wiki/Open_source_license
            - text: ", such as the"
            - link "platform-independent" [ref=e1647] [cursor=pointer]:
              - /url: /wiki/Cross-platform
            - link "software framework" [ref=e1648] [cursor=pointer]:
              - /url: /wiki/Software_framework
            - link "Eclipse" [ref=e1649] [cursor=pointer]:
              - /url: /wiki/Eclipse_(software)
            - text: (worth approximately $40 million at the time of the donation),
            - superscript [ref=e1650]:
              - link "[192]" [ref=e1651] [cursor=pointer]:
                - /url: "#cite_note-194"
            - text: the three-sentence International Components for Unicode (
            - link "ICU" [ref=e1652] [cursor=pointer]:
              - /url: /wiki/International_Components_for_Unicode
            - text: ) license, and the
            - link "Java" [ref=e1653] [cursor=pointer]:
              - /url: /wiki/Java_(programming_language)
            - text: "-based"
            - link "relational database management system" [ref=e1654] [cursor=pointer]:
              - /url: /wiki/Relational_database_management_system
            - text: (RDBMS)
            - link "Apache Derby" [ref=e1655] [cursor=pointer]:
              - /url: /wiki/Apache_Derby
            - text: . IBM's
            - link "open source" [ref=e1656] [cursor=pointer]:
              - /url: /wiki/Open_source
            - text: involvement has not been trouble-free, however (see
            - link "SCO v. IBM" [ref=e1658] [cursor=pointer]:
              - /url: /wiki/SCO_v._IBM
            - text: ).
          - paragraph [ref=e1659]:
            - text: Famous
            - link "inventions" [ref=e1660] [cursor=pointer]:
              - /url: /wiki/Invention
            - text: "and developments by IBM include: the"
            - link "automated teller machine (ATM)" [ref=e1661] [cursor=pointer]:
              - /url: /wiki/Automated_teller_machine
            - text: ","
            - link "Dynamic Random Access Memory (DRAM)" [ref=e1662] [cursor=pointer]:
              - /url: /wiki/Dynamic_random-access_memory
            - text: ", the"
            - link "electronic keypunch" [ref=e1663] [cursor=pointer]:
              - /url: /wiki/Keypunch
            - text: ", the"
            - link "financial swap" [ref=e1664] [cursor=pointer]:
              - /url: /wiki/Swap_(finance)
            - text: ", the"
            - link "floppy disk" [ref=e1665] [cursor=pointer]:
              - /url: /wiki/Floppy_disk
            - text: ", the"
            - link "hard disk drive" [ref=e1666] [cursor=pointer]:
              - /url: /wiki/Hard_disk_drive
            - text: ", the"
            - link "magnetic stripe card" [ref=e1667] [cursor=pointer]:
              - /url: /wiki/Magnetic_stripe_card
            - text: ", the"
            - link "relational database" [ref=e1668] [cursor=pointer]:
              - /url: /wiki/Relational_model
            - text: ","
            - link "RISC" [ref=e1669] [cursor=pointer]:
              - /url: /wiki/Reduced_instruction_set_computing
            - text: ", the"
            - link "SABRE airline reservation system" [ref=e1670] [cursor=pointer]:
              - /url: /wiki/Sabre_(computer_system)
            - text: ","
            - link "SQL" [ref=e1671] [cursor=pointer]:
              - /url: /wiki/SQL
            - text: ", the"
