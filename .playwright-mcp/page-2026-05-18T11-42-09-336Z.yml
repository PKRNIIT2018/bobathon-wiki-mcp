            - text: (Cambridge, Massachusetts, United States), the
            - link "IBM Toronto Software Lab" [ref=e1378] [cursor=pointer]:
              - /url: /wiki/IBM_Toronto_Software_Lab
            - text: (Toronto, Canada), the IBM Building, Johannesburg (Johannesburg, South Africa), the
            - link "IBM Building (Seattle)" [ref=e1379] [cursor=pointer]:
