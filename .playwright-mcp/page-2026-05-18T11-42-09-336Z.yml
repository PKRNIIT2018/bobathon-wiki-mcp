            - text: IBM Q1 2024 revenue alone was $14.5 billion, up 1% year-over-year. The company's software revenue was up 5% with strong performance in hybrid cloud and AI. The full FY2024 figure and FY2024 figure and FY2025 quarterly results need updating throughout the article.
