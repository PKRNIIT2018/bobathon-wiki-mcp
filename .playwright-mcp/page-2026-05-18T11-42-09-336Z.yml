                - /url: "#cite_note-159"
            - text: and
            - link "cybersecurity" [ref=e1432] [cursor=pointer]:
              - /url: /wiki/Cybersecurity
            - text: .
            - superscript [ref=e1433]:
              - link "[158]" [ref=e1434] [cursor=pointer]:
                - /url: "#cite_note-160"
          - generic [ref=e1435]:
            - heading "Hardware" [level=3] [ref=e1436]
