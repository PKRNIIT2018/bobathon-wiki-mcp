                - /url: "#cite_note-163"
            - superscript [ref=e1463]:
              - link "[162]" [ref=e1464] [cursor=pointer]:
                - /url: "#cite_note-164"
            - text: IBM
            - link "Secure Blue" [ref=e1465] [cursor=pointer]:
              - /url: /wiki/Secure_Blue
            - text: is encryption hardware that can be built into microprocessors,
            - superscript [ref=e1466]:
              - link "[163]" [ref=e1467] [cursor=pointer]:
                - /url: "#cite_note-165"
            - text: and in 2014, the company revealed
            - link "TrueNorth" [ref=e1468] [cursor=pointer]:
              - /url: /wiki/TrueNorth
            - text: ", a"
            - link "neuromorphic" [ref=e1469] [cursor=pointer]:
              - /url: /wiki/Neuromorphic
            - link "CMOS" [ref=e1470] [cursor=pointer]:
              - /url: /wiki/CMOS
            - link "integrated circuit" [ref=e1471] [cursor=pointer]:
              - /url: /wiki/Integrated_circuit
            - text: and announced a $3 billion investment over the following five years to design a neural chip that mimics the human brain, with 10 billion neurons and 100 trillion synapses, but that uses just 1 kilowatt of power.
            - superscript [ref=e1472]:
              - link "[164]" [ref=e1473] [cursor=pointer]:
                - /url: "#cite_note-BrainIBM-166"
            - text: In 2016, the company launched
            - link "all-flash arrays" [ref=e1474] [cursor=pointer]:
              - /url: /wiki/Flash_file_system
            - text: designed for small and midsized companies, which includes software for data compression, provisioning, and snapshots across various systems.
            - superscript [ref=e1475]:
              - link "[165]" [ref=e1476] [cursor=pointer]:
                - /url: "#cite_note-167"
          - generic [ref=e1477]:
            - heading "Quantum computing" [level=4] [ref=e1478]
