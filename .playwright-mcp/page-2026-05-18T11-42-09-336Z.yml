            - text: in professional golf, with IBM creating the first Masters.org (1996), the first course cam (1998), the first
            - link "iPhone" [ref=e1735] [cursor=pointer]:
              - /url: /wiki/IPhone
            - text: app with live streaming (2009), and first-ever live 4K Ultra High Definition feed in the United States for a major sporting event (2016).
            - superscript [ref=e1736]:
              - link "[205]" [ref=e1737] [cursor=pointer]:
