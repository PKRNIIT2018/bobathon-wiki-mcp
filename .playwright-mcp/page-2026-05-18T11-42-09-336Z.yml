          - paragraph [ref=e625]:
            - text: International Business Machines Corporation,
            - link "doing business as" [ref=e626] [cursor=pointer]:
              - /url: /wiki/Trademark
            - text: IBM (nicknamed Big Blue),
            - superscript [ref=e627]:
              - link "[6]" [ref=e628] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: is an American
            - link "multinational" [ref=e629] [cursor=pointer]:
              - /url: /wiki/Multinational_corporation
            - link "technology company" [ref=e630] [cursor=pointer]:
              - /url: /wiki/Technology_company
            - text: headquartered in
            - link "Armonk, New York" [ref=e631] [cursor=pointer]:
              - /url: /wiki/Armonk,_New_York
            - text: ", and present in over 175 countries."
            - superscript [ref=e632]:
              - link "[7]" [ref=e633] [cursor=pointer]:
                - /url: "#cite_note-7"
            - superscript [ref=e634]:
              - link "[8]" [ref=e635] [cursor=pointer]:
                - /url: "#cite_note-auto-8"
            - text: It is a
            - link "publicly traded company" [ref=e636] [cursor=pointer]:
              - /url: /wiki/Publicly_traded_company
            - text: and one of the 30 companies in the
            - link "Dow Jones Industrial Average" [ref=e637] [cursor=pointer]:
              - /url: /wiki/Dow_Jones_Industrial_Average
            - text: .
            - superscript [ref=e638]:
              - link "[a]" [ref=e639] [cursor=pointer]:
                - /url: "#cite_note-9"
            - superscript [ref=e640]:
              - link "[9]" [ref=e641] [cursor=pointer]:
                - /url: "#cite_note-10"
            - superscript [ref=e642]:
              - link "[10]" [ref=e643] [cursor=pointer]:
                - /url: "#cite_note-11"
            - text: IBM is the largest industrial research organization in the world, with 19 research facilities across a dozen countries; for 29 consecutive years, from 1993 to 2021, it held the record for most annual U.S.
            - link "patents" [ref=e644] [cursor=pointer]:
              - /url: /wiki/Patent
            - text: generated by a business.
          - paragraph [ref=e645]:
            - text: IBM was founded in 1911 as the
            - link "Computing-Tabulating-Recording Company" [ref=e646] [cursor=pointer]:
              - /url: /wiki/Computing-Tabulating-Recording_Company
            - text: (CTR), a
            - link "holding company" [ref=e647] [cursor=pointer]:
              - /url: /wiki/Holding_company
            - text: of manufacturers of record-keeping and measuring systems. It was renamed "International Business Machines" in 1924 and soon became the leading manufacturer of
            - link "punch-card tabulating systems" [ref=e648] [cursor=pointer]:
              - /url: /wiki/Tabulating_machine
            - text: . During the 1960s and 1970s, the
            - link "IBM mainframe" [ref=e649] [cursor=pointer]:
              - /url: /wiki/IBM_mainframe
            - text: ", exemplified by the"
            - link "System/360" [ref=e650] [cursor=pointer]:
              - /url: /wiki/IBM_System/360
            - text: and its successors, was the world's dominant
            - link "computing platform" [ref=e651] [cursor=pointer]:
              - /url: /wiki/Computing_platform
            - text: ", with the company producing 80 percent of computers in the U.S. and 70 percent of computers worldwide."
            - superscript [ref=e652]:
              - link "[11]" [ref=e653] [cursor=pointer]:
                - /url: "#cite_note-:0-12"
            - text: Embracing both business and scientific computing, System/360 was the first family of computers designed to cover a complete range of applications from small to large.
            - superscript [ref=e654]:
              - link "[12]" [ref=e655] [cursor=pointer]:
                - /url: "#cite_note-13"
          - paragraph [ref=e656]:
            - text: IBM debuted in the
            - link "microcomputer" [ref=e657] [cursor=pointer]:
              - /url: /wiki/Microcomputer
            - text: market in 1981 with the
            - link "IBM Personal Computer" [ref=e658] [cursor=pointer]:
              - /url: /wiki/IBM_Personal_Computer
            - text: ;
            - link "its architecture" [ref=e659] [cursor=pointer]:
              - /url: /wiki/PC_architecture
            - text: remains the basis for the majority of
            - link "personal computers" [ref=e660] [cursor=pointer]:
              - /url: /wiki/Personal_computers
            - text: sold today.
            - superscript [ref=e661]:
              - link "[13]" [ref=e662] [cursor=pointer]:
                - /url: "#cite_note-14"
            - text: The company later also found success in the
            - link "portable" [ref=e663] [cursor=pointer]:
              - /url: /wiki/Portable_computer
            - text: space with the
            - link "ThinkPad" [ref=e664] [cursor=pointer]:
              - /url: /wiki/ThinkPad
            - text: . Since the 1990s, IBM has concentrated on
            - link "computer services" [ref=e665] [cursor=pointer]:
              - /url: /wiki/Information_technology
            - text: ","
            - link "software" [ref=e666] [cursor=pointer]:
              - /url: /wiki/Software
            - text: ","
            - link "supercomputers" [ref=e667] [cursor=pointer]:
              - /url: /wiki/Supercomputer
            - text: ", and"
            - link "scientific research" [ref=e668] [cursor=pointer]:
              - /url: /wiki/Scientific_method#Scientific_inquiry
            - text: ; it sold its microcomputer division to
            - link "Lenovo" [ref=e669] [cursor=pointer]:
              - /url: /wiki/Lenovo
            - text: in 2005. IBM continues to develop mainframes, and its supercomputers have
            - link "consistently ranked" [ref=e670] [cursor=pointer]:
              - /url: /wiki/TOP500
            - text: among the most powerful in the world in the 21st century.
          - paragraph [ref=e671]:
            - text: As one of the world's oldest and largest technology companies, IBM has been responsible for several
            - link "technological innovations" [ref=e672] [cursor=pointer]:
              - /url: /wiki/Technological_innovation
            - text: ", including the"
            - link "Automated Teller Machine" [ref=e673] [cursor=pointer]:
              - /url: /wiki/Automated_Teller_Machine
            - text: (ATM),
            - link "Dynamic Random-Access Memory" [ref=e674] [cursor=pointer]:
              - /url: /wiki/Dynamic_random-access_memory
            - text: (DRAM), the
            - link "floppy disk" [ref=e675] [cursor=pointer]:
              - /url: /wiki/Floppy_disk
            - text: ","
            - link "Generalized Markup Language" [ref=e676] [cursor=pointer]:
              - /url: /wiki/Generalized_Markup_Language
            - text: ", the"
            - link "hard disk drive" [ref=e677] [cursor=pointer]:
              - /url: /wiki/Hard_disk_drive
            - text: ", the"
            - link "magnetic stripe card" [ref=e678] [cursor=pointer]:
              - /url: /wiki/Magnetic_stripe_card
            - text: ", the"
            - link "relational database" [ref=e679] [cursor=pointer]:
              - /url: /wiki/Relational_model
            - text: ", the"
            - link "SQL programming language" [ref=e680] [cursor=pointer]:
              - /url: /wiki/SQL
            - text: ", and the"
            - link "Universal Product Code" [ref=e681] [cursor=pointer]:
              - /url: /wiki/Universal_Product_Code
            - text: (UPC) barcode. The company has made inroads in advanced
            - link "computer chips" [ref=e682] [cursor=pointer]:
              - /url: /wiki/Integrated_circuit
            - text: ","
            - link "quantum computing" [ref=e683] [cursor=pointer]:
              - /url: /wiki/Quantum_computing
            - text: ","
            - link "artificial intelligence" [ref=e684] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: ", and"
            - link "data infrastructure" [ref=e685] [cursor=pointer]:
              - /url: /wiki/Data_infrastructure
            - text: .
            - superscript [ref=e686]:
              - link "[14]" [ref=e687] [cursor=pointer]:
                - /url: "#cite_note-15"
            - superscript [ref=e688]:
              - link "[15]" [ref=e689] [cursor=pointer]:
                - /url: "#cite_note-16"
            - superscript [ref=e690]:
              - link "[16]" [ref=e691] [cursor=pointer]:
                - /url: "#cite_note-17"
            - text: IBM employees and alumni have won various recognitions for their scientific research and inventions, including six
            - link "Nobel Prizes" [ref=e692] [cursor=pointer]:
              - /url: /wiki/Nobel_Prize
            - text: and six
            - link "Turing Awards" [ref=e693] [cursor=pointer]:
              - /url: /wiki/Turing_Award
            - text: .
            - superscript [ref=e694]:
              - link "[17]" [ref=e695] [cursor=pointer]:
                - /url: "#cite_note-18"
          - generic [ref=e696]:
            - heading "History" [level=2] [ref=e697]
            - generic [ref=e698]:
              - text: "["
              - link "edit" [ref=e699] [cursor=pointer]:
