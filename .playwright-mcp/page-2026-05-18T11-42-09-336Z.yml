            - text: (Greenock, Scotland), and
            - link "Tour Descartes" [ref=e1387] [cursor=pointer]:
              - /url: /wiki/Tour_Descartes
            - text: (Paris, France). The company's contributions to industrial architecture and design include works by
            - link "Marcel Breuer" [ref=e1388] [cursor=pointer]:
