              - /url: /wiki/List_of_IBM_CEOs
          - paragraph [ref=e1293]:
            - text: The company's 15-member board of directors are responsible for overall corporate management and includes the current or former CEOs of
            - link "Anthem" [ref=e1294] [cursor=pointer]:
              - /url: /wiki/Anthem_(company)
            - text: ","
            - link "Dow Chemical" [ref=e1295] [cursor=pointer]:
              - /url: /wiki/Dow_Chemical_Company
            - text: ","
            - link "Johnson and Johnson" [ref=e1296] [cursor=pointer]:
              - /url: /wiki/Johnson_and_Johnson
            - text: ","
            - link "Royal Dutch Shell" [ref=e1297] [cursor=pointer]:
              - /url: /wiki/Royal_Dutch_Shell
            - text: ","
            - link "UPS" [ref=e1298] [cursor=pointer]:
              - /url: /wiki/United_Parcel_Service
            - text: ", and"
            - link "Vanguard" [ref=e1299] [cursor=pointer]:
              - /url: /wiki/The_Vanguard_Group
            - text: as well as the president of
            - link "Cornell University" [ref=e1300] [cursor=pointer]:
              - /url: /wiki/Cornell_University
            - text: and a retired
            - link "U.S. Navy admiral" [ref=e1301] [cursor=pointer]:
              - /url: /wiki/Admiral_(United_States)
            - text: .
            - superscript [ref=e1302]:
              - link "[140]" [ref=e1303] [cursor=pointer]:
                - /url: "#cite_note-142"
            - text: Vanguard Group is the largest shareholder of IBM and as of March 31, 2023, held 15.7% of total shares outstanding.
            - superscript [ref=e1304]:
              - link "[141]" [ref=e1305] [cursor=pointer]:
                - /url: "#cite_note-143"
          - paragraph [ref=e1306]:
            - text: In 2011, IBM became the first technology company
            - link "Warren Buffett" [ref=e1307] [cursor=pointer]:
              - /url: /wiki/Warren_Buffett
            - text: "'s"
            - link "holding company" [ref=e1308] [cursor=pointer]:
              - /url: /wiki/Holding_company
            - link "Berkshire Hathaway" [ref=e1309] [cursor=pointer]:
              - /url: /wiki/Berkshire_Hathaway
            - text: invested in.
            - superscript [ref=e1310]:
              - link "[142]" [ref=e1311] [cursor=pointer]:
                - /url: "#cite_note-144"
            - text: Initially he bought 64 million shares costing $10.5 billion. Over the years, Buffett increased his IBM holdings, but by the end of 2017 had reduced them by 94.5% to 2.05 million shares; by May 2018, he was completely out of IBM.
            - superscript [ref=e1312]:
              - link "[143]" [ref=e1313] [cursor=pointer]:
                - /url: "#cite_note-145"
          - generic [ref=e1314]:
            - heading "Headquarters and offices" [level=3] [ref=e1315]
            - generic [ref=e1316]:
              - text: "["
              - link "edit" [ref=e1317] [cursor=pointer]:
