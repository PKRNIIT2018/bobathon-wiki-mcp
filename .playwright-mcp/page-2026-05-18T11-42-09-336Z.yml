              - text: "]"
          - paragraph [ref=e1443]:
            - text: Since 1954, IBM has sold
            - link "mainframe computers" [ref=e1444] [cursor=pointer]:
              - /url: /wiki/Mainframe_computers
            - text: ", the latest being the"
            - link "IBM z" [ref=e1445] [cursor=pointer]:
              - /url: /wiki/IBM_Z
            - text: series. The most recent model, the
            - link "IBM z17" [ref=e1446] [cursor=pointer]:
              - /url: /wiki/IBM_Z#IBM_z17
            - text: ", was released in 2025."
            - superscript [ref=e1447]:
              - link "[159]" [ref=e1448] [cursor=pointer]:
                - /url: "#cite_note-161"
          - generic [ref=e1449]:
            - heading "Microprocessors" [level=4] [ref=e1450]
            - generic [ref=e1451]:
              - text: "["
              - link "edit" [ref=e1452] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=14
              - text: "]"
          - paragraph [ref=e1453]:
            - text: In 1990, IBM released the
            - link "Power microprocessors" [ref=e1454] [cursor=pointer]:
              - /url: /wiki/IBM_Power_microprocessors
            - text: ", which were designed into many console gaming systems, including"
            - link "Xbox 360" [ref=e1455] [cursor=pointer]:
              - /url: /wiki/Xbox_360
            - text: ","
            - superscript [ref=e1456]:
