          - figure "Pangu Plaza, one of IBM's offices in Beijing, China" [ref=e1320]:
            - link [ref=e1321] [cursor=pointer]:
              - /url: /wiki/File:IBM_Beijing,_Pangu_Plaza.jpg
              - img [ref=e1322]
            - generic [ref=e1323]: Pangu Plaza, one of IBM's offices in Beijing, China
          - paragraph [ref=e1324]:
            - text: IBM is headquartered in
            - link "Armonk, New York" [ref=e1325] [cursor=pointer]:
              - /url: /wiki/Armonk,_New_York
            - text: ", a community 37 miles (60 km) north of Midtown Manhattan."
            - superscript [ref=e1326]:
              - link "[144]" [ref=e1327] [cursor=pointer]:
                - /url: "#cite_note-146"
            - text: A nickname for the company is the "Colossus of Armonk".
            - superscript [ref=e1328]:
              - link "[145]" [ref=e1329] [cursor=pointer]:
                - /url: "#cite_note-salmans19820109-147"
            - text: Its principal building, referred to as CHQ, is a 283,000-square-foot (26,300 m
            - superscript [ref=e1330]: "2"
            - text: ) glass and stone edifice on a 25-acre (10 ha) parcel amid a 432-acre former apple orchard the company purchased in the mid-1950s.
            - superscript [ref=e1331]:
              - link "[146]" [ref=e1332] [cursor=pointer]:
                - /url: "#cite_note-148"
            - text: "There are two other IBM buildings within walking distance of CHQ: the North Castle office, which previously served as IBM's headquarters; and the Louis V. Gerstner, Jr., Center for Learning"
            - superscript [ref=e1333]:
              - link "[147]" [ref=e1334] [cursor=pointer]:
                - /url: "#cite_note-149"
            - text: (formerly known as IBM Learning Center (ILC)), a resort hotel and training center, which has 182 guest rooms, 31 meeting rooms, and various amenities.
            - superscript [ref=e1335]:
              - link "[148]" [ref=e1336] [cursor=pointer]:
                - /url: "#cite_note-150"
          - paragraph [ref=e1337]:
            - text: IBM operates in 174 countries as of 2016 ,
            - superscript [ref=e1338]:
              - link "[2]" [ref=e1339] [cursor=pointer]:
                - /url: "#cite_note-fortune20160201-2"
            - text: with mobility centers in smaller market areas and major campuses in the larger ones. In New York City, IBM has several offices besides CHQ, including the
            - link "IBM Watson" [ref=e1340] [cursor=pointer]:
              - /url: /wiki/IBM_Watson
            - text: headquarters at
            - link "Astor Place" [ref=e1341] [cursor=pointer]:
              - /url: /wiki/Astor_Place
            - text: in Manhattan. Outside of New York, major campuses in the United States include
            - link "Austin, Texas" [ref=e1342] [cursor=pointer]:
              - /url: /wiki/Austin,_Texas
            - text: ;
            - link "Research Triangle Park (Raleigh-Durham), North Carolina" [ref=e1343] [cursor=pointer]:
              - /url: /wiki/Research_Triangle_Park
            - text: ;
            - link "Rochester, Minnesota" [ref=e1344] [cursor=pointer]:
              - /url: /wiki/IBM_Rochester
            - text: ; and
            - link "Silicon Valley, California" [ref=e1345] [cursor=pointer]:
              - /url: /wiki/IBM_Research_-_Almaden
            - text: .
          - paragraph [ref=e1346]:
            - text: IBM's real estate holdings are varied and globally diverse. Towers occupied by IBM include
            - link "1250 René-Lévesque" [ref=e1347] [cursor=pointer]:
              - /url: /wiki/1250_Ren%C3%A9-L%C3%A9vesque
            - text: (Montreal, Canada) and
            - link "One Atlantic Center" [ref=e1348] [cursor=pointer]:
              - /url: /wiki/One_Atlantic_Center
            - text: (Atlanta, Georgia, US). In Beijing, China, IBM occupies
            - link "Pangu Plaza" [ref=e1349] [cursor=pointer]:
              - /url: /wiki/Pangu_Plaza
            - text: ","
            - superscript [ref=e1350]:
              - link "[149]" [ref=e1351] [cursor=pointer]:
                - /url: "#cite_note-151"
            - text: the city's seventh tallest building and overlooking
            - link "Beijing National Stadium (\"Bird's Nest\")" [ref=e1352] [cursor=pointer]:
              - /url: /wiki/Beijing_National_Stadium
            - text: ", home to the"
            - link "2008 Summer Olympics" [ref=e1353] [cursor=pointer]:
              - /url: /wiki/2008_Summer_Olympics
            - text: .
