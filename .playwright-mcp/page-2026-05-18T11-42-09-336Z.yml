          - generic [ref=e1952]:
            - heading "Workplace culture" [level=3] [ref=e1953]
            - generic [ref=e1954]:
              - text: "["
              - link "edit" [ref=e1955] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=26
              - text: "]"
          - paragraph [ref=e1956]:
            - text: Employees are often referred to as "IBMers" and "
            - link "Once An IBMer, Always An IBMer." [ref=e1957] [cursor=pointer]:
              - /url: https://www.ibm.com/responsibility/programs/volunteerism-giving/retirees
            - text: "\". IBM's culture has evolved significantly over its century of operations. In its early days, a dark (or gray) suit, white shirt, and a \"sincere\" tie constituted the public uniform for IBM employees."
            - superscript [ref=e1958]:
              - link "[226]" [ref=e1959] [cursor=pointer]:
                - /url: "#cite_note-Strategic_Marketing-228"
            - text: During IBM's management transformation in the 1990s, CEO
            - link "Louis V. Gerstner Jr." [ref=e1960] [cursor=pointer]:
              - /url: /wiki/Louis_V._Gerstner_Jr.
            - text: relaxed these codes, normalizing the dress and behavior of IBM employees.
            - superscript [ref=e1961]:
              - link "[227]" [ref=e1962] [cursor=pointer]:
                - /url: "#cite_note-IBM_Attire-229"
            - text: The company's culture has also given to different plays on the company acronym (IBM), with some saying it stands for "I've Been Moved," based on frequent relocations,
            - superscript [ref=e1963]:
              - link "[228]" [ref=e1964] [cursor=pointer]:
                - /url: "#cite_note-IBM_stands_for_'I've_Been_Moved'-230"
            - text: others saying it stands for "I'm By Myself" pursuant to a prevalent work-from-anywhere norm,
            - superscript [ref=e1965]:
              - link "[229]" [ref=e1966] [cursor=pointer]:
                - /url: "#cite_note-231"
            - text: and others saying it stands for "I'm Being Mentored" in reference to the company's open door policy and encouragement for mentoring at all levels.
            - superscript [ref=e1967]:
              - link "[230]" [ref=e1968] [cursor=pointer]:
                - /url: "#cite_note-Intelligent_Mentoring-232"
            - text: Similar IBM backronyms exist within the industry, such as
            - link "Computerworld" [ref=e1969] [cursor=pointer]:
              - /url: /wiki/Computerworld
            - text: producing a badge labelled "It's Better Manually" implying it would be easier to use a paper-based system than a computer.
            - superscript [ref=e1970]:
              - link "[231]" [ref=e1971] [cursor=pointer]:
                - /url: "#cite_note-#IBMCWbadge-233"
            - text: The company has traditionally resisted
            - link "labor union organizing" [ref=e1972] [cursor=pointer]:
              - /url: /wiki/IBM_and_unions
            - text: ","
            - superscript [ref=e1973]:
              - link "[232]" [ref=e1974] [cursor=pointer]:
                - /url: "#cite_note-234"
            - text: although unions represent some IBM workers outside the United States.
            - superscript [ref=e1975]:
              - link "[233]" [ref=e1976] [cursor=pointer]:
                - /url: "#cite_note-235"
