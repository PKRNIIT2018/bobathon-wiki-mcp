          - generic [ref=e716]:
            - heading "1910s–1950s" [level=3] [ref=e717]: 1910s–1950s
            - generic [ref=e718]:
              - text: "["
              - link "edit" [ref=e719] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=2
              - text: "]"
          - paragraph [ref=e720]:
            - text: IBM originated with several technological innovations developed and commercialized in the late 19th century. Julius E. Pitrap patented the computing scale in 1885;
            - superscript [ref=e721]:
              - link "[18]" [ref=e722] [cursor=pointer]:
                - /url: "#cite_note-19"
            - text: Alexander Dey invented the dial recorder (1888);
            - superscript [ref=e723]:
              - link "[19]" [ref=e724] [cursor=pointer]:
                - /url: "#cite_note-20"
            - link "Herman Hollerith" [ref=e725] [cursor=pointer]:
              - /url: /wiki/Herman_Hollerith
            - text: patented the
            - link "Electric Tabulating Machine" [ref=e726] [cursor=pointer]:
              - /url: /wiki/Electric_Tabulating_Machine
            - text: (1889);
            - superscript [ref=e727]:
              - link "[20]" [ref=e728] [cursor=pointer]:
                - /url: "#cite_note-21"
            - text: and
            - link "Willard Bundy" [ref=e729] [cursor=pointer]:
              - /url: /wiki/Willard_Bundy
            - text: invented a
            - link "time clock" [ref=e730] [cursor=pointer]:
              - /url: /wiki/Time_clock
            - text: to record workers' arrival and departure times on a paper tape (1889).
            - superscript [ref=e731]:
              - link "[21]" [ref=e732] [cursor=pointer]:
                - /url: "#cite_note-22"
            - text: On June 16, 1911, their four companies were
            - link "amalgamated" [ref=e733] [cursor=pointer]:
              - /url: /wiki/Consolidation_(business)
            - text: in New York State by
            - link "Charles Ranlett Flint" [ref=e734] [cursor=pointer]:
              - /url: /wiki/Charles_Ranlett_Flint
            - text: forming a fifth company, the
            - link "Computing-Tabulating-Recording Company" [ref=e735] [cursor=pointer]:
              - /url: /wiki/Computing-Tabulating-Recording_Company
            - text: (CTR) based in Endicott, New York.
            - superscript [ref=e736]:
              - link "[1]" [ref=e737] [cursor=pointer]:
                - /url: "#cite_note-certificate1911-1"
            - superscript [ref=e738]:
              - link "[22]" [ref=e739] [cursor=pointer]:
                - /url: "#cite_note-nytimes-23"
            - text: The five companies had 1,300 employees and offices and plants in Endicott and
            - link "Binghamton" [ref=e740] [cursor=pointer]:
              - /url: /wiki/Binghamton,_New_York
            - text: ", New York;"
            - link "Dayton, Ohio" [ref=e741] [cursor=pointer]:
              - /url: /wiki/Dayton,_Ohio
            - text: ;
            - link "Detroit, Michigan" [ref=e742] [cursor=pointer]:
              - /url: /wiki/Detroit
            - text: ;
            - link "Washington, D.C." [ref=e743] [cursor=pointer]:
              - /url: /wiki/Washington,_D.C.
            - text: ; and
            - link "Toronto" [ref=e744] [cursor=pointer]:
              - /url: /wiki/Toronto
            - text: ", Canada."
            - superscript [ref=e745]:
              - link "[23]" [ref=e746] [cursor=pointer]:
                - /url: "#cite_note-24"
          - paragraph [ref=e747]:
            - text: Collectively, the companies manufactured a wide array of machinery for sale and lease, ranging from commercial scales and industrial time recorders, meat and cheese slicers, to tabulators and punched cards.
            - link "Thomas J. Watson, Sr." [ref=e748] [cursor=pointer]:
              - /url: /wiki/Thomas_J._Watson,_Sr.
            - text: ", fired from the"
            - link "National Cash Register Company" [ref=e749] [cursor=pointer]:
              - /url: /wiki/National_Cash_Register_Company
            - text: (NCR) by
            - link "John Henry Patterson" [ref=e750] [cursor=pointer]:
              - /url: /wiki/John_Henry_Patterson_(NCR_owner)
            - text: ", called on Flint and, in 1914, was offered a position at CTR."
            - superscript [ref=e751]:
              - link "[24]" [ref=e752] [cursor=pointer]:
                - /url: "#cite_note-Belden-25"
            - text: Watson joined CTR as general manager and then, 11 months later, was made President when
            - link "antitrust" [ref=e753] [cursor=pointer]:
              - /url: /wiki/Competition_law
            - text: cases relating to his time at NCR were resolved.
            - superscript [ref=e754]:
              - link "[25]" [ref=e755] [cursor=pointer]:
                - /url: "#cite_note-26"
            - text: Having learned Patterson's pioneering business practices, Watson proceeded to put the stamp of NCR onto CTR's companies.
            - superscript [ref=e756]:
              - link "[24]" [ref=e757] [cursor=pointer]:
                - /url: "#cite_note-Belden-25"
            - superscript [ref=e758]: ": 105"
            - text: He implemented sales conventions, "generous sales incentives, a focus on customer service, an insistence on well-groomed, dark-suited salesmen and had an evangelical fervor for instilling company pride and loyalty in every worker".
            - superscript [ref=e759]:
              - link "[26]" [ref=e760] [cursor=pointer]:
                - /url: "#cite_note-Story-27"
            - superscript [ref=e761]:
              - link "[27]" [ref=e762] [cursor=pointer]:
                - /url: "#cite_note-28"
            - text: His favorite slogan, "
            - link "THINK" [ref=e763] [cursor=pointer]:
              - /url: /wiki/Think_(slogan)
            - text: "\", became a mantra for each company's employees."
            - superscript [ref=e764]:
              - link "[26]" [ref=e765] [cursor=pointer]:
                - /url: "#cite_note-Story-27"
            - text: During Watson's first four years, revenues reached $9 million ($167 million today) and the company's operations expanded to Europe, South America, Asia and Australia.
            - superscript [ref=e766]:
              - link "[26]" [ref=e767] [cursor=pointer]:
                - /url: "#cite_note-Story-27"
            - text: Watson never liked the clumsy hyphenated name "Computing-Tabulating-Recording Company" and chose to replace it with the more expansive title "International Business Machines" which had previously been used as the name of CTR's Canadian Division;
            - superscript [ref=e768]:
              - link "[28]" [ref=e769] [cursor=pointer]:
                - /url: "#cite_note-True_story_1962_p.125-29"
            - text: the name was changed on February 14, 1924.
            - superscript [ref=e770]:
              - link "[29]" [ref=e771] [cursor=pointer]:
                - /url: "#cite_note-30"
            - text: By 1933, most of the subsidiaries had been merged into one company, IBM.
            - superscript [ref=e772]:
              - link "[30]" [ref=e773] [cursor=pointer]:
                - /url: "#cite_note-31"
          - generic [ref=e774]:
            - heading "World War 2" [level=4] [ref=e775]
            - generic [ref=e776]:
              - text: "["
              - link "edit" [ref=e777] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=3
              - text: "]"
          - note [ref=e778]:
            - text: "Main article:"
            - link "IBM and World War II" [ref=e779] [cursor=pointer]:
              - /url: /wiki/IBM_and_World_War_II
          - figure "NACA researchers using an IBM type 704 electronic data processing machine in 1957" [ref=e780]:
            - link [ref=e781] [cursor=pointer]:
              - /url: /wiki/File:IBM_Electronic_Data_Processing_Machine_-_GPN-2000-001881.jpg
              - img [ref=e782]
            - generic [ref=e783]:
              - link "NACA" [ref=e784] [cursor=pointer]:
                - /url: /wiki/NACA
              - text: researchers using an
              - link "IBM type 704" [ref=e785] [cursor=pointer]:
                - /url: /wiki/IBM_704
              - text: electronic data processing machine in 1957
          - paragraph [ref=e786]:
            - text: The
            - link "Nazis" [ref=e787] [cursor=pointer]:
              - /url: /wiki/Nazi_Party
            - text: made extensive use of Hollerith punch card and alphabetical accounting equipment and IBM's majority-owned German subsidiary, Deutsche Hollerith Maschinen GmbH (
            - link "Dehomag" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Dehomag
            - text: ), supplied this equipment from the early 1930s. This equipment was critical to Nazi efforts to categorize citizens of both Germany and other nations that fell under Nazi control through ongoing censuses. These census data were used to facilitate the round-up of Jews and other targeted groups, and to catalog their movements through the machinery of the
            - link "Holocaust" [ref=e789] [cursor=pointer]:
              - /url: /wiki/Holocaust
            - text: ", including internment in the concentration camps."
            - superscript [ref=e790]:
              - link "[31]" [ref=e791] [cursor=pointer]:
                - /url: "#cite_note-32"
            - link "Edwin Black" [ref=e792] [cursor=pointer]:
              - /url: /wiki/Edwin_Black
            - text: contends in
            - link "IBM and the Holocaust" [ref=e794] [cursor=pointer]:
              - /url: /wiki/IBM_and_the_Holocaust
            - text: that IBM's dealings with Nazis through its New York City headquarters persisted during World War II.
            - superscript [ref=e795]:
              - link "[32]" [ref=e796] [cursor=pointer]:
                - /url: "#cite_note-33"
            - text: Nazi concentration camps operated a Hollerith department called Hollerith Abteilung, which had IBM machines, including calculating and sorting machines.
            - superscript [ref=e797]:
              - link "[33]" [ref=e798] [cursor=pointer]:
                - /url: "#cite_note-34"
          - paragraph [ref=e799]:
            - text: IBM as a military contractor produced 6% of the
            - link "M1 Carbine" [ref=e800] [cursor=pointer]:
              - /url: /wiki/M1_Carbine
            - text: rifles used in World War II, about 346,500 of them, between August 1943 and May 1944. IBM built the
            - link "Automatic Sequence Controlled Calculator" [ref=e801] [cursor=pointer]:
              - /url: /wiki/Automatic_Sequence_Controlled_Calculator
            - text: ", an electromechanical computer, during World War II. It offered its first commercial stored-program computer, the vacuum tube based"
            - link "IBM 701" [ref=e802] [cursor=pointer]:
              - /url: /wiki/IBM_701
            - text: ", in 1952. The"
            - link "IBM 305 RAMAC" [ref=e803] [cursor=pointer]:
              - /url: /wiki/IBM_305_RAMAC
            - text: introduced the hard disk drive in 1956. The company switched to transistorized designs with the
            - link "7000" [ref=e804] [cursor=pointer]:
              - /url: /wiki/IBM_700/7000_series
            - text: and
            - link "1400" [ref=e805] [cursor=pointer]:
              - /url: /wiki/IBM_1400_series
            - text: series, beginning in 1958. The 1400 series was the first to deploy over 10000 units, making it its most successful computer device at the time.
            - superscript [ref=e806]:
              - link "[34]" [ref=e807] [cursor=pointer]:
                - /url: "#cite_note-35"
          - paragraph [ref=e808]:
            - text: In 1956, the company demonstrated the first practical example of
            - link "artificial intelligence" [ref=e809] [cursor=pointer]:
              - /url: /wiki/Artificial_intelligence
            - text: when
            - link "Arthur L. Samuel" [ref=e810] [cursor=pointer]:
              - /url: /wiki/Arthur_Samuel_(computer_scientist)
            - text: of IBM's
            - link "Poughkeepsie" [ref=e811] [cursor=pointer]:
              - /url: /wiki/Poughkeepsie
            - text: ", New York, laboratory programmed an"
            - link "IBM 704" [ref=e812] [cursor=pointer]:
              - /url: /wiki/IBM_704
            - text: not merely to play checkers but "learn" from its own experience. In 1957, the
            - link "FORTRAN" [ref=e813] [cursor=pointer]:
              - /url: /wiki/FORTRAN
            - text: scientific programming language was announced.
            - superscript [ref=e814]:
              - link "[35]" [ref=e815] [cursor=pointer]:
                - /url: "#cite_note-36"
          - generic [ref=e816]:
            - heading "1960s–1980s" [level=3] [ref=e817]: 1960s–1980s
            - generic [ref=e818]:
              - text: "["
              - link "edit" [ref=e819] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=4
              - text: "]"
          - paragraph [ref=e820]:
            - text: In 1961, IBM developed the
            - link "SABRE reservation system" [ref=e821] [cursor=pointer]:
              - /url: /wiki/Sabre_(travel_reservation_system)
            - text: for
            - link "American Airlines" [ref=e822] [cursor=pointer]:
              - /url: /wiki/American_Airlines
            - text: and introduced the highly successful
            - link "Selectric" [ref=e823] [cursor=pointer]:
              - /url: /wiki/IBM_Selectric
            - text: typewriter. Also in 1961, IBM used the
            - link "IBM 7094" [ref=e824] [cursor=pointer]:
              - /url: /wiki/IBM_7094
            - text: to generate the first song sung completely by a computer using synthesizers. The song was Daisy Bell (Bicycle Built for Two). The recording is now in the United States
            - link "National Recording Registry" [ref=e825] [cursor=pointer]:
              - /url: /wiki/National_Recording_Registry
            - text: .
            - superscript [ref=e826]:
              - link "[36]" [ref=e827] [cursor=pointer]:
                - /url: "#cite_note-37"
          - paragraph [ref=e828]:
            - text: In 1963, IBM employees and computers helped
            - link "NASA" [ref=e829] [cursor=pointer]:
              - /url: /wiki/NASA
            - text: track the orbital flights of the
            - link "Mercury" [ref=e830] [cursor=pointer]:
              - /url: /wiki/Project_Mercury
            - text: astronauts. A year later, it moved its corporate headquarters from New York City to
            - link "Armonk, New York" [ref=e831] [cursor=pointer]:
              - /url: /wiki/Armonk,_New_York
            - text: . The latter half of the 1960s saw IBM continue its support of space exploration, participating in the 1965
            - link "Gemini" [ref=e832] [cursor=pointer]:
              - /url: /wiki/Project_Gemini
            - text: flights, 1966 Saturn flights, and 1969 lunar mission. IBM also developed and manufactured the
            - link "Saturn V's" [ref=e833] [cursor=pointer]:
              - /url: /wiki/Saturn_V
            - text: Instrument Unit and
            - link "Apollo" [ref=e834] [cursor=pointer]:
              - /url: /wiki/Apollo_program
            - text: spacecraft guidance computers.
          - figure "An IBM System/360 in use at the University of Michigan c. 1969" [ref=e835]:
            - link [ref=e836] [cursor=pointer]:
              - /url: /wiki/File:IBM360-67AtUmichWithMikeAlexander.jpg
              - img [ref=e837]
            - generic [ref=e838]:
              - text: An
              - link "IBM System/360" [ref=e839] [cursor=pointer]:
                - /url: /wiki/IBM_System/360
              - text: in use at the
              - link "University of Michigan" [ref=e840] [cursor=pointer]:
                - /url: /wiki/University_of_Michigan
              - text: c. 1969
          - figure "IBM guidance computer hardware for the Saturn V Instrument Unit" [ref=e841]:
            - link [ref=e842] [cursor=pointer]:
              - /url: /wiki/File:Saturn_IB_and_V_Instrument_Unit.jpg
              - img [ref=e843]
            - generic [ref=e844]:
              - text: IBM guidance computer hardware for the
              - link "Saturn V Instrument Unit" [ref=e845] [cursor=pointer]:
                - /url: /wiki/Saturn_V_Instrument_Unit
          - paragraph [ref=e846]:
            - text: On April 7, 1964, IBM launched the first computer system family, the
            - link "IBM System/360" [ref=e847] [cursor=pointer]:
              - /url: /wiki/IBM_System/360
            - text: . It spanned the complete range of commercial and scientific applications from large to small, allowing companies for the first time to upgrade to models with greater computing capability without having to rewrite their applications. It was followed by the
            - link "IBM System/370" [ref=e848] [cursor=pointer]:
              - /url: /wiki/IBM_System/370
            - text: in 1970. Together the 360 and 370 made the
            - link "IBM mainframe" [ref=e849] [cursor=pointer]:
              - /url: /wiki/IBM_mainframe
            - text: the dominant
            - link "mainframe computer" [ref=e850] [cursor=pointer]:
              - /url: /wiki/Mainframe_computer
            - text: and the dominant computing platform in the industry throughout this period and into the early 1980s. They and the operating systems that ran on them such as
            - link "OS/VS1" [ref=e851] [cursor=pointer]:
              - /url: /wiki/OS/VS1
            - text: and
            - link "MVS" [ref=e852] [cursor=pointer]:
              - /url: /wiki/MVS
            - text: ", and the middleware built on top of those such as the"
            - link "CICS" [ref=e853] [cursor=pointer]:
              - /url: /wiki/CICS
            - text: transaction processing monitor, had a near-monopoly-level market share and became the thing IBM was most known for during this period.
            - superscript [ref=e854]:
              - link "[37]" [ref=e855] [cursor=pointer]:
                - /url: "#cite_note-38"
          - paragraph [ref=e856]:
            - text: In 1969, the United States of America alleged that IBM violated the
            - link "Sherman Antitrust Act" [ref=e857] [cursor=pointer]:
              - /url: /wiki/Sherman_Antitrust_Act
            - text: by monopolizing or attempting to monopolize the general-purpose electronic digital computer system market, specifically computers designed primarily for business, and subsequently alleged that IBM violated the antitrust laws in IBM's actions directed against leasing companies and plug-compatible peripheral manufacturers. Shortly after, IBM unbundled its software and services in what many observers believed was a direct result of the lawsuit, creating a competitive market for software. In 1982, the Department of Justice dropped the case as "without merit".
            - superscript [ref=e858]:
              - link "[38]" [ref=e859] [cursor=pointer]:
                - /url: "#cite_note-39"
          - paragraph [ref=e860]:
            - text: Also in 1969, IBM engineer
            - link "Forrest Parry" [ref=e861] [cursor=pointer]:
              - /url: /wiki/Forrest_Parry
            - text: invented the
            - link "magnetic stripe card" [ref=e862] [cursor=pointer]:
              - /url: /wiki/Magnetic_stripe_card
            - text: that would become ubiquitous for credit/debit/ATM cards, driver's licenses, rapid transit cards and a multitude of other identity and access control applications. IBM pioneered the manufacture of these cards, and for most of the 1970s, the data processing systems and software for such applications ran exclusively on IBM computers. In 1974, IBM engineer
            - link "George J. Laurer" [ref=e863] [cursor=pointer]:
              - /url: /wiki/George_J._Laurer
            - text: developed the
            - link "Universal Product Code" [ref=e864] [cursor=pointer]:
              - /url: /wiki/Universal_Product_Code
            - text: .
            - superscript [ref=e865]:
              - link "[39]" [ref=e866] [cursor=pointer]:
                - /url: "#cite_note-40"
            - text: IBM and the
            - link "World Bank" [ref=e867] [cursor=pointer]:
              - /url: /wiki/World_Bank
            - text: first introduced
            - link "financial swaps" [ref=e868] [cursor=pointer]:
              - /url: /wiki/Swap_(finance)
            - text: to the public in 1981, when it entered into a swap agreement.
            - superscript [ref=e869]:
              - link "[40]" [ref=e870] [cursor=pointer]:
                - /url: "#cite_note-41"
          - figure "The IBM Personal Computer (pictured) became one of IBM's best selling products and has had a wide influence on personal computing since its release in 1981." [ref=e871]:
            - link [ref=e872] [cursor=pointer]:
              - /url: /wiki/File:IBM_PC-IMG_7271_(transparent).png
              - img [ref=e873]
            - generic [ref=e874]:
              - text: The
              - link "IBM Personal Computer" [ref=e875] [cursor=pointer]:
                - /url: /wiki/IBM_Personal_Computer
              - text: (pictured) became one of IBM's best selling products and has had a wide
              - link "influence on personal computing" [ref=e876] [cursor=pointer]:
                - /url: /wiki/Influence_of_the_IBM_PC_on_the_personal_computer_market
              - text: since its release in 1981.
          - paragraph [ref=e877]:
            - text: IBM entered the
            - link "microcomputer" [ref=e878] [cursor=pointer]:
              - /url: /wiki/Microcomputer
            - text: market in the 1980s with the
            - link "IBM Personal Computer" [ref=e879] [cursor=pointer]:
              - /url: /wiki/IBM_Personal_Computer
            - text: (IBM 5150). The computer, which spawned a
            - link "long line of successors" [ref=e880] [cursor=pointer]:
              - /url: /wiki/List_of_IBM_Personal_Computer_models
            - text: ", had a profound"
            - link "influence on the development of the personal computer market" [ref=e881] [cursor=pointer]:
              - /url: /wiki/Influence_of_the_IBM_PC_on_the_personal_computer_market
            - text: and became one of IBM's best selling products of all time. Because of a lack of foresight by IBM,
            - superscript [ref=e882]:
              - link "[41]" [ref=e883] [cursor=pointer]:
                - /url: "#cite_note-42"
            - superscript [ref=e884]:
              - link "[42]" [ref=e885] [cursor=pointer]:
                - /url: "#cite_note-43"
            - text: the PC was not well protected by
            - link "intellectual property" [ref=e886] [cursor=pointer]:
              - /url: /wiki/Intellectual_property
            - text: laws. As a consequence, IBM quickly began losing its market dominance to emerging,
            - link "compatible" [ref=e887] [cursor=pointer]:
              - /url: /wiki/IBM_PC_compatible
            - text: competitors in the PC market.
          - paragraph [ref=e888]:
            - text: In 1985, IBM collaborated with
            - link "Microsoft" [ref=e889] [cursor=pointer]:
              - /url: /wiki/Microsoft
            - text: to develop a new
            - link "operating system" [ref=e890] [cursor=pointer]:
              - /url: /wiki/Operating_system
            - text: ", which was released as"
            - link "OS/2" [ref=e891] [cursor=pointer]:
              - /url: /wiki/OS/2
            - text: . Following a dispute, Microsoft severed the collaboration and IBM continued development of OS/2 on its own but it failed in the marketplace against Microsoft's
            - link "Windows" [ref=e892] [cursor=pointer]:
              - /url: /wiki/Windows
            - text: during the mid-1990s.
          - generic [ref=e893]:
            - heading "1990s–2000s" [level=3] [ref=e894]: 1990s–2000s
            - generic [ref=e895]:
              - text: "["
              - link "edit" [ref=e896] [cursor=pointer]:
                - /url: /w/index.php?title=IBM&action=edit&section=5
              - text: "]"
          - paragraph [ref=e897]:
            - text: In 1991, IBM began spinning off its many divisions into autonomous subsidiaries (so-called "Baby Blues") in an attempt to make the company more manageable and to streamline IBM by having other investors finance those companies.
            - superscript [ref=e898]:
              - link "[43]" [ref=e899] [cursor=pointer]:
                - /url: "#cite_note-44"
            - superscript [ref=e900]:
              - link "[44]" [ref=e901] [cursor=pointer]:
                - /url: "#cite_note-45"
            - text: These included
            - link "AdStar" [ref=e902] [cursor=pointer]:
              - /url: /wiki/AdStar
            - text: ", dedicated to disk drives and other data storage products; IBM Application Business Systems, dedicated to mid-range computers; IBM Enterprise Systems, dedicated to mainframes; Pennant Systems, dedicated to mid-range and large printers;"
            - link "Lexmark" [ref=e903] [cursor=pointer]:
              - /url: /wiki/Lexmark
            - text: ", dedicated to small printers; and more."
            - superscript [ref=e904]:
              - link "[45]" [ref=e905] [cursor=pointer]:
                - /url: "#cite_note-46"
            - text: Lexmark was acquired by
            - link "Clayton & Dubilier" [ref=e906] [cursor=pointer]:
              - /url: /wiki/Clayton,_Dubilier_%26_Rice
            - text: in a
            - link "leveraged buyout" [ref=e907] [cursor=pointer]:
              - /url: /wiki/Leveraged_buyout
            - text: shortly after its formation.
            - superscript [ref=e908]:
              - link "[46]" [ref=e909] [cursor=pointer]:
                - /url: "#cite_note-47"
          - paragraph [ref=e910]:
            - text: In 1997,
            - link "Deep Blue" [ref=e911] [cursor=pointer]:
              - /url: /wiki/Deep_Blue_(chess_computer)
            - text: ", a chess computer created by IBM beat Chess World Champion at the time,"
            - link "Garry Kasparov" [ref=e912] [cursor=pointer]:
              - /url: /wiki/Garry_Kasparov
            - text: in a six round match following standard tournament rules.
          - paragraph [ref=e913]:
            - text: In September 1992, IBM finished spinning off its various microcomputer personal computer manufacturing divisions and were consolidated into an autonomous wholly owned subsidiary known as the IBM Personal Computer Company (IBM PC Co.).
            - superscript [ref=e914]:
              - link "[47]" [ref=e915] [cursor=pointer]:
                - /url: "#cite_note-48"
            - superscript [ref=e916]:
              - link "[48]" [ref=e917] [cursor=pointer]:
                - /url: "#cite_note-49"
            - text: This corporate restructuring came after IBM reported a sharp drop in profit margins during the second quarter of fiscal year 1992; market analysts attributed the drop to a fierce price war in the personal computer market over the summer of 1992.
            - superscript [ref=e918]:
              - link "[49]" [ref=e919] [cursor=pointer]:
                - /url: "#cite_note-50"
            - text: The corporate restructuring was one of the largest and most expensive in history up to that point.
            - superscript [ref=e920]:
              - link "[50]" [ref=e921] [cursor=pointer]:
                - /url: "#cite_note-51"
            - text: By the summer of 1993, the IBM PC Co. had divided into multiple business units itself, including
            - link "Ambra Computer Corporation" [ref=e922] [cursor=pointer]:
              - /url: /wiki/Ambra_Computer_Corporation
            - text: and the IBM Power Personal Systems Group, the former an attempt to design and market "
            - link "clone" [ref=e923] [cursor=pointer]:
              - /url: /wiki/IBM_PC_compatible
            - text: "\" computers of IBM's own architecture and the latter responsible for IBM's"
            - link "PowerPC" [ref=e924] [cursor=pointer]:
              - /url: /wiki/PowerPC
            - text: "-based"
            - link "workstations" [ref=e925] [cursor=pointer]:
              - /url: /wiki/Workstation
            - text: .
            - superscript [ref=e926]:
              - link "[51]" [ref=e927] [cursor=pointer]:
                - /url: "#cite_note-52"
            - superscript [ref=e928]:
              - link "[52]" [ref=e929] [cursor=pointer]:
                - /url: "#cite_note-53"
            - text: IBM PC Co. introduced the
            - link "ThinkPad" [ref=e930] [cursor=pointer]:
              - /url: /wiki/ThinkPad
            - text: clone computers, which IBM would heavily market and would eventually become one of the best-selling series of
            - link "notebook computers" [ref=e931] [cursor=pointer]:
              - /url: /wiki/Notebook_computers
            - text: .
            - superscript [ref=e932]:
              - link "[53]" [ref=e933] [cursor=pointer]:
                - /url: "#cite_note-54"
          - paragraph [ref=e934]:
            - text: In 1993, IBM posted an $8 billion loss – at the time the biggest in American corporate history.
            - superscript [ref=e935]:
              - link "[54]" [ref=e936] [cursor=pointer]:
                - /url: "#cite_note-55"
            - link "Lou Gerstner" [ref=e937] [cursor=pointer]:
              - /url: /wiki/Lou_Gerstner
            - text: was hired as CEO from
            - link "RJR Nabisco" [ref=e938] [cursor=pointer]:
              - /url: /wiki/RJR_Nabisco
            - text: to turn the company around.
            - superscript [ref=e939]:
              - link "[55]" [ref=e940] [cursor=pointer]:
                - /url: "#cite_note-56"
            - text: In 1995, IBM purchased
            - link "Lotus Development Corporation" [ref=e941] [cursor=pointer]:
              - /url: /wiki/Lotus_Development
            - text: ", best known for its"
            - link "Lotus 1-2-3" [ref=e942] [cursor=pointer]:
              - /url: /wiki/Lotus_1-2-3
            - text: spreadsheet software.
            - superscript [ref=e943]:
              - link "[56]" [ref=e944] [cursor=pointer]:
                - /url: "#cite_note-57"
            - text: During the decade, IBM was working on a new operating system, named the
            - link "Workplace OS" [ref=e945] [cursor=pointer]:
              - /url: /wiki/Workplace_OS
            - text: project. Despite a large amount of money spent on the project, it was cancelled in 1996.
          - 'figure "IBM inventions (clockwise from top-left): the hard-disk drive, DRAM, the UPC bar code, and the magnetic stripe card" [ref=e946]':
            - link [ref=e947] [cursor=pointer]:
              - /url: /wiki/File:IBMinventions.png
              - img [ref=e948]
            - generic [ref=e949]:
              - text: "IBM inventions (clockwise from top-left): the"
              - link "hard-disk drive" [ref=e950] [cursor=pointer]:
                - /url: /wiki/Hard-disk_drive
              - text: ","
              - link "DRAM" [ref=e951] [cursor=pointer]:
                - /url: /wiki/DRAM
              - text: ", the"
              - link "UPC bar code" [ref=e952] [cursor=pointer]:
                - /url: /wiki/UPC_bar_code
              - text: ", and the"
              - link "magnetic stripe card" [ref=e953] [cursor=pointer]:
                - /url: /wiki/Magnetic_stripe_card
          - paragraph [ref=e954]:
            - text: In 1998, IBM merged the enterprise-oriented Personal Systems Group of the IBM PC Co. into IBM's own Global Services personal computer consulting and customer service division. The resulting merged business units then became known simply as IBM Personal Systems Group.
            - superscript [ref=e955]:
              - link "[57]" [ref=e956] [cursor=pointer]:
                - /url: "#cite_note-58"
            - text: A year later, IBM stopped selling its computers at retail outlets after its market share in this sector had fallen considerably behind competitors
            - link "Compaq" [ref=e957] [cursor=pointer]:
              - /url: /wiki/Compaq
            - text: and
            - link "Dell" [ref=e958] [cursor=pointer]:
              - /url: /wiki/Dell
            - text: .
            - superscript [ref=e959]:
              - link "[58]" [ref=e960] [cursor=pointer]:
                - /url: "#cite_note-59"
            - text: Immediately afterwards, the IBM PC Co. was dissolved and merged into IBM Personal Systems Group.
            - superscript [ref=e961]:
              - link "[59]" [ref=e962] [cursor=pointer]:
                - /url: "#cite_note-60"
          - paragraph [ref=e963]:
            - text: In the 2000s, IBM collaborated with the Chinese defense contractor Huadi to develop the “
            - link "Golden Shield Project" [ref=e964] [cursor=pointer]:
              - /url: /wiki/Golden_Shield_Project
            - text: ”, a large-scale policing and surveillance project in Beijing. The system was reportedly used to monitor online activity and target groups such as
            - link "Falun Gong" [ref=e965] [cursor=pointer]:
              - /url: /wiki/Falun_Gong
            - text: ","
            - link "Uyghurs" [ref=e966] [cursor=pointer]:
              - /url: /wiki/Uyghurs
            - text: and other individuals considered security risks.
