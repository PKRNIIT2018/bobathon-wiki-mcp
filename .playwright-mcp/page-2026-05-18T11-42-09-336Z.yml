              - text: (2019), the first circuit-based commercial quantum computer
          - paragraph [ref=e1486]:
            - text: "In January 2019, IBM introduced its first commercial quantum computer:"
            - link "IBM Q System One" [ref=e1487] [cursor=pointer]:
              - /url: /wiki/IBM_Q_System_One
            - text: .
            - superscript [ref=e1488]:
              - link "[166]" [ref=e1489] [cursor=pointer]:
                - /url: "#cite_note-168"
            - text: In March 2020, it was announced that IBM would build Europe's first quantum data center in
            - link "Ehningen" [ref=e1490] [cursor=pointer]:
              - /url: /wiki/Ehningen
            - text: ","
            - link "Germany" [ref=e1491] [cursor=pointer]:
              - /url: /wiki/Germany
            - text: . The center, operated by the
            - link "Fraunhofer Society" [ref=e1492] [cursor=pointer]:
              - /url: /wiki/Fraunhofer_Society
            - text: ", was opened in 2024."
            - superscript [ref=e1493]:
              - link "[167]" [ref=e1494] [cursor=pointer]:
                - /url: "#cite_note-169"
            - superscript [ref=e1495]:
