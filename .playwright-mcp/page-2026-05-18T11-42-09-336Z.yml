          - paragraph [ref=e1420]:
            - text: IBM has a large and diverse portfolio of products and services. As of 2016 , these offerings fall into the categories of
            - link "cloud computing" [ref=e1421] [cursor=pointer]:
              - /url: /wiki/Cloud_computing
            - text: ", artificial intelligence,"
            - link "commerce" [ref=e1422] [cursor=pointer]:
              - /url: /wiki/Commerce
            - text: ","
            - link "data" [ref=e1423] [cursor=pointer]:
              - /url: /wiki/Data_analysis
            - text: and
            - link "analytics" [ref=e1424] [cursor=pointer]:
              - /url: /wiki/Analytics
            - text: ","
            - link "Internet of things" [ref=e1425] [cursor=pointer]:
              - /url: /wiki/Internet_of_things
            - text: (IoT),
            - superscript [ref=e1426]:
              - link "[156]" [ref=e1427] [cursor=pointer]:
                - /url: "#cite_note-158"
            - link "IT infrastructure" [ref=e1428] [cursor=pointer]:
              - /url: /wiki/IT_infrastructure
            - text: ","
            - link "mobile" [ref=e1429] [cursor=pointer]:
