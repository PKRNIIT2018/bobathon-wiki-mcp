            - text: and
            - link "Ricardo Legorreta" [ref=e1392] [cursor=pointer]:
              - /url: /wiki/Ricardo_Legorreta
            - text: . Van der Rohe's building in Chicago was recognized with the 1990
            - link "Honor Award" [ref=e1393] [cursor=pointer]:
              - /url: /wiki/Honor_Award
            - text: from the
            - link "National Building Museum" [ref=e1394] [cursor=pointer]:
              - /url: /wiki/National_Building_Museum
            - text: .
            - superscript [ref=e1395]:
              - link "[151]" [ref=e1396] [cursor=pointer]:
                - /url: "#cite_note-Honor-153"
          - paragraph [ref=e1397]:
            - text: In 2004, concerns were raised related to IBM's contribution in its early days to pollution in its original location in
            - link "Endicott, New York" [ref=e1398] [cursor=pointer]:
              - /url: /wiki/Endicott,_New_York#Pollution
            - text: .
            - superscript [ref=e1399]:
              - link "[152]" [ref=e1400] [cursor=pointer]:
                - /url: "#cite_note-154"
            - superscript [ref=e1401]:
              - link "[153]" [ref=e1402] [cursor=pointer]:
                - /url: "#cite_note-155"
            - text: IBM reported its total
            - link "CO2e emissions" [ref=e1403] [cursor=pointer]:
              - /url: /wiki/Carbon_footprint
            - text: (direct and indirect) for the twelve months ending December 31, 2020, at 621 kilotons (-324 /-34.3% year-on-year).
            - superscript [ref=e1404]:
              - link "[154]" [ref=e1405] [cursor=pointer]:
                - /url: "#cite_note-IBM_Total_CO2e_emissions_for_2020Q4-156"
            - text: In February 2021, IBM committed to achieve net zero greenhouse gas emissions by the year 2030.
            - superscript [ref=e1406]:
              - link "[155]" [ref=e1407] [cursor=pointer]:
                - /url: "#cite_note-157"
