            - text: .
            - superscript [ref=e1728]:
              - link "[204]" [ref=e1729] [cursor=pointer]:
                - /url: "#cite_note-206"
            - text: It was a general replacement for a 13-bar logo, since period photocopiers did not render narrow (as opposed to tall) stripes well. Aside from the logo, IBM used
            - link "Helvetica" [ref=e1730] [cursor=pointer]:
              - /url: /wiki/Helvetica
            - text: as a corporate typeface for 50 years, until it was replaced in 2017 by the custom-designed
            - link "IBM Plex" [ref=e1731] [cursor=pointer]:
              - /url: /wiki/IBM_Plex
            - text: .
          - paragraph [ref=e1732]:
            - text: IBM has a valuable brand as a result of over 100 years of operations and marketing campaigns. Since 1996, IBM has been the exclusive technology partner for the
            - link "Masters Tournament" [ref=e1733] [cursor=pointer]:
