          - paragraph [ref=e482]:
            - text: Slovan was officially founded on 3 May 1919 as I. ČSŠK Bratislava (the First CzechoSlovak Sports Club Bratislava). The first president was Police Captain Richard Brunner, who arranged the club's first temporary training ground at Kuchajda (
            - link "Pasienky" [ref=e483] [cursor=pointer]:
              - /url: /wiki/Pasienky
            - text: ). The club soon moved to
            - link "Petržalka" [ref=e484] [cursor=pointer]:
              - /url: /wiki/Petr%C5%BEalka
            - text: .
          - figure "Slovan squad from 1919 season" [ref=e485]:
            - link [ref=e486] [cursor=pointer]:
              - /url: /wiki/File:1csskba.jpg
              - img [ref=e487]
            - generic [ref=e488]: Slovan squad from 1919 season
          - paragraph [ref=e489]:
            - text: I. ČsŠK became the champions of
            - link "Slovakia" [ref=e490] [cursor=pointer]:
              - /url: /wiki/Slovakia
            - text: in 1922. Notable players from the early era were
            - link "Pavol Šoral" [ref=e491] [cursor=pointer]:
              - /url: /wiki/Pavol_%C5%A0oral
            - text: ","
            - link "Štefan Čambal" [ref=e492] [cursor=pointer]:
              - /url: /wiki/%C5%A0tefan_%C4%8Cambal
            - text: and
            - link "Štefan Priboj" [ref=e493] [cursor=pointer]:
              - /url: /wiki/%C5%A0tefan_Priboj
            - text: . In the spring of 1938
            - link "anti-Jewish" [ref=e494] [cursor=pointer]:
              - /url: /wiki/Antisemitism
            - text: sentiments penetrated into the club, and the victim was coach
            - link "József Braun" [ref=e495] [cursor=pointer]:
              - /url: /wiki/J%C3%B3zsef_Braun
            - text: ", who was one of the many Bratislava inhabitants who had to involuntarily leave the city. Under the terms of the 1938"
            - link "Munich Agreement" [ref=e496] [cursor=pointer]:
              - /url: /wiki/Munich_Agreement
            - text: Czechoslovakia was dissolved, leading to the emergence of the
            - link "Slovak Republic" [ref=e497] [cursor=pointer]:
              - /url: /wiki/Slovak_Republic_(1939%E2%80%931945)
            - text: . At this point the club name was changed to ŠK Bratislava. On 26 September 1940 ŠK Bratislava played its first game at the new stadium,
            - link "Tehelné pole" [ref=e498] [cursor=pointer]:
              - /url: /wiki/Teheln%C3%A9_pole_(1939)
            - text: .
          - paragraph [ref=e499]:
            - text: The first international meeting at the new venue was on 27 October 1940, when ŠK Bratislava and
            - link "Hertha Berlin" [ref=e500] [cursor=pointer]:
              - /url: /wiki/Hertha_Berlin
            - text: played out a 2–2 draw. In the separate Slovak league, ŠK Bratislava won the title four times in the period from 1939 to 1945. Slovan was the first Czechoslovak team to use the
            - link "WM formation" [ref=e501] [cursor=pointer]:
              - /url: /wiki/WM_formation
            - text: . The team's first foreign opponent after World War II was
            - link "Ferencvárosi TC" [ref=e502] [cursor=pointer]:
              - /url: /wiki/Ferencv%C3%A1rosi_TC
            - text: . ŠK Bratislava lost 1–0, but won the Central European Cup 2–1 over Hungary before 20,000 spectators at Tehelné pole. In this period former players of I. ČSŠK Bratislava
            - link "Ferdinand Daučík" [ref=e503] [cursor=pointer]:
              - /url: /wiki/Ferdinand_Dau%C4%8D%C3%ADk
            - text: and
            - link "Leopold \"Jim\" Šťastný" [ref=e504] [cursor=pointer]:
              - /url: /wiki/Leopold_%C5%A0%C5%A5astn%C3%BD
            - text: served as coaches for ŠK Bratislava.
          - generic [ref=e505]:
            - 'heading "1945–1993: Czechoslovak League" [level=3] [ref=e506]': "1945–1993: Czechoslovak League"
            - generic [ref=e507]:
              - text: "["
              - link "edit" [ref=e508] [cursor=pointer]:
