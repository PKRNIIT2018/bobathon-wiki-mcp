          - generic [ref=e733]:
            - 'heading "1993–present: Slovak League" [level=3] [ref=e734]': "1993–present: Slovak League"
            - generic [ref=e735]:
              - text: "["
              - link "edit" [ref=e736] [cursor=pointer]:
                - /url: /w/index.php?title=%C5%A0K_Slovan_Bratislava&action=edit&section=6
              - text: "]"
          - paragraph [ref=e737]:
            - text: Slovan won titles in the Slovak league in the 1993–94, 1994–95 and 1995–96 seasons. For the next two years,
            - link "MFK Košice" [ref=e738] [cursor=pointer]:
              - /url: /wiki/MFK_Ko%C5%A1ice
            - text: won the title. Slovan returned to the Slovak throne in the 1998–99 season. The stars of the team included coach
            - link "Stanislav Griga" [ref=e739] [cursor=pointer]:
              - /url: /wiki/Stanislav_Griga
            - text: and players
            - link "Róbert Tomaschek" [ref=e740] [cursor=pointer]:
              - /url: /wiki/R%C3%B3bert_Tomaschek
            - text: ","
            - link "Miroslav König" [ref=e741] [cursor=pointer]:
              - /url: /wiki/Miroslav_K%C3%B6nig
            - text: ","
            - link "Stanislav Varga" [ref=e742] [cursor=pointer]:
              - /url: /wiki/Stanislav_Varga
            - text: ","
            - link "Tibor Jančula" [ref=e743] [cursor=pointer]:
              - /url: /wiki/Tibor_Jan%C4%8Dula
            - text: ", and"
            - link "Ladislav Pecko" [ref=e744] [cursor=pointer]:
              - /url: /wiki/Ladislav_Pecko
            - text: . In the next few years the club's performance was below par and they were in trouble financially. They were forced to sell some of their best players. At the end of the
            - link "2003–04 season" [ref=e745] [cursor=pointer]:
              - /url: /wiki/2003%E2%80%9304_Slovak_Superliga
            - text: ", the team was relegated to the"
            - link "Slovak Second League" [ref=e746] [cursor=pointer]:
              - /url: /wiki/Slovak_Second_League
            - text: ", where they spent two seasons. After two years, in the"
            - link "2010–11 season" [ref=e747] [cursor=pointer]:
              - /url: /wiki/2010%E2%80%9311_Slovak_Superliga
            - text: Slovan won
            - link "the double" [ref=e748] [cursor=pointer]:
              - /url: /wiki/Double_(association_football)
            - text: with coach
            - link "Karel Jarolím" [ref=e749] [cursor=pointer]:
              - /url: /wiki/Karel_Jarol%C3%ADm
            - text: .
