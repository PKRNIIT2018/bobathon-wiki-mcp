            - text: in 2011 and
            - link "Branislav Niňaj" [ref=e3033] [cursor=pointer]:
              - /url: /wiki/Branislav_Ni%C5%88aj
            - text: to
            - link "Lokeren" [ref=e3034] [cursor=pointer]:
              - /url: /wiki/K.S.C._Lokeren_Oost-Vlaanderen
            - text: in 2015. Second highest transfer was agreed in 2020 when 25 years old striker and previous season topscorer
            - link "Andraž Šporar" [ref=e3035] [cursor=pointer]:
              - /url: /wiki/Andra%C5%BE_%C5%A0porar
            - text: joined Portugal team
            - link "Sporting CP" [ref=e3036] [cursor=pointer]:
              - /url: /wiki/Sporting_CP
            - text: for a fee more than €7 million. Top transfer was agreed in 2025 when topscorer
            - link "David Strelec" [ref=e3037] [cursor=pointer]:
              - /url: /wiki/David_Strelec
            - text: joined
            - link "Middlesbrough F.C." [ref=e3038] [cursor=pointer]:
              - /url: /wiki/Middlesbrough_F.C.
            - text: for a fee €10 million, which was the highest ever paid to a Slovak club.
