              - text: "]"
          - note [ref=e783]:
            - text: "Main article:"
            - link "Štadión Pasienky" [ref=e784] [cursor=pointer]:
              - /url: /wiki/%C5%A0tadi%C3%B3n_Pasienky
          - figure "Štadión Pasienky" [ref=e785]:
            - link [ref=e786] [cursor=pointer]:
              - /url: /wiki/File:Slovakia_bratislava_%C5%A0tadi%C3%B3n_Pasienky.jpg
              - img [ref=e787]
            - generic [ref=e788]: Štadión Pasienky
          - paragraph [ref=e789]:
            - text: During the demolition of the old Tehelné pole, the planning of the construction of the new stadium and during the construction itself, the
            - link "Pasienky Stadium" [ref=e790] [cursor=pointer]:
              - /url: /wiki/%C5%A0tadi%C3%B3n_Pasienky
            - text: became the temporary home ground for Slovan.
          - generic [ref=e791]:
            - 'heading "2019–present: new Tehelné pole" [level=3] [ref=e792]': "2019–present: new Tehelné pole"
            - generic [ref=e793]:
              - text: "["
              - link "edit" [ref=e794] [cursor=pointer]:
                - /url: /w/index.php?title=%C5%A0K_Slovan_Bratislava&action=edit&section=10
              - text: "]"
          - note [ref=e795]:
            - text: "Main article:"
            - link "Tehelné pole" [ref=e796] [cursor=pointer]:
              - /url: /wiki/Teheln%C3%A9_pole
          - figure "Tehelné Pole" [ref=e797]:
            - link [ref=e798] [cursor=pointer]:
              - /url: /wiki/File:Tehelne_pole.jpg
              - img [ref=e799]
            - generic [ref=e800]: Tehelné Pole
          - paragraph [ref=e801]:
            - text: In September 2016, after many years of negotiations and discussions, the building of the new stadium begun. The new stadium was opened on 3 March 2019 with a ceremony before the derby match against
            - link "Spartak Trnava" [ref=e802] [cursor=pointer]:
              - /url: /wiki/FC_Spartak_Trnava
            - text: . The new stadium was built at the same place where Slovan has had its original home. It is a locality, which is typically connected with sports activities in
            - link "Bratislava" [ref=e803] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: . The capacity of the new stadium is 22,500 spectators and fulfils UEFA 4-star category criteria.
          - generic [ref=e804]:
            - heading "Support" [level=2] [ref=e805]
            - generic [ref=e806]:
              - text: "["
              - link "edit" [ref=e807] [cursor=pointer]:
                - /url: /w/index.php?title=%C5%A0K_Slovan_Bratislava&action=edit&section=11
              - text: "]"
          - figure "Slovan fans are called Ultras Slovan" [ref=e808]:
            - link [ref=e809] [cursor=pointer]:
              - /url: /wiki/File:Slovan_Trnava_fans.jpg
              - img [ref=e810]
            - generic [ref=e811]: Slovan fans are called Ultras Slovan
          - paragraph [ref=e812]:
            - text: The main
            - link "ultras" [ref=e813] [cursor=pointer]:
              - /url: /wiki/Ultras
            - text: group is called Ultras Slovan or Sektor C - according to the section in which they are situated during home matches. Previously, the main ultras group was called Belasá šlachta (Sky-blue aristocracy). The major hooligan firm is called Ultras Slovan Pressburg.
          - paragraph [ref=e814]:
            - text: Slovan supporters maintain friendly relations with fans of
            - link "Zbrojovka Brno" [ref=e815] [cursor=pointer]:
              - /url: /wiki/FC_Zbrojovka_Brno
            - text: ","
            - link "Austria Wien" [ref=e816] [cursor=pointer]:
              - /url: /wiki/FK_Austria_Wien
            - text: ","
            - superscript [ref=e817]:
              - link "[6]" [ref=e818] [cursor=pointer]:
                - /url: "#cite_note-6"
            - text: as well as Polish club
            - link "Wisła Kraków" [ref=e819] [cursor=pointer]:
              - /url: /wiki/Wis%C5%82a_Krak%C3%B3w
            - text: .
          - paragraph [ref=e820]:
            - text: Slovan Bratislava supporters have a history of involvement in far-right politics and hooliganism. In April 2007, fans commemorated
            - link "Adolf Hitler" [ref=e821] [cursor=pointer]:
              - /url: /wiki/Adolf_Hitler
            - text: "'s birthday during a home match in Senec, displaying a large banner with Hitler’s image and chanting slogans while giving Nazi salutes, though the police investigation was suspended due to lack of evidence."
            - superscript [ref=e822]:
              - link "[7]" [ref=e823] [cursor=pointer]:
                - /url: "#cite_note-7"
            - text: In July 2007, during an away match against Rapid Vienna in the
            - link "UEFA Intertoto Cup" [ref=e824] [cursor=pointer]:
              - /url: /wiki/UEFA_Intertoto_Cup
            - text: ", Slovan hooligans blocked traffic, destroyed property, and attempted to breach the opposing fan section, setting fires in the stands."
            - superscript [ref=e825]:
              - link "[8]" [ref=e826] [cursor=pointer]:
                - /url: "#cite_note-Hooliganism_spreads_2007-8"
            - text: In September 2007, fans of rival Spartak Trnava clashed with Slovan fans in Bratislava, resulting in injuries to police and security officers and multiple detentions; local authorities did not fully resolve the incidents. In October 2007, Slovan fans in Trenčín invaded the home section, stole banners, and engaged in physical assaults, with arrests and investigations following the incident.
            - superscript [ref=e827]:
              - link "[8]" [ref=e828] [cursor=pointer]:
                - /url: "#cite_note-Hooliganism_spreads_2007-8"
          - paragraph [ref=e829]:
            - text: The fanbase has also been involved in international far-right networks. In March 2022, a neo-Nazi banner featuring a Nazi
            - link "SS" [ref=e830] [cursor=pointer]:
              - /url: /wiki/Schutzstaffel
            - text: version of a
            - link "Totenkopf" [ref=e831] [cursor=pointer]:
              - /url: /wiki/Totenkopf
            - text: and the motto "
            - link "My honor means loyalty" [ref=e832] [cursor=pointer]:
              - /url: /wiki/Meine_Ehre_hei%C3%9Ft_Treue
            - text: "\" appeared at a Vienna match, linked to Slovan Bratislava supporters in coordination with far-right Austrian groups."
            - superscript [ref=e833]:
              - link "[9]" [ref=e834] [cursor=pointer]:
                - /url: "#cite_note-9"
            - text: Individual members of the club’s leadership have also faced legal consequences for public expressions of far-right ideology; in 2018, Ivan Kmotrik Jr., vice president and manager of Slovan Bratislava, performed a Nazi salute at a Slovak Cup match and was fined by both the Slovak Football Association and a court in 2019.
            - superscript [ref=e835]:
              - link "[10]" [ref=e836] [cursor=pointer]:
                - /url: "#cite_note-10"
          - paragraph [ref=e837]:
            - text: In October 2019, UEFA ordered Slovan Bratislava to play their Europa League match against
            - link "Wolverhampton Wanderers" [ref=e838] [cursor=pointer]:
              - /url: /wiki/Wolverhampton_Wanderers
            - text: in an empty stadium as punishment for incidents in previous European qualifiers that season, including chants targeting Greek, Albanian, and Jewish people, and an offensive banner displayed during an August playoff against
            - link "PAOK" [ref=e839] [cursor=pointer]:
              - /url: /wiki/PAOK
            - text: of Greece.
            - superscript [ref=e840]:
              - link "[11]" [ref=e841] [cursor=pointer]:
                - /url: "#cite_note-11"
            - text: UEFA's appeals panel dismissed the Slovak club’s appeal against the one-match stadium closure. UEFA also fined Slovan €50,000 for the racist incidents, with an additional €41,750 for other offences, including fan disorder. UEFA initially banned all spectators, but Slovan circumvented the ban under a new regulation allowing children from local schools or football academies to attend free of charge. Thus, the stadium was filled with 20,000 under-14s and their chaperones. Wolves supporters were initially banned as well, though a small number were later able to gain entry through VIP allocations or last-minute arrangements.
            - superscript [ref=e842]:
              - link "[12]" [ref=e843] [cursor=pointer]:
                - /url: "#cite_note-12"
          - paragraph [ref=e844]:
            - text: During a 12 April 2025 match against
            - link "DAC Dunajská" [ref=e845] [cursor=pointer]:
              - /url: /wiki/FC_DAC_1904_Dunajsk%C3%A1_Streda
            - text: ", Slovan Bratislava fans displayed overtly nationalist and anti-Hungarian behaviour. They unfurled a banner depicting a balaclava-clad Slovan ultra \"teaching a lesson\" to children wearing DAC and"
            - link "Ferencvárosi TC" [ref=e846] [cursor=pointer]:
              - /url: /wiki/Ferencv%C3%A1rosi_TC
            - text: kits, accompanied by a blackboard and inscriptions mocking Hungary and asserting Slovak dominance. Anti-Hungarian chants were a constant feature, and the timing of the match coincided with a historic date commemorating the deportation of ethnic Hungarians from Slovakia in 1947.
            - superscript [ref=e847]:
              - link "[13]" [ref=e848] [cursor=pointer]:
                - /url: "#cite_note-13"
          - paragraph [ref=e849]:
            - text: The club has issued official statements rejecting racism and intolerance. In July 2020, ŠK Slovan Bratislava stated that banners displayed by supporters containing political content did not represent the club, and emphasised the multinational composition of its squad as evidence of inclusivity. The club also indicated willingness to cooperate with authorities in banning individuals if legally sanctioned.
            - superscript [ref=e850]:
              - link "[14]" [ref=e851] [cursor=pointer]:
                - /url: "#cite_note-14"
          - generic [ref=e852]:
            - heading "Rivalries" [level=3] [ref=e853]
            - generic [ref=e854]:
              - text: "["
              - link "edit" [ref=e855] [cursor=pointer]:
                - /url: /w/index.php?title=%C5%A0K_Slovan_Bratislava&action=edit&section=12
              - text: "]"
          - note [ref=e856]:
            - text: "Main article:"
            - link "Traditional derby" [ref=e857] [cursor=pointer]:
              - /url: /wiki/Traditional_derby
          - paragraph [ref=e858]:
            - text: Slovan's greatest rival is
            - link "Spartak Trnava" [ref=e859] [cursor=pointer]:
              - /url: /wiki/FC_Spartak_Trnava
            - text: . The derby is the most prestigious match in the Slovak football calendar.
          - paragraph [ref=e860]:
            - text: Matches against
            - link "DAC Dunajská Streda" [ref=e861] [cursor=pointer]:
              - /url: /wiki/FC_DAC_1904_Dunajsk%C3%A1_Streda
            - text: are not considered derbies, but in general they are the second most prestigious fixture in the Slovak league after the traditional derby.
          - paragraph [ref=e862]:
            - text: Slovan's major rival teams in Bratislava were
            - link "Inter Bratislava" [ref=e863] [cursor=pointer]:
              - /url: /wiki/FK_Inter_Bratislava
            - text: and
            - link "Petržalka" [ref=e864] [cursor=pointer]:
              - /url: /wiki/FC_Petr%C5%BEalka
            - text: . The rivalry between Slovan and Inter had a long and rich history as both teams played in the
            - link "Czechoslovak First League" [ref=e865] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_First_League
            - text: . The rivalry with Petržalka peaked after 2000.
          - paragraph [ref=e866]:
            - text: On the international scene, Slovan's rivals are mainly clubs from neighboring countries. Namely,
            - link "Sparta Prague" [ref=e867] [cursor=pointer]:
              - /url: /wiki/AC_Sparta_Prague
            - text: (
            - link "Federal Derby" [ref=e868] [cursor=pointer]:
              - /url: /w/index.php?title=Federal_Derby&action=edit&redlink=1
            - text: ),
            - superscript [ref=e869]:
              - link "[15]" [ref=e870] [cursor=pointer]:
                - /url: "#cite_note-15"
            - superscript [ref=e871]:
              - link "[16]" [ref=e872] [cursor=pointer]:
                - /url: "#cite_note-16"
            - link "Rapid Wien" [ref=e873] [cursor=pointer]:
              - /url: /wiki/SK_Rapid_Wien
            - superscript [ref=e874]:
              - link "[17]" [ref=e875] [cursor=pointer]:
                - /url: "#cite_note-17"
            - text: or
            - link "Ferencváros" [ref=e876] [cursor=pointer]:
              - /url: /wiki/Ferencv%C3%A1rosi_TC
            - text: .
