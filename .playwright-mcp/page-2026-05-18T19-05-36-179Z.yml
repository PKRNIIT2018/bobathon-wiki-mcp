              - img [ref=e511]
            - generic [ref=e512]: Champion of Czechoslovakia squad from 1951.
          - paragraph [ref=e513]:
            - text: The team name changed again in 1948, to Sokol NV Bratislava. The team met with success in 1949, when they became the first champions of the re-formed
            - link "Czechoslovakia" [ref=e514] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: . Outstanding players from this era included
            - link "Emil Pažický" [ref=e515] [cursor=pointer]:
              - /url: /wiki/Emil_Pa%C5%BEick%C3%BD
            - text: ","
            - link "Gejza Šimanský" [ref=e516] [cursor=pointer]:
              - /url: /wiki/Gejza_%C5%A0imansk%C3%BD
            - text: ","
            - link "Bozhin Laskov" [ref=e517] [cursor=pointer]:
              - /url: /wiki/Bozhin_Laskov
            - text: ","
            - link "Viktor Tegelhoff" [ref=e518] [cursor=pointer]:
              - /url: /wiki/Viktor_Tegelhoff
            - text: ", and"
            - link "Teodor Reimann" [ref=e519] [cursor=pointer]:
              - /url: /wiki/Teodor_Reimann
            - text: .
          - paragraph [ref=e520]:
            - link "Anton Bulla" [ref=e521] [cursor=pointer]:
              - /url: /wiki/Anton_Bulla
            - text: ", the coach in 1953, added eight new players to team. In 1961–62 the team defeated"
            - link "Red Star Bratislava" [ref=e522] [cursor=pointer]:
              - /url: /wiki/Inter_Bratislava
            - text: in the national league for the title. Under the influence of political and economic pressures and interests, TJ ÚNV Slovan and TJ Dimitrov merged to create CHZJD Slovan Bratislava on 5 August 1961 (CHZJD stood for the
            - link "Juraj Dimitrov" [ref=e523] [cursor=pointer]:
              - /url: /wiki/Juraj_Dimitrov
            - text: Chemical Plant).
          - figure "Slovan squad from 1963 to 1964, with national team players like Schrojf, Popluhár, Jokl and Cvetler." [ref=e524]:
            - link [ref=e525] [cursor=pointer]:
