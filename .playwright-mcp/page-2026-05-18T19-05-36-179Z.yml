          - paragraph [ref=e625]:
            - text: Slovan ended the 1967–68 season second in the league, won the cup in Czechoslovakia, and participated in the
            - link "UEFA Cup Winners' Cup" [ref=e626] [cursor=pointer]:
              - /url: /wiki/UEFA_Cup_Winners%27_Cup
            - text: . The team was managed by former Slovan player
            - link "Michal Vičan" [ref=e627] [cursor=pointer]:
              - /url: /wiki/Michal_Vi%C4%8Dan
            - text: ", who focused on fast and simple games. Vičan took the team on a winter tour of Argentina in 1969."
          - paragraph [ref=e628]:
            - text: In 1970 the Czechoslovak squad sent to the
            - link "FIFA World Cup" [ref=e629] [cursor=pointer]:
              - /url: /wiki/1970_FIFA_World_Cup
            - text: "in Mexico included seven players from Slovan:"
            - link "Alexander Vencel" [ref=e630] [cursor=pointer]:
              - /url: /wiki/Alexander_Vencel_(footballer,_born_1944)
            - text: ","
            - link "Ján Zlocha" [ref=e631] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Zlocha
            - text: ","
            - link "Ivan Hrdlička" [ref=e632] [cursor=pointer]:
              - /url: /wiki/Ivan_Hrdli%C4%8Dka
            - text: ","
            - link "Karol Jokl" [ref=e633] [cursor=pointer]:
              - /url: /wiki/Karol_Jokl
            - text: ","
            - link "Ján Čapkovič" [ref=e634] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_%C4%8Capkovi%C4%8D
            - text: ","
            - link "Vladimír Hrivnák" [ref=e635] [cursor=pointer]:
              - /url: /wiki/Vladim%C3%ADr_Hrivn%C3%A1k
            - text: ", and"
            - link "Alexander Horváth" [ref=e636] [cursor=pointer]:
              - /url: /wiki/Alexander_Horv%C3%A1th
            - text: .
            - link "Jozef Vengloš" [ref=e637] [cursor=pointer]:
              - /url: /wiki/Jozef_Venglo%C5%A1
            - text: was the coach of the Slovan Bratislava team for part of this era, as well as performing duties coaching at the international level.
          - paragraph [ref=e638]:
            - text: In 1976, a Czechoslovak team including six Slovan players won the European title in the
            - link "European Championships" [ref=e639] [cursor=pointer]:
              - /url: /wiki/UEFA_Euro_1976
            - text: held in
            - link "Belgrade" [ref=e640] [cursor=pointer]:
              - /url: /wiki/Belgrade
            - text: . Gold medals were given to coach Vengloš,
            - link "Alexander Vencel" [ref=e641] [cursor=pointer]:
              - /url: /wiki/Alexander_Vencel_(footballer,_born_1944)
            - text: ","
            - link "Jozef Čapkovič" [ref=e642] [cursor=pointer]:
              - /url: /wiki/Jozef_%C4%8Capkovi%C4%8D
            - text: ","
            - link "Koloman Gogh" [ref=e643] [cursor=pointer]:
              - /url: /wiki/Koloman_Gogh
            - text: ","
            - link "Marián Masný" [ref=e644] [cursor=pointer]:
              - /url: /wiki/Mari%C3%A1n_Masn%C3%BD
            - text: ","
            - link "Anton Ondruš" [ref=e645] [cursor=pointer]:
              - /url: /wiki/Anton_Ondru%C5%A1
            - text: ","
            - link "Ján Pivarník" [ref=e646] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Pivarn%C3%ADk
            - text: ", and"
            - link "Ján Švehlík" [ref=e647] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_%C5%A0vehl%C3%ADk
            - text: . From the 1977–78, season Slovan were declining. In the 1984–85 season Slovan, led by coaches
            - link "Ján Hucko" [ref=e648] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Hucko
            - text: and
            - link "Jozef Obert" [ref=e649] [cursor=pointer]:
              - /url: /wiki/Jozef_Obert
            - text: ", left the highest level of competition and were relegated to the Slovak National League."
          - paragraph [ref=e650]:
            - text: After three seasons spent in the Slovak National League, Slovan Bratislava were able to return to national competition. In season 1987–88, the team returned to the top leagues under the leadership of coaches
            - link "Ján Zachar" [ref=e651] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Zachar
            - text: and
            - link "Jozef Jankech" [ref=e652] [cursor=pointer]:
              - /url: /wiki/Jozef_Jankech
            - text: ", who later coached the"
            - link "Slovak national team" [ref=e653] [cursor=pointer]:
              - /url: /wiki/Slovakia_national_football_team
            - text: .
            - link "Dušan Galis" [ref=e654] [cursor=pointer]:
              - /url: /wiki/Du%C5%A1an_Galis
            - text: was the coach from 1977 to 1981. In
            - link "1991–92" [ref=e655] [cursor=pointer]:
              - /url: /wiki/1991%E2%80%9392_Czechoslovak_First_League
            - text: ", Slovan Bratislava won the Czechoslovak title for the last time. Among the stars on the team were"
            - link "Peter Dubovský" [ref=e656] [cursor=pointer]:
              - /url: /wiki/Peter_Dubovsk%C3%BD_(footballer)
            - text: ","
            - link "Dušan Tittel" [ref=e657] [cursor=pointer]:
              - /url: /wiki/Du%C5%A1an_Tittel
            - text: ","
            - link "Ladislav Pecko" [ref=e658] [cursor=pointer]:
              - /url: /wiki/Ladislav_Pecko
            - text: ","
            - link "Vladimir Kinder" [ref=e659] [cursor=pointer]:
              - /url: /wiki/Vladimir_Kinder
            - text: ","
            - link "Miloš Glonek" [ref=e660] [cursor=pointer]:
              - /url: /wiki/Milo%C5%A1_Glonek
            - text: ","
            - link "Tomáš Stúpala" [ref=e661] [cursor=pointer]:
              - /url: /wiki/Tom%C3%A1%C5%A1_St%C3%BApala
            - text: ", and"
            - link "Alexander Vencel Jr." [ref=e662] [cursor=pointer]:
              - /url: /wiki/Alexander_Vencel_(footballer,_born_1967)
          - generic [ref=e663]:
            - 'heading "1969: Cup Winners'' Cup champions" [level=3] [ref=e664]': "1969: Cup Winners' Cup champions"
            - generic [ref=e665]:
              - text: "["
