            - generic [ref=e763]: Tehelné pole (old)
          - paragraph [ref=e764]:
            - link "Tehelné pole" [ref=e765] [cursor=pointer]:
              - /url: /wiki/Teheln%C3%A9_pole_(1939)
            - text: ", Slovan's previous stadium, was built during the"
            - link "first Slovak Republic" [ref=e766] [cursor=pointer]:
              - /url: /wiki/First_Slovak_Republic
            - text: ", when Nazi Germany occupied"
            - link "Petržalka" [ref=e767] [cursor=pointer]:
              - /url: /wiki/Petr%C5%BEalka
            - text: in 1938 and Bratislava lost almost all of its sporting facilities.
            - superscript [ref=e768]:
              - link "[3]" [ref=e769] [cursor=pointer]:
                - /url: "#cite_note-lacika-3"
            - text: The construction lasted from 1939 to 1944 and the stadium became home ground for Slovan Bratislava. The stadium was officially opened in September 1940 with 25,000 places, and the first international match was played on 27 October 1940, with Slovan Bratislava playing against
            - link "Hertha Berlin" [ref=e770] [cursor=pointer]:
              - /url: /wiki/Hertha_Berlin
            - text: ", ending in 2–2 tie. The old stadium underwent reconstruction in 1961, which added second tribune, boosting its capacity to 45,000 and modernising by adding score table, artificial light and revamping the field."
            - superscript [ref=e771]:
              - link "[4]" [ref=e772] [cursor=pointer]:
                - /url: "#cite_note-4"
            - text: However, the stadium could hold up even 50,000 spectators, and just before breakup of Czechoslovakia, it was the largest one in use (
            - link "Strahov Stadium" [ref=e773] [cursor=pointer]:
              - /url: /wiki/Strahov_Stadium
            - text: in Prague had a capacity of 220,000 but was disused in the 1990s) and was the home ground for
            - link "Czechoslovak national team" [ref=e774] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia_national_football_team
            - text: .
            - superscript [ref=e775]:
              - link "[5]" [ref=e776] [cursor=pointer]:
                - /url: "#cite_note-aktualne-5"
            - text: The stadium was reconstructed once more in the 1990s to the "all-seater" stadium, reducing the capacity into 30,000.
            - superscript [ref=e777]:
              - link "[5]" [ref=e778] [cursor=pointer]:
                - /url: "#cite_note-aktualne-5"
            - text: The last match at the old Tehelné pole stadium was played in November 2009.
          - generic [ref=e779]:
            - 'heading "2009–2018: Pasienky" [level=3] [ref=e780]': "2009–2018: Pasienky"
