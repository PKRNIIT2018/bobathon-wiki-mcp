          - paragraph [ref=e2997]:
            - text: Slovan have produced numerous players who have gone on to represent the
            - link "Slovak national football team" [ref=e2998] [cursor=pointer]:
              - /url: /wiki/Slovak_national_football_team
            - text: . Over the last period there has been a steady increase of young players leaving Slovan after a few years of first team football and moving on to play football in leagues of a higher standard, with the German
            - link "Bundesliga" [ref=e2999] [cursor=pointer]:
              - /url: /wiki/Bundesliga
            - text: (best scorer
            - link "Róbert Vittek" [ref=e3000] [cursor=pointer]:
