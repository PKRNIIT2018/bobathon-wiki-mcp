          - paragraph [ref=e446]:
            - text: "ŠK Slovan Bratislava ( Slovak pronunciation:"
            - link "[ˈslɔʋam ˈbracislaʋa]" [ref=e448] [cursor=pointer]:
              - /url: /wiki/Help:IPA/Slovak
            - text: ", \""
            - link "Bratislava" [ref=e449] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - link "Slavs" [ref=e450] [cursor=pointer]:
              - /url: /wiki/Slavs
            - text: "\") is a professional"
            - link "football" [ref=e451] [cursor=pointer]:
              - /url: /wiki/Association_football
            - text: club based in
            - link "Bratislava" [ref=e452] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ","
            - link "Slovakia" [ref=e453] [cursor=pointer]:
              - /url: /wiki/Slovakia
            - text: ", that plays in the"
            - link "Slovak First Football League" [ref=e454] [cursor=pointer]:
              - /url: /wiki/Slovak_First_Football_League
            - text: . Founded as I. ČSŠK Bratislava in 1919, the club changed its name to Slovan Bratislava in 1953. Slovan is the most successful team in Slovakia with the most titles in both league and cup in the country.
          - paragraph [ref=e455]:
            - text: Slovan Bratislava became the first and so far only club in Slovakia as well as former
            - link "Czechoslovakia" [ref=e456] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: to win one of the European cup competitions, the
            - link "Cup Winners' Cup" [ref=e457] [cursor=pointer]:
              - /url: /wiki/1968%E2%80%9369_European_Cup_Winners%27_Cup
            - text: when they defeated
            - link "FC Barcelona" [ref=e458] [cursor=pointer]:
              - /url: /wiki/FC_Barcelona
            - text: in the final in
            - link "Basel" [ref=e459] [cursor=pointer]:
              - /url: /wiki/Basel
            - text: in 1969. The club also supplied seven players to the victorious Czechoslovakia team of
            - link "UEFA Euro 1976" [ref=e460] [cursor=pointer]:
              - /url: /wiki/UEFA_Euro_1976
            - text: .
          - generic [ref=e461]:
            - heading "History" [level=2] [ref=e462]
