                - /url: /wiki/%C4%BDudov%C3%ADt_Cvetler
              - text: .
          - paragraph [ref=e532]:
            - text: 1962 was a successful year, as the Czechoslovakia national team were defeated 3–1 in the
            - link "1962 FIFA World Cup Final" [ref=e533] [cursor=pointer]:
              - /url: /wiki/1962_FIFA_World_Cup_Final
            - text: in Chile, obtaining the silver, and repeating the success of the
            - link "1934 FIFA World Cup Final" [ref=e534] [cursor=pointer]:
              - /url: /wiki/1934_FIFA_World_Cup_Final
            - text: in Rome. Slovan players included
            - link "goalkeeper" [ref=e535] [cursor=pointer]:
              - /url: /wiki/Goalkeeper_(association_football)
            - link "Viliam Schrojf" [ref=e536] [cursor=pointer]:
