            - text: to
            - link "Middlesbrough" [ref=e3004] [cursor=pointer]:
              - /url: /wiki/Middlesbrough_F.C.
            - text: in 1997,
            - link "Stanislav Varga" [ref=e3005] [cursor=pointer]:
              - /url: /wiki/Stanislav_Varga
            - text: to
            - link "Sunderland" [ref=e3006] [cursor=pointer]:
              - /url: /wiki/Sunderland_A.F.C.
            - text: in 2000,
            - link "Igor Bališ" [ref=e3007] [cursor=pointer]:
              - /url: /wiki/Igor_Bali%C5%A1
            - text: to
            - link "West Bromwich" [ref=e3008] [cursor=pointer]:
              - /url: /wiki/West_Bromwich_Albion_F.C.
            - text: in 2000), Turkish
            - link "Süper Lig" [ref=e3009] [cursor=pointer]:
              - /url: /wiki/S%C3%BCper_Lig
            - text: (
            - link "Marko Milinković" [ref=e3010] [cursor=pointer]:
              - /url: /wiki/Marko_Milinkovi%C4%87
            - text: to
            - link "Gençlerbirliği S.K." [ref=e3011] [cursor=pointer]:
              - /url: /wiki/Gen%C3%A7lerbirli%C4%9Fi_S.K.
            - text: in 2016,
            - link "Ľubomír Meszároš" [ref=e3012] [cursor=pointer]:
              - /url: /wiki/%C4%BDubom%C3%ADr_Mesz%C3%A1ro%C5%A1
            - text: to
            - link "Elazığspor" [ref=e3013] [cursor=pointer]:
              - /url: /wiki/Elaz%C4%B1%C4%9Fspor
            - text: in 2002,
