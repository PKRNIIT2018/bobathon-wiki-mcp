            - text: "Main article:"
            - link "1969 European Cup Winners' Cup Final" [ref=e668] [cursor=pointer]:
              - /url: /wiki/1969_European_Cup_Winners%27_Cup_Final
          - paragraph [ref=e669]:
            - text: On 21 May 1969, the team defeated
            - link "FC Barcelona" [ref=e670] [cursor=pointer]:
              - /url: /wiki/FC_Barcelona
            - text: in the
            - link "1969 European Cup Winners' Cup Final" [ref=e671] [cursor=pointer]:
              - /url: /wiki/1969_European_Cup_Winners%27_Cup_Final
            - text: by a score of 3–2, which is the biggest success in the club's history so far. During the match, well-known commentator
            - link "Gabo Zelenay" [ref=e672] [cursor=pointer]:
              - /url: /wiki/Gabo_Zelenay
            - text: delivered the slogan "Bieli jastrabi z Tehelného poľa bratislavského" (White Hawks from Tehelné pole Bratislava), referring to the Slovan players who had achieved success in the final.
            - superscript [ref=e673]:
              - link "[2]" [ref=e674] [cursor=pointer]:
                - /url: "#cite_note-:0-2"
            - text: The phrase later became one of the nicknames for the club.
            - superscript [ref=e675]:
              - link "[2]" [ref=e676] [cursor=pointer]:
                - /url: "#cite_note-:0-2"
