          - paragraph [ref=e571]:
            - text: Slovakia,
            - superscript [ref=e572]:
              - link "[b]" [ref=e573] [cursor=pointer]:
                - /url: "#cite_note-13"
            - text: officially the Slovak Republic,
            - superscript [ref=e574]:
              - link "[c]" [ref=e575] [cursor=pointer]:
                - /url: "#cite_note-14"
            - text: is a
            - link "landlocked country" [ref=e576] [cursor=pointer]:
              - /url: /wiki/Landlocked_country
            - text: in
            - link "Central Europe" [ref=e577] [cursor=pointer]:
              - /url: /wiki/Central_Europe
            - text: . It is bordered by
            - link "Poland" [ref=e578] [cursor=pointer]:
              - /url: /wiki/Poland
            - text: to the north,
            - link "Ukraine" [ref=e579] [cursor=pointer]:
              - /url: /wiki/Ukraine
            - text: to the east,
            - link "Hungary" [ref=e580] [cursor=pointer]:
              - /url: /wiki/Hungary
            - text: to the south,
            - link "Austria" [ref=e581] [cursor=pointer]:
              - /url: /wiki/Austria
            - text: to the west, and the
            - link "Czech Republic" [ref=e582] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: to the northwest. Slovakia's mostly mountainous territory spans about 49,000 km
            - superscript [ref=e583]: "2"
            - text: (19,000 sq mi), hosting a population exceeding 5.4 million. The capital and
            - link "largest city" [ref=e584] [cursor=pointer]:
              - /url: /wiki/List_of_cities_and_towns_in_Slovakia
            - text: is
            - link "Bratislava" [ref=e585] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ", while the second largest city is"
            - link "Košice" [ref=e586] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: .
          - paragraph [ref=e587]:
            - text: The
            - link "Slavs" [ref=e588] [cursor=pointer]:
              - /url: /wiki/Slavs
            - text: arrived in the territory of the present-day Slovakia in the 5th and 6th centuries. From the late 6th century, parts of modern Slovakia were incorporated into the
            - link "Avar Khaganate" [ref=e589] [cursor=pointer]:
              - /url: /wiki/Pannonian_Avars
            - text: . In the 7th century, the Slavs played a significant role in the creation of
            - link "Samo's Empire" [ref=e590] [cursor=pointer]:
              - /url: /wiki/Samo%27s_Empire
            - text: . When the Avar Khaganate dissolved in the 9th century, the Slavs established the
            - link "Principality of Nitra" [ref=e591] [cursor=pointer]:
              - /url: /wiki/Principality_of_Nitra
            - text: before it was annexed by the
            - link "Principality of Moravia" [ref=e592] [cursor=pointer]:
              - /url: /wiki/Great_Moravia
            - text: ", which later became"
            - link "Great Moravia" [ref=e593] [cursor=pointer]:
              - /url: /wiki/Great_Moravia
            - text: . When Great Moravia fell in the 10th century, the territory was integrated into the
            - link "Principality of Hungary" [ref=e594] [cursor=pointer]:
              - /url: /wiki/Principality_of_Hungary
            - text: at the end of the 9th century, which later became the
            - link "Kingdom of Hungary" [ref=e595] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Hungary
            - text: in 1000.
            - superscript [ref=e596]:
              - link "[12]" [ref=e597] [cursor=pointer]:
                - /url: "#cite_note-15"
            - text: In 1241 and 1242, after the
            - link "Mongol invasion of Europe" [ref=e598] [cursor=pointer]:
              - /url: /wiki/Mongol_invasion_of_Europe
            - text: ", much of the territory was destroyed, but was recovered largely thanks to Hungarian king"
            - link "Béla IV" [ref=e599] [cursor=pointer]:
              - /url: /wiki/B%C3%A9la_IV_of_Hungary
            - text: . During the 16th and 17th centuries, southern portions of present-day Slovakia were incorporated into provinces of the
            - link "Ottoman Empire" [ref=e600] [cursor=pointer]:
              - /url: /wiki/Ottoman_Empire
            - text: .
            - superscript [ref=e601]:
              - link "[13]" [ref=e602] [cursor=pointer]:
                - /url: "#cite_note-Pirický-2023-16"
            - superscript [ref=e603]:
              - link "[14]" [ref=e604] [cursor=pointer]:
                - /url: "#cite_note-Ágoston-1998-17"
            - text: The Ottoman-controlled areas were ceded to the Habsburgs by the turn of the 18th century. The Hungarian declaration of
            - link "independence" [ref=e605] [cursor=pointer]:
              - /url: /wiki/Hungarian_Revolution_of_1848
            - text: in 1848 was followed in the same year by the
            - link "Slovak Uprising" [ref=e606] [cursor=pointer]:
              - /url: /wiki/Slovak_Uprising_of_1848%E2%80%9349
            - text: through the establishment of the
            - link "Slovak National Council" [ref=e607] [cursor=pointer]:
              - /url: /wiki/Slovak_National_Council_(1848%E2%80%931849)
            - text: .
            - superscript [ref=e608]:
              - link "[15]" [ref=e609] [cursor=pointer]:
                - /url: "#cite_note-18"
            - text: While the uprising did not achieve its aim, it played an important role in cementing a Slovak national identity. The Hungarian wars of independence eventually resulted in a compromise that established the
            - link "Austro-Hungarian Empire" [ref=e610] [cursor=pointer]:
              - /url: /wiki/Austria-Hungary
            - text: .
            - superscript [ref=e611]:
              - link "[16]" [ref=e612] [cursor=pointer]:
                - /url: "#cite_note-19"
          - paragraph [ref=e613]:
            - text: During
            - link "World War I" [ref=e614] [cursor=pointer]:
              - /url: /wiki/World_War_I
            - text: ", the"
            - link "Czechoslovak National Council" [ref=e615] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_National_Council
            - text: successfully fought for
            - link "independence" [ref=e616] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_declaration_of_independence
            - text: amidst the collapse of the Austro-Hungarian Empire, and the state of
            - link "Czechoslovakia" [ref=e617] [cursor=pointer]:
              - /url: /wiki/First_Czechoslovak_Republic
            - text: was proclaimed in 1918. The borders were set by the
            - link "Treaty of Saint Germain" [ref=e618] [cursor=pointer]:
              - /url: /wiki/Treaty_of_Saint-Germain-en-Laye_(1919)
            - text: in 1919 and by the
            - link "Treaty of Trianon" [ref=e619] [cursor=pointer]:
              - /url: /wiki/Treaty_of_Trianon
            - text: in 1920 Czechoslovakia incorporated the territory of present-day Slovakia which was entirely part of the
            - link "Kingdom of Hungary" [ref=e620] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Hungary
            - text: . In the lead up to
            - link "World War II" [ref=e621] [cursor=pointer]:
              - /url: /wiki/World_War_II
            - text: ", local fascist parties gradually came to power in the Slovak lands, and the first"
            - link "Slovak Republic" [ref=e622] [cursor=pointer]:
              - /url: /wiki/Slovak_Republic_(1939%E2%80%931945)
            - text: was established in 1939 as a
            - link "one-party" [ref=e623] [cursor=pointer]:
              - /url: /wiki/One-party_state
            - link "clerical fascist" [ref=e624] [cursor=pointer]:
              - /url: /wiki/Clerical_fascism
            - link "client state" [ref=e625] [cursor=pointer]:
              - /url: /wiki/Client_state
            - text: under the control of
            - link "Nazi Germany" [ref=e626] [cursor=pointer]:
              - /url: /wiki/Nazi_Germany
            - text: . In 1940, the country joined the
            - link "Axis" [ref=e627] [cursor=pointer]:
              - /url: /wiki/Axis_powers
            - text: when its leaders signed the
            - link "Tripartite Pact" [ref=e628] [cursor=pointer]:
              - /url: /wiki/Tripartite_Pact
            - text: .
            - link "Czechoslovakia" [ref=e629] [cursor=pointer]:
              - /url: /wiki/Third_Czechoslovak_Republic
            - text: was re-established after the country's
            - link "liberation" [ref=e630] [cursor=pointer]:
              - /url: /wiki/Occupation_of_Czechoslovakia_(1938%E2%80%931945)#Liberation_of_Czechoslovakia
            - text: at the end of the war in 1945. Following the
            - link "Soviet-backed coup of 1948" [ref=e631] [cursor=pointer]:
              - /url: /wiki/1948_Czechoslovak_coup_d%27%C3%A9tat
            - text: ", Czechoslovakia became a"
            - link "communist state" [ref=e632] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_Socialist_Republic
            - text: within the
            - link "Eastern Bloc" [ref=e633] [cursor=pointer]:
              - /url: /wiki/Eastern_Bloc
            - text: ", a"
            - link "satellite state" [ref=e634] [cursor=pointer]:
              - /url: /wiki/Satellite_state
            - text: of the
            - link "Soviet Union" [ref=e635] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: behind the
            - link "Iron Curtain" [ref=e636] [cursor=pointer]:
              - /url: /wiki/Iron_Curtain
            - text: and member of the
            - link "Warsaw Pact" [ref=e637] [cursor=pointer]:
              - /url: /wiki/Warsaw_Pact
            - text: . Attempts to
            - link "liberalise communism" [ref=e638] [cursor=pointer]:
              - /url: /wiki/Socialism_with_a_human_face
            - text: culminated in the
            - link "Prague Spring" [ref=e639] [cursor=pointer]:
              - /url: /wiki/Prague_Spring
            - text: ", which was suppressed by the"
            - link "Warsaw Pact invasion of Czechoslovakia" [ref=e640] [cursor=pointer]:
              - /url: /wiki/Warsaw_Pact_invasion_of_Czechoslovakia
            - text: in August 1968. In 1989, the
            - link "Velvet Revolution" [ref=e641] [cursor=pointer]:
              - /url: /wiki/Velvet_Revolution
            - text: peacefully ended Communist rule in Czechoslovakia. Slovakia became an independent
            - link "democratic" [ref=e642] [cursor=pointer]:
              - /url: /wiki/Democracy
            - text: state on 1 January 1993 after the peaceful dissolution of
            - link "Czechoslovakia" [ref=e643] [cursor=pointer]:
              - /url: /wiki/Czech_and_Slovak_Federative_Republic
            - text: ", sometimes referred to as the"
            - link "Velvet Divorce" [ref=e644] [cursor=pointer]:
              - /url: /wiki/Velvet_Divorce
            - text: .
          - paragraph [ref=e645]:
            - text: Slovakia is a
            - link "developed country" [ref=e646] [cursor=pointer]:
              - /url: /wiki/Developed_country
            - text: with an advanced
            - link "high-income economy" [ref=e647] [cursor=pointer]:
              - /url: /wiki/World_Bank_high-income_economy
            - text: . The country maintains a combination of a
            - link "market economy" [ref=e648] [cursor=pointer]:
              - /url: /wiki/Market_economy
            - text: with a comprehensive
            - link "social security" [ref=e649] [cursor=pointer]:
              - /url: /wiki/Welfare_spending
            - text: system, providing citizens with
            - link "universal health care" [ref=e650] [cursor=pointer]:
              - /url: /wiki/Universal_health_care
            - text: ","
            - link "free education" [ref=e651] [cursor=pointer]:
              - /url: /wiki/Free_education
            - text: ", one of the"
            - link "lowest retirement ages" [ref=e652] [cursor=pointer]:
              - /url: /wiki/Retirement_in_Europe
            - text: in Europe and one of the longest paid
            - link "parental leaves" [ref=e653] [cursor=pointer]:
              - /url: /wiki/Parental_leave
            - text: in the
            - link "OECD" [ref=e654] [cursor=pointer]:
              - /url: /wiki/OECD
            - text: .
            - superscript [ref=e655]:
              - link "[17]" [ref=e656] [cursor=pointer]:
                - /url: "#cite_note-20"
            - text: Slovakia is a member of the
            - link "European Union" [ref=e657] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: ", the"
            - link "eurozone" [ref=e658] [cursor=pointer]:
              - /url: /wiki/Eurozone
            - text: ", the"
            - link "Schengen Area" [ref=e659] [cursor=pointer]:
              - /url: /wiki/Schengen_Area
            - text: ", the"
            - link "United Nations" [ref=e660] [cursor=pointer]:
              - /url: /wiki/United_Nations
            - text: ","
            - link "NATO" [ref=e661] [cursor=pointer]:
              - /url: /wiki/NATO
            - text: ","
            - link "CERN" [ref=e662] [cursor=pointer]:
              - /url: /wiki/CERN
            - text: ", the OECD, the"
            - link "WTO" [ref=e663] [cursor=pointer]:
              - /url: /wiki/World_Trade_Organization
            - text: ", the"
            - link "Council of Europe" [ref=e664] [cursor=pointer]:
              - /url: /wiki/Council_of_Europe
            - text: ", the"
            - link "Visegrád Group" [ref=e665] [cursor=pointer]:
              - /url: /wiki/Visegr%C3%A1d_Group
            - text: ", and the"
            - link "OSCE" [ref=e666] [cursor=pointer]:
              - /url: /wiki/Organization_for_Security_and_Co-operation_in_Europe
            - text: . Slovakia is also home to
            - link "eight" [ref=e667] [cursor=pointer]:
              - /url: /wiki/List_of_World_Heritage_Sites_in_Slovakia
            - link "UNESCO" [ref=e668] [cursor=pointer]:
              - /url: /wiki/UNESCO
            - text: World Heritage Sites. The world's largest per-capita car producer, Slovakia manufactured a total of 1.08 million cars in 2023, representing 44% of its total industrial output.
            - superscript [ref=e669]:
              - link "[18]" [ref=e670] [cursor=pointer]:
                - /url: "#cite_note-spectator.sme.sk-21"
          - heading "Etymology" [level=2] [ref=e672]
          - note [ref=e673]:
            - text: "See also:"
            - link "Slovaks § Name" [ref=e674] [cursor=pointer]:
              - /url: /wiki/Slovaks#Name
          - paragraph [ref=e675]:
            - text: Slovakia's name means the "Land of the
            - link "Slavs" [ref=e676] [cursor=pointer]:
              - /url: /wiki/Slavs
            - text: "\" ("
            - generic "Slovak-language text" [ref=e677]:
              - link "Slovensko" [ref=e679] [cursor=pointer]:
                - /url: /wiki/Slovensko
            - text: in
            - link "Slovak" [ref=e680] [cursor=pointer]:
              - /url: /wiki/Slovak_language
            - text: stemming from the older form
            - generic "Slavic languages collective text" [ref=e681]: Sloven/Slovienin
            - text: ). As such, it is a cognate of the words
            - link "Slovenia" [ref=e682] [cursor=pointer]:
              - /url: /wiki/Slovenia
            - text: and
            - link "Slavonia" [ref=e683] [cursor=pointer]:
              - /url: /wiki/Slavonia
            - text: . In medieval Latin, German, and even some Slavic sources, the same name has often been used for Slovaks, Slovenes, Slavonians, and Slavs in general. According to one of the theories, a new form of national name formed for the ancestors of the Slovaks between the 13th and 14th century, possibly due to foreign influence; the
            - link "Czech" [ref=e684] [cursor=pointer]:
              - /url: /wiki/Czech_language
            - text: word
            - generic "Czech-language text" [ref=e685]: Slovák
            - text: (in medieval sources from 1291 onward).
            - superscript [ref=e686]:
              - link "[19]" [ref=e687] [cursor=pointer]:
                - /url: "#cite_note-UHLÁR-22"
            - text: This form slowly replaced the name for the male members of the community, but the female name (
            - generic "Slovak-language text" [ref=e688]: Slovenka
            - text: ), reference to the lands inhabited (
            - generic "Slovak-language text" [ref=e689]: Slovensko
            - text: ) and the name of the language (
            - generic "Slovak-language text" [ref=e690]: slovenčina
            - text: ) all remained the same, with their base in the older form (compare to Slovenian counterparts). Most foreign translations tend to stem from this newer form (Slovakia in English,
            - generic "German-language text" [ref=e691]: Slowakei
            - text: in German,
            - generic "French-language text" [ref=e692]: Slovaquie
            - text: in French, etc.).
          - paragraph [ref=e693]:
            - text: "In medieval Latin sources, terms:"
            - generic "Medieval Latin-language text" [ref=e694]: Slavus
            - text: ","
            - generic "Medieval Latin-language text" [ref=e695]: Slavonia
            - text: ", or"
            - generic "Medieval Latin-language text" [ref=e696]: Slavorum
            - text: (and more variants, from as early as 1029)
            - superscript [ref=e697]:
              - link "[19]" [ref=e698] [cursor=pointer]:
                - /url: "#cite_note-UHLÁR-22"
            - text: have been used. In German sources, names for the Slovak lands were
            - generic "German-language text" [ref=e699]: Windenland
            - text: or
            - generic "German-language text" [ref=e700]: Windische Lande
            - text: (early 15th century),
            - superscript [ref=e701]:
              - link "[20]" [ref=e702] [cursor=pointer]:
                - /url: "#cite_note-23"
            - text: with the forms Slovakia and
            - generic "German-language text" [ref=e703]: Schlowakei
            - text: starting to appear in the 16th century.
            - superscript [ref=e704]:
              - link "[21]" [ref=e705] [cursor=pointer]:
                - /url: "#cite_note-24"
            - text: The present Slovak form
            - generic "Slovak-language text" [ref=e706]: Slovensko
            - text: is first attested in the year 1675.
            - superscript [ref=e707]:
              - link "[22]" [ref=e708] [cursor=pointer]:
                - /url: "#cite_note-25"
          - heading "History" [level=2] [ref=e710]
          - note [ref=e711]:
            - text: "Main article:"
            - link "History of Slovakia" [ref=e712] [cursor=pointer]:
              - /url: /wiki/History_of_Slovakia
          - figure "A Venus from Moravany nad Váhom, which dates back to 22,800 BC" [ref=e713]:
            - link [ref=e714] [cursor=pointer]:
              - /url: /wiki/File:Moravianska_venusa.jpg
              - img [ref=e715]
            - generic [ref=e716]:
              - text: A
              - link "Venus" [ref=e717] [cursor=pointer]:
                - /url: /wiki/Moravany_Venus
              - text: from
              - link "Moravany nad Váhom" [ref=e718] [cursor=pointer]:
                - /url: /wiki/Moravany_nad_V%C3%A1hom
              - text: ", which dates back to 22,800 BC"
          - paragraph [ref=e719]:
            - text: The oldest surviving human artefacts from Slovakia are found near
            - link "Nové Mesto nad Váhom" [ref=e720] [cursor=pointer]:
              - /url: /wiki/Nov%C3%A9_Mesto_nad_V%C3%A1hom
            - text: and are dated at 270,000 BCE, in the
            - link "Early Paleolithic" [ref=e721] [cursor=pointer]:
              - /url: /wiki/Lower_Paleolithic
            - text: era. These ancient tools, made by the
            - link "Clactonian" [ref=e722] [cursor=pointer]:
              - /url: /wiki/Clactonian
            - text: technique, bear witness to the ancient habitation of Slovakia.
            - superscript [ref=e723]:
              - link "[23]" [ref=e724] [cursor=pointer]:
                - /url: "#cite_note-26"
          - paragraph [ref=e725]:
            - text: Other
            - link "stone tools" [ref=e726] [cursor=pointer]:
              - /url: /wiki/Stone_tool
            - text: from the
            - link "Middle Paleolithic" [ref=e727] [cursor=pointer]:
              - /url: /wiki/Middle_Paleolithic
            - text: era (200,000–80,000 BCE) come from the Prévôt (Prepoštská) cave in
            - link "Bojnice" [ref=e728] [cursor=pointer]:
              - /url: /wiki/Bojnice
            - text: and from other nearby sites.
            - superscript [ref=e729]:
              - link "[24]" [ref=e730] [cursor=pointer]:
                - /url: "#cite_note-27"
            - text: The most important discovery from that era is a
            - link "Neanderthal" [ref=e731] [cursor=pointer]:
              - /url: /wiki/Neanderthal
            - link "cranium" [ref=e732] [cursor=pointer]:
              - /url: /wiki/Human_skull
            - text: (c. 200,000 BCE), discovered near
            - link "Gánovce" [ref=e733] [cursor=pointer]:
              - /url: /wiki/G%C3%A1novce
            - text: ", a village in northern Slovakia."
          - paragraph [ref=e734]:
            - text: Archaeologists have found prehistoric human skeletons in the region, as well as numerous objects and vestiges of the
            - link "Gravettian" [ref=e735] [cursor=pointer]:
              - /url: /wiki/Gravettian
            - text: culture, principally in the river valleys of
            - link "Nitra" [ref=e736] [cursor=pointer]:
              - /url: /wiki/Nitra_(river)
            - text: ","
            - link "Hron" [ref=e737] [cursor=pointer]:
              - /url: /wiki/Hron
            - text: ","
            - link "Ipeľ" [ref=e738] [cursor=pointer]:
              - /url: /wiki/Ipe%C4%BE
            - text: ","
            - link "Váh" [ref=e739] [cursor=pointer]:
              - /url: /wiki/V%C3%A1h
            - text: and as far as the city of
            - link "Žilina" [ref=e740] [cursor=pointer]:
              - /url: /wiki/%C5%BDilina
            - text: ", and near the foot of the"
            - link "Vihorlat" [ref=e741] [cursor=pointer]:
              - /url: /wiki/Vihorlat_Mountains
            - text: ", Inovec, and"
            - link "Tribeč" [ref=e742] [cursor=pointer]:
              - /url: /wiki/Tribe%C4%8D
            - text: mountains, as well as in the
            - link "Myjava" [ref=e743] [cursor=pointer]:
              - /url: /wiki/Myjava
            - text: Mountains. The most well-known finds include the oldest female statue made of
            - link "mammoth" [ref=e744] [cursor=pointer]:
              - /url: /wiki/Mammoth
            - text: bone (22,800 BCE), the famous
            - link "Venus of Moravany" [ref=e745] [cursor=pointer]:
              - /url: /wiki/Venus_of_Moravany
            - text: . The statue was found in the 1940s in
            - link "Moravany nad Váhom" [ref=e746] [cursor=pointer]:
              - /url: /wiki/Moravany_nad_V%C3%A1hom
            - text: near
            - link "Piešťany" [ref=e747] [cursor=pointer]:
              - /url: /wiki/Pie%C5%A1%C5%A5any
            - text: . Numerous necklaces made of shells from Cypraca thermophile
            - link "gastropods" [ref=e748] [cursor=pointer]:
              - /url: /wiki/Gastropoda
            - text: of the
            - link "Tertiary" [ref=e749] [cursor=pointer]:
              - /url: /wiki/Tertiary_(period)
            - text: period have come from the sites of Zákovská, Podkovice, Hubina, and Radošina. These findings provide the most ancient evidence of commercial exchanges carried out between the
            - link "Mediterranean" [ref=e750] [cursor=pointer]:
              - /url: /wiki/Mediterranean_Sea
            - text: and
            - link "Central Europe" [ref=e751] [cursor=pointer]:
              - /url: /wiki/Central_Europe
            - text: .
          - heading "Bronze Age" [level=3] [ref=e753]
          - paragraph [ref=e754]:
            - text: During the
            - link "Bronze Age" [ref=e755] [cursor=pointer]:
              - /url: /wiki/Bronze_Age
            - text: ", the geographical territory of modern-day Slovakia went through three stages of development, stretching from 2000 to 800 BCE. Major cultural, economic, and political development can be attributed to the significant growth in production of copper, especially in central Slovakia (for example in"
            - link "Špania Dolina" [ref=e756] [cursor=pointer]:
              - /url: /wiki/%C5%A0pania_Dolina
            - text: ) and northwest Slovakia.
            - link "Copper" [ref=e757] [cursor=pointer]:
              - /url: /wiki/Copper
            - text: became a stable source of prosperity for the local population.
          - paragraph [ref=e758]:
            - text: After the disappearance of the
            - link "Čakany" [ref=e759] [cursor=pointer]:
              - /url: /wiki/%C4%8Cakany
            - text: and
            - link "Velatice" [ref=e760] [cursor=pointer]:
              - /url: /wiki/Velatice
            - text: cultures, the
            - link "Lusatian" [ref=e761] [cursor=pointer]:
              - /url: /wiki/Lusatian_culture
            - text: people expanded building of strong and complex fortifications, with the large permanent buildings and administrative centres. Excavations of Lusatian
            - link "hill forts" [ref=e762] [cursor=pointer]:
              - /url: /wiki/Hillfort
            - text: document the substantial development of trade and agriculture at that period. The richness and diversity of tombs increased considerably. The inhabitants of the area manufactured arms, shields, jewellery, dishes, and statues.
          - heading "Iron Age" [level=3] [ref=e764]
          - figure "Biatec, presumably a king, who appeared on the Celtic coins minted by the Boii at the current location of Bratislava, 1st century B.C." [ref=e765]:
            - link [ref=e766] [cursor=pointer]:
              - /url: /wiki/File:Boii_Biatec_1st._cen_BC_2940416.jpg
              - img [ref=e767]
            - generic [ref=e768]:
              - link "Biatec" [ref=e769] [cursor=pointer]:
                - /url: /wiki/Biatec
              - text: ", presumably a king, who appeared on the Celtic coins minted by the"
              - link "Boii" [ref=e770] [cursor=pointer]:
                - /url: /wiki/Boii
              - text: at the current location of Bratislava, 1st century B.C.
          - heading "Hallstatt Period" [level=4] [ref=e772]
          - paragraph [ref=e773]:
            - text: The arrival of tribes from
            - link "Thrace" [ref=e774] [cursor=pointer]:
              - /url: /wiki/Thrace
            - text: disrupted the people of the Kalenderberg culture, who lived in the hamlets located on the plain (
            - link "Sereď" [ref=e775] [cursor=pointer]:
              - /url: /wiki/Sere%C4%8F
            - text: ) and in the hill forts like Molpír, near
            - link "Smolenice" [ref=e776] [cursor=pointer]:
              - /url: /wiki/Smolenice
            - text: ", in the"
            - link "Little Carpathians" [ref=e777] [cursor=pointer]:
              - /url: /wiki/Little_Carpathians
            - text: . During Hallstatt times, monumental burial mounds were erected in western Slovakia, with princely equipment consisting of richly decorated vessels, ornaments and decorations. The burial rites consisted entirely of cremation. Common people were buried in flat urnfield cemeteries.
          - paragraph [ref=e778]:
            - text: A special role was given to weaving and the production of textiles. The local power of the "Princes" of the
            - link "Hallstatt period" [ref=e779] [cursor=pointer]:
              - /url: /wiki/Hallstatt_culture
            - text: disappeared in Slovakia during the century before the middle of first millennium BCE, after strife between the
            - link "Scytho" [ref=e780] [cursor=pointer]:
              - /url: /wiki/Scythians
            - text: "-Thracian people and locals, resulting in abandonment of the old hill-forts. Relatively depopulated areas soon caught the interest of emerging"
            - link "Celtic" [ref=e781] [cursor=pointer]:
              - /url: /wiki/Celts
            - text: tribes, who advanced from the south towards the north, following the Slovak rivers, peacefully integrating into the remnants of the local population.
          - heading "La Tène Period" [level=4] [ref=e783]: La Tène Period
          - paragraph [ref=e784]:
            - text: From around 500 BCE, the territory of modern-day Slovakia was settled by
            - link "Celts" [ref=e785] [cursor=pointer]:
              - /url: /wiki/Celt
            - text: ", who built powerful"
            - link "oppida" [ref=e787] [cursor=pointer]:
              - /url: /wiki/Oppida
            - text: on the sites of modern-day
            - link "Bratislava" [ref=e788] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: and
            - link "Devín" [ref=e789] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn
            - text: .
            - link "Biatecs" [ref=e790] [cursor=pointer]:
              - /url: /wiki/Biatec
            - text: ","
            - link "silver coins" [ref=e791] [cursor=pointer]:
              - /url: /wiki/Silver_coin
            - text: with inscriptions in the Latin alphabet, represent the first known use of writing in Slovakia. At the northern regions, remnants of the local population of Lusatian origin, together with Celtic and later Dacian influence, gave rise to the unique
            - link "Púchov culture" [ref=e792] [cursor=pointer]:
              - /url: /wiki/P%C3%BAchov_culture
            - text: ", with advanced crafts and iron-working, many hill-forts and fortified settlements of central type with the coinage of the \"Velkobysterecky\" type (no inscriptions, with a horse on one side and a head on the other). This culture is often connected with the Celtic tribe mentioned in Roman sources as"
            - link "Cotini" [ref=e793] [cursor=pointer]:
              - /url: /wiki/Cotini
            - text: .
          - heading "Roman Period" [level=4] [ref=e795]
          - figure "A Roman inscription at the castle hill of Trenčín (178–179 AD)" [ref=e796]:
            - link [ref=e797] [cursor=pointer]:
              - /url: /wiki/File:Trencin-Roman2.JPG
              - img [ref=e798]
            - generic [ref=e799]:
              - text: A Roman inscription at the castle hill of
              - link "Trenčín" [ref=e800] [cursor=pointer]:
                - /url: /wiki/Tren%C4%8D%C3%ADn
              - text: (178–179 AD)
          - paragraph [ref=e801]:
            - text: From 2
            - link "CE" [ref=e802] [cursor=pointer]:
              - /url: /wiki/Common_Era
            - text: ", the expanding"
            - link "Roman Empire" [ref=e803] [cursor=pointer]:
              - /url: /wiki/Roman_Empire
            - text: established and maintained a series of outposts around and just south of the
            - link "Danube" [ref=e804] [cursor=pointer]:
              - /url: /wiki/Danube
            - text: ", the largest of which were known as"
            - link "Carnuntum" [ref=e805] [cursor=pointer]:
              - /url: /wiki/Carnuntum
            - text: (whose remains are on the main road halfway between
            - link "Vienna" [ref=e806] [cursor=pointer]:
              - /url: /wiki/Vienna
            - text: and
            - link "Bratislava" [ref=e807] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ) and
            - link "Brigetio" [ref=e808] [cursor=pointer]:
              - /url: /wiki/Brigetio
            - text: (present-day
            - link "Szőny" [ref=e809] [cursor=pointer]:
              - /url: /wiki/Sz%C5%91ny
            - text: at the Slovak-Hungarian border). Such Roman border settlements were built on the present area of
            - link "Rusovce" [ref=e810] [cursor=pointer]:
              - /url: /wiki/Rusovce
            - text: ", currently a suburb of"
            - link "Bratislava" [ref=e811] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: . The military fort was surrounded by a civilian
            - link "vicus" [ref=e812] [cursor=pointer]:
              - /url: /wiki/Vicus
            - text: and several farms of the
            - link "villa rustica" [ref=e813] [cursor=pointer]:
              - /url: /wiki/Villa_rustica
            - text: type. The name of this settlement was
            - link "Gerulata" [ref=e814] [cursor=pointer]:
              - /url: /wiki/Gerulata
            - text: . The military fort had an auxiliary cavalry unit, approximately 300 horses strong, modelled after the
            - link "Cananefates" [ref=e815] [cursor=pointer]:
              - /url: /wiki/Cananefates
            - text: . The remains of Roman buildings have also survived in
            - link "Stupava" [ref=e816] [cursor=pointer]:
              - /url: /wiki/Stupava,_Slovakia
            - text: ","
            - link "Devín Castle" [ref=e817] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn_Castle
            - text: ", Bratislava Castle Hill, and the Bratislava-"
            - link "Dúbravka" [ref=e818] [cursor=pointer]:
              - /url: /wiki/D%C3%BAbravka,_Bratislava
            - text: suburb.
          - paragraph [ref=e819]:
            - text: Near the northernmost line of the Roman hinterlands, the
            - link "Limes Romanus" [ref=e820] [cursor=pointer]:
              - /url: /wiki/Limes_Romanus
            - text: ", there existed the winter camp of"
            - link "Laugaricio" [ref=e821] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8D%C3%ADn
            - text: (modern-day
            - link "Trenčín" [ref=e822] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8D%C3%ADn
            - text: ) where the Auxiliary of Legion II fought and prevailed in a decisive battle over the Germanic
            - link "Quadi" [ref=e823] [cursor=pointer]:
              - /url: /wiki/Quadi
            - text: tribe in 179 CE during the
            - link "Marcomannic Wars" [ref=e824] [cursor=pointer]:
              - /url: /wiki/Marcomannic_Wars
            - text: . The Kingdom of
            - link "Vannius" [ref=e825] [cursor=pointer]:
              - /url: /wiki/Vannius
            - text: ", a kingdom founded by the"
            - link "Germanic" [ref=e826] [cursor=pointer]:
              - /url: /wiki/Germanic_peoples
            - link "Suebi" [ref=e827] [cursor=pointer]:
              - /url: /wiki/Suebi
            - text: tribes of
            - link "Quadi" [ref=e828] [cursor=pointer]:
              - /url: /wiki/Quadi
            - text: and
            - link "Marcomanni" [ref=e829] [cursor=pointer]:
              - /url: /wiki/Marcomanni
            - text: ", as well as several small Germanic and"
            - link "Celtic tribes" [ref=e830] [cursor=pointer]:
              - /url: /wiki/List_of_Celtic_tribes
            - text: ", including the Osi and"
            - link "Cotini" [ref=e831] [cursor=pointer]:
              - /url: /wiki/Cotini
            - text: ", existed in western and central Slovakia from 8–6 BCE to 179 CE."
          - heading "Great invasions from the fourth to seventh centuries" [level=3] [ref=e833]
          - paragraph [ref=e834]:
            - text: In the second and third centuries CE, the
            - link "Huns" [ref=e835] [cursor=pointer]:
              - /url: /wiki/Huns
            - text: began to leave the
            - link "Central Asian steppes" [ref=e836] [cursor=pointer]:
              - /url: /wiki/Eurasian_Steppe
            - text: . They crossed the Danube in 377 CE and occupied
            - link "Pannonia" [ref=e837] [cursor=pointer]:
              - /url: /wiki/Pannonia
            - text: ", which they used for 75 years as their base for launching looting-raids into Western Europe. However,"
            - link "Attila" [ref=e838] [cursor=pointer]:
              - /url: /wiki/Attila
            - text: "'s death in 453 brought about the disappearance of the"
            - link "Hunnic empire" [ref=e839] [cursor=pointer]:
              - /url: /wiki/Huns
            - text: . In 568, a Turko-Mongol tribal confederacy, the
            - link "Avars" [ref=e840] [cursor=pointer]:
              - /url: /wiki/Pannonian_Avars
            - text: ", conducted its invasion into the Middle Danube region. The Avars occupied the lowlands of the"
            - link "Pannonian Plain" [ref=e841] [cursor=pointer]:
              - /url: /wiki/Pannonian_Plain
            - text: and established an empire dominating the
            - link "Carpathian Basin" [ref=e842] [cursor=pointer]:
              - /url: /wiki/Pannonian_Basin
            - text: .
          - paragraph [ref=e843]:
            - text: In 623, the
            - link "Slavic population" [ref=e844] [cursor=pointer]:
              - /url: /wiki/Early_Slavs
            - text: living in the western parts of Pannonia seceded from their empire after a revolution led by
            - link "Samo" [ref=e845] [cursor=pointer]:
              - /url: /wiki/Samo
            - text: ", a Frankish merchant."
            - superscript [ref=e846]:
              - link "[25]" [ref=e847] [cursor=pointer]:
                - /url: "#cite_note-Történeti_Kronológia-28"
            - text: After 626, the Avar power started a gradual decline
            - superscript [ref=e848]:
              - link "[26]" [ref=e849] [cursor=pointer]:
                - /url: "#cite_note-29"
            - text: but its reign lasted to 804.
          - heading "Avars" [level=3] [ref=e851]
          - paragraph [ref=e852]:
            - text: In 568, the
            - link "Avars" [ref=e853] [cursor=pointer]:
              - /url: /wiki/Pannonian_Avars
            - text: ", under Khagan"
            - link "Bayan I" [ref=e854] [cursor=pointer]:
              - /url: /wiki/Bayan_I
            - text: established an empire in the
            - link "Carpathian Basin" [ref=e855] [cursor=pointer]:
              - /url: /wiki/Pannonian_Basin
            - text: that lasted for 250 years.
            - superscript [ref=e856]:
              - link "[27]" [ref=e857] [cursor=pointer]:
                - /url: "#cite_note-Hun_Avar_Hungarian_Genetics_2019-30"
          - heading "Slavic states" [level=3] [ref=e859]
          - paragraph [ref=e860]:
            - text: The
            - link "Slavic" [ref=e861] [cursor=pointer]:
              - /url: /wiki/Slavs
            - text: tribes settled in the territory of present-day Slovakia in the fifth century. Western Slovakia was the centre of
            - link "Samo" [ref=e862] [cursor=pointer]:
              - /url: /wiki/Samo
            - text: "'s empire in the seventh century. A Slavic state known as the"
            - link "Principality of Nitra" [ref=e863] [cursor=pointer]:
              - /url: /wiki/Principality_of_Nitra
            - text: arose in the eighth century and its ruler
            - link "Pribina" [ref=e864] [cursor=pointer]:
              - /url: /wiki/Pribina
            - text: had the first known Christian church of the territory of present-day Slovakia consecrated by 828. Together with neighbouring
            - link "Moravia" [ref=e865] [cursor=pointer]:
              - /url: /wiki/Moravia
            - text: ", the principality formed the core of the"
            - link "Great Moravian" [ref=e866] [cursor=pointer]:
              - /url: /wiki/Great_Moravia
            - text: Empire from 833. The high point of this Slavonic empire came with the arrival of
            - link "Saints Cyril and Methodius" [ref=e867] [cursor=pointer]:
              - /url: /wiki/Saints_Cyril_and_Methodius
            - text: in 863, during the reign of
            - link "Duke" [ref=e868] [cursor=pointer]:
              - /url: /wiki/Duke
            - link "Rastislav" [ref=e869] [cursor=pointer]:
              - /url: /wiki/Rastislav_of_Moravia
            - text: ", and the territorial expansion under"
            - link "King" [ref=e870] [cursor=pointer]:
              - /url: /wiki/King
            - link "Svätopluk I" [ref=e871] [cursor=pointer]:
              - /url: /wiki/Sv%C3%A4topluk_I
            - text: .
          - heading "Great Moravia (830–before 907)" [level=4] [ref=e873]: Great Moravia (830–before 907)
          - note [ref=e874]:
            - text: "Main article:"
            - link "Great Moravia" [ref=e875] [cursor=pointer]:
              - /url: /wiki/Great_Moravia
          - figure "A statue of Saint Cyril and Saint Methodius in Žilina. In 863, they introduced Christianity to what is now Slovakia." [ref=e876]:
            - link [ref=e877] [cursor=pointer]:
              - /url: /wiki/File:Cyril_a_metod_zilina.jpg
              - img [ref=e878]
            - generic [ref=e879]:
              - text: A statue of
              - link "Saint Cyril and Saint Methodius" [ref=e880] [cursor=pointer]:
                - /url: /wiki/Saints_Cyril_and_Methodius
              - text: in
              - link "Žilina" [ref=e881] [cursor=pointer]:
                - /url: /wiki/%C5%BDilina
              - text: . In 863, they introduced
              - link "Christianity" [ref=e882] [cursor=pointer]:
                - /url: /wiki/Christianity
              - text: to what is now Slovakia.
          - paragraph [ref=e883]:
            - text: Great Moravia arose around 830 when
            - link "Mojmír I" [ref=e884] [cursor=pointer]:
              - /url: /wiki/Mojmir_I_of_Moravia
            - text: unified the
            - link "Slavic" [ref=e885] [cursor=pointer]:
              - /url: /wiki/Slavs
            - text: tribes settled north of the
            - link "Danube" [ref=e886] [cursor=pointer]:
              - /url: /wiki/Danube
            - text: and extended the Moravian supremacy over them.
            - superscript [ref=e887]:
              - link "[28]" [ref=e888] [cursor=pointer]:
                - /url: "#cite_note-31"
            - text: When Mojmír I endeavoured to secede from the supremacy of the king of
            - link "East Francia" [ref=e889] [cursor=pointer]:
              - /url: /wiki/East_Francia
            - text: in 846, King
            - link "Louis the German" [ref=e890] [cursor=pointer]:
              - /url: /wiki/Louis_the_German
            - text: deposed him and assisted Mojmír's nephew
            - link "Rastislav" [ref=e891] [cursor=pointer]:
              - /url: /wiki/Rastislav_of_Moravia
            - text: (846–870) in acquiring the throne.
            - superscript [ref=e892]:
              - link "[29]" [ref=e893] [cursor=pointer]:
                - /url: "#cite_note-Korai_Magyar_Történeti_Lexikon-32"
            - text: "The new monarch pursued an independent policy: after stopping a Frankish attack in 855, he also sought to weaken the influence of Frankish priests preaching in his realm."
            - link "Duke Rastislav" [ref=e894] [cursor=pointer]:
              - /url: /wiki/Rastislav_of_Moravia
            - text: asked the
            - link "Byzantine Emperor" [ref=e895] [cursor=pointer]:
              - /url: /wiki/Byzantine_Empire
            - link "Michael III" [ref=e896] [cursor=pointer]:
              - /url: /wiki/Michael_III
            - text: to send teachers who would interpret Christianity in the Slavic vernacular.
          - paragraph [ref=e897]:
            - text: In 862, Prince
            - link "Rastislav of Moravia" [ref=e898] [cursor=pointer]:
              - /url: /wiki/Rastislav_of_Moravia
            - text: rebelled against the
            - link "Franks" [ref=e899] [cursor=pointer]:
              - /url: /wiki/Franks
            - text: ", and after hiring"
            - link "Hungarian" [ref=e900] [cursor=pointer]:
              - /url: /wiki/Hungarians
            - text: troops, won his independence; this was the first time that Hungarians expeditionary troops entered the
            - link "Carpathian Basin" [ref=e901] [cursor=pointer]:
              - /url: /wiki/Pannonian_Basin
            - text: .
            - superscript [ref=e902]:
              - link "[30]" [ref=e903] [cursor=pointer]:
                - /url: "#cite_note-33"
            - superscript [ref=e904]:
              - link "[31]" [ref=e905] [cursor=pointer]:
                - /url: "#cite_note-34"
          - paragraph [ref=e906]:
            - text: On Rastislav's request, two brothers, Byzantine officials and missionaries
            - link "Saints Cyril and Methodius" [ref=e907] [cursor=pointer]:
              - /url: /wiki/Saints_Cyril_and_Methodius
            - text: came in 863. Cyril developed the
            - link "first Slavic alphabet" [ref=e908] [cursor=pointer]:
              - /url: /wiki/Glagolitic_alphabet
            - text: and translated the Gospel into the
            - link "Old Church Slavonic" [ref=e909] [cursor=pointer]:
              - /url: /wiki/Old_Church_Slavonic
            - text: language. Rastislav was also preoccupied with the security and administration of his state. Numerous fortified castles built throughout the country are dated to his reign and some of them (e.g., Dowina, sometimes identified with
            - link "Devín Castle" [ref=e910] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn_Castle
            - text: )
            - superscript [ref=e911]:
              - link "[32]" [ref=e912] [cursor=pointer]:
                - /url: "#cite_note-worldarcheology-35"
            - superscript [ref=e913]:
              - link "[33]" [ref=e914] [cursor=pointer]:
                - /url: "#cite_note-caplovic-36"
            - text: are also mentioned in connection with Rastislav by Frankish chronicles.
            - superscript [ref=e915]:
              - link "[34]" [ref=e916] [cursor=pointer]:
                - /url: "#cite_note-37"
            - superscript [ref=e917]:
              - text: "["
              - link "full citation needed" [ref=e919] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citing_sources#What_information_to_include
              - text: "]"
            - superscript [ref=e920]:
              - link "[35]" [ref=e921] [cursor=pointer]:
                - /url: "#cite_note-fulda-38"
          - paragraph [ref=e922]:
            - text: During Rastislav's reign, the
            - link "Principality of Nitra" [ref=e923] [cursor=pointer]:
              - /url: /wiki/Principality_of_Nitra
            - text: was given to his nephew
            - link "Svätopluk" [ref=e924] [cursor=pointer]:
              - /url: /wiki/Svatopluk_I_of_Moravia
            - text: as an
            - link "appanage" [ref=e925] [cursor=pointer]:
              - /url: /wiki/Appanage
            - text: .
            - superscript [ref=e926]:
              - link "[33]" [ref=e927] [cursor=pointer]:
                - /url: "#cite_note-caplovic-36"
            - text: The rebellious prince allied himself with the Franks and overthrew his uncle in 870. Similarly to his predecessor, Svätopluk I (871–894) assumed the title of the king (rex). During his reign, the Great Moravian Empire reached its greatest territorial extent, when not only present-day
            - link "Moravia" [ref=e928] [cursor=pointer]:
              - /url: /wiki/Moravia
            - text: and Slovakia but also present-day northern and
            - link "central Hungary" [ref=e929] [cursor=pointer]:
              - /url: /wiki/Central_Hungary
            - text: ","
            - link "Lower Austria" [ref=e930] [cursor=pointer]:
              - /url: /wiki/Lower_Austria
            - text: ","
            - link "Bohemia" [ref=e931] [cursor=pointer]:
              - /url: /wiki/Bohemia
            - text: ","
            - link "Silesia" [ref=e932] [cursor=pointer]:
              - /url: /wiki/Silesia
            - text: ","
            - link "Lusatia" [ref=e933] [cursor=pointer]:
              - /url: /wiki/Lusatia
            - text: ", southern Poland and"
            - link "northern Serbia" [ref=e934] [cursor=pointer]:
              - /url: /wiki/Vojvodina
            - text: belonged to the empire, but the exact borders of his domains are still disputed by modern authors.
            - superscript [ref=e935]:
              - link "[36]" [ref=e936] [cursor=pointer]:
                - /url: "#cite_note-Tóth-39"
            - text: Svatopluk also withstood attacks of the
            - link "Magyar" [ref=e937] [cursor=pointer]:
              - /url: /wiki/Hungarians
            - text: tribes and the
            - link "Bulgarian Empire" [ref=e938] [cursor=pointer]:
              - /url: /wiki/First_Bulgarian_Empire
            - text: ", although sometimes it was he who hired the Magyars when waging war against"
            - link "East Francia" [ref=e939] [cursor=pointer]:
              - /url: /wiki/East_Francia
            - text: .
            - superscript [ref=e940]:
              - link "[37]" [ref=e941] [cursor=pointer]:
                - /url: "#cite_note-40"
          - paragraph [ref=e942]:
            - text: In 880,
            - link "Pope John VIII" [ref=e943] [cursor=pointer]:
              - /url: /wiki/Pope_John_VIII
            - text: set up an independent
            - link "ecclesiastical province" [ref=e944] [cursor=pointer]:
              - /url: /wiki/Ecclesiastical_province
            - text: in Great Moravia with Archbishop
            - link "Methodius" [ref=e945] [cursor=pointer]:
              - /url: /wiki/Saints_Cyril_and_Methodius
            - text: as its head. He also named the German cleric
            - link "Wiching" [ref=e946] [cursor=pointer]:
              - /url: /wiki/Wiching
            - text: the Bishop of
            - link "Nitra" [ref=e947] [cursor=pointer]:
              - /url: /wiki/Nitra
            - text: .
          - figure "Certain and disputed borders of Great Moravia under Svatopluk I (according to modern historians)" [ref=e948]:
            - link [ref=e949] [cursor=pointer]:
              - /url: /wiki/File:Great_Moravia.svg
              - img [ref=e950]
            - generic [ref=e951]:
              - text: Certain and disputed borders of Great Moravia under
              - link "Svatopluk I" [ref=e952] [cursor=pointer]:
                - /url: /wiki/Svatopluk_I_of_Moravia
              - text: (according to modern historians)
          - paragraph [ref=e953]:
            - text: After the death of Prince Svatopluk in 894, his sons
            - link "Mojmír II" [ref=e954] [cursor=pointer]:
              - /url: /wiki/Mojmir_II_of_Moravia
            - text: (894–906?) and
            - link "Svatopluk II" [ref=e955] [cursor=pointer]:
              - /url: /wiki/Svatopluk_II
            - text: succeeded him as the Prince of Great Moravia and the Prince of Nitra respectively.
            - superscript [ref=e956]:
              - link "[33]" [ref=e957] [cursor=pointer]:
                - /url: "#cite_note-caplovic-36"
            - text: However, they started to quarrel for domination of the whole empire. Weakened by an internal conflict as well as by constant warfare with
            - link "Eastern Francia" [ref=e958] [cursor=pointer]:
              - /url: /wiki/Eastern_Francia
            - text: ", Great Moravia lost most of its peripheral territories."
          - paragraph [ref=e959]:
            - text: It is not known what happened with both Mojmír II and Svatopluk II because they are not mentioned in written sources after 906. In
            - link "three battles" [ref=e960] [cursor=pointer]:
              - /url: /wiki/Battle_of_Pressburg
            - text: (4–5 July and 9 August 907) near
            - link "Bratislava" [ref=e961] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ", the Magyars routed"
            - link "Bavarian" [ref=e962] [cursor=pointer]:
              - /url: /wiki/Bavaria
            - text: armies. Some historians put this year as the date of the break-up of the Great Moravian Empire, due to the Hungarian conquest; other historians take the date a little bit earlier (to 902).
          - paragraph [ref=e963]:
            - text: Great Moravia left behind a lasting legacy in Central and Eastern Europe. The
            - link "Glagolitic script" [ref=e964] [cursor=pointer]:
              - /url: /wiki/Glagolitic_alphabet
            - text: and its successor
            - link "Cyrillic" [ref=e965] [cursor=pointer]:
              - /url: /wiki/Cyrillic_script
            - text: were disseminated to other Slavic countries, charting a new path in their
            - link "sociocultural development" [ref=e966] [cursor=pointer]:
              - /url: /wiki/Sociocultural_evolution
            - text: .
          - heading "Grand Principality of Hungary (895–1000)" [level=3] [ref=e968]: Grand Principality of Hungary (895–1000)
          - note [ref=e969]:
            - text: "Main article:"
            - link "Principality of Hungary" [ref=e970] [cursor=pointer]:
              - /url: /wiki/Principality_of_Hungary
          - paragraph [ref=e971]:
            - text: Foundation of the
            - link "Hungarian state" [ref=e972] [cursor=pointer]:
              - /url: /wiki/Principality_of_Hungary
            - text: is connected to the
            - link "Hungarian conquerors" [ref=e973] [cursor=pointer]:
              - /url: /wiki/Hungarian_conquest_of_the_Carpathian_Basin
            - text: ", who arrived from the"
            - link "Pontic steppes" [ref=e974] [cursor=pointer]:
              - /url: /wiki/Pontic%E2%80%93Caspian_steppe
            - text: as a confederation of
            - link "seven tribes" [ref=e975] [cursor=pointer]:
              - /url: /wiki/Seven_chieftains_of_the_Magyars
            - text: . The
            - link "Hungarians" [ref=e976] [cursor=pointer]:
              - /url: /wiki/Hungarians
            - text: arrived in the frame of a strong centralized steppe-empire under the leadership of Grand Prince
            - link "Álmos" [ref=e977] [cursor=pointer]:
              - /url: /wiki/%C3%81lmos
            - text: and his son
            - link "Árpád" [ref=e978] [cursor=pointer]:
              - /url: /wiki/%C3%81rp%C3%A1d
            - text: ", they became founders of the"
            - link "Árpád dynasty" [ref=e979] [cursor=pointer]:
              - /url: /wiki/%C3%81rp%C3%A1d_dynasty
            - text: ", the Hungarian ruling dynasty and the Hungarian state. The"
            - link "Árpád dynasty" [ref=e980] [cursor=pointer]:
              - /url: /wiki/%C3%81rp%C3%A1d_dynasty
            - text: claimed to be a direct descendant of the great Hun leader Attila.
            - superscript [ref=e981]:
              - link "[38]" [ref=e982] [cursor=pointer]:
                - /url: "#cite_note-41"
            - superscript [ref=e983]:
              - link "[39]" [ref=e984] [cursor=pointer]:
                - /url: "#cite_note-42"
            - superscript [ref=e985]:
              - link "[40]" [ref=e986] [cursor=pointer]:
                - /url: "#cite_note-43"
            - text: The
            - link "Hungarians" [ref=e987] [cursor=pointer]:
              - /url: /wiki/Hungarians
            - text: took possession of the
            - link "Carpathian Basin" [ref=e988] [cursor=pointer]:
              - /url: /wiki/Pannonian_Basin
            - text: in a pre-planned manner, with a long move-in between 862 and 895.
            - superscript [ref=e989]:
              - link "[41]" [ref=e990] [cursor=pointer]:
                - /url: "#cite_note-44"
            - text: Their armies' advance may have been promoted by continuous wars among the countries of the region whose rulers still hired them occasionally to intervene in their struggles.
            - superscript [ref=e991]:
              - link "[42]" [ref=e992] [cursor=pointer]:
                - /url: "#cite_note-Kristó_2-45"
          - paragraph [ref=e993]:
            - text: Just a few decades after the collapse of the
            - link "Avar Khaganate" [ref=e994] [cursor=pointer]:
              - /url: /wiki/Pannonian_Avars
            - text: in 822, once again a steppe empire, the Hungarian Grand Principality united the Carpathian Basin under its rule. Only the
            - link "East Frankish Empire" [ref=e995] [cursor=pointer]:
              - /url: /wiki/East_Francia
            - text: had such military power that it could intervent in the formation of the new order. His leadership also wanted to eliminate the new steppe state because the East Frankish Empire lost Pannonia and its Christian Avar taxpayers, and his territory was hit by increasing attacks by the Hungarians, especially Bavaria, which was then the eastern province of the Eastern Frankish Kingdom. In 907, three East Francian armies led by
            - link "Luitpold" [ref=e996] [cursor=pointer]:
              - /url: /wiki/Luitpold,_Margrave_of_Bavaria
            - text: ", Margrave of Bavaria, which entered the Hungarian territory in order to expel the Hungarians from the Carpathian Basin, is annihilated by the Hungarian army at the"
            - link "Battle of Pressburg" [ref=e997] [cursor=pointer]:
              - /url: /wiki/Battle_of_Pressburg
            - text: . Luitpold, Margrave of Bavaria, Dietmar I, Archbishop of Salzburg, Prince Sieghard, 19 counts, 2 bishops, and 3 abbots are killed in the battle, together with the majority of the soldiers. The Hungarians secured the lands they gained during the Hungarian conquest of the Carpathian Basin, and prevented a future German invasion, the Germans did not launch an imperial scale campaign against Hungary for 123 years until 1030.
            - superscript [ref=e998]:
              - link "[43]" [ref=e999] [cursor=pointer]:
                - /url: "#cite_note-Szabados_-_Battle_of_Pressburg_2023-46"
          - heading "The Kingdom of Hungary, the Habsburg Monarchy and the Ottoman Empire (1000–1918)" [level=3] [ref=e1001]: The Kingdom of Hungary, the Habsburg Monarchy and the Ottoman Empire (1000–1918)
          - note [ref=e1002]:
            - text: "Main articles:"
            - link "Kingdom of Hungary" [ref=e1003] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Hungary
            - text: ","
            - link "Habsburg monarchy" [ref=e1004] [cursor=pointer]:
              - /url: /wiki/Habsburg_monarchy
            - text: ", and"
            - link "Ottoman Empire" [ref=e1005] [cursor=pointer]:
              - /url: /wiki/Ottoman_Empire
          - figure "Stephen I, King of Hungary" [ref=e1006]:
            - link [ref=e1007] [cursor=pointer]:
              - /url: /wiki/File:Istvan-ChroniconPictum.jpg
              - img [ref=e1008]
            - generic [ref=e1009]:
              - link "Stephen I" [ref=e1010] [cursor=pointer]:
                - /url: /wiki/Stephen_I_of_Hungary
              - text: ","
              - link "King of Hungary" [ref=e1011] [cursor=pointer]:
                - /url: /wiki/King_of_Hungary
          - paragraph [ref=e1012]:
            - text: In 972, the ruling prince
            - link "Géza" [ref=e1013] [cursor=pointer]:
              - /url: /wiki/G%C3%A9za,_Grand_Prince_of_the_Hungarians
            - text: of the
            - link "Árpád dynasty" [ref=e1014] [cursor=pointer]:
              - /url: /wiki/%C3%81rp%C3%A1d_dynasty
            - text: officially started to integrate
            - link "Grand Principality of Hungary" [ref=e1015] [cursor=pointer]:
              - /url: /wiki/Principality_of_Hungary
            - text: into Christian Western Europe. His son
            - link "Saint Stephen I" [ref=e1016] [cursor=pointer]:
              - /url: /wiki/Stephen_I_of_Hungary
            - text: became the first
            - link "King of Hungary" [ref=e1017] [cursor=pointer]:
              - /url: /wiki/King_of_Hungary
            - text: after defeating his
            - link "pagan" [ref=e1018] [cursor=pointer]:
              - /url: /wiki/Paganism
            - text: uncle
            - link "Koppány" [ref=e1019] [cursor=pointer]:
              - /url: /wiki/Kopp%C3%A1ny
            - text: . Under Stephen, Hungary was recognised as a Catholic
            - link "Apostolic Kingdom" [ref=e1020] [cursor=pointer]:
              - /url: /wiki/Apostolic_Majesty
            - text: . Applying to
            - link "Pope Sylvester II" [ref=e1021] [cursor=pointer]:
              - /url: /wiki/Pope_Sylvester_II
            - text: ", Stephen received the insignia of royalty (including probably a part of the"
            - link "Holy Crown of Hungary" [ref=e1022] [cursor=pointer]:
              - /url: /wiki/Holy_Crown_of_Hungary
            - text: ) from the papacy.
          - paragraph [ref=e1023]:
            - text: In the years 1001–1002 and 1018–1029, Slovakia was part of the
            - link "Kingdom of Poland" [ref=e1024] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Poland
            - text: ", having been conquered by"
            - link "Boleslaus I the Brave" [ref=e1025] [cursor=pointer]:
              - /url: /wiki/Boleslaus_I_the_Brave
            - text: .
            - superscript [ref=e1026]:
              - link "[44]" [ref=e1027] [cursor=pointer]:
                - /url: "#cite_note-47"
            - text: After the territory of Slovakia was returned to Hungary, a semi-autonomous polity continued to exist (or was created in 1048 by king
            - link "Andrew I" [ref=e1028] [cursor=pointer]:
              - /url: /wiki/Andrew_I_of_Hungary
            - text: ) called
            - link "Duchy of Nitra" [ref=e1029] [cursor=pointer]:
              - /url: /wiki/Duchy_of_Nitra
            - text: . Comprising roughly the territory of
            - link "Principality of Nitra" [ref=e1030] [cursor=pointer]:
              - /url: /wiki/Principality_of_Nitra
            - text: and
            - link "Bihar principality" [ref=e1031] [cursor=pointer]:
              - /url: /wiki/Bihar_County
            - text: ", they formed what was called a tercia pars regni, third of a kingdom."
            - superscript [ref=e1032]:
              - link "[45]" [ref=e1033] [cursor=pointer]:
                - /url: "#cite_note-48"
          - paragraph [ref=e1034]:
            - text: This polity existed up until 1108/1110, after which it was not restored. After this, up until the collapse of
            - link "Austria-Hungary" [ref=e1035] [cursor=pointer]:
              - /url: /wiki/Austria-Hungary
            - text: in 1918, the territory of Slovakia was an integral part of the Hungarian state.
            - superscript [ref=e1036]:
              - link "[46]" [ref=e1037] [cursor=pointer]:
                - /url: "#cite_note-49"
            - superscript [ref=e1038]:
              - link "[47]" [ref=e1039] [cursor=pointer]:
                - /url: "#cite_note-50"
            - superscript [ref=e1040]:
              - link "[48]" [ref=e1041] [cursor=pointer]:
                - /url: "#cite_note-51"
            - text: The ethnic composition of Slovakia became more diverse with the arrival of the
            - link "Carpathian Germans" [ref=e1042] [cursor=pointer]:
              - /url: /wiki/Carpathian_Germans
            - text: in the 13th century and the
            - link "Jews" [ref=e1043] [cursor=pointer]:
              - /url: /wiki/Jews
            - text: in the 14th century.
          - paragraph [ref=e1044]:
            - text: A significant decline in the population resulted from the
            - link "invasion of the Mongols" [ref=e1045] [cursor=pointer]:
              - /url: /wiki/Mongol_invasion_of_Europe
            - text: in 1241 and the subsequent famine. After the invasion, much of the territory was destroyed, but was recovered largely thanks to Hungarian king
            - link "Béla IV" [ref=e1046] [cursor=pointer]:
              - /url: /wiki/B%C3%A9la_IV_of_Hungary
            - text: . However, in medieval times the area of Slovakia was characterised by German and
            - link "Jewish" [ref=e1047] [cursor=pointer]:
              - /url: /wiki/Jewish
            - text: immigration, burgeoning towns, construction of numerous stone castles, and the cultivation of the arts.
            - superscript [ref=e1048]:
              - link "[49]" [ref=e1049] [cursor=pointer]:
                - /url: "#cite_note-tibensky-52"
            - text: The arrival of German element sometimes proved a problem for the autochthonous Slovaks (and even Hungarians in the broader Hungary), since they often quickly gained most power in medieval towns, only to later refuse to share it. Breaking of old customs by Germans often resulted in national quarrels. One of which had to be sorted out by the king
            - link "Louis I." [ref=e1050] [cursor=pointer]:
              - /url: /wiki/Louis_I_of_Hungary
            - text: with the proclamation
            - link "Privilegium pro Slavis" [ref=e1051] [cursor=pointer]:
              - /url: /wiki/Privilegium_pro_Slavis
            - text: (Privilege for Slovaks) in the year 1381. According to this privilege, Slovaks and
            - link "Germans" [ref=e1052] [cursor=pointer]:
              - /url: /wiki/Carpathian_Germans
            - text: were to occupy each half of the seats in the city council of
            - link "Žilina" [ref=e1053] [cursor=pointer]:
              - /url: /wiki/%C5%BDilina
            - text: and the mayor should be elected each year, alternating between those nationalities. This would not be the last such case.
            - superscript [ref=e1054]:
              - link "[50]" [ref=e1055] [cursor=pointer]:
                - /url: "#cite_note-53"
          - figure "One of the commanders of a Slovak volunteers' army captain Ján Francisci-Rimavský during the fight for independence from the Kingdom of Hungary" [ref=e1056]:
            - link [ref=e1057] [cursor=pointer]:
              - /url: /wiki/File:1franci2.jpg
              - img [ref=e1058]
            - generic [ref=e1059]:
              - text: One of the commanders of a Slovak volunteers' army captain
              - link "Ján Francisci-Rimavský" [ref=e1060] [cursor=pointer]:
                - /url: /wiki/J%C3%A1n_Francisci-Rimavsk%C3%BD
              - text: during the
              - link "fight for independence from the Kingdom of Hungary" [ref=e1061] [cursor=pointer]:
                - /url: /wiki/Slovak_Uprising_of_1848%E2%80%9349
          - paragraph [ref=e1062]:
            - text: In 1465, King
            - link "Matthias Corvinus" [ref=e1063] [cursor=pointer]:
              - /url: /wiki/Matthias_Corvinus_of_Hungary
            - text: founded the Hungarian Kingdom's third university, in Pressburg (
            - link "Bratislava" [ref=e1064] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ), but it was closed in 1490 after his death.
            - superscript [ref=e1065]:
              - link "[51]" [ref=e1066] [cursor=pointer]:
                - /url: "#cite_note-54"
            - link "Hussites" [ref=e1067] [cursor=pointer]:
              - /url: /wiki/Hussites
            - text: also settled in the region after the
            - link "Hussite Wars" [ref=e1068] [cursor=pointer]:
              - /url: /wiki/Hussite_Wars
            - text: .
            - superscript [ref=e1069]:
              - link "[52]" [ref=e1070] [cursor=pointer]:
                - /url: "#cite_note-books.google.pl-55"
          - paragraph [ref=e1071]:
            - text: Owing to the
            - link "Ottoman Empire" [ref=e1072] [cursor=pointer]:
              - /url: /wiki/Ottoman_Empire
            - text: "'s expansion into Hungarian territory,"
            - link "Bratislava" [ref=e1073] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: was designated the new capital of Hungary in 1536, ahead of the fall of the old Hungarian capital of
            - link "Buda" [ref=e1074] [cursor=pointer]:
              - /url: /wiki/Buda
            - text: in 1541. It became part of the Austrian Habsburg monarchy, marking the beginning of a new era. The territory comprising modern Slovakia, then known as
            - link "Upper Hungary" [ref=e1075] [cursor=pointer]:
              - /url: /wiki/Upper_Hungary
            - text: ", became the place of settlement for nearly two-thirds of the"
            - link "Magyar" [ref=e1076] [cursor=pointer]:
              - /url: /wiki/Magyar_tribes
            - text: nobility fleeing the Turks and became far more linguistically and culturally Hungarian than it was before.
            - superscript [ref=e1077]:
              - link "[52]" [ref=e1078] [cursor=pointer]:
                - /url: "#cite_note-books.google.pl-55"
            - text: Partly thanks to old
            - link "Hussite" [ref=e1079] [cursor=pointer]:
              - /url: /wiki/Hussite
            - text: families and Slovaks studying under
            - link "Martin Luther" [ref=e1080] [cursor=pointer]:
              - /url: /wiki/Martin_Luther
            - text: ", the region then experienced a growth in"
            - link "Protestantism" [ref=e1081] [cursor=pointer]:
              - /url: /wiki/Protestantism
            - text: .
            - superscript [ref=e1082]:
              - link "[52]" [ref=e1083] [cursor=pointer]:
                - /url: "#cite_note-books.google.pl-55"
            - text: For a short period in the 17th century, most Slovaks were
            - link "Lutherans" [ref=e1084] [cursor=pointer]:
              - /url: /wiki/Lutherans
            - text: .
            - superscript [ref=e1085]:
              - link "[52]" [ref=e1086] [cursor=pointer]:
                - /url: "#cite_note-books.google.pl-55"
            - text: They defied the Catholic Habsburgs and sought protection from neighbouring
            - link "Transylvania" [ref=e1087] [cursor=pointer]:
              - /url: /wiki/Transylvania
            - text: ", a rival continuation of the"
            - link "Magyar" [ref=e1088] [cursor=pointer]:
              - /url: /wiki/Magyar_tribes
            - text: state that practised religious tolerance and normally had Ottoman backing. Upper Hungary, modern Slovakia, became the site of frequent wars between Catholics in the west territory and Protestants in the east, as well as against Turks; the frontier was on a constant state of military alert and heavily fortified by castles and citadels often manned by Catholic German and Slovak troops on the Habsburg side. By 1648, Slovakia was not spared the
            - link "Counter-Reformation" [ref=e1089] [cursor=pointer]:
              - /url: /wiki/Counter-Reformation
            - text: ", which brought the majority of its population from Lutheranism back to"
            - link "Roman Catholicism" [ref=e1090] [cursor=pointer]:
              - /url: /wiki/Roman_Catholicism
            - text: . In 1655, the printing press at the
            - link "Trnava" [ref=e1091] [cursor=pointer]:
              - /url: /wiki/Trnava
            - text: university produced the Jesuit Benedikt Szöllősi's Cantus Catholici, a Catholic hymnal in Slovak that reaffirmed links to the earlier works of Cyril and Methodius.
          - paragraph [ref=e1092]:
            - text: The
            - link "Ottoman wars" [ref=e1093] [cursor=pointer]:
              - /url: /wiki/Ottoman_wars_in_Europe
            - text: ", the rivalry between Austria and"
            - link "Transylvania" [ref=e1094] [cursor=pointer]:
              - /url: /wiki/Transylvania
            - text: ", and the frequent insurrections against the"
            - link "Habsburg monarchy" [ref=e1095] [cursor=pointer]:
              - /url: /wiki/Habsburg_monarchy
            - text: inflicted a great deal of devastation, especially in the rural areas.
            - superscript [ref=e1096]:
              - link "[53]" [ref=e1097] [cursor=pointer]:
                - /url: "#cite_note-56"
            - text: In the
            - link "Austro-Turkish War (1663–1664)" [ref=e1098] [cursor=pointer]:
              - /url: /wiki/Austro-Turkish_War_(1663%E2%80%931664)
            - text: a Turkish army led by the
            - link "Grand Vizier" [ref=e1099] [cursor=pointer]:
              - /url: /wiki/Grand_Vizier
            - text: decimated Slovakia.
            - superscript [ref=e1100]:
              - link "[52]" [ref=e1101] [cursor=pointer]:
                - /url: "#cite_note-books.google.pl-55"
            - text: In 1682, the
            - link "Principality of Upper Hungary" [ref=e1102] [cursor=pointer]:
              - /url: /wiki/Principality_of_Upper_Hungary
            - text: ", a short-lived Ottoman vassal state, was established in the territory of modern Slovakia. Prior to this, regions on its southern rim were already encompassed in the"
            - link "Egri" [ref=e1103] [cursor=pointer]:
              - /url: /wiki/E%C4%9Fri_Eyalet
            - text: ","
            - link "Budin" [ref=e1104] [cursor=pointer]:
              - /url: /wiki/Budin_Eyalet
            - text: and
            - link "Uyvar" [ref=e1105] [cursor=pointer]:
              - /url: /wiki/Uyvar_Eyalet
            - link "eyalets" [ref=e1106] [cursor=pointer]:
              - /url: /wiki/Eyalet
            - text: .
            - superscript [ref=e1107]:
              - link "[13]" [ref=e1108] [cursor=pointer]:
                - /url: "#cite_note-Pirický-2023-16"
            - superscript [ref=e1109]:
              - link "[54]" [ref=e1110] [cursor=pointer]:
                - /url: "#cite_note-57"
            - superscript [ref=e1111]:
              - link "[14]" [ref=e1112] [cursor=pointer]:
                - /url: "#cite_note-Ágoston-1998-17"
            - link "Thököly" [ref=e1113] [cursor=pointer]:
              - /url: /wiki/Emeric_Th%C3%B6k%C3%B6ly
            - text: "'s"
            - link "kuruc" [ref=e1114] [cursor=pointer]:
              - /url: /wiki/Kuruc
            - text: rebels from the Principality of Upper Hungary fought alongside the Turks against the Austrians and Poles at the
            - link "Battle of Vienna" [ref=e1115] [cursor=pointer]:
              - /url: /wiki/Battle_of_Vienna
            - text: of 1683 led by
            - link "John III Sobieski" [ref=e1116] [cursor=pointer]:
              - /url: /wiki/John_III_Sobieski
            - text: . As the
            - link "Turks withdrew" [ref=e1117] [cursor=pointer]:
              - /url: /wiki/Great_Turkish_War
            - text: from Hungary in the late 17th century, the importance of the territory composing modern Slovakia decreased, although
            - link "Pressburg" [ref=e1118] [cursor=pointer]:
              - /url: /wiki/Pressburg
            - text: retained its status as the capital of Hungary until 1848 when it was transferred back to Buda.
            - superscript [ref=e1119]:
              - link "[55]" [ref=e1120] [cursor=pointer]:
                - /url: "#cite_note-58"
          - paragraph [ref=e1121]:
            - text: During the
            - link "revolution of 1848–49" [ref=e1122] [cursor=pointer]:
              - /url: /wiki/Revolutions_of_1848_in_the_Habsburg_areas
            - text: ", the"
            - link "Slovaks started uprising" [ref=e1123] [cursor=pointer]:
              - /url: /wiki/Slovak_Volunteer_Campaigns
            - text: ", supporting the"
            - link "Austrian Emperor" [ref=e1124] [cursor=pointer]:
              - /url: /wiki/Emperor_of_Austria
            - text: ", hoping for independence from the Hungarian part of the"
            - link "Dual Monarchy" [ref=e1125] [cursor=pointer]:
              - /url: /wiki/Austria-Hungary
            - text: and greater autonomy within the empire. They failed to achieve their aim, but the conflict resulted in Slovak rights for language in certain administrative and educational areas.
          - paragraph [ref=e1126]:
            - text: Thereafter, relations between the nationalities deteriorated (see
            - link "Magyarisation" [ref=e1127] [cursor=pointer]:
              - /url: /wiki/Magyarisation
            - text: ), culminating in the secession of Slovakia from Hungary after World War I.
            - superscript [ref=e1128]:
              - link "[56]" [ref=e1129] [cursor=pointer]:
                - /url: "#cite_note-59"
          - heading "Czechoslovak independence (1918–1939)" [level=3] [ref=e1131]: Czechoslovak independence (1918–1939)
          - note [ref=e1132]:
            - text: "Main articles:"
            - link "Dissolution of Austria-Hungary" [ref=e1133] [cursor=pointer]:
              - /url: /wiki/Dissolution_of_Austria-Hungary
            - text: ","
            - link "Czechoslovakia" [ref=e1134] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: ","
            - link "First Czechoslovak Republic" [ref=e1135] [cursor=pointer]:
              - /url: /wiki/First_Czechoslovak_Republic
            - text: ","
            - link "Munich Agreement" [ref=e1136] [cursor=pointer]:
              - /url: /wiki/Munich_Agreement
            - text: ", and"
            - link "Second Czechoslovak Republic" [ref=e1137] [cursor=pointer]:
              - /url: /wiki/Second_Czechoslovak_Republic
          - note [ref=e1138]:
            - text: "See also:"
            - link "Slovak Soviet Republic" [ref=e1139] [cursor=pointer]:
              - /url: /wiki/Slovak_Soviet_Republic
            - text: and
            - link "Autonomous Land of Slovakia" [ref=e1140] [cursor=pointer]:
              - /url: /wiki/Autonomous_Land_of_Slovakia
          - figure "Czechoslovak declaration of independence by Tomáš Garrigue Masaryk in the United States, 1918" [ref=e1141]:
            - link [ref=e1142] [cursor=pointer]:
              - /url: /wiki/File:Masaryk_Independence_Hall2.jpg
              - img [ref=e1143]
            - generic [ref=e1144]:
              - link "Czechoslovak declaration of independence" [ref=e1145] [cursor=pointer]:
                - /url: /wiki/Czechoslovak_declaration_of_independence
              - text: by
              - link "Tomáš Garrigue Masaryk" [ref=e1146] [cursor=pointer]:
                - /url: /wiki/Tom%C3%A1%C5%A1_Garrigue_Masaryk
              - text: in the United States, 1918
          - paragraph [ref=e1147]:
            - text: On 18 October 1918,
            - link "Tomáš Garrigue Masaryk" [ref=e1148] [cursor=pointer]:
              - /url: /wiki/Tom%C3%A1%C5%A1_Garrigue_Masaryk
            - text: ","
            - link "Milan Rastislav Štefánik" [ref=e1149] [cursor=pointer]:
              - /url: /wiki/Milan_Rastislav_%C5%A0tef%C3%A1nik
            - text: and
            - link "Edvard Beneš" [ref=e1150] [cursor=pointer]:
              - /url: /wiki/Edvard_Bene%C5%A1
            - text: declared in
            - link "Washington, D.C." [ref=e1151] [cursor=pointer]:
              - /url: /wiki/Washington,_D.C.
            - text: the
            - link "independence" [ref=e1152] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_declaration_of_independence
            - text: for the territories of
            - link "Bohemia" [ref=e1153] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Bohemia
            - text: ","
            - link "Moravia" [ref=e1154] [cursor=pointer]:
              - /url: /wiki/Margraviate_of_Moravia
            - text: ","
            - link "Silesia" [ref=e1155] [cursor=pointer]:
              - /url: /wiki/Silesia
            - text: ","
            - link "Upper Hungary" [ref=e1156] [cursor=pointer]:
              - /url: /wiki/Upper_Hungary
            - text: and
            - link "Carpathian Ruthenia" [ref=e1157] [cursor=pointer]:
              - /url: /wiki/Carpathian_Ruthenia
            - text: from the
            - link "Austro-Hungarian Empire" [ref=e1158] [cursor=pointer]:
              - /url: /wiki/Austro-Hungarian_Empire
            - text: and proclaimed a common state,
            - link "Czechoslovakia" [ref=e1159] [cursor=pointer]:
              - /url: /wiki/First_Czechoslovak_Republic
            - text: .
          - paragraph [ref=e1160]:
            - text: During the chaos following the break-up of Austria-Hungary, Czechoslovakia was formed with numerous
            - link "Czechs" [ref=e1161] [cursor=pointer]:
              - /url: /wiki/Czechs
            - text: ","
            - link "Germans" [ref=e1162] [cursor=pointer]:
              - /url: /wiki/German_people
            - text: ","
            - link "Slovaks" [ref=e1163] [cursor=pointer]:
              - /url: /wiki/Slovaks
            - text: ","
            - link "Hungarians" [ref=e1164] [cursor=pointer]:
              - /url: /wiki/Hungarians
            - text: and
            - link "Ruthenians" [ref=e1165] [cursor=pointer]:
              - /url: /wiki/Ruthenians
            - text: . The borders were set by the
            - link "Treaty of Saint Germain" [ref=e1166] [cursor=pointer]:
              - /url: /wiki/Treaty_of_Saint-Germain-en-Laye_(1919)
            - text: in 1919 and
            - link "Treaty of Trianon" [ref=e1167] [cursor=pointer]:
              - /url: /wiki/Treaty_of_Trianon
            - text: in 1920. By the treaties following the World War I, Czechoslovakia emerged as a sovereign European state.
          - figure "The Hungarian delegation arriving to Grand Trianon Palace at Versailles, to sign Treaty of Trianon, that cede territory of Slovakia (Upper Hungary) to Czechoslovakia after World War I, 1920" [ref=e1168]:
            - link [ref=e1169] [cursor=pointer]:
              - /url: /wiki/File:Signature_de_la_Paix_avec_la_Hongrie,_en_t%C3%AAte_Ben%C3%A1rd_%C3%81gost_hongrois(passant_devant_un_piquet_d%27honneur_%C3%A0_Versailles).jpg
              - img [ref=e1170]
            - generic [ref=e1171]:
              - text: The Hungarian delegation arriving to
              - link "Grand Trianon Palace" [ref=e1172] [cursor=pointer]:
                - /url: /wiki/Grand_Trianon
              - text: at
              - link "Versailles" [ref=e1173] [cursor=pointer]:
                - /url: /wiki/Versailles,_Yvelines
              - text: ", to sign"
              - link "Treaty of Trianon" [ref=e1174] [cursor=pointer]:
                - /url: /wiki/Treaty_of_Trianon
              - text: ", that cede territory of Slovakia ("
              - link "Upper Hungary" [ref=e1175] [cursor=pointer]:
                - /url: /wiki/Upper_Hungary
              - text: ) to Czechoslovakia after
              - link "World War I" [ref=e1176] [cursor=pointer]:
                - /url: /wiki/World_War_I
              - text: ", 1920"
          - paragraph [ref=e1177]:
            - text: During the
            - link "Interwar period" [ref=e1178] [cursor=pointer]:
              - /url: /wiki/Interwar_period
            - text: ", democratic Czechoslovakia was allied with France, and also with"
            - link "Romania" [ref=e1179] [cursor=pointer]:
              - /url: /wiki/Romania
            - text: and
            - link "Yugoslavia" [ref=e1180] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Yugoslavia
            - text: (
            - link "Little Entente" [ref=e1181] [cursor=pointer]:
              - /url: /wiki/Little_Entente
            - text: ); however, the
            - link "Locarno Treaties" [ref=e1182] [cursor=pointer]:
              - /url: /wiki/Locarno_Treaties
            - text: of 1925 left East European security open. Both Czechs and Slovaks enjoyed a period of relative prosperity. There was progress in not only the development of the country's economy but also culture and educational opportunities. Yet the
            - link "Great Depression" [ref=e1183] [cursor=pointer]:
              - /url: /wiki/Great_Depression
            - text: caused a sharp economic downturn, followed by political disruption and insecurity in Europe.
            - superscript [ref=e1184]:
              - link "[57]" [ref=e1185] [cursor=pointer]:
                - /url: "#cite_note-60"
          - paragraph [ref=e1186]:
            - text: In the 1930s, Czechoslovakia came under continuous pressure from the
            - link "revanchist" [ref=e1187] [cursor=pointer]:
              - /url: /wiki/Revanchism
            - text: governments of Germany, Hungary and Poland who used the aggrieved minorities in the country as a useful vehicle. Revision of the borders was called for, as Czechs constituted only 43% of the population. Eventually, this pressure led to the
            - link "Munich Agreement" [ref=e1188] [cursor=pointer]:
              - /url: /wiki/Munich_Agreement
            - text: of September 1938, which allowed the majority ethnic Germans in the
            - link "Sudetenland" [ref=e1189] [cursor=pointer]:
              - /url: /wiki/Sudetenland
            - text: ", borderlands of Czechoslovakia, to join with Germany. The remaining minorities stepped up their pressures for autonomy and the State became federalised, with Diets in Slovakia and Ruthenia. The remainder of Czechoslovakia was renamed Czecho-Slovakia and promised a greater degree of Slovak political autonomy. This, however, failed to materialise."
            - superscript [ref=e1190]:
              - link "[58]" [ref=e1191] [cursor=pointer]:
                - /url: "#cite_note-61"
            - text: Parts of southern and eastern Slovakia were also reclaimed by Hungary at the
            - link "First Vienna Award" [ref=e1192] [cursor=pointer]:
              - /url: /wiki/First_Vienna_Award
            - text: of November 1938.
          - heading "Fascist regime during World War II (1939–1945)" [level=3] [ref=e1194]: Fascist regime during World War II (1939–1945)
          - note [ref=e1195]:
            - text: "Main articles:"
            - link "Slovak Republic (1939–1945)" [ref=e1196] [cursor=pointer]:
              - /url: /wiki/Slovak_Republic_(1939%E2%80%931945)
            - text: ","
            - link "Slovakia during World War II" [ref=e1197] [cursor=pointer]:
              - /url: /wiki/Slovakia_during_World_War_II
            - text: ", and"
            - link "Slovak National Uprising" [ref=e1198] [cursor=pointer]:
              - /url: /wiki/Slovak_National_Uprising
          - note [ref=e1199]:
            - text: "See also:"
            - link "Occupation of Czechoslovakia (1938–1945)" [ref=e1200] [cursor=pointer]:
              - /url: /wiki/Occupation_of_Czechoslovakia_(1938%E2%80%931945)
            - text: ","
            - link "Czechoslovak government-in-exile" [ref=e1201] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_government-in-exile
            - text: ", and"
            - link "Protectorate of Bohemia and Moravia" [ref=e1202] [cursor=pointer]:
              - /url: /wiki/Protectorate_of_Bohemia_and_Moravia
          - figure "Adolf Hitler greeting Jozef Tiso, president of the (First) Slovak Republic, a client state of Nazi Germany during World War II, 1941" [ref=e1203]:
            - link [ref=e1204] [cursor=pointer]:
              - /url: /wiki/File:Jozef_Tiso_(Berlin).jpg
              - img [ref=e1205]
            - generic [ref=e1206]:
              - link "Adolf Hitler" [ref=e1207] [cursor=pointer]:
                - /url: /wiki/Adolf_Hitler
              - text: greeting
              - link "Jozef Tiso" [ref=e1208] [cursor=pointer]:
                - /url: /wiki/Jozef_Tiso
              - text: ", president of the (First)"
              - link "Slovak Republic" [ref=e1209] [cursor=pointer]:
                - /url: /wiki/Slovak_Republic_(1939%E2%80%931945)
              - text: ", a client state of Nazi Germany during World War II, 1941"
          - paragraph [ref=e1210]:
            - text: After the
            - link "Munich Agreement" [ref=e1211] [cursor=pointer]:
              - /url: /wiki/Munich_Agreement
            - text: and its
            - link "Vienna Award" [ref=e1212] [cursor=pointer]:
              - /url: /wiki/Vienna_Award
            - text: ","
            - link "Nazi Germany" [ref=e1213] [cursor=pointer]:
              - /url: /wiki/Nazi_Germany
            - text: threatened to annex part of Slovakia and allow the remaining regions to be partitioned by Hungary or Poland unless independence was declared. Thus, Slovakia seceded from
            - link "Czecho-Slovakia" [ref=e1214] [cursor=pointer]:
              - /url: /wiki/Second_Czechoslovak_Republic
            - text: in March 1939 and allied itself, as demanded by Germany, with
            - link "Hitler" [ref=e1215] [cursor=pointer]:
              - /url: /wiki/Adolf_Hitler
            - text: "'s coalition."
            - superscript [ref=e1216]:
              - link "[59]" [ref=e1217] [cursor=pointer]:
                - /url: "#cite_note-62"
            - text: Secession had created the first Slovak state in history.
            - superscript [ref=e1218]:
              - link "[60]" [ref=e1219] [cursor=pointer]:
                - /url: "#cite_note-RadioPrague-63"
          - paragraph [ref=e1220]:
            - text: A
            - link "one-party" [ref=e1221] [cursor=pointer]:
              - /url: /wiki/One-party_state
            - link "clerical fascist" [ref=e1222] [cursor=pointer]:
              - /url: /wiki/Clerical_fascism
            - link "Slovak Republic" [ref=e1223] [cursor=pointer]:
              - /url: /wiki/Slovak_Republic_(1939%E2%80%931945)
            - text: governed by the far-right
            - link "Hlinka's Slovak People's Party" [ref=e1224] [cursor=pointer]:
              - /url: /wiki/Slovak_People%27s_Party
            - text: was led by President
            - link "Jozef Tiso" [ref=e1225] [cursor=pointer]:
              - /url: /wiki/Jozef_Tiso
            - text: and Prime Minister
            - link "Vojtech Tuka" [ref=e1226] [cursor=pointer]:
              - /url: /wiki/Vojtech_Tuka
            - text: . The (First) Slovak Republic is primarily known for its
            - link "collaboration" [ref=e1227] [cursor=pointer]:
              - /url: /wiki/Collaborationism
            - text: with Nazi Germany, which included sending troops to the
            - link "invasion of Poland" [ref=e1228] [cursor=pointer]:
              - /url: /wiki/Slovak_invasion_of_Poland
            - text: in
            - link "September 1939" [ref=e1229] [cursor=pointer]:
              - /url: /wiki/September_Campaign
            - text: and the
            - link "Soviet Union" [ref=e1230] [cursor=pointer]:
              - /url: /wiki/Operation_Barbarossa
            - text: in 1941. On 24 November 1940, Slovakia joined the
            - link "Axis" [ref=e1231] [cursor=pointer]:
              - /url: /wiki/Axis_powers
            - text: when its leaders signed the
            - link "Tripartite Pact" [ref=e1232] [cursor=pointer]:
              - /url: /wiki/Tripartite_Pact
            - text: . The country was strongly influenced by Germany and gradually became a
            - link "puppet regime" [ref=e1233] [cursor=pointer]:
              - /url: /wiki/Puppet_state
            - text: in many respects.
          - paragraph [ref=e1234]:
            - text: Meanwhile, the
            - link "Czechoslovak government-in-exile" [ref=e1235] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_government-in-exile
            - text: sought to reverse the
            - link "Munich Agreement" [ref=e1236] [cursor=pointer]:
              - /url: /wiki/Munich_Agreement
            - text: and the subsequent
            - link "German occupation of Czechoslovakia" [ref=e1237] [cursor=pointer]:
              - /url: /wiki/German_occupation_of_Czechoslovakia
            - text: and to return the Republic to its 1937 boundaries. The government operated from
            - link "London" [ref=e1238] [cursor=pointer]:
              - /url: /wiki/London
            - text: and it was ultimately considered, by those countries that recognised it, the legitimate government for
            - link "Czechoslovakia" [ref=e1239] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: throughout the Second World War.
          - paragraph [ref=e1240]:
            - text: The
            - link "local Jewish population" [ref=e1241] [cursor=pointer]:
              - /url: /wiki/History_of_the_Jews_in_Slovakia
            - text: was heavily persecuted.
            - superscript [ref=e1242]:
              - link "[61]" [ref=e1243] [cursor=pointer]:
                - /url: "#cite_note-64"
            - text: As part of the
            - link "Holocaust in Slovakia" [ref=e1244] [cursor=pointer]:
              - /url: /wiki/Holocaust_in_Slovakia
            - text: ", 75,000 Jews out of 80,000 who remained on Slovak territory after Hungary had seized southern regions were deported and taken to German"
            - link "death camps" [ref=e1245] [cursor=pointer]:
              - /url: /wiki/Death_camps
            - text: .
            - superscript [ref=e1246]:
              - link "[62]" [ref=e1247] [cursor=pointer]:
                - /url: "#cite_note-65"
            - superscript [ref=e1248]:
              - link "[63]" [ref=e1249] [cursor=pointer]:
                - /url: "#cite_note-66"
            - text: Thousands of Jews, Gypsies and other politically undesirable people remained in Slovak forced labour camps in
            - link "Sereď" [ref=e1250] [cursor=pointer]:
              - /url: /wiki/Sere%C4%8F_concentration_camp
            - text: ", Vyhne, and Nováky."
            - superscript [ref=e1251]:
              - link "[64]" [ref=e1252] [cursor=pointer]:
                - /url: "#cite_note-67"
            - text: Tiso, through the granting of presidential exceptions, allowed between 1,000 and 4,000 people crucial to the war economy to avoid deportations.
            - superscript [ref=e1253]:
              - link "[65]" [ref=e1254] [cursor=pointer]:
                - /url: "#cite_note-68"
            - text: Under Tiso's government and Hungarian occupation, the vast majority of Slovakia's pre-war Jewish population (between 75,000 and 105,000 individuals including those who perished from the occupied territory) were murdered.
            - superscript [ref=e1255]:
              - link "[66]" [ref=e1256] [cursor=pointer]:
                - /url: "#cite_note-69"
            - superscript [ref=e1257]:
              - link "[67]" [ref=e1258] [cursor=pointer]:
                - /url: "#cite_note-70"
            - text: The Slovak state paid Germany 500
            - link "RM" [ref=e1259] [cursor=pointer]:
              - /url: /wiki/Reichsmark
            - text: per every deported Jew for "retraining and accommodation" (a similar but smaller payment of 30 RM was paid by
            - link "Croatia" [ref=e1260] [cursor=pointer]:
              - /url: /wiki/Independent_State_of_Croatia
            - text: ).
            - superscript [ref=e1261]:
              - link "[68]" [ref=e1262] [cursor=pointer]:
                - /url: "#cite_note-71"
          - paragraph [ref=e1263]:
            - text: After it became clear that the Soviet
            - link "Red Army" [ref=e1264] [cursor=pointer]:
              - /url: /wiki/Red_Army
            - text: was going to push the Nazis out of eastern and central Europe, an anti-Nazi
            - link "resistance movement" [ref=e1265] [cursor=pointer]:
              - /url: /wiki/Resistance_movement
            - text: launched. Internal opposition to the fascist government's policies culminated in the
            - link "Slovak National Uprising" [ref=e1266] [cursor=pointer]:
              - /url: /wiki/Slovak_National_Uprising
            - text: ", near the end of summer 1944. A bloody German occupation and a guerilla war followed. Germans and their"
            - link "local collaborators" [ref=e1267] [cursor=pointer]:
              - /url: /wiki/Hlinka_Guard
            - text: completely destroyed 93 villages and massacred thousands of civilians, often hundreds at a time.
            - superscript [ref=e1268]:
              - link "[69]" [ref=e1269] [cursor=pointer]:
                - /url: "#cite_note-72"
            - text: Although the uprising was eventually suppressed,
            - link "partisan resistance" [ref=e1270] [cursor=pointer]:
              - /url: /wiki/Slovak_partisans
            - text: continued. The territory of Slovakia was liberated by Soviet and Romanian forces by the end of April 1945.
          - heading "From Fascism to Communism (1945–1948)" [level=3] [ref=e1272]: From Fascism to Communism (1945–1948)
          - note [ref=e1273]:
            - text: "Main articles:"
            - link "Third Czechoslovak Republic" [ref=e1274] [cursor=pointer]:
              - /url: /wiki/Third_Czechoslovak_Republic
            - text: and
            - link "1948 Czechoslovak coup d'état" [ref=e1275] [cursor=pointer]:
              - /url: /wiki/1948_Czechoslovak_coup_d%27%C3%A9tat
          - note [ref=e1276]:
            - text: "See also:"
            - link "Soviet annexation of Transcarpathia" [ref=e1277] [cursor=pointer]:
              - /url: /wiki/Soviet_annexation_of_Transcarpathia
          - paragraph [ref=e1278]:
            - text: As a result of the
            - link "Yalta Conference" [ref=e1279] [cursor=pointer]:
              - /url: /wiki/Yalta_Conference
            - text: in February 1945, Czechoslovakia came under the influence of the
            - link "Soviet Union" [ref=e1280] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: .
          - paragraph [ref=e1281]:
            - text: After World War II, Czechoslovakia was reconstituted and
            - link "Jozef Tiso" [ref=e1282] [cursor=pointer]:
              - /url: /wiki/Jozef_Tiso
            - text: was executed in 1947 for collaboration with the Nazis. More than
            - link "80,000 Hungarians" [ref=e1283] [cursor=pointer]:
              - /url: /wiki/Hungarians_in_Slovakia#Population_exchanges
            - superscript [ref=e1284]:
              - link "[70]" [ref=e1285] [cursor=pointer]:
                - /url: "#cite_note-73"
            - text: and 32,000 Germans
            - superscript [ref=e1286]:
              - link "[71]" [ref=e1287] [cursor=pointer]:
                - /url: "#cite_note-74"
            - text: were forced to leave Slovakia, in a series of
            - link "population transfers" [ref=e1288] [cursor=pointer]:
              - /url: /wiki/Expulsion_of_Germans_after_World_War_II
            - text: initiated by the Allies at the
            - link "Potsdam Conference" [ref=e1289] [cursor=pointer]:
              - /url: /wiki/Potsdam_Conference
            - text: .
            - superscript [ref=e1290]:
              - link "[72]" [ref=e1291] [cursor=pointer]:
                - /url: "#cite_note-rock-75"
            - text: Out of about 130,000
            - link "Carpathian Germans" [ref=e1292] [cursor=pointer]:
              - /url: /wiki/Carpathian_Germans
            - text: in Slovakia in 1938, by 1947 only some 20,000 remained.
            - superscript [ref=e1293]:
              - link "[73]" [ref=e1294] [cursor=pointer]:
                - /url: "#cite_note-76"
            - superscript [ref=e1295]:
              - text: "["
              - link "failed verification" [ref=e1297] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Verifiability
              - text: "]"
          - paragraph [ref=e1298]:
            - text: In February 1948, the
            - link "Communist Party of Czechoslovakia" [ref=e1299] [cursor=pointer]:
              - /url: /wiki/Communist_Party_of_Czechoslovakia
            - text: ", with Soviet backing, assumed undisputed control over the government of"
            - link "Czechoslovakia" [ref=e1300] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: through a
            - link "coup d'état" [ref=e1301] [cursor=pointer]:
              - /url: /wiki/1948_Czechoslovak_coup_d%27%C3%A9tat
            - text: and Czechoslovakia came under direct occupation of the Soviet Union and its
            - link "Warsaw Pact" [ref=e1302] [cursor=pointer]:
              - /url: /wiki/Warsaw_Pact
            - text: . It became a
            - link "puppet state" [ref=e1303] [cursor=pointer]:
              - /url: /wiki/Puppet_state
            - text: of the Soviet Union, but it was never part of the Soviet Union and remained independent to a certain degree.
          - heading "Communist party rule in Czechoslovakia (1948–1989)" [level=3] [ref=e1305]: Communist party rule in Czechoslovakia (1948–1989)
          - note [ref=e1306]:
            - text: "Main article:"
            - link "Czechoslovak Socialist Republic" [ref=e1307] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_Socialist_Republic
          - note [ref=e1308]:
            - text: "See also:"
            - link "Cold War" [ref=e1309] [cursor=pointer]:
              - /url: /wiki/Cold_War
            - text: ","
            - link "Iron Curtain" [ref=e1310] [cursor=pointer]:
              - /url: /wiki/Iron_Curtain
            - text: ","
            - link "Prague Spring" [ref=e1311] [cursor=pointer]:
              - /url: /wiki/Prague_Spring
            - text: ","
            - link "Warsaw Pact invasion of Czechoslovakia" [ref=e1312] [cursor=pointer]:
              - /url: /wiki/Warsaw_Pact_invasion_of_Czechoslovakia
            - text: ", and"
            - link "Communist Party of Czechoslovakia" [ref=e1313] [cursor=pointer]:
              - /url: /wiki/Communist_Party_of_Czechoslovakia
          - figure "Soviet tank in Bratislava during the Warsaw Pact invasion of Czechoslovakia in 1968" [ref=e1314]:
            - link [ref=e1315] [cursor=pointer]:
              - /url: /wiki/File:Bratislava_1968_2.jpg
              - img [ref=e1316]
            - generic [ref=e1317]:
              - link "Soviet" [ref=e1318] [cursor=pointer]:
                - /url: /wiki/Soviet_Union
              - text: tank in Bratislava during the Warsaw Pact invasion of Czechoslovakia in 1968
          - paragraph [ref=e1319]:
            - text: Borders with the West were protected by the
            - link "Iron Curtain" [ref=e1320] [cursor=pointer]:
              - /url: /wiki/Iron_Curtain
            - text: . About 600 people, men, women, and children, were killed on the Czechoslovak border with Austria and
            - link "West Germany" [ref=e1321] [cursor=pointer]:
              - /url: /wiki/West_Germany
            - text: between 1948 and 1989.
            - superscript [ref=e1322]:
              - link "[74]" [ref=e1323] [cursor=pointer]:
                - /url: "#cite_note-77"
            - text: 8,240 people went to forced labour camps in 1948–1953.
            - superscript [ref=e1324]:
              - link "[75]" [ref=e1325] [cursor=pointer]:
                - /url: "#cite_note-78"
          - paragraph [ref=e1326]:
            - text: On 11 July 1960, the
            - link "Constitution of Czechoslovakia" [ref=e1327] [cursor=pointer]:
              - /url: /wiki/1960_Constitution_of_Czechoslovakia
            - text: was promulgated, changing the name of the country from the "Czechoslovak Republic" to the "Czechoslovak Socialist Republic".
          - paragraph [ref=e1328]:
            - text: In 1968, following the
            - link "Prague Spring" [ref=e1329] [cursor=pointer]:
              - /url: /wiki/Prague_Spring
            - text: ", the country was"
            - link "invaded" [ref=e1330] [cursor=pointer]:
              - /url: /wiki/Warsaw_Pact_invasion_of_Czechoslovakia
            - text: by the Warsaw Pact forces (
            - link "People's Republic of Bulgaria" [ref=e1331] [cursor=pointer]:
              - /url: /wiki/People%27s_Republic_of_Bulgaria
            - text: ","
            - link "People's Republic of Hungary" [ref=e1332] [cursor=pointer]:
              - /url: /wiki/Hungarian_People%27s_Republic
            - text: ","
            - link "People's Republic of Poland" [ref=e1333] [cursor=pointer]:
              - /url: /wiki/Polish_People%27s_Republic
            - text: ", and"
            - link "Soviet Union" [ref=e1334] [cursor=pointer]:
              - /url: /wiki/Soviet_Union
            - text: ", with the exception of"
            - link "Socialist Republic of Romania" [ref=e1335] [cursor=pointer]:
              - /url: /wiki/Socialist_Republic_of_Romania
            - text: and
            - link "People's Socialist Republic of Albania" [ref=e1336] [cursor=pointer]:
              - /url: /wiki/People%27s_Socialist_Republic_of_Albania
            - text: ), ending a
            - link "period of liberalisation" [ref=e1337] [cursor=pointer]:
              - /url: /wiki/Prague_Spring
            - text: under the leadership of
            - link "Alexander Dubček" [ref=e1338] [cursor=pointer]:
              - /url: /wiki/Alexander_Dub%C4%8Dek
            - text: . 137 Czechoslovak civilians were killed and 500 seriously wounded during the invasion.
            - superscript [ref=e1339]:
              - link "[76]" [ref=e1340] [cursor=pointer]:
                - /url: "#cite_note-victims-79"
            - superscript [ref=e1341]:
              - link "[77]" [ref=e1342] [cursor=pointer]:
                - /url: "#cite_note-victims2-80"
          - paragraph [ref=e1343]:
            - text: In 1969, Czechoslovakia became a
            - link "federation" [ref=e1344] [cursor=pointer]:
              - /url: /wiki/Constitutional_Act_on_the_Czechoslovak_Federation
            - text: of the
            - link "Czech Socialist Republic" [ref=e1345] [cursor=pointer]:
              - /url: /wiki/Czech_Socialist_Republic
            - text: and the
            - link "Slovak Socialist Republic" [ref=e1346] [cursor=pointer]:
              - /url: /wiki/Slovak_Socialist_Republic
            - text: within the
            - link "Czechoslovak Socialist Republic" [ref=e1347] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_Socialist_Republic
            - text: .
          - figure "Czechoslovak communist leader Gustáv Husák (right) with Fidel Castro during his state visit of Czechoslovakia, 1972" [ref=e1348]:
            - link [ref=e1349] [cursor=pointer]:
              - /url: /wiki/File:Fidel_Castro_1972_(SOA_Prague).jpg
              - img [ref=e1350]
            - generic [ref=e1351]:
              - text: Czechoslovak communist leader
              - link "Gustáv Husák" [ref=e1352] [cursor=pointer]:
                - /url: /wiki/Gust%C3%A1v_Hus%C3%A1k
              - text: (right) with
              - link "Fidel Castro" [ref=e1353] [cursor=pointer]:
                - /url: /wiki/Fidel_Castro
              - text: during his state visit of Czechoslovakia, 1972
          - paragraph [ref=e1354]:
            - text: Czechoslovakia was allied with communist regimes worldwide. As one of the first countries in the world acknowledged
            - link "Kim Il-sung" [ref=e1355] [cursor=pointer]:
              - /url: /wiki/Kim_Il-sung
            - text: "'s"
            - link "Democratic People's Republic of Korea" [ref=e1356] [cursor=pointer]:
              - /url: /wiki/Democratic_People%27s_Republic_of_Korea
            - text: . After the beginning of the
            - link "Korean War" [ref=e1357] [cursor=pointer]:
              - /url: /wiki/Korean_War
            - text: ", Czechoslovakia protested against measures taken by the Security Council. Czechoslovak communist leaders considered the intervention against North Korean aggression illegal. During summer 1950, many resolutions against \"American imperialism\" were sent to the United Nations from Czechoslovakia. During the Korean War in 1952, Czechoslovakia sent a military hospital with two hospital teams consisting of 58 people to North Korea."
            - superscript [ref=e1358]:
              - link "[78]" [ref=e1359] [cursor=pointer]:
                - /url: "#cite_note-81"
          - paragraph [ref=e1360]:
            - text: When
            - link "Fidel Castro" [ref=e1361] [cursor=pointer]:
              - /url: /wiki/Fidel_Castro
            - text: took power after the
            - link "Cuban Revolution" [ref=e1362] [cursor=pointer]:
              - /url: /wiki/Cuban_Revolution
            - text: in 1959, Czechoslovakia opened an embassy in Cuba and developed mutual relations. In August 1968, Castro denounced the
            - link "Prague Spring" [ref=e1363] [cursor=pointer]:
              - /url: /wiki/Prague_Spring
            - text: as led by a "fascist reactionary rabble" and praised the Soviet invasion of Czechoslovakia.
            - superscript [ref=e1364]:
              - link "[79]" [ref=e1365] [cursor=pointer]:
                - /url: "#cite_note-82"
            - superscript [ref=e1366]:
              - link "[80]" [ref=e1367] [cursor=pointer]:
                - /url: "#cite_note-83"
            - text: During the
            - link "Vietnam War" [ref=e1368] [cursor=pointer]:
              - /url: /wiki/Vietnam_War
            - text: ", Czechoslovakia sent"
            - link "significant aid" [ref=e1369] [cursor=pointer]:
              - /url: /wiki/International_participation_in_the_Vietnam_War
            - text: to
            - link "North Vietnam" [ref=e1370] [cursor=pointer]:
              - /url: /wiki/North_Vietnam
            - text: .
            - superscript [ref=e1371]:
              - link "[81]" [ref=e1372] [cursor=pointer]:
                - /url: "#cite_note-Bischof2-84"
            - text: The Czechoslovak government created committees which sought to not only promote and establish peace, but also to promote victory for
            - link "Viet Cong" [ref=e1373] [cursor=pointer]:
              - /url: /wiki/Viet_Cong
            - text: and
            - link "Vietnam People's Army" [ref=e1374] [cursor=pointer]:
              - /url: /wiki/Vietnam_People%27s_Army
            - text: forces.
            - superscript [ref=e1375]:
              - link "[81]" [ref=e1376] [cursor=pointer]:
                - /url: "#cite_note-Bischof2-84"
            - text: Czech-made equipment and military aid would increase significantly following the Prague Spring.
            - superscript [ref=e1377]:
              - link "[82]" [ref=e1378] [cursor=pointer]:
                - /url: "#cite_note-Francev2-85"
            - text: Czechoslovakia continued to send tens of thousands of Czech-made rifles as well as mortar and artillery throughout the war.
            - superscript [ref=e1379]:
              - link "[82]" [ref=e1380] [cursor=pointer]:
                - /url: "#cite_note-Francev2-85"
          - heading "From Communism to Democracy (1989–1992)" [level=3] [ref=e1382]: From Communism to Democracy (1989–1992)
          - note [ref=e1383]:
            - text: "Main article:"
            - link "Czech and Slovak Federative Republic" [ref=e1384] [cursor=pointer]:
              - /url: /wiki/Czech_and_Slovak_Federative_Republic
          - note [ref=e1385]:
            - text: "See also:"
            - link "Slovak National Council's Declaration of Independence of the Slovak Nation" [ref=e1386] [cursor=pointer]:
              - /url: /wiki/Slovak_National_Council%27s_Declaration_of_Independence_of_the_Slovak_Nation
            - text: and
            - link "Constitution of Slovakia" [ref=e1387] [cursor=pointer]:
              - /url: /wiki/Constitution_of_Slovakia
          - figure "The Velvet Revolution ended 41 years of authoritarian communist rule in Czechoslovakia in 1989." [ref=e1388]:
            - link [ref=e1389] [cursor=pointer]:
              - /url: /wiki/File:Praha_19891122-419-02.jpg
              - img [ref=e1390]
            - generic [ref=e1391]:
              - text: The
              - link "Velvet Revolution" [ref=e1392] [cursor=pointer]:
                - /url: /wiki/Velvet_Revolution
              - text: ended 41 years of authoritarian communist rule in
              - link "Czechoslovakia" [ref=e1393] [cursor=pointer]:
                - /url: /wiki/Czechoslovak_Socialist_Republic
              - text: in 1989.
          - paragraph [ref=e1394]:
            - text: The end of Communist rule in Czechoslovakia in 1989, during the peaceful
            - link "Velvet Revolution" [ref=e1395] [cursor=pointer]:
              - /url: /wiki/Velvet_Revolution
            - text: ", was followed once again by the country's dissolution, this time into two"
            - link "successor states" [ref=e1396] [cursor=pointer]:
              - /url: /wiki/Succession_of_states
            - text: .
            - link "Czechoslovak Socialist Republic" [ref=e1397] [cursor=pointer]:
              - /url: /wiki/Czechoslovak_Socialist_Republic
            - text: renamed as
            - link "Czech and Slovak Federative Republic" [ref=e1398] [cursor=pointer]:
              - /url: /wiki/Czech_and_Slovak_Federative_Republic
            - text: ", the word \"socialist\" was dropped in the names of the two republics within the federation, the Slovak Socialist Republic renamed as"
            - link "Slovak Republic" [ref=e1399] [cursor=pointer]:
              - /url: /wiki/Slovak_Socialist_Republic
            - text: .
          - paragraph [ref=e1400]:
            - text: On 17 July 1992, Slovakia, led by Prime Minister
            - link "Vladimír Mečiar" [ref=e1401] [cursor=pointer]:
              - /url: /wiki/Vladim%C3%ADr_Me%C4%8Diar
            - text: ", declared itself a sovereign state, meaning that its laws took precedence over those of the federal government. Throughout the autumn of 1992, Vladimír Mečiar and"
            - link "Czech Prime Minister" [ref=e1402] [cursor=pointer]:
              - /url: /wiki/List_of_Prime_Ministers_of_the_Czech_Republic
            - link "Václav Klaus" [ref=e1403] [cursor=pointer]:
              - /url: /wiki/V%C3%A1clav_Klaus
            - text: negotiated the details for disbanding the federation. In November, the federal parliament voted to dissolve the country officially on 31 December 1992.
          - heading "Slovak independence (since 1993)" [level=3] [ref=e1405]: Slovak independence (since 1993)
          - heading "1990s" [level=4] [ref=e1407]
          - paragraph [ref=e1408]:
            - text: The Slovak Republic and the
            - link "Czech Republic" [ref=e1409] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: went their separate ways on 1 January 1993, an event sometimes called the
            - link "Velvet Divorce" [ref=e1410] [cursor=pointer]:
              - /url: /wiki/Dissolution_of_Czechoslovakia
            - text: ", after 74 years of joint existence disrupted only by World War II."
            - superscript [ref=e1411]:
              - link "[83]" [ref=e1412] [cursor=pointer]:
                - /url: "#cite_note-86"
            - superscript [ref=e1413]:
              - link "[84]" [ref=e1414] [cursor=pointer]:
                - /url: "#cite_note-87"
            - text: Slovakia has, nevertheless, remained a close partner with the Czech Republic; the two countries are close European allies and both co-operate with Hungary and Poland in the
            - link "Visegrád Group" [ref=e1415] [cursor=pointer]:
              - /url: /wiki/Visegr%C3%A1d_Group
            - text: .
            - superscript [ref=e1416]:
              - link "[85]" [ref=e1417] [cursor=pointer]:
                - /url: "#cite_note-88"
            - text: The first President of the Slovak Republic became
            - link "Michal Kováč" [ref=e1418] [cursor=pointer]:
              - /url: /wiki/Michal_Kov%C3%A1%C4%8D
            - text: ", elected by the"
            - link "National Council of Slovakia" [ref=e1419] [cursor=pointer]:
              - /url: /wiki/National_Council_of_Slovakia
            - text: in February 1993.
            - superscript [ref=e1420]:
              - link "[86]" [ref=e1421] [cursor=pointer]:
                - /url: "#cite_note-89"
            - text: Slovakia became a member of the
            - link "United Nations" [ref=e1422] [cursor=pointer]:
              - /url: /wiki/United_Nations
            - text: on 19 January 1993, on 31 March 1993 ratified the
            - link "UNESCO World Heritage Convention" [ref=e1423] [cursor=pointer]:
              - /url: /wiki/World_Heritage_Convention
            - text: ", making its historical sites eligible for inclusion on the"
            - link "UNESCO" [ref=e1424] [cursor=pointer]:
              - /url: /wiki/UNESCO
            - text: list and on 15 April 1993 joined
            - link "GATT" [ref=e1425] [cursor=pointer]:
              - /url: /wiki/GATT
            - text: (current
            - link "World Trade Organization" [ref=e1426] [cursor=pointer]:
              - /url: /wiki/World_Trade_Organization
            - text: ).
            - superscript [ref=e1427]:
              - link "[87]" [ref=e1428] [cursor=pointer]:
                - /url: "#cite_note-90"
          - paragraph [ref=e1429]:
            - text: After the fall of communism and the dissolution of Czechoslovakia, the country was unprepared for organised crime.
            - superscript [ref=e1430]:
              - link "[88]" [ref=e1431] [cursor=pointer]:
                - /url: "#cite_note-91"
            - link "Crime rates in Slovakia" [ref=e1432] [cursor=pointer]:
              - /url: /wiki/Crime_in_Slovakia
            - text: soared in the 1990s, the first post-communist gangsters emerged and
            - link "mafia" [ref=e1433] [cursor=pointer]:
              - /url: /wiki/Slovak_mafia
            - text: became the major problem in the country.
            - superscript [ref=e1434]:
              - link "[89]" [ref=e1435] [cursor=pointer]:
                - /url: "#cite_note-92"
            - text: Most of the law enforcement officers, prosecutors, and judges had no experience of investigating, trying, or sentencing criminals. Many officials lacked even basic knowledge of the leading criminal operators in their communities.
            - superscript [ref=e1436]:
              - link "[90]" [ref=e1437] [cursor=pointer]:
                - /url: "#cite_note-93"
            - text: Between 1994–1998, during the government of
            - link "Prime Minister" [ref=e1438] [cursor=pointer]:
              - /url: /wiki/Prime_Minister_of_Slovakia
            - link "Vladimír Mečiar" [ref=e1439] [cursor=pointer]:
              - /url: /wiki/Vladim%C3%ADr_Me%C4%8Diar
            - text: ", organised crime became well established and it penetrated the highest political positions."
            - superscript [ref=e1440]:
              - link "[91]" [ref=e1441] [cursor=pointer]:
                - /url: "#cite_note-94"
            - text: One of the major crime events was kidnapping of Slovak president's son Michal Kováč Jr. in 1995, organised by
            - link "Slovak intelligence service" [ref=e1442] [cursor=pointer]:
              - /url: /wiki/Slovensk%C3%A1_informa%C4%8Dn%C3%A1_slu%C5%BEba
            - text: and the government of Vladimír Mečiar.
            - superscript [ref=e1443]:
              - link "[92]" [ref=e1444] [cursor=pointer]:
                - /url: "#cite_note-95"
            - superscript [ref=e1445]:
              - link "[93]" [ref=e1446] [cursor=pointer]:
                - /url: "#cite_note-96"
            - text: Processes of
            - link "privatization in Slovakia" [ref=e1447] [cursor=pointer]:
              - /url: /wiki/Privatization_in_Slovakia
            - text: began, often criticized for lack of transparency and corruption. Hundreds of state assets came into private hands to only a selected group of businessmen.
            - superscript [ref=e1448]:
              - link "[94]" [ref=e1449] [cursor=pointer]:
                - /url: "#cite_note-97"
            - text: In the 1990s, Slovakia had central Europe's worst-performing economy, marked by high unemployment rates and inflation with least democratic government.
            - link "Madeleine Albright" [ref=e1450] [cursor=pointer]:
              - /url: /wiki/Madeleine_Albright
            - text: ", the"
            - link "U.S. secretary of state" [ref=e1451] [cursor=pointer]:
              - /url: /wiki/U.S._secretary_of_state
            - text: ", referred to it as \"a black hole in the heart of Europe\"."
            - superscript [ref=e1452]:
              - link "[95]" [ref=e1453] [cursor=pointer]:
                - /url: "#cite_note-98"
            - text: This time period in Slovakia is also known as
            - generic [ref=e1454]:
              - text: "\""
              - link "Wild 90s" [ref=e1455] [cursor=pointer]:
                - /url: /wiki/The_wild_nineties
              - text: "\""
            - text: ("Divoké 90.roky").
            - superscript [ref=e1456]:
              - link "[96]" [ref=e1457] [cursor=pointer]:
                - /url: "#cite_note-99"
            - text: Since March 1998, the country was 14 months without a head of state, when the National Council of Slovakia
            - link "multiple times failed" [ref=e1458] [cursor=pointer]:
              - /url: /wiki/1998_Slovak_presidential_election
            - text: to elect the new president, which led to the introduction of a
            - link "direct presidential election" [ref=e1459] [cursor=pointer]:
              - /url: /wiki/1999_Slovak_presidential_election
            - text: in 1999.
            - superscript [ref=e1460]:
              - link "[97]" [ref=e1461] [cursor=pointer]:
                - /url: "#cite_note-100"
          - paragraph [ref=e1462]:
            - text: After the
            - link "1998 parliamentary election" [ref=e1463] [cursor=pointer]:
              - /url: /wiki/1998_Slovak_parliamentary_election
            - text: ","
            - link "Mikuláš Dzurinda" [ref=e1464] [cursor=pointer]:
              - /url: /wiki/Mikul%C3%A1%C5%A1_Dzurinda
            - text: went on to replace Vladimír Mečiar as Prime Minister, and during two successive governments between 1998–2006, relaunched the transformation processes that had stalled under Mečiar.
            - superscript [ref=e1465]:
              - link "[98]" [ref=e1466] [cursor=pointer]:
                - /url: "#cite_note-101"
            - text: The country embarked on a reformist course that saw the introduction of a flat tax, liberalisation of the labour market, deregulation of business, and partial privatization of social security. Government of Mikuláš Dzurinda led Slovakia into OECD, NATO and the European Union.
            - superscript [ref=e1467]:
              - link "[99]" [ref=e1468] [cursor=pointer]:
                - /url: "#cite_note-102"
            - text: In 1999, the second President of Slovakia became
            - link "Rudolf Schuster" [ref=e1469] [cursor=pointer]:
              - /url: /wiki/Rudolf_Schuster
            - text: ", first directly-elected president."
            - superscript [ref=e1470]:
              - link "[100]" [ref=e1471] [cursor=pointer]:
                - /url: "#cite_note-103"
          - heading "2000s" [level=4] [ref=e1473]
          - figure "Slovakia became a member of the European Union in 2004 and signed the Lisbon Treaty in 2007." [ref=e1474]:
            - link [ref=e1475] [cursor=pointer]:
              - /url: /wiki/File:Tratado_de_Lisboa_13_12_2007_(081).jpg
              - img [ref=e1476]
            - generic [ref=e1477]:
              - text: Slovakia became a member of the European Union in 2004 and signed the
              - link "Lisbon Treaty" [ref=e1478] [cursor=pointer]:
                - /url: /wiki/Lisbon_Treaty
              - text: in 2007.
          - paragraph [ref=e1479]:
            - text: Slovakia became a member of
            - link "OECD" [ref=e1480] [cursor=pointer]:
              - /url: /wiki/OECD
            - text: on 14 December 2000,
            - link "NATO" [ref=e1481] [cursor=pointer]:
              - /url: /wiki/NATO
            - text: on 29 March 2004 and of the
            - link "European Union" [ref=e1482] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: on 1 May 2004.
            - superscript [ref=e1483]:
              - link "[101]" [ref=e1484] [cursor=pointer]:
                - /url: "#cite_note-104"
            - text: The country used to be dubbed the
            - generic [ref=e1485]:
              - text: "\""
              - link "Tatra Tiger" [ref=e1486] [cursor=pointer]:
                - /url: /wiki/Tatra_Tiger
              - text: "\""
            - text: in the 2000s as achieved, on average, roughly 6% per capita GDP growth each year from 2000 to 2008.
            - superscript [ref=e1487]:
              - link "[102]" [ref=e1488] [cursor=pointer]:
                - /url: "#cite_note-Nicolae-Dragos-2015-105"
            - superscript [ref=e1489]:
              - link "[103]" [ref=e1490] [cursor=pointer]:
                - /url: "#cite_note-Akadémiai_Kiadó-106"
            - link "Ivan Gašparovič" [ref=e1491] [cursor=pointer]:
              - /url: /wiki/Ivan_Ga%C5%A1parovi%C4%8D
            - text: became the third president of Slovakia in 2004 and in 2009 became the first and the only Slovak re-elected president.
            - superscript [ref=e1492]:
              - link "[104]" [ref=e1493] [cursor=pointer]:
                - /url: "#cite_note-107"
          - paragraph [ref=e1494]:
            - text: In 2006,
            - link "Robert Fico" [ref=e1495] [cursor=pointer]:
              - /url: /wiki/Robert_Fico
            - text: became Prime Minister, during his first government, Slovakia joined the
            - link "Schengen area" [ref=e1496] [cursor=pointer]:
              - /url: /wiki/Schengen_area
            - text: on 21 December 2007, allowing visa free travel and on 1 January 2009 adopted the
            - link "Euro" [ref=e1497] [cursor=pointer]:
              - /url: /wiki/Euro
            - text: as its national currency at 30.1260
            - link "korunas" [ref=e1498] [cursor=pointer]:
              - /url: /wiki/Slovak_koruna
            - text: to the euro.
            - superscript [ref=e1499]:
              - link "[105]" [ref=e1500] [cursor=pointer]:
                - /url: "#cite_note-108"
            - text: The Slovak economy was involved in a major slowdown during the
            - link "2008 financial crisis" [ref=e1501] [cursor=pointer]:
              - /url: /wiki/2008_financial_crisis
            - text: ", experiencing the deepest"
            - link "recession" [ref=e1502] [cursor=pointer]:
              - /url: /wiki/Recession
            - text: in history.
            - superscript [ref=e1503]:
              - link "[106]" [ref=e1504] [cursor=pointer]:
                - /url: "#cite_note-109"
            - text: At the beginning of 2009, Slovakia faced energy crisis and declared a
            - link "state of emergency" [ref=e1505] [cursor=pointer]:
              - /url: /wiki/State_of_emergency
            - text: ", after Russia cut gas supplies to Europe via Ukrainian pipelines as part of a"
            - link "price dispute with Ukraine" [ref=e1506] [cursor=pointer]:
              - /url: /wiki/2009_Russia%E2%80%93Ukraine_gas_dispute
            - text: .
            - superscript [ref=e1507]:
              - link "[107]" [ref=e1508] [cursor=pointer]:
                - /url: "#cite_note-110"
          - heading "2010s" [level=4] [ref=e1510]
          - paragraph [ref=e1511]:
            - text: Between 2010–2012, Slovak government was led by first female Prime Minister
            - link "Iveta Radičová" [ref=e1512] [cursor=pointer]:
              - /url: /wiki/Iveta_Radi%C4%8Dov%C3%A1
            - text: .
            - superscript [ref=e1513]:
              - link "[108]" [ref=e1514] [cursor=pointer]:
                - /url: "#cite_note-111"
            - text: Her government lasted only two years, Radičová combined the vote on the strengthening of the
            - link "European Financial Stability Facility" [ref=e1515] [cursor=pointer]:
              - /url: /wiki/European_Financial_Stability_Facility
            - text: – a key anti-crisis mechanism in the
            - link "eurozone" [ref=e1516] [cursor=pointer]:
              - /url: /wiki/Eurozone
            - text: – with a vote of confidence for her cabinet. Slovak parliament rejected the EFSF, which led to the collapse of the government.
            - superscript [ref=e1517]:
              - link "[109]" [ref=e1518] [cursor=pointer]:
                - /url: "#cite_note-112"
          - paragraph [ref=e1519]:
            - text: In 2012, Robert Fico became second time Prime Minister when his political party
            - link "Direction – Social Democracy" [ref=e1520] [cursor=pointer]:
              - /url: /wiki/Direction_%E2%80%93_Social_Democracy
            - text: won
            - link "election" [ref=e1521] [cursor=pointer]:
              - /url: /wiki/2012_Slovak_parliamentary_election
            - text: and collected 83 of 150 seats in
            - link "National Council" [ref=e1522] [cursor=pointer]:
              - /url: /wiki/National_Council_of_Slovakia
            - text: ", becoming the first single party to win a"
            - link "clear majority" [ref=e1523] [cursor=pointer]:
              - /url: /wiki/Majority_government
            - text: in the Slovak parliament since the fall of communism.
            - superscript [ref=e1524]:
              - link "[110]" [ref=e1525] [cursor=pointer]:
                - /url: "#cite_note-113"
            - text: In 2014,
            - link "Andrej Kiska" [ref=e1526] [cursor=pointer]:
              - /url: /wiki/Andrej_Kiska
            - text: became the fourth President of Slovakia. For the first time was elected as President entrepreneur and first-time politician.
            - superscript [ref=e1527]:
              - link "[111]" [ref=e1528] [cursor=pointer]:
                - /url: "#cite_note-114"
            - text: International crisis impacted Slovak politics and quickly started dominating the country's political life and media coverage, such as
            - link "Annexation of Crimea by the Russian Federation" [ref=e1529] [cursor=pointer]:
              - /url: /wiki/Annexation_of_Crimea_by_the_Russian_Federation
            - text: in neighbouring Ukraine in 2014 or
            - link "European migrant crisis" [ref=e1530] [cursor=pointer]:
              - /url: /wiki/2015_European_migrant_crisis
            - text: in 2015.
            - superscript [ref=e1531]:
              - link "[112]" [ref=e1532] [cursor=pointer]:
                - /url: "#cite_note-115"
          - paragraph [ref=e1533]:
            - text: After the
            - link "parliamentary election" [ref=e1534] [cursor=pointer]:
              - /url: /wiki/2016_Slovak_parliamentary_election
            - text: in 2016, Robert Fico became third time Prime Minister, making him longest-serving prime minister in Slovak history, if the years are counted cumulatively.
            - superscript [ref=e1535]:
              - link "[113]" [ref=e1536] [cursor=pointer]:
                - /url: "#cite_note-116"
            - text: Third term of Fico's government was characterised by social and political turmoil. On 21 February 2018, young Slovak investigative journalist Ján Kuciak and his fiancée,
            - link "were killed" [ref=e1537] [cursor=pointer]:
              - /url: /wiki/Murder_of_J%C3%A1n_Kuciak
            - text: in their home in
            - link "Veľká Mača" [ref=e1538] [cursor=pointer]:
              - /url: /wiki/Ve%C4%BEk%C3%A1_Ma%C4%8Da
            - text: .
            - superscript [ref=e1539]:
              - link "[114]" [ref=e1540] [cursor=pointer]:
                - /url: "#cite_note-117"
            - superscript [ref=e1541]:
              - link "[115]" [ref=e1542] [cursor=pointer]:
                - /url: "#cite_note-118"
            - text: Thousands of people protested in streets across Slovakia for independent investigation of journalist's murder and a 'trustworthy' government in
            - link "largest demonstrations" [ref=e1543] [cursor=pointer]:
              - /url: /wiki/Murder_of_J%C3%A1n_Kuciak#Political_crisis
            - text: in the country since the Velvet Revolution.
            - superscript [ref=e1544]:
              - link "[116]" [ref=e1545] [cursor=pointer]:
                - /url: "#cite_note-119"
            - text: Due to protests, Robert Fico resigned, and the government continued under a new Prime Minister
            - link "Peter Pellegrini" [ref=e1546] [cursor=pointer]:
              - /url: /wiki/Peter_Pellegrini
            - text: .
            - superscript [ref=e1547]:
              - link "[117]" [ref=e1548] [cursor=pointer]:
                - /url: "#cite_note-120"
            - text: In 2019,
            - link "Zuzana Čaputová" [ref=e1549] [cursor=pointer]:
              - /url: /wiki/Zuzana_%C4%8Caputov%C3%A1
            - text: became the fifth President of Slovakia, first female president.
            - superscript [ref=e1550]:
              - link "[118]" [ref=e1551] [cursor=pointer]:
                - /url: "#cite_note-121"
          - heading "2020s" [level=4] [ref=e1553]
          - paragraph [ref=e1554]:
            - text: After the
            - link "parliamentary election" [ref=e1555] [cursor=pointer]:
              - /url: /wiki/2020_Slovak_parliamentary_election
            - text: in 2020,
            - link "Igor Matovič" [ref=e1556] [cursor=pointer]:
              - /url: /wiki/Igor_Matovi%C4%8D
            - text: became the new Prime Minister of Slovakia.
            - superscript [ref=e1557]:
              - link "[119]" [ref=e1558] [cursor=pointer]:
                - /url: "#cite_note-122"
            - text: Matovič and his government, with little to no previous government experience, was dealing with the
            - link "COVID-19 pandemic" [ref=e1559] [cursor=pointer]:
              - /url: /wiki/COVID-19_pandemic
            - text: and
            - link "COVID-19 recession" [ref=e1560] [cursor=pointer]:
              - /url: /wiki/COVID-19_recession
            - text: ", during which more than"
            - link "21,000 people" [ref=e1561] [cursor=pointer]:
              - /url: /wiki/COVID-19_pandemic_in_Slovakia
            - text: died in Slovakia between 2020–2023, the worst death toll in the country since the end of World War II.
            - superscript [ref=e1562]:
              - link "[120]" [ref=e1563] [cursor=pointer]:
                - /url: "#cite_note-123"
            - superscript [ref=e1564]:
              - link "[121]" [ref=e1565] [cursor=pointer]:
                - /url: "#cite_note-124"
            - text: Due to the COVID-19 pandemic, the Slovak economy faced the worst economic crisis since the
            - link "2008 financial crisis" [ref=e1566] [cursor=pointer]:
              - /url: /wiki/2008_financial_crisis
            - text: and fell into recession.
            - superscript [ref=e1567]:
              - link "[122]" [ref=e1568] [cursor=pointer]:
                - /url: "#cite_note-125"
            - text: At the beginning of 2021, Matovič signed an agreement to acquire 2 million doses of Russia's
            - link "Sputnik V COVID-19 vaccine" [ref=e1569] [cursor=pointer]:
              - /url: /wiki/Sputnik_V_COVID-19_vaccine
            - text: ", which has not been cleared by"
            - link "European Union" [ref=e1570] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: regulators.
            - superscript [ref=e1571]:
              - link "[123]" [ref=e1572] [cursor=pointer]:
                - /url: "#cite_note-126"
            - text: Matovič orchestrated the deal despite disagreement among his coalition partners, which led to a government crisis and his resignation.
            - superscript [ref=e1573]:
              - link "[124]" [ref=e1574] [cursor=pointer]:
                - /url: "#cite_note-127"
            - superscript [ref=e1575]:
              - link "[125]" [ref=e1576] [cursor=pointer]:
                - /url: "#cite_note-128"
            - text: The government continued under a new Prime Minister
            - link "Eduard Heger" [ref=e1577] [cursor=pointer]:
              - /url: /wiki/Eduard_Heger
            - text: .
            - superscript [ref=e1578]:
              - link "[126]" [ref=e1579] [cursor=pointer]:
                - /url: "#cite_note-129"
            - text: Heger and his government faced many challenges, such as the ongoing COVID-19 pandemic,
            - link "Russian invasion" [ref=e1580] [cursor=pointer]:
              - /url: /wiki/Russian_invasion_of_Ukraine
            - text: in neighbouring Ukraine,
            - link "Ukrainian refugee crisis" [ref=e1581] [cursor=pointer]:
              - /url: /wiki/Ukrainian_refugee_crisis
            - text: ","
            - link "Global energy crisis" [ref=e1582] [cursor=pointer]:
              - /url: /wiki/Global_energy_crisis_(2021%E2%80%932023)
            - text: and
            - link "Inflation surge" [ref=e1583] [cursor=pointer]:
              - /url: /wiki/2021%E2%80%932023_inflation_surge
            - text: . After a strong economic recovery in 2021, growth slowed down markedly in 2022 and 2023 as a result of the consequences of the Russian invasion of Ukraine, notably the subsequent
            - link "EU sanctions on Russia" [ref=e1584] [cursor=pointer]:
              - /url: /wiki/International_sanctions_during_the_Russo-Ukrainian_War
            - text: and Global energy crisis.
            - superscript [ref=e1585]:
              - link "[127]" [ref=e1586] [cursor=pointer]:
                - /url: "#cite_note-130"
            - text: Slovakia became one of Ukraine's largest
            - link "donors of military aid" [ref=e1587] [cursor=pointer]:
              - /url: /wiki/List_of_military_aid_to_Ukraine_during_the_Russo-Ukrainian_War
            - text: during Heger's government in 2022 and 2023.
            - superscript [ref=e1588]:
              - link "[128]" [ref=e1589] [cursor=pointer]:
                - /url: "#cite_note-131"
            - text: Government crisis in Slovakia continued with various disputes in the coalition. At the end of 2022, Heger's government collapsed, after a lost no-confidence vote in parliament.
            - superscript [ref=e1590]:
              - link "[129]" [ref=e1591] [cursor=pointer]:
                - /url: "#cite_note-132"
            - text: In 2023, in the interim before the next election, President Zuzana Čaputová appointed the first
            - link "technocrat government" [ref=e1592] [cursor=pointer]:
              - /url: /wiki/Technocracy
            - text: in Slovak history and
            - link "Ľudovít Ódor" [ref=e1593] [cursor=pointer]:
              - /url: /wiki/%C4%BDudov%C3%ADt_%C3%93dor
            - text: became the new Prime Minister for only six months, the third Prime Minister of Slovakia in three years.
            - superscript [ref=e1594]:
              - link "[130]" [ref=e1595] [cursor=pointer]:
                - /url: "#cite_note-133"
            - link "People's Party Our Slovakia" [ref=e1596] [cursor=pointer]:
              - /url: /wiki/People%27s_Party_Our_Slovakia
            - text: ", a far-right political party whose leadership has historically employed neo-Nazi imagery and ultra-nationalist rhetoric, maintained parliamentary representation between 2016 and 2023."
            - superscript [ref=e1597]:
              - link "[131]" [ref=e1598] [cursor=pointer]:
                - /url: "#cite_note-134"
          - paragraph [ref=e1599]:
            - text: After the
            - link "parliamentary election" [ref=e1600] [cursor=pointer]:
              - /url: /wiki/2023_Slovak_parliamentary_election
            - text: in 2023, Robert Fico became for the fourth time Prime Minister.
            - superscript [ref=e1601]:
              - link "[132]" [ref=e1602] [cursor=pointer]:
                - /url: "#cite_note-reuters.com-135"
            - text: The new government halted military aid to Ukraine, while still providing humanitarian aid and electricity supplies.
            - superscript [ref=e1603]:
              - link "[133]" [ref=e1604] [cursor=pointer]:
                - /url: "#cite_note-136"
            - superscript [ref=e1605]:
              - link "[134]" [ref=e1606] [cursor=pointer]:
                - /url: "#cite_note-137"
            - text: On 15 May 2024, Prime Minister Robert Fico was shot several times and wounded in an
            - link "assassination attempt" [ref=e1607] [cursor=pointer]:
              - /url: /wiki/Attempted_assassination_of_Robert_Fico
            - text: .
            - superscript [ref=e1608]:
              - link "[135]" [ref=e1609] [cursor=pointer]:
                - /url: "#cite_note-138"
            - text: The suspect stated during interrogation that he acted primarily because of the Fico government's opposition to military assistance to Ukraine.
            - superscript [ref=e1610]:
              - link "[136]" [ref=e1611] [cursor=pointer]:
                - /url: "#cite_note-139"
            - text: In 2024,
            - link "Peter Pellegrini" [ref=e1612] [cursor=pointer]:
              - /url: /wiki/Peter_Pellegrini
            - text: became the sixth President of Slovakia.
            - superscript [ref=e1613]:
              - link "[137]" [ref=e1614] [cursor=pointer]:
                - /url: "#cite_note-140"
            - text: Pellegrini is the first Slovak politician to have held all three highest constitutional posts (President, Prime Minister and Speaker of Parliament) in the country. Fourth term of Fico's government is characterized by political instability with fragile coalition, worsening relations with European Union, diplomatic disputes with the closest ally
            - link "Czech Republic" [ref=e1615] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: and growing Russian influence.
            - superscript [ref=e1616]:
              - link "[138]" [ref=e1617] [cursor=pointer]:
                - /url: "#cite_note-141"
            - superscript [ref=e1618]:
              - link "[139]" [ref=e1619] [cursor=pointer]:
                - /url: "#cite_note-142"
            - superscript [ref=e1620]:
              - link "[140]" [ref=e1621] [cursor=pointer]:
                - /url: "#cite_note-143"
            - text: Pro-Russia policies of Slovak government,
            - superscript [ref=e1622]:
              - link "[141]" [ref=e1623] [cursor=pointer]:
                - /url: "#cite_note-144"
            - text: questioning Slovakia's future in the European Union and NATO,
            - superscript [ref=e1624]:
              - link "[142]" [ref=e1625] [cursor=pointer]:
                - /url: "#cite_note-145"
            - superscript [ref=e1626]:
              - link "[143]" [ref=e1627] [cursor=pointer]:
                - /url: "#cite_note-146"
            - text: criticism of Ukrainian President
            - link "Volodymyr Zelenskyy" [ref=e1628] [cursor=pointer]:
              - /url: /wiki/Volodymyr_Zelenskyy
            - superscript [ref=e1629]:
              - link "[144]" [ref=e1630] [cursor=pointer]:
                - /url: "#cite_note-147"
            - text: and Fico's good relationship with Russian President
            - link "Vladimir Putin" [ref=e1631] [cursor=pointer]:
              - /url: /wiki/Vladimir_Putin
            - text: ","
            - superscript [ref=e1632]:
              - link "[145]" [ref=e1633] [cursor=pointer]:
                - /url: "#cite_note-148"
            - text: led to
            - link "widespread demonstrations" [ref=e1634] [cursor=pointer]:
              - /url: /wiki/2025_Slovak_protests
            - text: across the country.
            - superscript [ref=e1635]:
              - link "[146]" [ref=e1636] [cursor=pointer]:
                - /url: "#cite_note-149"
            - text: Slovakia fell significantly in the media freedom ranking and corruption ranking.
            - superscript [ref=e1637]:
              - link "[147]" [ref=e1638] [cursor=pointer]:
                - /url: "#cite_note-150"
            - superscript [ref=e1639]:
              - link "[148]" [ref=e1640] [cursor=pointer]:
                - /url: "#cite_note-151"
            - text: Crisis of democratic society was followed by economic decline, underlined by downgrade rating from credit rating agency
            - link "Moody's" [ref=e1641] [cursor=pointer]:
              - /url: /wiki/Moody%27s_Ratings
            - text: and later
            - link "Standard & Poor's" [ref=e1642] [cursor=pointer]:
              - /url: /wiki/S%26P_Global_Ratings
            - text: .
            - superscript [ref=e1643]:
              - link "[149]" [ref=e1644] [cursor=pointer]:
                - /url: "#cite_note-152"
            - superscript [ref=e1645]:
              - link "[150]" [ref=e1646] [cursor=pointer]:
                - /url: "#cite_note-153"
            - superscript [ref=e1647]:
              - link "[151]" [ref=e1648] [cursor=pointer]:
                - /url: "#cite_note-154"
            - text: In 2025, the government amended constitution to recognize
            - link "only two genders" [ref=e1649] [cursor=pointer]:
              - /url: /wiki/List_of_gender_identities
            - text: (male and female), sparking human rights concerns.
            - superscript [ref=e1650]:
              - link "[152]" [ref=e1651] [cursor=pointer]:
                - /url: "#cite_note-155"
            - superscript [ref=e1652]:
              - link "[153]" [ref=e1653] [cursor=pointer]:
                - /url: "#cite_note-156"
          - heading "Geography" [level=2] [ref=e1655]
          - note [ref=e1656]:
            - text: "Main article:"
            - link "Geography of Slovakia" [ref=e1657] [cursor=pointer]:
              - /url: /wiki/Geography_of_Slovakia
          - note [ref=e1658]:
            - text: "See also:"
            - link "Geomorphological division of Slovakia" [ref=e1659] [cursor=pointer]:
              - /url: /wiki/Geomorphological_division_of_Slovakia
          - generic [ref=e1661]:
            - link "Panorama of the High Tatras" [ref=e1664] [cursor=pointer]:
              - /url: /wiki/File:High_Tatras_Panorama.jpg
            - generic [ref=e1665]:
              - link "File:High Tatras Panorama.jpg" [ref=e1667] [cursor=pointer]:
                - /url: /wiki/File:High_Tatras_Panorama.jpg
              - text: Panorama of the
              - link "High Tatras" [ref=e1668] [cursor=pointer]:
                - /url: /wiki/High_Tatras
          - paragraph [ref=e1669]:
            - text: Slovakia lies between latitudes
            - link "47°" [ref=e1670] [cursor=pointer]:
              - /url: /wiki/47th_parallel_north
            - text: and
            - link "50° N" [ref=e1671] [cursor=pointer]:
              - /url: /wiki/50th_parallel_north
            - text: ", and longitudes"
            - link "16°" [ref=e1672] [cursor=pointer]:
              - /url: /wiki/16th_meridian_east
            - text: and
            - link "23° E" [ref=e1673] [cursor=pointer]:
              - /url: /wiki/23rd_meridian_east
            - text: . The Slovak landscape is noted primarily for its mountainous nature, with the
            - link "Carpathian Mountains" [ref=e1674] [cursor=pointer]:
              - /url: /wiki/Carpathian_Mountains
            - text: extending across most of the northern half of the country. Among these
            - link "mountain ranges" [ref=e1675] [cursor=pointer]:
              - /url: /wiki/Mountain_range
            - text: are the high peaks of the
            - link "Fatra-Tatra Area" [ref=e1676] [cursor=pointer]:
              - /url: /wiki/Fatra-Tatra_Area
            - text: (including
            - link "Tatra Mountains" [ref=e1677] [cursor=pointer]:
              - /url: /wiki/Tatra_Mountains
            - text: ","
            - link "Greater Fatra" [ref=e1678] [cursor=pointer]:
              - /url: /wiki/Ve%C4%BEk%C3%A1_Fatra
            - text: and
            - link "Lesser Fatra" [ref=e1679] [cursor=pointer]:
              - /url: /wiki/Lesser_Fatra
            - text: ),
            - link "Slovak Ore Mountains" [ref=e1680] [cursor=pointer]:
              - /url: /wiki/Slovak_Ore_Mountains
            - text: ","
            - link "Slovak Central Mountains" [ref=e1681] [cursor=pointer]:
              - /url: /wiki/Slovak_Central_Mountains
            - text: or
            - link "Beskids" [ref=e1682] [cursor=pointer]:
              - /url: /wiki/Beskids
            - text: . The largest lowland is the fertile
            - link "Danubian Lowland" [ref=e1683] [cursor=pointer]:
              - /url: /wiki/Danubian_Lowland
            - text: in the southwest, followed by the
            - link "Eastern Slovak Lowland" [ref=e1684] [cursor=pointer]:
              - /url: /wiki/Eastern_Slovak_Lowland
            - text: in the southeast.
            - superscript [ref=e1685]:
              - link "[154]" [ref=e1686] [cursor=pointer]:
                - /url: "#cite_note-cia-157"
            - text: Forests cover 41% of Slovak land surface.
            - superscript [ref=e1687]:
              - link "[155]" [ref=e1688] [cursor=pointer]:
                - /url: "#cite_note-158"
          - heading "Tatra mountains" [level=3] [ref=e1690]
          - note [ref=e1691]:
            - text: "Main article:"
            - link "Tatra Mountains" [ref=e1692] [cursor=pointer]:
              - /url: /wiki/Tatra_Mountains
          - figure "A topographical map of Slovakia" [ref=e1693]:
            - link [ref=e1694] [cursor=pointer]:
              - /url: /wiki/File:Slovakia_topo.jpg
              - img [ref=e1695]
            - generic [ref=e1696]:
              - text: A
              - link "topographical" [ref=e1697] [cursor=pointer]:
                - /url: /wiki/Topography
              - text: map of Slovakia
          - paragraph [ref=e1698]:
            - text: The Tatra Mountains, with 29 peaks higher than 2,500 metres (8,202 feet)
            - link "AMSL" [ref=e1699] [cursor=pointer]:
              - /url: /wiki/Sea_level#AMSL
            - text: ", are the highest mountain range in the Carpathian Mountains. The Tatras occupy an area of 750 km"
            - superscript [ref=e1700]: "2"
            - text: (290 sq mi), of which the greater part 600 km
            - superscript [ref=e1701]: "2"
            - text: (230 sq mi) lies in Slovakia. They are divided into several parts.
          - paragraph [ref=e1702]:
            - text: To the north, close to the Polish border, are the
            - link "High Tatras" [ref=e1703] [cursor=pointer]:
              - /url: /wiki/High_Tatras
            - text: which are a popular
            - link "hiking" [ref=e1704] [cursor=pointer]:
              - /url: /wiki/Hiking
            - text: and
            - link "skiing" [ref=e1705] [cursor=pointer]:
              - /url: /wiki/Skiing
            - text: destination and home to many scenic lakes and valleys as well as the highest point in Slovakia, the
            - link "Gerlachovský štít" [ref=e1706] [cursor=pointer]:
              - /url: /wiki/Gerlachovsk%C3%BD_%C5%A1t%C3%ADt
            - text: at 2,655 metres (8,711 ft) and the country's highly symbolic mountain
            - link "Kriváň" [ref=e1707] [cursor=pointer]:
              - /url: /wiki/Kriv%C3%A1%C5%88_(peak)
            - text: . To the west are the
            - link "Western Tatras" [ref=e1708] [cursor=pointer]:
              - /url: /wiki/Western_Tatras
            - text: with their highest peak of
            - link "Bystrá" [ref=e1709] [cursor=pointer]:
              - /url: /wiki/Bystr%C3%A1_(mountain)
            - text: at 2,248 metres (7,375 ft) and to the east are the
            - link "Belianske Tatras" [ref=e1710] [cursor=pointer]:
              - /url: /wiki/Belianske_Tatras
            - text: ", smallest by area."
          - paragraph [ref=e1711]:
            - text: Separated from the Tatras proper by the valley of the
            - link "Váh" [ref=e1712] [cursor=pointer]:
              - /url: /wiki/V%C3%A1h
            - text: river are the
            - link "Low Tatras" [ref=e1713] [cursor=pointer]:
              - /url: /wiki/Low_Tatras
            - text: ", with their highest peak of"
            - link "Ďumbier" [ref=e1714] [cursor=pointer]:
              - /url: /wiki/%C4%8Eumbier
            - text: at 2,043 metres (6,703 ft).
          - paragraph [ref=e1715]:
            - text: The Tatra mountain range is represented as one of the three hills on the
            - link "coat of arms of Slovakia" [ref=e1716] [cursor=pointer]:
              - /url: /wiki/Coat_of_arms_of_Slovakia
            - text: .
          - heading "National parks" [level=3] [ref=e1718]
          - note [ref=e1719]:
            - text: "Main article:"
            - link "List of national parks of Slovakia" [ref=e1720] [cursor=pointer]:
              - /url: /wiki/List_of_national_parks_of_Slovakia
          - figure "Slovak Paradise National Park" [ref=e1721]:
            - link [ref=e1722] [cursor=pointer]:
              - /url: /wiki/File:Palcmansk%C3%A1_Ma%C5%A1a.JPG
              - img [ref=e1723]
            - link "Slovak Paradise National Park" [ref=e1725] [cursor=pointer]:
              - /url: /wiki/Slovak_Paradise_National_Park
          - paragraph [ref=e1726]:
            - text: "There are nine national parks in Slovakia, covering 6.5% of the Slovak land surface. These parks are:"
            - link "Tatra National Park" [ref=e1727] [cursor=pointer]:
              - /url: /wiki/Tatra_National_Park,_Slovakia
            - text: ","
            - link "Low Tatras National Park" [ref=e1728] [cursor=pointer]:
              - /url: /wiki/Low_Tatras_National_Park
            - text: ","
            - link "Veľká Fatra National Park" [ref=e1729] [cursor=pointer]:
              - /url: /wiki/Ve%C4%BEk%C3%A1_Fatra_National_Park
            - text: ","
            - link "Slovak Karst National Park" [ref=e1730] [cursor=pointer]:
              - /url: /wiki/Slovak_Karst_National_Park
            - text: ","
            - link "Poloniny National Park" [ref=e1731] [cursor=pointer]:
              - /url: /wiki/Poloniny_National_Park
            - text: ","
            - link "Malá Fatra National Park" [ref=e1732] [cursor=pointer]:
              - /url: /wiki/Mal%C3%A1_Fatra_National_Park
            - text: ","
            - link "Muránska planina National Park" [ref=e1733] [cursor=pointer]:
              - /url: /wiki/Mur%C3%A1nska_planina_National_Park
            - text: ","
            - link "Slovak Paradise National Park" [ref=e1734] [cursor=pointer]:
              - /url: /wiki/Slovak_Paradise_National_Park
            - text: and
            - link "Pieniny National Park" [ref=e1735] [cursor=pointer]:
              - /url: /wiki/Pieniny_National_Park_(Slovakia)
            - text: .
            - superscript [ref=e1736]:
              - link "[156]" [ref=e1737] [cursor=pointer]:
                - /url: "#cite_note-159"
          - heading "Caves" [level=3] [ref=e1739]
          - note [ref=e1740]:
            - text: "Main article:"
            - link "List of caves in Slovakia" [ref=e1741] [cursor=pointer]:
              - /url: /wiki/List_of_caves_in_Slovakia
          - figure "Domica Cave" [ref=e1742]:
            - link [ref=e1743] [cursor=pointer]:
              - /url: /wiki/File:Domica_Cave_20.jpg
              - img [ref=e1744]
            - link "Domica Cave" [ref=e1746] [cursor=pointer]:
              - /url: /wiki/Domica_Cave
          - paragraph [ref=e1747]:
            - text: Slovakia has hundreds of caves and caverns under its mountains, of which 30 are open to the public.
            - superscript [ref=e1748]:
              - link "[157]" [ref=e1749] [cursor=pointer]:
                - /url: "#cite_note-160"
            - text: Most of the caves have
            - link "stalagmites" [ref=e1750] [cursor=pointer]:
              - /url: /wiki/Stalagmite
            - text: rising from the ground and
            - link "stalactites" [ref=e1751] [cursor=pointer]:
              - /url: /wiki/Stalactite
            - text: hanging from above.
          - paragraph [ref=e1752]:
            - text: There are currently five Slovak caves under
            - link "UNESCO" [ref=e1753] [cursor=pointer]:
              - /url: /wiki/UNESCO
            - text: "'s World Heritage Site status:"
            - link "Dobšiná Ice Cave" [ref=e1754] [cursor=pointer]:
              - /url: /wiki/Dob%C5%A1in%C3%A1_Ice_Cave
            - text: ","
            - link "Domica" [ref=e1755] [cursor=pointer]:
              - /url: /wiki/Domica
            - text: ","
            - link "Gombasek Cave" [ref=e1756] [cursor=pointer]:
              - /url: /wiki/Gombasek_Cave
            - text: ","
            - link "Jasovská Cave" [ref=e1757] [cursor=pointer]:
              - /url: /wiki/Jasovsk%C3%A1_Cave
            - text: and
            - link "Ochtinská Aragonite Cave" [ref=e1758] [cursor=pointer]:
              - /url: /wiki/Ochtinsk%C3%A1_Aragonite_Cave
            - text: . Other caves open to the public include
            - link "Belianska Cave" [ref=e1759] [cursor=pointer]:
              - /url: /wiki/Belianska_Cave
            - text: ","
            - link "Demänovská Cave of Liberty" [ref=e1760] [cursor=pointer]:
              - /url: /wiki/Dem%C3%A4novsk%C3%A1_Cave_of_Liberty
            - text: ","
            - link "Demänovská Ice Cave" [ref=e1761] [cursor=pointer]:
              - /url: /wiki/Dem%C3%A4novsk%C3%A1_Ice_Cave
            - text: or
            - link "Bystrianska Cave" [ref=e1762] [cursor=pointer]:
              - /url: /wiki/Bystrianska_Cave
            - text: .
          - heading "Rivers" [level=3] [ref=e1764]
          - note [ref=e1765]:
            - text: "Main article:"
            - link "List of rivers of Slovakia" [ref=e1766] [cursor=pointer]:
              - /url: /wiki/List_of_rivers_of_Slovakia
          - figure "Dunajec river" [ref=e1767]:
            - link [ref=e1768] [cursor=pointer]:
              - /url: /wiki/File:Widok_z_Trzech_Koron_w_Pieninach,_20231014_1446_2508.jpg
              - img [ref=e1769]
            - link "Dunajec river" [ref=e1771] [cursor=pointer]:
              - /url: /wiki/Dunajec
          - paragraph [ref=e1772]:
            - text: Most of the rivers arise in the Slovak mountains. Some only pass through Slovakia, while others make a natural border with surrounding countries (more than 620 kilometres [390 mi]). For example, the
            - link "Dunajec" [ref=e1773] [cursor=pointer]:
              - /url: /wiki/Dunajec
            - text: (17 kilometres [11 mi]) to the north, the
            - link "Danube" [ref=e1774] [cursor=pointer]:
              - /url: /wiki/Danube_River
            - text: (172 kilometres [107 mi]) to the south or the
            - link "Morava" [ref=e1775] [cursor=pointer]:
              - /url: /wiki/Morava_(river)
            - text: (119 kilometres [74 mi]) to the West. The total length of the rivers on Slovak territory is 49,774 kilometres (30,928 mi).
          - paragraph [ref=e1776]:
            - text: The longest river in Slovakia is the
            - link "Váh" [ref=e1777] [cursor=pointer]:
              - /url: /wiki/V%C3%A1h
            - text: (403 kilometres [250 mi]), the shortest is the Čierna voda. Other important and large rivers are the
            - link "Myjava" [ref=e1778] [cursor=pointer]:
              - /url: /wiki/Myjava_(river)
            - text: ", the"
            - link "Nitra" [ref=e1779] [cursor=pointer]:
              - /url: /wiki/Nitra_(river)
            - text: (197 kilometres [122 mi]), the
            - link "Orava" [ref=e1780] [cursor=pointer]:
              - /url: /wiki/Orava_(river)
            - text: ", the"
            - link "Hron" [ref=e1781] [cursor=pointer]:
              - /url: /wiki/Hron
            - text: (298 kilometres [185 mi]), the
            - link "Hornád" [ref=e1782] [cursor=pointer]:
              - /url: /wiki/Horn%C3%A1d
            - text: (193 kilometres [120 mi]), the
            - link "Slaná" [ref=e1783] [cursor=pointer]:
              - /url: /wiki/Slan%C3%A1_river
            - text: (110 kilometres [68 mi]), the
            - link "Ipeľ" [ref=e1784] [cursor=pointer]:
              - /url: /wiki/Ipe%C4%BE
            - text: (232 kilometres [144 mi], forming the border with Hungary), the
            - link "Bodrog" [ref=e1785] [cursor=pointer]:
              - /url: /wiki/Bodrog
            - text: ", the"
            - link "Laborec" [ref=e1786] [cursor=pointer]:
              - /url: /wiki/Laborec
            - text: ", the"
            - link "Latorica" [ref=e1787] [cursor=pointer]:
              - /url: /wiki/Latorica
            - text: and the
            - link "Ondava" [ref=e1788] [cursor=pointer]:
              - /url: /wiki/Ondava
            - text: .
          - paragraph [ref=e1789]:
            - text: The biggest volume of discharge in Slovak rivers is during
            - link "spring" [ref=e1790] [cursor=pointer]:
              - /url: /wiki/Spring_(season)
            - text: ", when the snow melts from the mountains. The only exception is the Danube, whose discharge is the greatest during summer when the snow melts in the"
            - link "Alps" [ref=e1791] [cursor=pointer]:
              - /url: /wiki/Alps
            - text: . The Danube is the largest river that flows through Slovakia.
            - superscript [ref=e1792]:
              - link "[158]" [ref=e1793] [cursor=pointer]:
                - /url: "#cite_note-161"
          - heading "Climate" [level=3] [ref=e1795]
          - generic [ref=e1797]:
            - generic [ref=e1798]:
              - link [ref=e1802] [cursor=pointer]:
                - /url: /wiki/File:1._m%C3%A1j_Hlavn%C3%A1_ulica_Pre%C5%A1ov_23_Slovakia_38.jpg
                - img [ref=e1803]
              - link [ref=e1807] [cursor=pointer]:
                - /url: /wiki/File:CulHer14Slovakia328.JPG
                - img [ref=e1808]
            - generic [ref=e1809]:
              - link [ref=e1813] [cursor=pointer]:
                - /url: /wiki/File:DanielovDomVysok%C3%A9Tatry15Slovakia31.JPG
                - img [ref=e1814]
              - link [ref=e1818] [cursor=pointer]:
                - /url: /wiki/File:Bansk%C3%A1_%C5%A0tiavnica_im_Herbst.JPG
                - img [ref=e1819]
            - generic [ref=e1821]:
              - text: "Four seasons in Slovakia: spring in"
              - link "Prešov" [ref=e1822] [cursor=pointer]:
                - /url: /wiki/Pre%C5%A1ov
              - text: ", summer in"
              - link "Spišské Podhradie" [ref=e1823] [cursor=pointer]:
                - /url: /wiki/Spi%C5%A1sk%C3%A9_Podhradie
              - text: ", autumn in"
              - link "High Tatras" [ref=e1824] [cursor=pointer]:
                - /url: /wiki/High_Tatras
              - text: ", winter in"
              - link "Banská Štiavnica" [ref=e1825] [cursor=pointer]:
                - /url: /wiki/Bansk%C3%A1_%C5%A0tiavnica
              - text: (the town is a
              - link "UNESCO World Heritage Site" [ref=e1826] [cursor=pointer]:
                - /url: /wiki/UNESCO_World_Heritage_Site
              - text: )
          - paragraph [ref=e1827]:
            - text: The Slovak climate lies between the temperate and
            - link "continental climate" [ref=e1828] [cursor=pointer]:
              - /url: /wiki/Continental_climate
            - text: zones with relatively warm
            - link "summers" [ref=e1829] [cursor=pointer]:
              - /url: /wiki/Summer
            - text: and cold, cloudy and humid
            - link "winters" [ref=e1830] [cursor=pointer]:
              - /url: /wiki/Winter
            - text: . Temperature extremes are between −41 and 40.3 °C (−41.8 and 104.5 °F) although temperatures below −30 °C (−22 °F) are rare. The weather differs from the mountainous north to the plains in the south.
          - paragraph [ref=e1831]:
            - text: The warmest region is
            - link "Bratislava" [ref=e1832] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: and Southern Slovakia where the temperatures may reach 30 °C (86 °F) in summer, occasionally to 39 °C (102 °F) in
            - link "Hurbanovo" [ref=e1833] [cursor=pointer]:
              - /url: /wiki/Hurbanovo
            - text: . During night, the temperatures drop to 20 °C (68 °F). The daily temperatures in winter average in the range of −5 °C (23 °F) to 10 °C (50 °F). During night it may be freezing, but usually not below −10 °C (14 °F).
          - paragraph [ref=e1834]:
            - text: In Slovakia, there are four
            - link "seasons" [ref=e1835] [cursor=pointer]:
              - /url: /wiki/Season
            - text: ", each season ("
            - link "spring" [ref=e1836] [cursor=pointer]:
              - /url: /wiki/Spring_(season)
            - text: ", summer,"
            - link "autumn" [ref=e1837] [cursor=pointer]:
              - /url: /wiki/Autumn
            - text: and winter) lasts three months. The dry continental air brings in the summer heat and winter frosts. In contrast, oceanic air brings rainfalls and reduces summer temperatures. In the lowlands and valleys, there is often fog, especially in winter.
          - paragraph [ref=e1838]: Spring starts with 21 March and is characterised by colder weather with an average daily temperature of 9 °C (48 °F) in the first weeks and about 14 °C (57 °F) in May and 17 °C (63 °F) in June. In Slovakia, the weather and climate in the spring are very unstable.
          - paragraph [ref=e1839]: Summer starts on 22 June and is usually characterised by hot weather with daily temperatures exceeding 30 °C (86 °F). July is the warmest month with temperatures up to about 37 to 40 °C (99 to 104 °F), especially in regions of southern Slovakia. Showers or thunderstorms may occur because of the summer monsoon called Medardova kvapka (Medard drop – 40 days of rain). Summer in Northern Slovakia is usually mild with temperatures around 25 °C (77 °F) (less in the mountains).
          - paragraph [ref=e1840]:
            - text: Autumn in Slovakia starts on 23 September and is mostly characterised by wet weather and wind, although the first weeks can be very warm and sunny. The average temperature in September is around 14 °C (57 °F), in November to 3 °C (37 °F). Late September and early October is a dry and sunny time of year (so-called
            - link "Indian summer" [ref=e1841] [cursor=pointer]:
              - /url: /wiki/Indian_summer
            - text: ).
          - paragraph [ref=e1842]:
            - text: Winter starts on 21 December with temperatures around −5 to −10 °C (23 to 14 °F). In December and January, it is usually snowing, these are the coldest months of the year. At lower altitudes, snow does not stay the whole winter, it changes into the thaw and frost. Winters are colder in the mountains, where the snow usually lasts until March or April and the night temperatures fall to −20 °C (−4 °F) and colder.
            - superscript [ref=e1843]:
              - link "[159]" [ref=e1844] [cursor=pointer]:
                - /url: "#cite_note-162"
          - heading "Biodiversity" [level=3] [ref=e1846]
          - figure "Rupicapra rupicapra tatrica in the Tatra Mountains" [ref=e1847]:
            - link [ref=e1848] [cursor=pointer]:
              - /url: /wiki/File:Vysok%C3%A9_Tatry,_Dolina_Bielej_vody,_cestou_od_Zelen%C3%A9ho_plesa_na_Jah%C5%88ac%C3%AD_%C5%A1t%C3%ADt_(32).JPG
              - img [ref=e1849]
            - generic [ref=e1850]:
              - link "Rupicapra rupicapra tatrica" [ref=e1852] [cursor=pointer]:
                - /url: /wiki/Rupicapra_rupicapra_tatrica
              - text: in the
              - link "Tatra Mountains" [ref=e1853] [cursor=pointer]:
                - /url: /wiki/Tatra_Mountains
          - paragraph [ref=e1854]:
            - text: Slovakia signed the Rio
            - link "Convention on Biological Diversity" [ref=e1855] [cursor=pointer]:
              - /url: /wiki/Convention_on_Biological_Diversity
            - text: on 19 May 1993, and became a party to the convention on 25 August 1994.
            - superscript [ref=e1856]:
              - link "[160]" [ref=e1857] [cursor=pointer]:
                - /url: "#cite_note-163"
            - text: It has subsequently produced a
            - link "National Biodiversity Strategy and Action Plan" [ref=e1858] [cursor=pointer]:
              - /url: /wiki/Biodiversity_action_plan
            - text: ", which was received by the convention on 2 November 1998."
            - superscript [ref=e1859]:
              - link "[161]" [ref=e1860] [cursor=pointer]:
                - /url: "#cite_note-164"
          - paragraph [ref=e1861]:
            - text: The biodiversity of Slovakia comprises
            - link "animals" [ref=e1862] [cursor=pointer]:
              - /url: /wiki/Animal
            - text: (such as annelids, arthropods, molluscs, nematodes and vertebrates),
            - link "fungi" [ref=e1863] [cursor=pointer]:
              - /url: /wiki/Fungi
            - text: (
            - link "Ascomycota" [ref=e1864] [cursor=pointer]:
              - /url: /wiki/Ascomycota
            - text: ","
            - link "Basidiomycota" [ref=e1865] [cursor=pointer]:
              - /url: /wiki/Basidiomycota
            - text: ","
            - link "Chytridiomycota" [ref=e1866] [cursor=pointer]:
              - /url: /wiki/Chytridiomycota
            - text: ","
            - link "Glomeromycota" [ref=e1867] [cursor=pointer]:
              - /url: /wiki/Glomeromycota
            - text: and
            - link "Zygomycota" [ref=e1868] [cursor=pointer]:
              - /url: /wiki/Zygomycota
            - text: ), micro-organisms (including
            - link "Mycetozoa" [ref=e1869] [cursor=pointer]:
              - /url: /wiki/Mycetozoa
            - text: ), and
            - link "plants" [ref=e1870] [cursor=pointer]:
              - /url: /wiki/Plant
            - text: . The geographical position of Slovakia determines the richness of the diversity of fauna and flora. More than 11,000 plant species have been described throughout its territory, nearly 29,000 animal species and over 1,000 species of protozoa.
            - link "Endemic" [ref=e1871] [cursor=pointer]:
              - /url: /wiki/Endemism
            - text: biodiversity is also common.
            - superscript [ref=e1872]:
              - link "[162]" [ref=e1873] [cursor=pointer]:
                - /url: "#cite_note-geography.upol.cz-165"
          - figure "Belianske Tatras" [ref=e1874]:
            - link [ref=e1875] [cursor=pointer]:
              - /url: /wiki/File:Belianske_Tatry.jpg
              - img [ref=e1876]
            - link "Belianske Tatras" [ref=e1878] [cursor=pointer]:
              - /url: /wiki/Belianske_Tatras
          - paragraph [ref=e1879]:
            - text: Slovakia is located in the biome of
            - link "temperate broadleaf and mixed forests" [ref=e1880] [cursor=pointer]:
              - /url: /wiki/Temperate_broadleaf_and_mixed_forest
            - text: and terrestrial ecoregions of
            - link "Pannonian mixed forests" [ref=e1881] [cursor=pointer]:
              - /url: /wiki/Pannonian_mixed_forests
            - text: and
            - link "Carpathian montane conifer forests" [ref=e1882] [cursor=pointer]:
              - /url: /wiki/Carpathian_montane_conifer_forests
            - text: .
            - superscript [ref=e1883]:
              - link "[163]" [ref=e1884] [cursor=pointer]:
                - /url: "#cite_note-DinersteinOlson2017-166"
            - text: As the altitude changes, the vegetation associations and animal communities are forming height levels (
            - link "oak" [ref=e1885] [cursor=pointer]:
              - /url: /wiki/Oak
            - text: ","
            - link "beech" [ref=e1886] [cursor=pointer]:
              - /url: /wiki/Beech
            - text: ","
            - link "spruce" [ref=e1887] [cursor=pointer]:
              - /url: /wiki/Spruce
            - text: ","
            - link "scrub pine" [ref=e1888] [cursor=pointer]:
              - /url: /wiki/Scrub_pine
            - text: ","
            - link "alpine meadows" [ref=e1889] [cursor=pointer]:
              - /url: /wiki/Alpine_meadows
            - text: and
            - link "subsoil" [ref=e1890] [cursor=pointer]:
              - /url: /wiki/Subsoil
            - text: ). Forests cover 44% of the territory of Slovakia.
            - superscript [ref=e1891]:
              - link "[164]" [ref=e1892] [cursor=pointer]:
                - /url: "#cite_note-167"
            - text: The country had a 2019
            - link "Forest Landscape Integrity Index" [ref=e1893] [cursor=pointer]:
              - /url: /wiki/Forest_Landscape_Integrity_Index
            - text: mean score of 4.34/10, ranking it 129th globally out of 172 countries.
            - superscript [ref=e1894]:
              - link "[165]" [ref=e1895] [cursor=pointer]:
                - /url: "#cite_note-FLII-Supplementary-168"
            - text: In terms of forest stands, 60% are
            - link "broadleaf trees" [ref=e1896] [cursor=pointer]:
              - /url: /wiki/Broadleaf_trees
            - text: and 40% are
            - link "coniferous trees" [ref=e1897] [cursor=pointer]:
              - /url: /wiki/Coniferous_trees
            - text: . The occurrence of animal species is strongly connected to the appropriate types of plant associations and biotopes.
            - superscript [ref=e1898]:
              - link "[162]" [ref=e1899] [cursor=pointer]:
                - /url: "#cite_note-geography.upol.cz-165"
          - paragraph [ref=e1900]:
            - text: Over 4,000 species of fungi have been recorded from Slovakia.
            - superscript [ref=e1901]:
              - link "[166]" [ref=e1902] [cursor=pointer]:
                - /url: "#cite_note-169"
            - superscript [ref=e1903]:
              - link "[167]" [ref=e1904] [cursor=pointer]:
                - /url: "#cite_note-170"
            - text: Of these, nearly 1,500 are
            - link "lichen" [ref=e1905] [cursor=pointer]:
              - /url: /wiki/Lichen
            - text: "-forming species."
            - superscript [ref=e1906]:
              - link "[168]" [ref=e1907] [cursor=pointer]:
                - /url: "#cite_note-171"
            - text: Some of these fungi are undoubtedly endemic, but not enough is known to say how many. Of the lichen-forming species, about 40% have been classified as threatened in some way. About 7% are apparently extinct, 9% endangered, 17% vulnerable, and 7% rare. The conservation status of non-lichen-forming fungi in Slovakia is not well documented, but there is a red list for its larger fungi.
            - superscript [ref=e1908]:
              - link "[169]" [ref=e1909] [cursor=pointer]:
                - /url: "#cite_note-172"
          - heading "Water" [level=3] [ref=e1911]
          - figure "Mountain lake Štrbské pleso" [ref=e1912]:
            - link [ref=e1913] [cursor=pointer]:
              - /url: /wiki/File:Mountain_lake_(Unsplash).jpg
              - img [ref=e1914]
            - generic [ref=e1915]:
              - text: Mountain lake
              - link "Štrbské pleso" [ref=e1916] [cursor=pointer]:
                - /url: /wiki/%C5%A0trbsk%C3%A9_pleso
          - paragraph [ref=e1917]:
            - text: The entire population of Slovakia has access to a safe-drinking water source.
            - superscript [ref=e1918]:
              - link "[170]" [ref=e1919] [cursor=pointer]:
                - /url: "#cite_note-173"
            - text: The country has one of the best quality tap water in the world, it is the second country in Europe (after
            - link "Austria" [ref=e1920] [cursor=pointer]:
              - /url: /wiki/Austria
            - text: ) with the largest reserves of drinking water. Groundwater is the drinking water source of the highest quality protected by
            - link "Constitution of Slovakia" [ref=e1921] [cursor=pointer]:
              - /url: /wiki/Constitution_of_Slovakia
            - text: . Since 2014, it is banned the export of
            - link "drinking" [ref=e1922] [cursor=pointer]:
              - /url: /wiki/Drinking_water
            - text: and
            - link "mineral waters" [ref=e1923] [cursor=pointer]:
              - /url: /wiki/Mineral_water
            - text: in pipelines and water tanks. The ban excludes bottled water and water for personal use. Both, groundwater (82.2%) as well as surface water (17.8%) are exploited as drinking water sources.
            - link "Žitný ostrov" [ref=e1924] [cursor=pointer]:
              - /url: /wiki/%C5%BDitn%C3%BD_ostrov
            - text: is the biggest natural groundwater source in Slovakia and as well in Central Europe.
            - superscript [ref=e1925]:
              - link "[171]" [ref=e1926] [cursor=pointer]:
                - /url: "#cite_note-174"
          - paragraph [ref=e1927]:
            - text: About 1300 mineral sources are registered, providing curative water and high quality
            - link "mineral water" [ref=e1928] [cursor=pointer]:
              - /url: /wiki/Mineral_water
            - text: for drinking. There are 21 thermal
            - link "spa towns" [ref=e1929] [cursor=pointer]:
              - /url: /wiki/Spa_town
            - text: built on these mineral springs. The most visited are
            - link "Piešťany" [ref=e1930] [cursor=pointer]:
              - /url: /wiki/Pie%C5%A1%C5%A5any
            - text: ","
            - link "Trenčianske Teplice" [ref=e1931] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8Dianske_Teplice
            - text: ","
            - link "Bardejov" [ref=e1932] [cursor=pointer]:
              - /url: /wiki/Bardejov
            - text: and
            - link "Dudince" [ref=e1933] [cursor=pointer]:
              - /url: /wiki/Dudince
            - text: .
          - heading "Government and politics" [level=2] [ref=e1935]
          - note [ref=e1936]:
