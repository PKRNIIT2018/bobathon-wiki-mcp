          - figure "Population density in Slovakia. The two biggest cities are clearly visible, Bratislava in the far west and Košice in the east." [ref=e3064]:
            - link [ref=e3065] [cursor=pointer]:
              - /url: /wiki/File:Population_density_in_Slovakia.png
              - img [ref=e3066]
            - generic [ref=e3067]: Population density in Slovakia. The two biggest cities are clearly visible, Bratislava in the far west and Košice in the east.
          - paragraph [ref=e3068]:
            - text: The population is over 5.4 million and consists mostly of
            - link "Slovaks" [ref=e3069] [cursor=pointer]:
              - /url: /wiki/Slovaks
            - text: . The average population density is 110 inhabitants per km
            - superscript [ref=e3070]: "2"
            - text: .
            - superscript [ref=e3071]:
              - link "[241]" [ref=e3072] [cursor=pointer]:
                - /url: "#cite_note-244"
            - text: According to the 2021 census, the majority of the inhabitants of Slovakia are
            - link "Slovaks" [ref=e3073] [cursor=pointer]:
              - /url: /wiki/Slovaks
            - text: (83.8%).
            - link "Hungarians" [ref=e3074] [cursor=pointer]:
              - /url: /wiki/Hungarians_in_Slovakia
            - text: are the largest
            - link "ethnic minority" [ref=e3075] [cursor=pointer]:
              - /url: /wiki/Minority_group
            - text: (7.8%). Other
            - link "ethnic groups" [ref=e3076] [cursor=pointer]:
              - /url: /wiki/Ethnic_group
            - text: include
            - link "Roma" [ref=e3077] [cursor=pointer]:
              - /url: /wiki/Romani_people
            - text: (1.2%),
            - superscript [ref=e3078]:
              - link "[242]" [ref=e3079] [cursor=pointer]:
                - /url: "#cite_note-245"
            - link "Czechs" [ref=e3080] [cursor=pointer]:
              - /url: /wiki/Czechs
            - text: (0.5%),
            - link "Rusyns" [ref=e3081] [cursor=pointer]:
              - /url: /wiki/Rusyns
            - text: (0.4%) and others (1.9) or unspecified (5.4%).
            - superscript [ref=e3082]:
              - link "[243]" [ref=e3083] [cursor=pointer]:
                - /url: "#cite_note-246"
          - paragraph [ref=e3084]:
            - text: In 2024, the
            - link "median age" [ref=e3085] [cursor=pointer]:
              - /url: /wiki/Median_age
            - text: of the Slovak population was 42.8 years.
            - superscript [ref=e3086]:
              - link "[244]" [ref=e3087] [cursor=pointer]:
                - /url: "#cite_note-247"
          - paragraph [ref=e3088]:
            - text: The largest waves of Slovak emigration occurred in the 19th and early 20th centuries. In the 1990 US census, 1.8 million people self-identified as having Slovak ancestry.
            - superscript [ref=e3089]:
              - link "[245]" [ref=e3090] [cursor=pointer]:
                - /url: "#cite_note-248"
            - superscript [ref=e3091]:
              - text: "["
              - link "needs update" [ref=e3093] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Manual_of_Style/Dates_and_numbers#Chronological_items
              - text: "]"
          - paragraph [ref=e3094]:
            - text: In the 2024 Global Hunger Index, Slovakia is one of 22 countries with a GHI score of less than 5.
            - superscript [ref=e3095]:
              - link "[246]" [ref=e3096] [cursor=pointer]:
                - /url: "#cite_note-249"
          - heading "Languages" [level=3] [ref=e3098]
          - note [ref=e3099]:
            - text: "Main article:"
            - link "Slovak language" [ref=e3100] [cursor=pointer]:
              - /url: /wiki/Slovak_language
          - note [ref=e3101]:
            - text: "See also:"
            - link "History of the Slovak language" [ref=e3102] [cursor=pointer]:
              - /url: /wiki/History_of_the_Slovak_language
          - figure "The Slovak alphabet has 46 letters, of which 3 are digraphs and 18 contain diacritics." [ref=e3103]:
            - link [ref=e3104] [cursor=pointer]:
              - /url: /wiki/File:Slovak_alphabet.png
              - img [ref=e3105]
            - generic [ref=e3106]:
              - text: The
              - link "Slovak alphabet" [ref=e3107] [cursor=pointer]:
                - /url: /wiki/Slovak_alphabet
              - text: has 46 letters, of which 3 are
              - link "digraphs" [ref=e3108] [cursor=pointer]:
                - /url: /wiki/Digraph_(orthography)
              - text: and 18 contain
              - link "diacritics" [ref=e3109] [cursor=pointer]:
                - /url: /wiki/Diacritic
              - text: .
          - paragraph [ref=e3110]:
            - text: The
            - link "official language" [ref=e3111] [cursor=pointer]:
              - /url: /wiki/Official_language
            - text: is
            - link "Slovak" [ref=e3112] [cursor=pointer]:
              - /url: /wiki/Slovak_language
            - text: ", a member of the"
            - link "Slavic language family" [ref=e3113] [cursor=pointer]:
              - /url: /wiki/Slavic_languages
            - text: .
            - link "Hungarian" [ref=e3114] [cursor=pointer]:
              - /url: /wiki/Hungarian_language
            - text: is widely spoken in the southern regions, and
            - link "Rusyn" [ref=e3115] [cursor=pointer]:
              - /url: /wiki/Rusyn_language
            - text: is used in some parts of the Northeast.
            - link "Minority languages" [ref=e3116] [cursor=pointer]:
              - /url: /wiki/Minority_language
            - text: hold co-official status in the municipalities in which the size of the minority population meets the legal threshold of 15% in two consecutive censuses.
            - superscript [ref=e3117]:
              - link "[247]" [ref=e3118] [cursor=pointer]:
                - /url: "#cite_note-250"
          - paragraph [ref=e3119]:
            - text: Slovakia is ranked among the top EU countries regarding the knowledge of foreign languages. In 2007, 68% of the population aged from 25 to 64 years claimed to speak two or more foreign languages, finishing second highest in the European Union. The best known foreign language in Slovakia is
            - link "Czech" [ref=e3120] [cursor=pointer]:
              - /url: /wiki/Czech_language
            - text: .
            - link "Eurostat" [ref=e3121] [cursor=pointer]:
              - /url: /wiki/Eurostat
            - text: report also shows that 98.3% of Slovak students in the upper secondary education take on two foreign languages, ranking highly over the average 60.1% in the European Union.
            - superscript [ref=e3122]:
              - link "[248]" [ref=e3123] [cursor=pointer]:
                - /url: "#cite_note-251"
            - text: According to a
            - link "Eurobarometer" [ref=e3124] [cursor=pointer]:
              - /url: /wiki/Eurobarometer
            - text: survey from 2012, 26% of the population have knowledge of English at a conversational level, followed by German (22%) and Russian (17%).
            - superscript [ref=e3125]:
              - link "[249]" [ref=e3126] [cursor=pointer]:
                - /url: "#cite_note-252"
          - paragraph [ref=e3127]:
            - text: The deaf community uses the
            - link "Slovak Sign Language" [ref=e3128] [cursor=pointer]:
              - /url: /wiki/Slovak_Sign_Language
            - text: .
          - heading "Religion" [level=3] [ref=e3130]
          - note [ref=e3131]:
            - text: "Main article:"
            - link "Religion in Slovakia" [ref=e3132] [cursor=pointer]:
              - /url: /wiki/Religion_in_Slovakia
          - generic [ref=e3134]:
            - generic [ref=e3136]:
              - link [ref=e3139] [cursor=pointer]:
                - /url: /wiki/File:Levo%C4%8Da_(2).jpg
                - img [ref=e3140]
              - generic [ref=e3141]:
                - text: Basilica of St. James in
                - link "Levoča" [ref=e3142] [cursor=pointer]:
                  - /url: /wiki/Levo%C4%8Da
            - generic [ref=e3144]:
              - link [ref=e3147] [cursor=pointer]:
                - /url: /wiki/File:D%C3%B3m_sv%C3%A4tej_Al%C5%BEbety_a_Kaplnka_sv._Michala,_Ko%C5%A1ice,_Slovensko.jpg
                - img [ref=e3148]
              - generic [ref=e3149]:
                - link "St. Elisabeth Cathedral" [ref=e3150] [cursor=pointer]:
                  - /url: /wiki/St._Elisabeth_Cathedral
                - text: in Košice, the largest church in Slovakia
          - paragraph [ref=e3151]:
            - text: The
            - link "Slovak constitution" [ref=e3152] [cursor=pointer]:
              - /url: /wiki/Constitution_of_Slovakia
            - text: guarantees
            - link "freedom of religion" [ref=e3153] [cursor=pointer]:
              - /url: /wiki/Freedom_of_religion
            - text: . In 2021, 55.8% of population identified themselves as
            - link "Catholics" [ref=e3154] [cursor=pointer]:
              - /url: /wiki/Catholic_Church_in_Slovakia
            - text: (
            - link "Latin Church" [ref=e3155] [cursor=pointer]:
              - /url: /wiki/Latin_Church
            - text: ), 5.3% as
            - link "Lutherans" [ref=e3156] [cursor=pointer]:
              - /url: /wiki/Evangelical_Church_of_the_Augsburg_Confession_in_Slovakia
            - text: ", 1.6% as"
            - link "Calvinists" [ref=e3157] [cursor=pointer]:
              - /url: /wiki/Reformed_Christian_Church_in_Slovakia
            - text: ", 4% as"
            - link "Greek Catholics" [ref=e3158] [cursor=pointer]:
              - /url: /wiki/Slovak_Greek_Catholic_Church
            - text: ", 0.9% as"
            - link "Orthodox" [ref=e3159] [cursor=pointer]:
              - /url: /wiki/Orthodox_Church_of_the_Czech_Lands_and_Slovakia
            - text: ", 23.8% identified themselves as"
            - link "atheists" [ref=e3160] [cursor=pointer]:
              - /url: /wiki/Atheism
            - text: or non-religious, and 6.5% did not answer the question about their belief.
            - superscript [ref=e3161]:
              - link "[250]" [ref=e3162] [cursor=pointer]:
                - /url: "#cite_note-253"
            - text: In 2004, about one third of the church members regularly attended church services.
            - superscript [ref=e3163]:
              - link "[251]" [ref=e3164] [cursor=pointer]:
                - /url: "#cite_note-254"
            - text: The
            - link "Slovak Greek Catholic Church" [ref=e3165] [cursor=pointer]:
              - /url: /wiki/Slovak_Greek_Catholic_Church
            - text: is an Eastern rite
            - link "sui iuris" [ref=e3166] [cursor=pointer]:
              - /url: /wiki/Sui_iuris
            - text: Catholic Church. Before World War II, an estimated 90,000 Jews lived in Slovakia (1.6% of the population), but most were murdered during the
            - link "Holocaust" [ref=e3167] [cursor=pointer]:
              - /url: /wiki/Holocaust
            - text: . After further reductions due to postwar
            - link "emigration" [ref=e3168] [cursor=pointer]:
              - /url: /wiki/Aliyah
            - text: and assimilation, only about 2,300 Jews remain today (0.04% of the population).
            - superscript [ref=e3169]:
              - link "[252]" [ref=e3170] [cursor=pointer]:
                - /url: "#cite_note-255"
          - paragraph [ref=e3171]:
            - text: There are 18 state-registered religions in Slovakia, of which 16 are Christian, one is Jewish, and one is the
            - link "Baháʼí Faith" [ref=e3172] [cursor=pointer]:
              - /url: /wiki/Bah%C3%A1%CA%BC%C3%AD_Faith
            - text: .
            - superscript [ref=e3173]:
              - link "[253]" [ref=e3174] [cursor=pointer]:
                - /url: "#cite_note-Hukelova-256"
            - text: In 2016, a two-thirds majority of the Slovak parliament passed a new bill that would obstruct
            - link "Islam" [ref=e3175] [cursor=pointer]:
              - /url: /wiki/Islam
            - text: and other religious organisations from becoming state-recognised religions by doubling the minimum followers threshold from 25,000 to 50,000; however, Slovakia's then-president
            - link "Andrej Kiska" [ref=e3176] [cursor=pointer]:
              - /url: /wiki/Andrej_Kiska
            - text: vetoed the bill.
            - superscript [ref=e3177]:
              - link "[253]" [ref=e3178] [cursor=pointer]:
                - /url: "#cite_note-Hukelova-256"
            - text: In 2010, there were an estimated 5,000
            - link "Muslims" [ref=e3179] [cursor=pointer]:
              - /url: /wiki/Islam_in_Slovakia
            - text: in Slovakia representing less than 0.1% of the country's population.
            - superscript [ref=e3180]:
              - link "[254]" [ref=e3181] [cursor=pointer]:
                - /url: "#cite_note-257"
            - text: Slovakia is the only member state of the European Union to not have any
            - link "mosques" [ref=e3182] [cursor=pointer]:
              - /url: /wiki/Mosque
            - text: .
            - superscript [ref=e3183]:
              - link "[255]" [ref=e3184] [cursor=pointer]:
                - /url: "#cite_note-258"
          - heading "Education" [level=3] [ref=e3186]
          - note [ref=e3187]:
            - text: "Main article:"
            - link "Education in Slovakia" [ref=e3188] [cursor=pointer]:
              - /url: /wiki/Education_in_Slovakia
          - figure "Comenius University headquarters in Bratislava" [ref=e3189]:
            - link [ref=e3190] [cursor=pointer]:
              - /url: /wiki/File:Univerzita_Komensk%C3%A9ho.jpg
              - img [ref=e3191]
            - generic [ref=e3192]:
              - link "Comenius University" [ref=e3193] [cursor=pointer]:
                - /url: /wiki/Comenius_University_in_Bratislava
              - text: headquarters in
              - link "Bratislava" [ref=e3194] [cursor=pointer]:
                - /url: /wiki/Bratislava
          - paragraph [ref=e3195]: Education in Slovakia is compulsory from age 6 to 16. Primary school in Slovakia lasts for nine years, which is divided into two parts, the first stage (age 6–10) and the second stage (age 10–15), which is finished by taking nationwide testing called Monitor (in Slovak language and math).
          - paragraph [ref=e3196]:
            - text: For most students, secondary education (high school) lasts four years, from ages 15 to 19. This is the typical length for students who complete the full nine years of primary school and then enroll in a secondary school. High school is finished by school-leaving exam called Maturita, or Maturitná skúška. The
            - link "Programme for International Student Assessment" [ref=e3197] [cursor=pointer]:
              - /url: /wiki/Programme_for_International_Student_Assessment
            - text: ", coordinated by the"
            - link "OECD" [ref=e3198] [cursor=pointer]:
              - /url: /wiki/Organisation_for_Economic_Co-operation_and_Development
            - text: ", currently ranks"
            - link "Slovak secondary education" [ref=e3199] [cursor=pointer]:
              - /url: /wiki/Education_in_Slovakia
            - text: the 30th in the world (placing it just below the United States and just above Spain).
            - superscript [ref=e3200]:
              - link "[256]" [ref=e3201] [cursor=pointer]:
                - /url: "#cite_note-259"
          - paragraph [ref=e3202]:
            - text: After finishing high school, students can go to university. Slovakia has a wide range of universities. The biggest university is
            - link "Comenius University" [ref=e3203] [cursor=pointer]:
              - /url: /wiki/Comenius_University
            - text: ", established in 1919. Although it is not the first university ever established on Slovak territory, it is the oldest university that is still running. Most universities in Slovakia are public funded, where anyone can apply. Every citizen has a right to free education in public schools. The country has also several privately funded universities. Anyone can apply to any number of universities."
          - heading "Health" [level=3] [ref=e3205]
          - paragraph [ref=e3206]:
            - text: The Slovak healthcare system faces significant structural challenges characterized by a chronic shortage of medical professionals. According to the
            - link "European Observatory on Health Systems and Policies" [ref=e3207] [cursor=pointer]:
              - /url: /wiki/European_Observatory_on_Health_Systems_and_Policies
            - text: ", the technical state of many public hospitals requires extensive modernization to meet contemporary European standards."
            - superscript [ref=e3208]:
              - link "[257]" [ref=e3209] [cursor=pointer]:
                - /url: "#cite_note-260"
            - superscript [ref=e3210]:
              - link "[258]" [ref=e3211] [cursor=pointer]:
                - /url: "#cite_note-261"
            - text: The country continues to rank among the region's highest in per capita pure alcohol consumption. Behavioral risk factors, led by alcohol abuse, are associated with roughly 30% of total mortality.
            - superscript [ref=e3212]:
              - link "[259]" [ref=e3213] [cursor=pointer]:
                - /url: "#cite_note-262"
          - heading "Culture" [level=2] [ref=e3215]
          - note [ref=e3216]:
            - text: "Main article:"
            - link "Culture of Slovakia" [ref=e3217] [cursor=pointer]:
              - /url: /wiki/Culture_of_Slovakia
          - heading "Folk tradition" [level=3] [ref=e3219]
          - note [ref=e3220]:
            - text: "See also:"
            - link "Music of Slovakia" [ref=e3221] [cursor=pointer]:
              - /url: /wiki/Music_of_Slovakia
            - text: and
            - link "Architecture of Slovakia" [ref=e3222] [cursor=pointer]:
              - /url: /wiki/Architecture_of_Slovakia
          - figure "Wooden folk architecture can be seen in the well-preserved village of Vlkolínec, a UNESCO World Heritage Site." [ref=e3223]:
            - link [ref=e3224] [cursor=pointer]:
              - /url: /wiki/File:Vlkolinec_02.jpg
              - img [ref=e3225]
            - generic [ref=e3226]:
              - text: Wooden folk architecture can be seen in the well-preserved village of
              - link "Vlkolínec" [ref=e3227] [cursor=pointer]:
                - /url: /wiki/Vlkol%C3%ADnec
              - text: ", a"
              - link "UNESCO World Heritage Site" [ref=e3228] [cursor=pointer]:
                - /url: /wiki/UNESCO_World_Heritage_Site
              - text: .
          - paragraph [ref=e3229]:
            - link "Folk tradition" [ref=e3230] [cursor=pointer]:
              - /url: /wiki/Folk_tradition
            - text: has rooted strongly in Slovakia and is reflected in literature, music, dance and architecture. The prime example is the Slovak national anthem,
            - generic [ref=e3231]:
              - text: "\""
              - link "Nad Tatrou sa blýska" [ref=e3232] [cursor=pointer]:
                - /url: /wiki/Nad_Tatrou_sa_bl%C3%BDska
              - text: "\""
            - text: ", which is based on a melody from the"
            - generic [ref=e3233]:
              - text: "\""
              - link "Kopala studienku" [ref=e3234] [cursor=pointer]:
                - /url: /wiki/Kopala_studienku
              - text: "\""
            - text: folk song.
          - paragraph [ref=e3235]:
            - text: The manifestation of Slovak folklore culture is the "Východná" Folklore Festival. It is the oldest and largest nationwide festival with international participation,
            - superscript [ref=e3236]:
              - link "[260]" [ref=e3237] [cursor=pointer]:
                - /url: "#cite_note-263"
            - text: which takes place in
            - link "Východná" [ref=e3238] [cursor=pointer]:
              - /url: /wiki/V%C3%BDchodn%C3%A1
            - text: annually. Slovakia is usually represented by many groups but mainly by SĽUK (Slovenský ľudový umelecký kolektív—Slovak folk art collective). SĽUK is the largest Slovak folk art group, trying to preserve the folklore tradition.
          - paragraph [ref=e3239]:
            - text: An example of wooden folk architecture in Slovakia can be seen in the well-preserved village of
            - link "Vlkolínec" [ref=e3240] [cursor=pointer]:
              - /url: /wiki/Vlkol%C3%ADnec
            - text: which has been the
            - link "UNESCO World Heritage Site" [ref=e3241] [cursor=pointer]:
              - /url: /wiki/UNESCO_World_Heritage_Site
            - text: since 1993.
            - superscript [ref=e3242]:
              - link "[261]" [ref=e3243] [cursor=pointer]:
                - /url: "#cite_note-264"
            - text: The
            - link "Prešov Region" [ref=e3244] [cursor=pointer]:
              - /url: /wiki/Pre%C5%A1ov_Region
            - text: preserves the world's most remarkable folk wooden churches. Most of them are protected by Slovak law as
            - link "cultural heritage" [ref=e3245] [cursor=pointer]:
              - /url: /wiki/Cultural_heritage
            - text: ", but some of them are on the"
            - link "UNESCO" [ref=e3246] [cursor=pointer]:
              - /url: /wiki/UNESCO
            - text: list too, in Bodružal, Hervartov, Ladomirová and Ruská Bystrá.
          - paragraph [ref=e3247]:
            - text: The best known Slovak hero, found in many folk
            - link "mythologies" [ref=e3248] [cursor=pointer]:
              - /url: /wiki/Mythologies
            - text: ", is"
            - link "Juraj Jánošík" [ref=e3249] [cursor=pointer]:
              - /url: /wiki/Juraj_J%C3%A1no%C5%A1%C3%ADk
            - text: (1688–1713) (the Slovak equivalent of
            - link "Robin Hood" [ref=e3250] [cursor=pointer]:
              - /url: /wiki/Robin_Hood
            - text: ). The legend says he was taking from the rich and giving to the poor. Jánošík's life was depicted in a list of literary works and many movies throughout the 20th century. One of the most popular is a film Jánošík directed by
            - link "Martin Frič" [ref=e3251] [cursor=pointer]:
              - /url: /wiki/Martin_Fri%C4%8D
            - text: in 1935.
            - superscript [ref=e3252]:
              - link "[262]" [ref=e3253] [cursor=pointer]:
                - /url: "#cite_note-265"
            - text: He is commemorated mainly in
            - link "Terchová" [ref=e3254] [cursor=pointer]:
              - /url: /wiki/Terchov%C3%A1
            - text: ", his family's place of living."
          - heading "Art" [level=3] [ref=e3256]
          - figure "Main altar in the Basilica of St. James, crafted by Master Paul of Levoča, 1517. It is the tallest wooden altar in the world" [ref=e3257]:
            - link [ref=e3258] [cursor=pointer]:
              - /url: /wiki/File:St._James,_Levo%C4%8Da,_Main_altar,_2017_v2.jpg
              - img [ref=e3259]
            - generic [ref=e3260]:
              - text: Main altar in the Basilica of St. James, crafted by
              - link "Master Paul of Levoča" [ref=e3261] [cursor=pointer]:
                - /url: /wiki/Master_Paul_of_Levo%C4%8Da
              - text: ", 1517. It is the tallest wooden altar in the world"
          - paragraph [ref=e3262]:
            - link "Visual art" [ref=e3263] [cursor=pointer]:
              - /url: /wiki/Visual_art
            - text: in Slovakia is represented through
            - link "painting" [ref=e3264] [cursor=pointer]:
              - /url: /wiki/Painting
            - text: ","
            - link "drawing" [ref=e3265] [cursor=pointer]:
              - /url: /wiki/Drawing
            - text: ","
            - link "printmaking" [ref=e3266] [cursor=pointer]:
              - /url: /wiki/Printmaking
            - text: ","
            - link "illustration" [ref=e3267] [cursor=pointer]:
              - /url: /wiki/Illustration
            - text: ","
            - link "arts and crafts" [ref=e3268] [cursor=pointer]:
              - /url: /wiki/Handicraft
            - text: ","
            - link "sculpture" [ref=e3269] [cursor=pointer]:
              - /url: /wiki/Sculpture
            - text: ","
            - link "photography" [ref=e3270] [cursor=pointer]:
              - /url: /wiki/Photography
            - text: or
            - link "conceptual art" [ref=e3271] [cursor=pointer]:
              - /url: /wiki/Conceptual_art
            - text: . The
            - link "Slovak National Gallery" [ref=e3272] [cursor=pointer]:
              - /url: /wiki/Slovak_National_Gallery
            - text: founded in 1948, is the biggest network of galleries in Slovakia. Two displays in Bratislava are situated in
            - link "Esterházy Palace" [ref=e3273] [cursor=pointer]:
              - /url: /wiki/Esterh%C3%A1zy_Palace_(Bratislava)
            - text: (Esterházyho palác) and the Water Barracks (Vodné kasárne), adjacent one to another. They are located on the Danube riverfront in the Old Town.
            - superscript [ref=e3274]:
              - link "[263]" [ref=e3275] [cursor=pointer]:
                - /url: "#cite_note-266"
            - superscript [ref=e3276]:
              - link "[264]" [ref=e3277] [cursor=pointer]:
                - /url: "#cite_note-267"
          - paragraph [ref=e3278]:
            - text: The
            - link "Bratislava City Gallery" [ref=e3279] [cursor=pointer]:
              - /url: /wiki/Bratislava_City_Gallery
            - text: ", founded in 1961 is the second biggest Slovak gallery of its kind. It stores about 35,000 pieces of Slovak international art and offers permanent displays in"
            - link "Pálffy Palace" [ref=e3280] [cursor=pointer]:
              - /url: /wiki/Johann_P%C3%A1lffy_Palace
            - text: and
            - link "Mirbach Palace" [ref=e3281] [cursor=pointer]:
              - /url: /wiki/Mirbach_Palace
            - text: ", located in the Old Town. Danubiana Art Museum, one of the youngest art museums in Europe, is situated near"
            - link "Čunovo" [ref=e3282] [cursor=pointer]:
              - /url: /wiki/%C4%8Cunovo
            - text: waterworks (part of
            - link "Gabčíkovo Waterworks" [ref=e3283] [cursor=pointer]:
              - /url: /wiki/Gab%C4%8D%C3%ADkovo_-_Nagymaros_Dams
            - text: "). Other major galleries include:"
            - link "Andy Warhol Museum of Modern Art" [ref=e3284] [cursor=pointer]:
              - /url: /wiki/Andy_Warhol_Museum_of_Modern_Art
            - text: (Warhol's parents were from
            - link "Miková" [ref=e3285] [cursor=pointer]:
              - /url: /wiki/Mikov%C3%A1
            - text: ),
            - link "East Slovak Gallery" [ref=e3286] [cursor=pointer]:
              - /url: /wiki/East_Slovak_Gallery
            - text: ","
            - link "Ernest Zmeták Art Gallery" [ref=e3287] [cursor=pointer]:
              - /url: /wiki/Ernest_Zmet%C3%A1k_Art_Gallery
            - text: ","
            - link "Zvolen Castle" [ref=e3288] [cursor=pointer]:
              - /url: /wiki/Zvolen_Castle
            - text: .
          - heading "Literature" [level=3] [ref=e3290]
          - note [ref=e3291]:
            - text: "Further information:"
            - link "Slovak literature" [ref=e3292] [cursor=pointer]:
              - /url: /wiki/Slovak_literature
          - note [ref=e3293]:
            - text: "See also:"
            - link "List of Slovak authors" [ref=e3294] [cursor=pointer]:
              - /url: /wiki/List_of_Slovak_authors
          - figure "Ľudovít Štúr codified the Slovak standard language." [ref=e3295]:
            - link [ref=e3296] [cursor=pointer]:
              - /url: /wiki/File:Bozetech_Klemens_Stur.jpg
              - img [ref=e3297]
            - generic [ref=e3298]:
              - link "Ľudovít Štúr" [ref=e3299] [cursor=pointer]:
                - /url: /wiki/%C4%BDudov%C3%ADt_%C5%A0t%C3%BAr
              - text: codified the Slovak standard language.
          - paragraph [ref=e3300]:
            - text: Christian topics include poem
            - link "Proglas" [ref=e3301] [cursor=pointer]:
              - /url: /wiki/Proglas
            - text: as a foreword to the four
            - link "Gospels" [ref=e3302] [cursor=pointer]:
              - /url: /wiki/Gospel
            - text: ", partial translations of the Bible into"
            - link "Old Church Slavonic" [ref=e3303] [cursor=pointer]:
              - /url: /wiki/Old_Church_Slavonic
            - text: ", Zakon sudnyj ljudem."
          - paragraph [ref=e3304]:
            - link "Medieval literature" [ref=e3305] [cursor=pointer]:
              - /url: /wiki/Medieval_literature
            - text: ", in the period from the 11th to the 15th centuries, was written in"
            - link "Latin" [ref=e3306] [cursor=pointer]:
              - /url: /wiki/Latin
            - text: ", Czech and Slovakised Czech. Lyric (prayers, songs and formulas) was still controlled by the Church, while epic was concentrated on legends. Authors from this period include"
            - link "Johannes de Thurocz" [ref=e3307] [cursor=pointer]:
              - /url: /wiki/Johannes_de_Thurocz
            - text: ", author of the"
            - link "Chronica Hungarorum" [ref=e3308] [cursor=pointer]:
              - /url: /wiki/Chronica_Hungarorum
            - text: and Maurus, both of them Hungarians.
            - superscript [ref=e3309]:
              - link "[265]" [ref=e3310] [cursor=pointer]:
                - /url: "#cite_note-Phillips-268"
            - text: The worldly literature also emerged and chronicles were written in this period.
          - paragraph [ref=e3311]:
            - text: Two leading persons codified Slovak. The first was
            - link "Anton Bernolák" [ref=e3312] [cursor=pointer]:
              - /url: /wiki/Anton_Bernol%C3%A1k
            - text: ", whose concept was based on the western Slovak"
            - link "dialect" [ref=e3313] [cursor=pointer]:
              - /url: /wiki/Dialect
            - text: in 1787. It was the codification of the first-ever literary language of Slovaks. The second was
            - link "Ľudovít Štúr" [ref=e3314] [cursor=pointer]:
              - /url: /wiki/%C4%BDudov%C3%ADt_%C5%A0t%C3%BAr
            - text: ", whose formation of the Slovak took principles from the central Slovak dialect in 1843."
          - paragraph [ref=e3315]:
            - text: Slovakia is also known for its polyhistors, of whom include
            - link "Pavol Jozef Šafárik" [ref=e3316] [cursor=pointer]:
              - /url: /wiki/Pavel_Jozef_%C5%A0af%C3%A1rik
            - text: ","
            - link "Matej Bel" [ref=e3317] [cursor=pointer]:
              - /url: /wiki/Matthias_Bel
            - text: ","
            - link "Ján Kollár" [ref=e3318] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Koll%C3%A1r
            - text: ", and its political revolutionaries and reformists, such"
            - link "Milan Rastislav Štefánik" [ref=e3319] [cursor=pointer]:
              - /url: /wiki/Milan_Rastislav_%C5%A0tef%C3%A1nik
            - text: and
            - link "Alexander Dubček" [ref=e3320] [cursor=pointer]:
              - /url: /wiki/Alexander_Dub%C4%8Dek
            - text: .
          - heading "Cuisine" [level=3] [ref=e3322]
          - note [ref=e3323]:
            - text: "Main article:"
            - link "Slovak cuisine" [ref=e3324] [cursor=pointer]:
              - /url: /wiki/Slovak_cuisine
          - note [ref=e3325]:
            - text: "See also:"
            - link "Slovak wine" [ref=e3326] [cursor=pointer]:
              - /url: /wiki/Slovak_wine
            - text: and
            - link "Beer in Slovakia" [ref=e3327] [cursor=pointer]:
              - /url: /wiki/Beer_in_Slovakia
          - figure "Bryndzové halušky, one of the national dishes in Slovakia" [ref=e3328]:
            - link [ref=e3329] [cursor=pointer]:
              - /url: /wiki/File:Star%C3%A1_Bystrica,_Brynzov%C3%A9_halu%C5%A1ky.jpg
              - img [ref=e3330]
            - generic [ref=e3331]:
              - link "Bryndzové halušky" [ref=e3332] [cursor=pointer]:
                - /url: /wiki/Bryndzov%C3%A9_halu%C5%A1ky
              - text: ", one of the"
              - link "national dishes" [ref=e3333] [cursor=pointer]:
                - /url: /wiki/National_dish
              - text: in Slovakia
          - paragraph [ref=e3334]:
            - text: Traditional Slovak cuisine is based mainly on
            - link "pork" [ref=e3335] [cursor=pointer]:
              - /url: /wiki/Pork
            - text: ","
            - link "poultry" [ref=e3336] [cursor=pointer]:
              - /url: /wiki/Poultry
            - text: (
            - link "chicken" [ref=e3337] [cursor=pointer]:
              - /url: /wiki/Chicken
            - text: is the most widely eaten, followed by
            - link "duck" [ref=e3338] [cursor=pointer]:
              - /url: /wiki/Duck
            - text: ","
            - link "goose" [ref=e3339] [cursor=pointer]:
              - /url: /wiki/Goose
            - text: ", and"
            - link "turkey" [ref=e3340] [cursor=pointer]:
              - /url: /wiki/Turkey_as_food
            - text: ),
            - link "flour" [ref=e3341] [cursor=pointer]:
              - /url: /wiki/Flour
            - text: ","
            - link "potatoes" [ref=e3342] [cursor=pointer]:
              - /url: /wiki/Potato
            - text: ","
            - link "cabbage" [ref=e3343] [cursor=pointer]:
              - /url: /wiki/Cabbage
            - text: ", and"
            - link "milk products" [ref=e3344] [cursor=pointer]:
              - /url: /wiki/Milk_products
            - text: . It is relatively closely related to
            - link "Hungarian" [ref=e3345] [cursor=pointer]:
              - /url: /wiki/Hungarian_cuisine
            - text: ","
            - link "Czech" [ref=e3346] [cursor=pointer]:
              - /url: /wiki/Czech_cuisine
            - text: ","
            - link "Polish" [ref=e3347] [cursor=pointer]:
              - /url: /wiki/Polish_cuisine
            - text: and
            - link "Austrian cuisine" [ref=e3348] [cursor=pointer]:
              - /url: /wiki/Austrian_cuisine
            - text: . On the east it is also influenced by
            - link "Ukrainian" [ref=e3349] [cursor=pointer]:
              - /url: /wiki/Ukrainian_cuisine
            - text: ", including"
            - link "Lemko" [ref=e3350] [cursor=pointer]:
              - /url: /wiki/Lemkos
            - text: and
            - link "Rusyn" [ref=e3351] [cursor=pointer]:
              - /url: /wiki/Rusyns
            - text: . In comparison with other European countries,
            - link "\"game meat\"" [ref=e3352] [cursor=pointer]:
              - /url: /wiki/Game_(hunting)
            - text: is more accessible in Slovakia due to vast resources of forest and because hunting is relatively popular.
            - superscript [ref=e3353]:
              - link "[266]" [ref=e3354] [cursor=pointer]:
                - /url: "#cite_note-EuropeNations2000-269"
            - link "Boar" [ref=e3355] [cursor=pointer]:
              - /url: /wiki/Boar
            - text: ","
            - link "rabbit" [ref=e3356] [cursor=pointer]:
              - /url: /wiki/Rabbit
            - text: ", and"
            - link "venison" [ref=e3357] [cursor=pointer]:
              - /url: /wiki/Venison
            - text: are generally available throughout the year.
            - link "Lamb" [ref=e3358] [cursor=pointer]:
              - /url: /wiki/Sheep
            - text: and
            - link "goat" [ref=e3359] [cursor=pointer]:
              - /url: /wiki/Goat
            - text: are eaten but are not widely popular.
            - superscript [ref=e3360]:
              - text: "["
              - link "citation needed" [ref=e3362] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e3363]:
            - text: The traditional Slovak meals are
            - generic "Slovak-language text" [ref=e3364]:
              - link "bryndzové halušky" [ref=e3366] [cursor=pointer]:
                - /url: /wiki/Bryndzov%C3%A9_halu%C5%A1ky
            - text: ", bryndzové pirohy and other meals with potato dough and"
            - link "bryndza" [ref=e3367] [cursor=pointer]:
              - /url: /wiki/Bryndza
            - text: . Bryndza is a salty cheese made of sheep milk, characterised by a strong taste and aroma. Bryndzové halušky especially is considered a national dish, and is very commonly found on the menu of traditional Slovak restaurants.
          - paragraph [ref=e3368]:
            - text: A typical soup is a
            - link "sauerkraut" [ref=e3369] [cursor=pointer]:
              - /url: /wiki/Sauerkraut
            - text: soup ("kapustnica"). A
            - link "blood sausage" [ref=e3370] [cursor=pointer]:
              - /url: /wiki/Black_pudding
            - text: called "krvavnica", made from any parts of a butchered pig, is also a specific Slovak meal.
          - paragraph [ref=e3371]:
            - text: Wine is enjoyed throughout Slovakia.
            - link "Slovak wine" [ref=e3372] [cursor=pointer]:
              - /url: /wiki/Slovak_wine
            - text: comes predominantly from the southern areas along the Danube and its tributaries; the northern half of the country is too cold and mountainous to grow grapevines. Traditionally, white wine was more popular than red or rosé (except in some regions), and
            - link "sweet wine" [ref=e3373] [cursor=pointer]:
              - /url: /wiki/Sweetness_of_wine
            - text: more popular than dry; however, in recent years tastes seem to be changing.
            - superscript [ref=e3374]:
              - link "[267]" [ref=e3375] [cursor=pointer]:
                - /url: "#cite_note-270"
            - text: Beer (mainly of the
            - link "pilsener" [ref=e3376] [cursor=pointer]:
              - /url: /wiki/Pilsener
            - text: style, though
            - link "dark lagers" [ref=e3377] [cursor=pointer]:
              - /url: /wiki/Dunkel
            - text: are also consumed) is also popular.
          - heading "Sport" [level=3] [ref=e3379]
          - note [ref=e3380]:
            - text: "Main article:"
            - link "Sport in Slovakia" [ref=e3381] [cursor=pointer]:
              - /url: /wiki/Sport_in_Slovakia
          - paragraph [ref=e3382]:
            - text: Sporting activities are practised widely in Slovakia, many of them on a professional level.
            - link "Ice hockey" [ref=e3383] [cursor=pointer]:
              - /url: /wiki/Ice_hockey
            - text: and
            - link "football" [ref=e3384] [cursor=pointer]:
              - /url: /wiki/Association_football
            - text: have traditionally been regarded as the most popular sports in Slovakia, though
            - link "tennis" [ref=e3385] [cursor=pointer]:
              - /url: /wiki/Tennis
            - text: ","
            - link "handball" [ref=e3386] [cursor=pointer]:
              - /url: /wiki/Handball
            - text: ","
            - link "basketball" [ref=e3387] [cursor=pointer]:
              - /url: /wiki/Basketball
            - text: ","
            - link "volleyball" [ref=e3388] [cursor=pointer]:
              - /url: /wiki/Volleyball
            - text: ","
            - link "whitewater slalom" [ref=e3389] [cursor=pointer]:
              - /url: /wiki/Whitewater_slalom
            - text: ","
            - link "cycling" [ref=e3390] [cursor=pointer]:
              - /url: /wiki/Cycle_sport
            - text: ","
            - link "alpine skiing" [ref=e3391] [cursor=pointer]:
              - /url: /wiki/Alpine_skiing
            - text: ","
            - link "biathlon" [ref=e3392] [cursor=pointer]:
              - /url: /wiki/Biathlon
            - text: and
            - link "athletics" [ref=e3393] [cursor=pointer]:
              - /url: /wiki/Sport_of_athletics
            - text: are also popular.
            - superscript [ref=e3394]:
              - text: "["
              - link "citation needed" [ref=e3396] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - figure "The Slovak national ice hockey team celebrating a victory against Sweden at the 2010 Winter Olympics" [ref=e3397]:
            - link [ref=e3398] [cursor=pointer]:
              - /url: /wiki/File:Slovakia2010WinterOlympicscelebration2.jpg
              - img [ref=e3399]
            - generic [ref=e3400]:
              - text: The
              - link "Slovak national ice hockey team" [ref=e3401] [cursor=pointer]:
                - /url: /wiki/Slovakia_men%27s_national_ice_hockey_team
              - text: celebrating a victory against
              - link "Sweden" [ref=e3402] [cursor=pointer]:
                - /url: /wiki/Swedish_national_men%27s_ice_hockey_team
              - text: at the
              - link "2010 Winter Olympics" [ref=e3403] [cursor=pointer]:
                - /url: /wiki/2010_Winter_Olympics
          - paragraph [ref=e3404]:
            - text: One of the most popular team sports in Slovakia is
            - link "ice hockey" [ref=e3405] [cursor=pointer]:
              - /url: /wiki/Ice_hockey
            - text: . Slovakia became a member of the
            - link "IIHF" [ref=e3406] [cursor=pointer]:
              - /url: /wiki/IIHF
            - text: on 2 February 1993.
            - superscript [ref=e3407]:
              - link "[268]" [ref=e3408] [cursor=pointer]:
                - /url: "#cite_note-271"
            - text: Since then, the team has won four medals in
            - link "Ice Hockey World Championships" [ref=e3409] [cursor=pointer]:
              - /url: /wiki/Ice_Hockey_World_Championships
            - text: ", consisting of one gold, two silver and a bronze. The most recent success was a silver medal at the"
            - link "2012 IIHF World Championship" [ref=e3410] [cursor=pointer]:
              - /url: /wiki/2012_IIHF_World_Championship
            - text: in
            - link "Helsinki" [ref=e3411] [cursor=pointer]:
              - /url: /wiki/Helsinki
            - text: . The Slovak national hockey team made eight appearances in the
            - link "Olympic games" [ref=e3412] [cursor=pointer]:
              - /url: /wiki/Slovakia_men%27s_national_ice_hockey_team
            - text: ", finishing fourth in the"
            - link "2010 Winter Olympics" [ref=e3413] [cursor=pointer]:
              - /url: /wiki/2010_Winter_Olympics
            - text: in
            - link "Vancouver" [ref=e3414] [cursor=pointer]:
              - /url: /wiki/Vancouver
            - text: and third with bronze medal at the
            - link "2022 Winter Olympics" [ref=e3415] [cursor=pointer]:
              - /url: /wiki/2022_Winter_Olympics
            - text: in
            - link "Beijing" [ref=e3416] [cursor=pointer]:
              - /url: /wiki/Beijing
            - text: . The country has 8,280 registered players and is ranked seventh in the
            - link "IIHF World Ranking" [ref=e3417] [cursor=pointer]:
              - /url: /wiki/IIHF_World_Ranking
            - text: at present. The Slovak hockey teams
            - link "HC Slovan Bratislava" [ref=e3418] [cursor=pointer]:
              - /url: /wiki/HC_Slovan_Bratislava
            - text: and
            - link "HC Lev Poprad" [ref=e3419] [cursor=pointer]:
              - /url: /wiki/HC_Lev_Poprad
            - text: participated in the
            - link "Kontinental Hockey League" [ref=e3420] [cursor=pointer]:
              - /url: /wiki/Kontinental_Hockey_League
            - text: .
            - superscript [ref=e3421]:
              - link "[269]" [ref=e3422] [cursor=pointer]:
                - /url: "#cite_note-272"
          - paragraph [ref=e3423]:
            - text: Slovakia hosted the
            - link "2011 IIHF World Championship" [ref=e3424] [cursor=pointer]:
              - /url: /wiki/2011_IIHF_World_Championship
            - text: ", where"
            - link "Finland" [ref=e3425] [cursor=pointer]:
              - /url: /wiki/Finland_men%27s_national_ice_hockey_team
            - text: won the gold medal and
            - link "2019 IIHF World Championship" [ref=e3426] [cursor=pointer]:
              - /url: /wiki/2019_IIHF_World_Championship
            - text: ", where"
            - link "Finland" [ref=e3427] [cursor=pointer]:
              - /url: /wiki/Finland_men%27s_national_ice_hockey_team
            - text: also won the gold medal. Both competitions took place in
            - link "Bratislava" [ref=e3428] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: and
            - link "Košice" [ref=e3429] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: .
            - superscript [ref=e3430]:
              - link "[270]" [ref=e3431] [cursor=pointer]:
                - /url: "#cite_note-273"
          - figure "National football stadium in Bratislava" [ref=e3432]:
            - link [ref=e3433] [cursor=pointer]:
              - /url: /wiki/File:Slovakia_bratislava_N%C3%A1rodn%C3%BD_futbalov%C3%BD_%C5%A1tadi%C3%B3n.jpg
              - img [ref=e3434]
            - generic [ref=e3435]:
              - link "National football stadium" [ref=e3436] [cursor=pointer]:
                - /url: /wiki/Teheln%C3%A9_pole
              - text: in Bratislava
          - paragraph [ref=e3437]:
            - text: Football is the most popular sport in Slovakia, with over 400,000 registered players. Since 1993, the
            - link "Slovak national football team" [ref=e3438] [cursor=pointer]:
              - /url: /wiki/Slovak_national_football_team
            - text: has qualified for the
            - link "FIFA World Cup" [ref=e3439] [cursor=pointer]:
              - /url: /wiki/FIFA_World_Cup
            - text: once, in
            - link "2010" [ref=e3440] [cursor=pointer]:
              - /url: /wiki/2010_FIFA_World_Cup
            - text: . They progressed to the last 16, where they were defeated by the
            - link "Netherlands" [ref=e3441] [cursor=pointer]:
              - /url: /wiki/Netherlands_national_football_team
            - text: . The most notable result was the 3–2 victory over
            - link "Italy" [ref=e3442] [cursor=pointer]:
              - /url: /wiki/Italy_national_football_team
            - text: . In 2016, the
            - link "Slovak national football team" [ref=e3443] [cursor=pointer]:
              - /url: /wiki/Slovak_national_football_team
            - text: qualified for the
            - link "UEFA Euro 2016" [ref=e3444] [cursor=pointer]:
              - /url: /wiki/UEFA_Euro_2016
            - text: tournament, under head coach
            - link "Ján Kozák" [ref=e3445] [cursor=pointer]:
              - /url: /wiki/J%C3%A1n_Koz%C3%A1k_(footballer,_born_1954)
            - text: . This helped the team reach its best-ever position of 14th in the
            - link "FIFA World Rankings" [ref=e3446] [cursor=pointer]:
              - /url: /wiki/FIFA_World_Rankings
            - text: .
            - superscript [ref=e3447]:
              - text: "["
              - link "citation needed" [ref=e3449] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
          - paragraph [ref=e3450]:
            - text: In club competitions, only three teams have qualified for the
            - link "UEFA Champions League" [ref=e3451] [cursor=pointer]:
              - /url: /wiki/UEFA_Champions_League
            - text: Group Stage, namely
            - link "MFK Košice" [ref=e3452] [cursor=pointer]:
              - /url: /wiki/MFK_Ko%C5%A1ice
            - text: in
            - link "1997–98" [ref=e3453] [cursor=pointer]:
              - /url: /wiki/1997%E2%80%9398_UEFA_Champions_League
            - text: ","
            - link "FC Artmedia Bratislava" [ref=e3454] [cursor=pointer]:
              - /url: /wiki/FC_Artmedia_Bratislava
            - text: in
            - link "2005–06 season" [ref=e3455] [cursor=pointer]:
              - /url: /wiki/2005%E2%80%9306_UEFA_Champions_League
            - text: ", and"
            - link "MŠK Žilina" [ref=e3456] [cursor=pointer]:
              - /url: /wiki/M%C5%A0K_%C5%BDilina
            - text: in
            - link "2010–11" [ref=e3457] [cursor=pointer]:
              - /url: /wiki/2010%E2%80%9311_UEFA_Champions_League
            - text: . FC Artmedia Bratislava has been the most successful team, finishing third at the Group Stage of the
            - link "UEFA Cup" [ref=e3458] [cursor=pointer]:
              - /url: /wiki/2005%E2%80%9306_UEFA_Cup
            - text: ", therefore qualifying for the knockout stage. They remain the only Slovak club that has won a match at the group stage."
            - superscript [ref=e3459]:
              - text: "["
              - link "citation needed" [ref=e3461] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citation_needed
              - text: "]"
