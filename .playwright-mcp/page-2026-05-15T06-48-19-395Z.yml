          - heading "Economy" [level=2] [ref=e2416]
          - note [ref=e2417]:
            - text: "Main article:"
            - link "Economy of Slovakia" [ref=e2418] [cursor=pointer]:
              - /url: /wiki/Economy_of_Slovakia
          - note [ref=e2419]:
            - text: "See also:"
            - link "Slovak euro coins" [ref=e2420] [cursor=pointer]:
              - /url: /wiki/Slovak_euro_coins
          - figure "National Bank of Slovakia in Bratislava" [ref=e2421]:
            - link [ref=e2422] [cursor=pointer]:
              - /url: /wiki/File:Nbs.jpg
              - img [ref=e2423]
            - generic [ref=e2424]:
              - link "National Bank of Slovakia" [ref=e2425] [cursor=pointer]:
                - /url: /wiki/National_Bank_of_Slovakia
              - text: in Bratislava
          - paragraph [ref=e2426]:
            - text: Slovakia has a
            - link "high-income" [ref=e2427] [cursor=pointer]:
              - /url: /wiki/High-income_country
            - link "developed economy" [ref=e2428] [cursor=pointer]:
              - /url: /wiki/Developed_economies
            - text: . In 2026, with a population of only 5 million, it ranked as the
            - link "47th richest country" [ref=e2429] [cursor=pointer]:
              - /url: /wiki/List_of_countries_by_GDP_(PPP)_per_capita
            - text: with a
            - link "per capita gross domestic product" [ref=e2430] [cursor=pointer]:
              - /url: /wiki/Per_capita_GDP
            - text: based on
            - link "purchasing power parity" [ref=e2431] [cursor=pointer]:
              - /url: /wiki/Purchasing_power_parity
            - text: of $49,376,
            - superscript [ref=e2432]:
              - link "[191]" [ref=e2433] [cursor=pointer]:
                - /url: "#cite_note-194"
            - text: and the
            - link "58th largest economy in the World" [ref=e2434] [cursor=pointer]:
              - /url: /wiki/List_of_countries_by_GDP_(nominal)
            - text: with a GDP of $167,730 billion.
            - superscript [ref=e2435]:
              - link "[192]" [ref=e2436] [cursor=pointer]:
                - /url: "#cite_note-195"
            - text: Its GDP per capita equalling 74% of the average of the European Union in 2023.
            - superscript [ref=e2437]:
              - link "[193]" [ref=e2438] [cursor=pointer]:
                - /url: "#cite_note-rich-196"
            - text: Major
            - link "privatisations" [ref=e2439] [cursor=pointer]:
              - /url: /wiki/Privatisation
            - text: are completed, the banking sector is almost completely in private hands, and foreign investment has risen.
          - paragraph [ref=e2440]:
            - text: In 2024, more than 80% of Slovak exports went to the
            - link "European Union" [ref=e2441] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: ", and more than 65% of Slovak imports came from other European Union member states."
            - superscript [ref=e2442]:
              - link "[194]" [ref=e2443] [cursor=pointer]:
                - /url: "#cite_note-197"
            - superscript [ref=e2444]:
              - link "[177]" [ref=e2445] [cursor=pointer]:
                - /url: "#cite_note-Statistical_Office_of_the_Slovak_Republic-2024-180"
            - text: Main export partners are Germany (23% of total exports), Czech Republic (12.4%), Poland (8.3%) and Austria (5.7%).
          - paragraph [ref=e2446]:
            - text: The country has difficulties addressing regional imbalances in wealth and employment.
            - superscript [ref=e2447]:
              - link "[195]" [ref=e2448] [cursor=pointer]:
                - /url: "#cite_note-198"
            - text: GDP per capita ranges from 188% of EU average in Bratislava to 54% in Eastern Slovakia.
            - superscript [ref=e2449]:
              - link "[196]" [ref=e2450] [cursor=pointer]:
                - /url: "#cite_note-199"
            - text: Bratislava is the 19th-richest region of the
            - link "European Union" [ref=e2451] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: by GDP (
            - link "PPP" [ref=e2452] [cursor=pointer]:
              - /url: /wiki/Purchasing_power_parity
            - text: ) per capita.
            - superscript [ref=e2453]:
              - link "[197]" [ref=e2454] [cursor=pointer]:
                - /url: "#cite_note-200"
            - text: Although regional income inequality is high,
            - link "90% of citizens own their homes" [ref=e2455] [cursor=pointer]:
              - /url: /wiki/List_of_countries_by_home_ownership_rate
            - text: . The
            - link "housing affordability" [ref=e2456] [cursor=pointer]:
              - /url: /wiki/Affordable_housing
            - text: is low, with one of the highest housing related expenditure relative to
            - link "household final consumption expenditure" [ref=e2457] [cursor=pointer]:
              - /url: /wiki/Household_final_consumption_expenditure
            - text: in OECD.
            - superscript [ref=e2458]:
              - link "[198]" [ref=e2459] [cursor=pointer]:
                - /url: "#cite_note-b201-201"
          - figure "Slovakia is part of the Schengen Area, the EU single market, and since 2009, the eurozone (dark blue)." [ref=e2460]:
            - link [ref=e2461] [cursor=pointer]:
              - /url: /wiki/File:Eurozone.svg
              - img [ref=e2462]
            - generic [ref=e2463]:
              - text: Slovakia is part of the
              - link "Schengen Area" [ref=e2464] [cursor=pointer]:
                - /url: /wiki/Schengen_Area
              - text: ", the EU single market, and since 2009, the"
              - link "eurozone" [ref=e2465] [cursor=pointer]:
                - /url: /wiki/Eurozone
              - text: (dark blue).
          - paragraph [ref=e2466]:
            - text: The country used to be dubbed the
            - generic [ref=e2467]:
              - text: "\""
              - link "Tatra Tiger" [ref=e2468] [cursor=pointer]:
                - /url: /wiki/Tatra_Tiger
              - text: "\""
            - text: in the 2000s as it successfully transformed from a centrally
            - link "planned economy" [ref=e2469] [cursor=pointer]:
              - /url: /wiki/Planned_economy
            - text: to a market-driven economy and achieved, on average, roughly 6% per capita GDP growth each year from 2000 to 2008.
            - superscript [ref=e2470]:
              - link "[102]" [ref=e2471] [cursor=pointer]:
                - /url: "#cite_note-Nicolae-Dragos-2015-105"
            - superscript [ref=e2472]:
              - link "[103]" [ref=e2473] [cursor=pointer]:
                - /url: "#cite_note-Akadémiai_Kiadó-106"
          - paragraph [ref=e2474]:
            - text: Unemployment, peaking at 19% at the end of 1999, decreased to 4.9% in 2019, lowest recorded rate in Slovak history.
            - superscript [ref=e2475]:
              - link "[199]" [ref=e2476] [cursor=pointer]:
                - /url: "#cite_note-202"
            - text: Unemployment rate was 5.3% as per June 2025.
            - superscript [ref=e2477]:
              - link "[200]" [ref=e2478] [cursor=pointer]:
                - /url: "#cite_note-203"
            - superscript [ref=e2479]:
              - link "[201]" [ref=e2480] [cursor=pointer]:
                - /url: "#cite_note-204"
          - paragraph [ref=e2481]:
            - text: The ratio of government debt to GDP in Slovakia reached 60.5% in 2024.
            - superscript [ref=e2482]:
              - link "[202]" [ref=e2483] [cursor=pointer]:
                - /url: "#cite_note-205"
          - paragraph [ref=e2484]:
            - text: A high dependence on global supply chains and energy imports makes the Slovak economy vulnerable to external shocks. As a consequence, the economy was hit hard by the global
            - link "COVID-19 pandemic" [ref=e2485] [cursor=pointer]:
              - /url: /wiki/COVID-19_pandemic
            - text: crisis (−3.3% decline in 2020), despite sizeable economic policy support. And after a strong recovery in 2021 (+4.8% growth), growth slowed down markedly in 2022 (+1.9%) and 2023 (+1.6%) as a result of the consequences of the
            - link "Russian invasion of Ukraine" [ref=e2486] [cursor=pointer]:
              - /url: /wiki/Russian_invasion_of_Ukraine
            - text: ", notably the subsequent"
            - link "EU sanctions on Russia" [ref=e2487] [cursor=pointer]:
              - /url: /wiki/International_sanctions_during_the_Russo-Ukrainian_War
            - text: and soaring energy prices.
          - figure "High-rise buildings in Bratislava's business districts" [ref=e2488]:
            - link [ref=e2489] [cursor=pointer]:
              - /url: /wiki/File:Sky_Park_Bratislava.jpg
              - img [ref=e2490]
            - generic [ref=e2491]: High-rise buildings in Bratislava's business districts
          - paragraph [ref=e2492]:
            - text: The Slovak government encourages foreign investment since it is one of the driving forces of the economy. Slovakia is an attractive country for
            - link "foreign investors" [ref=e2493] [cursor=pointer]:
              - /url: /wiki/Investment_(macroeconomics)
            - text: mainly because of its low wages, low tax rates, well educated
            - link "labour force" [ref=e2494] [cursor=pointer]:
              - /url: /wiki/Labour_force
            - text: ", favourable geographic location in the heart of Central Europe, strong political stability and good international relations reinforced by the country's accession to the European Union. Some regions, mostly at the east of Slovakia have failed to attract major investment, which has aggravated regional disparities in many economic and social areas."
          - paragraph [ref=e2495]:
            - text: Slovakia adopted the
            - link "euro" [ref=e2496] [cursor=pointer]:
              - /url: /wiki/Euro
            - text: currency on 1 January 2009 as the 16th member of the eurozone. The euro in Slovakia was approved by
            - link "the European commission" [ref=e2497] [cursor=pointer]:
              - /url: /wiki/European_Commission
            - text: on 7 May 2008. The
            - link "Slovak koruna" [ref=e2498] [cursor=pointer]:
              - /url: /wiki/Slovak_koruna
            - text: was revalued on 28 May 2008 to 30.126 for 1 euro, which was also the exchange rate for the euro.
            - superscript [ref=e2499]:
              - link "[203]" [ref=e2500] [cursor=pointer]:
                - /url: "#cite_note-206"
            - superscript [ref=e2501]:
              - link "[204]" [ref=e2502] [cursor=pointer]:
                - /url: "#cite_note-207"
          - paragraph [ref=e2503]:
            - text: Slovakia ranks 45th out of 190 economies in terms of ease of doing business, according to the
            - link "2020 World Bank Doing Business Report" [ref=e2504] [cursor=pointer]:
              - /url: /wiki/Ease_of_doing_business_index
            - text: and 59th out of the 67 countries and territories in terms of competitive economy, according to the
            - link "2024 World Competitiveness Yearbook Report" [ref=e2505] [cursor=pointer]:
              - /url: /wiki/World_Competitiveness_Yearbook
            - text: .
          - heading "Industry" [level=3] [ref=e2507]
          - note [ref=e2508]:
            - text: "See also:"
            - link "Automotive industry in Slovakia" [ref=e2509] [cursor=pointer]:
              - /url: /wiki/Automotive_industry_in_Slovakia
          - figure "Kia's car production plant in Žilina" [ref=e2510]:
            - link [ref=e2511] [cursor=pointer]:
              - /url: /wiki/File:Kia-factory-slovakia.jpg
              - img [ref=e2512]
            - generic [ref=e2513]:
              - link "Kia" [ref=e2514] [cursor=pointer]:
                - /url: /wiki/Kia
              - text: "'s car production plant in"
              - link "Žilina" [ref=e2515] [cursor=pointer]:
                - /url: /wiki/%C5%BDilina
          - paragraph [ref=e2516]:
            - text: Although Slovakia's GDP comes mainly from the tertiary (services) sector, the industrial sector also plays an important role within its economy. The main industry sectors are
            - link "car manufacturing" [ref=e2517] [cursor=pointer]:
              - /url: /wiki/Automotive_industry_in_Slovakia
            - text: and
            - link "electrical engineering" [ref=e2518] [cursor=pointer]:
              - /url: /wiki/Electrical_engineering
            - text: . Since 2007, Slovakia has been the world's largest producer of cars per capita,
            - superscript [ref=e2519]:
              - link "[205]" [ref=e2520] [cursor=pointer]:
                - /url: "#cite_note-Kia-208"
            - text: with a total of 1,080,000 cars manufactured in the country in 2023 alone.
            - superscript [ref=e2521]:
              - link "[18]" [ref=e2522] [cursor=pointer]:
                - /url: "#cite_note-spectator.sme.sk-21"
            - text: 275,000 people are employed directly and indirectly by the automotive industry.
            - superscript [ref=e2523]:
              - link "[206]" [ref=e2524] [cursor=pointer]:
                - /url: "#cite_note-sario.sk-209"
            - text: "There are currently four automobile assembly plants, with a fifth under construction:"
            - link "Volkswagen" [ref=e2525] [cursor=pointer]:
              - /url: /wiki/Volkswagen
            - text: "'s in"
            - link "Bratislava" [ref=e2526] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: "(models:"
            - link "Volkswagen Up" [ref=e2527] [cursor=pointer]:
              - /url: /wiki/Volkswagen_Up
            - text: ","
            - link "Volkswagen Touareg" [ref=e2528] [cursor=pointer]:
              - /url: /wiki/Volkswagen_Touareg
            - text: ","
            - link "Audi Q7" [ref=e2529] [cursor=pointer]:
              - /url: /wiki/Audi_Q7
            - text: ","
            - link "Audi Q8" [ref=e2530] [cursor=pointer]:
              - /url: /wiki/Audi_Q8
            - text: ","
            - link "Porsche Cayenne" [ref=e2531] [cursor=pointer]:
              - /url: /wiki/Porsche_Cayenne
            - text: ","
            - link "Lamborghini Urus" [ref=e2532] [cursor=pointer]:
              - /url: /wiki/Lamborghini_Urus
            - text: ),
            - link "PSA Peugeot Citroën" [ref=e2533] [cursor=pointer]:
              - /url: /wiki/PSA_Peugeot_Citro%C3%ABn
            - text: "'s in"
            - link "Trnava" [ref=e2534] [cursor=pointer]:
              - /url: /wiki/Trnava
            - text: "(models:"
            - link "Peugeot 208" [ref=e2535] [cursor=pointer]:
              - /url: /wiki/Peugeot_208
            - text: ","
            - link "Citroën C3 Picasso" [ref=e2536] [cursor=pointer]:
              - /url: /wiki/Citro%C3%ABn_C3_Picasso
            - text: ),
            - link "Kia Motors" [ref=e2537] [cursor=pointer]:
              - /url: /wiki/Kia_Motors
            - text: "'"
            - link "Žilina Plant" [ref=e2538] [cursor=pointer]:
              - /url: /wiki/Kia_Design_and_Manufacturing_Facilities#Žilina_Plant
            - text: "(models:"
            - link "Kia Cee'd" [ref=e2539] [cursor=pointer]:
              - /url: /wiki/Kia_Cee%27d
            - text: ","
            - link "Kia Sportage" [ref=e2540] [cursor=pointer]:
              - /url: /wiki/Kia_Sportage
            - text: ","
            - link "Kia Venga" [ref=e2541] [cursor=pointer]:
              - /url: /wiki/Kia_Venga
            - text: ) and
            - link "Jaguar Land Rover" [ref=e2542] [cursor=pointer]:
              - /url: /wiki/Jaguar_Land_Rover
            - text: "'s in"
            - link "Nitra" [ref=e2543] [cursor=pointer]:
              - /url: /wiki/Nitra
            - text: "(model:"
            - link "Land Rover Defender" [ref=e2544] [cursor=pointer]:
              - /url: /wiki/Land_Rover_Defender
            - text: ","
            - link "Land Rover Discovery" [ref=e2545] [cursor=pointer]:
              - /url: /wiki/Land_Rover_Discovery#Third_generation_(L462;_2017–present)
            - text: ).
            - link "Volvo" [ref=e2546] [cursor=pointer]:
              - /url: /wiki/Volvo
            - text: will make electric cars at a new plant at the east of Slovakia, construction began in 2023 in
            - link "Košice" [ref=e2547] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: ", with series production starting in 2027."
            - superscript [ref=e2548]:
              - link "[207]" [ref=e2549] [cursor=pointer]:
                - /url: "#cite_note-210"
            - link "Hyundai Mobis" [ref=e2550] [cursor=pointer]:
              - /url: /wiki/Hyundai_Mobis
            - text: in
            - link "Žilina" [ref=e2551] [cursor=pointer]:
              - /url: /wiki/%C5%BDilina
            - text: is the largest suppliers for the automotive industry in Slovakia.
            - superscript [ref=e2552]:
              - link "[208]" [ref=e2553] [cursor=pointer]:
                - /url: "#cite_note-etrend.sk-211"
          - paragraph [ref=e2554]:
            - link "U.S. Steel" [ref=e2555] [cursor=pointer]:
              - /url: /wiki/U._S._Steel_Ko%C5%A1ice
            - text: in
            - link "Košice" [ref=e2556] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: ", a branch of the American steel producer"
            - link "U.S. Steel" [ref=e2557] [cursor=pointer]:
              - /url: /wiki/U.S._Steel
            - text: ", is the largest employer in eastern Slovakia with 7,500 employees."
            - superscript [ref=e2558]:
              - link "[209]" [ref=e2559] [cursor=pointer]:
                - /url: "#cite_note-212"
          - paragraph [ref=e2560]:
            - link "ESET" [ref=e2561] [cursor=pointer]:
              - /url: /wiki/ESET
            - text: is an IT security company from Bratislava with more than 1,000
            - superscript [ref=e2562]:
              - link "[210]" [ref=e2563] [cursor=pointer]:
                - /url: "#cite_note-213"
            - text: employees worldwide at present. Their branch offices are in the United States, Ireland, United Kingdom, Argentina, the
            - link "Czech Republic" [ref=e2564] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: ","
            - link "Singapore" [ref=e2565] [cursor=pointer]:
              - /url: /wiki/Singapore
            - text: and Poland.
            - superscript [ref=e2566]:
              - link "[211]" [ref=e2567] [cursor=pointer]:
                - /url: "#cite_note-214"
            - text: In recent years,
            - link "service" [ref=e2568] [cursor=pointer]:
              - /url: /wiki/Tertiary_sector_of_the_economy
            - text: and
            - link "high-tech" [ref=e2569] [cursor=pointer]:
              - /url: /wiki/High_tech
            - text: "-oriented businesses have prospered in Bratislava. Many global companies, including"
            - link "IBM" [ref=e2570] [cursor=pointer]:
              - /url: /wiki/IBM
            - text: ","
            - link "Dell" [ref=e2571] [cursor=pointer]:
              - /url: /wiki/Dell
            - text: ","
            - link "Lenovo" [ref=e2572] [cursor=pointer]:
              - /url: /wiki/Lenovo
            - text: ","
            - link "AT&T" [ref=e2573] [cursor=pointer]:
              - /url: /wiki/AT%26T
            - text: ","
            - link "SAP" [ref=e2574] [cursor=pointer]:
              - /url: /wiki/SAP_AG
            - text: ", and"
            - link "Accenture" [ref=e2575] [cursor=pointer]:
              - /url: /wiki/Accenture
            - text: ", have built"
            - link "outsourcing" [ref=e2576] [cursor=pointer]:
              - /url: /wiki/Outsourcing
            - text: and service centres here.
            - superscript [ref=e2577]:
              - link "[212]" [ref=e2578] [cursor=pointer]:
                - /url: "#cite_note-215"
            - text: Reasons for the influx of
            - link "multi-national corporations" [ref=e2579] [cursor=pointer]:
              - /url: /wiki/Multinational_corporation
            - text: include proximity to Western Europe, skilled labour force and the high density of universities and research facilities.
            - superscript [ref=e2580]:
              - link "[213]" [ref=e2581] [cursor=pointer]:
                - /url: "#cite_note-216"
            - text: Other large companies and employers with headquarters in Bratislava include
            - link "Amazon" [ref=e2582] [cursor=pointer]:
              - /url: /wiki/Amazon_(company)
            - text: ","
            - link "Slovak Telekom" [ref=e2583] [cursor=pointer]:
              - /url: /wiki/Slovak_Telekom
            - text: ","
            - link "Orange Slovensko" [ref=e2584] [cursor=pointer]:
              - /url: /wiki/Orange_Slovensko
            - text: ","
            - link "Slovenská sporiteľňa" [ref=e2585] [cursor=pointer]:
              - /url: /wiki/Slovensk%C3%A1_sporite%C4%BE%C5%88a
            - text: ","
            - link "Tatra banka" [ref=e2586] [cursor=pointer]:
              - /url: /wiki/Tatra_banka
            - text: ","
            - link "Doprastav" [ref=e2587] [cursor=pointer]:
              - /url: /wiki/Doprastav
            - text: ","
            - link "Hewlett-Packard" [ref=e2588] [cursor=pointer]:
              - /url: /wiki/Hewlett-Packard
            - text: Slovakia,
            - link "Henkel" [ref=e2589] [cursor=pointer]:
              - /url: /wiki/Henkel
            - text: Slovensko,
            - link "Slovenský plynárenský priemysel" [ref=e2590] [cursor=pointer]:
              - /url: /wiki/Slovensk%C3%BD_plyn%C3%A1rensk%C3%BD_priemysel
            - text: ","
            - link "Microsoft" [ref=e2591] [cursor=pointer]:
              - /url: /wiki/Microsoft
            - text: Slovakia,
            - link "Mondelez Slovakia" [ref=e2592] [cursor=pointer]:
              - /url: /wiki/Mondelez_International
            - text: ","
            - link "Whirlpool Slovakia" [ref=e2593] [cursor=pointer]:
              - /url: /wiki/Whirlpool_Corporation
            - text: and
            - link "Zurich Insurance Group" [ref=e2594] [cursor=pointer]:
              - /url: /wiki/Zurich_Insurance_Group
            - text: Slovakia.
          - paragraph [ref=e2595]:
            - text: Bratislava's geographical position in Central Europe has long made Bratislava a crossroads for
            - link "international trade" [ref=e2596] [cursor=pointer]:
              - /url: /wiki/International_trade
            - text: traffic.
            - superscript [ref=e2597]:
              - link "[214]" [ref=e2598] [cursor=pointer]:
                - /url: "#cite_note-217"
            - superscript [ref=e2599]:
              - link "[215]" [ref=e2600] [cursor=pointer]:
                - /url: "#cite_note-218"
            - text: Various ancient
            - link "trade routes" [ref=e2601] [cursor=pointer]:
              - /url: /wiki/Trade_route
            - text: ", such as the"
            - link "Amber Road" [ref=e2602] [cursor=pointer]:
              - /url: /wiki/Amber_Road
            - text: and the
            - link "Danube" [ref=e2603] [cursor=pointer]:
              - /url: /wiki/Danube
            - text: waterway, have crossed territory of present-day Bratislava. Today, Bratislava is a road, railway, waterway and airway hub.
            - superscript [ref=e2604]:
              - link "[216]" [ref=e2605] [cursor=pointer]:
                - /url: "#cite_note-transport-219"
          - heading "Energy" [level=3] [ref=e2607]
          - note [ref=e2608]:
            - text: "Main article:"
            - link "Energy in Slovakia" [ref=e2609] [cursor=pointer]:
              - /url: /wiki/Energy_in_Slovakia
          - figure "Nuclear Power Plant Jaslovské Bohunice" [ref=e2610]:
            - link [ref=e2611] [cursor=pointer]:
              - /url: /wiki/File:Jaslovske_Bohunice_Power_Plant_1.JPG
              - img [ref=e2612]
            - generic [ref=e2613]:
              - text: Nuclear Power Plant
              - link "Jaslovské Bohunice" [ref=e2614] [cursor=pointer]:
                - /url: /wiki/Bohunice_Nuclear_Power_Plant
          - paragraph [ref=e2615]:
            - text: Slovakia is self-sufficient in electricity production following the launch of the third unit of the Mochovce nuclear power plant in 2023.
            - superscript [ref=e2616]:
              - link "[217]" [ref=e2617] [cursor=pointer]:
                - /url: "#cite_note-220"
          - paragraph [ref=e2618]:
            - text: In 2020, Slovakia produced a total of 29,322
            - link "GWh" [ref=e2619] [cursor=pointer]:
              - /url: /wiki/GWh
            - text: of
            - link "electricity" [ref=e2620] [cursor=pointer]:
              - /url: /wiki/Electricity
            - text: .
            - link "Nuclear energy" [ref=e2621] [cursor=pointer]:
              - /url: /wiki/Nuclear_power
            - text: accounted for 54% (15 400 GWh) of total electricity production, followed by 16% by
            - link "hydro power" [ref=e2622] [cursor=pointer]:
              - /url: /wiki/Hydro_power
            - text: energy, 16% natural gas, 8% coal, biofuel 3% and 3% by
            - link "solar energy" [ref=e2623] [cursor=pointer]:
              - /url: /wiki/Solar_energy
            - text: ","
            - superscript [ref=e2624]:
              - link "[218]" [ref=e2625] [cursor=pointer]:
                - /url: "#cite_note-worl823-221"
            - superscript [ref=e2626]:
              - link "[219]" [ref=e2627] [cursor=pointer]:
                - /url: "#cite_note-222"
          - paragraph [ref=e2628]:
            - text: The two nuclear power-plants in Slovakia are in
            - link "Jaslovské Bohunice" [ref=e2629] [cursor=pointer]:
              - /url: /wiki/Jaslovsk%C3%A9_Bohunice_Nuclear_Power_Plant
            - text: and
            - link "Mochovce" [ref=e2630] [cursor=pointer]:
              - /url: /wiki/Mochovce_Nuclear_Power_Plant
            - text: . Jaslovské Bohunice containing two operating reactors. Mochovce containing three operating reactors, unit Mochovce-3 came on-line in January 2023 and unit Mochovce-4 will be completed at the end of 2025.
            - superscript [ref=e2631]:
              - link "[218]" [ref=e2632] [cursor=pointer]:
                - /url: "#cite_note-worl823-221"
            - text: The additional reactors in Mochovce returned Slovakia to being a net exporter of electricity.
            - superscript [ref=e2633]:
              - link "[220]" [ref=e2634] [cursor=pointer]:
                - /url: "#cite_note-223"
            - superscript [ref=e2635]:
              - link "[221]" [ref=e2636] [cursor=pointer]:
                - /url: "#cite_note-224"
          - paragraph [ref=e2637]:
            - text: In 2024, Slovak government approved a plan to build another new nuclear reactor in
            - link "Jaslovské Bohunice" [ref=e2638] [cursor=pointer]:
              - /url: /wiki/Jaslovsk%C3%A9_Bohunice_Nuclear_Power_Plant
            - text: .
            - superscript [ref=e2639]:
              - link "[222]" [ref=e2640] [cursor=pointer]:
                - /url: "#cite_note-225"
          - figure "Slovnaft oil refinery in Bratislava" [ref=e2641]:
            - link [ref=e2642] [cursor=pointer]:
              - /url: /wiki/File:Refinery_of_Slovnaft,_view_from_Nov%C3%BD_most_viewpoint_in_Bratislava,_Bratislava_II_District.jpg
              - img [ref=e2643]
            - generic [ref=e2644]:
              - link "Slovnaft" [ref=e2645] [cursor=pointer]:
                - /url: /wiki/Slovnaft
              - text: oil refinery in Bratislava
          - paragraph [ref=e2646]:
            - link "Slovenský plynárenský priemysel" [ref=e2647] [cursor=pointer]:
              - /url: /wiki/Slovensk%C3%BD_plyn%C3%A1rensk%C3%BD_priemysel
            - text: (Slovak Gas Industry) is the biggest natural gas seller in Slovakia. In 2024, domestic gas production covers roughly 2% of Slovak consumption.
            - superscript [ref=e2648]:
              - link "[223]" [ref=e2649] [cursor=pointer]:
                - /url: "#cite_note-226"
            - text: An average of around 65 million m³ of natural gas is produced, while 4,2 billion m³ of natural gas is imported.
            - superscript [ref=e2650]:
              - link "[224]" [ref=e2651] [cursor=pointer]:
                - /url: "#cite_note-227"
            - text: As of 2025, most of gas imports to Slovakia is from Russia via
            - link "TurkStream" [ref=e2652] [cursor=pointer]:
              - /url: /wiki/TurkStream
            - text: pipeline. TurkStream connects Russia and Turkey, with gas flowing through the Balkans and Hungary before reaching Slovakia.
            - superscript [ref=e2653]:
              - link "[225]" [ref=e2654] [cursor=pointer]:
                - /url: "#cite_note-228"
          - paragraph [ref=e2655]:
            - text: The oil production in Slovakia is even lower than the gas production. In 2021 it reached a volume of 4,500 tons per year with a total oil consumption of around 6 million tons per year.
            - superscript [ref=e2656]:
              - link "[226]" [ref=e2657] [cursor=pointer]:
                - /url: "#cite_note-229"
            - text: Among European Union countries, Slovakia is the most dependent on Russian oil and petroleum products.
            - superscript [ref=e2658]:
              - link "[227]" [ref=e2659] [cursor=pointer]:
                - /url: "#cite_note-230"
            - text: In 2020, Russia was the origin country for 78 percent of the country's total oil imports.
            - link "Slovnaft" [ref=e2660] [cursor=pointer]:
              - /url: /wiki/Slovnaft
            - text: ", with 4,000 employees, is the largest oil refining company in Slovakia, located in Bratislava. The company refines 5.5 to 6 million tonnes of crude oil per annum and produces a broad range of motor fuels, fuel oils and petrochemical products."
          - heading "Transportation" [level=3] [ref=e2662]
          - note [ref=e2663]:
            - text: "Main article:"
            - link "Transport in Slovakia" [ref=e2664] [cursor=pointer]:
              - /url: /wiki/Transport_in_Slovakia
          - figure "A train in the northern town of Vysoké Tatry" [ref=e2665]:
            - link [ref=e2666] [cursor=pointer]:
              - /url: /wiki/File:Strbske_Pleso_pociag_425_2.jpg
              - img [ref=e2667]
            - generic [ref=e2668]:
              - text: A train in the northern town of
              - link "Vysoké Tatry" [ref=e2669] [cursor=pointer]:
                - /url: /wiki/Vysok%C3%A9_Tatry
          - paragraph [ref=e2670]: There are four main motorway D1 to D4 and eight expressways R1 to R8. Many of them are still under construction.
          - paragraph [ref=e2671]:
            - text: The major motorway in Slovakia is
            - link "D1" [ref=e2672] [cursor=pointer]:
              - /url: /wiki/Motorway_D1_(Slovakia)
            - text: ", the motorway connects major cities across Slovakia from west to east, from Bratislava to"
            - link "Trnava" [ref=e2673] [cursor=pointer]:
              - /url: /wiki/Trnava
            - text: ","
            - link "Nitra" [ref=e2674] [cursor=pointer]:
              - /url: /wiki/Nitra
            - text: ","
            - link "Trenčín" [ref=e2675] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8D%C3%ADn
            - text: ","
            - link "Žilina" [ref=e2676] [cursor=pointer]:
              - /url: /wiki/%C5%BDilina
            - text: and beyond. As of 2025, some sections of D1 are still under construction. The
            - link "D2 motorway" [ref=e2677] [cursor=pointer]:
              - /url: /wiki/Motorway_D2_(Slovakia)
            - text: connects it to
            - link "Prague" [ref=e2678] [cursor=pointer]:
              - /url: /wiki/Prague
            - text: ","
            - link "Brno" [ref=e2679] [cursor=pointer]:
              - /url: /wiki/Brno
            - text: and
            - link "Budapest" [ref=e2680] [cursor=pointer]:
              - /url: /wiki/Budapest
            - text: in the north–south direction. A large part of
            - link "D4 motorway" [ref=e2681] [cursor=pointer]:
              - /url: /wiki/Motorway_D4_(Slovakia)
            - text: (an outer bypass), which ease the pressure on Bratislava's highway system, opened in 2021.
            - superscript [ref=e2682]:
              - link "[228]" [ref=e2683] [cursor=pointer]:
                - /url: "#cite_note-231"
            - text: The
            - link "A6 motorway" [ref=e2684] [cursor=pointer]:
              - /url: /wiki/Nordostautobahn
            - text: to
            - link "Vienna" [ref=e2685] [cursor=pointer]:
              - /url: /wiki/Vienna
            - text: connects Slovakia directly to the Austrian motorway system and was opened on 19 November 2007.
            - superscript [ref=e2686]:
              - link "[229]" [ref=e2687] [cursor=pointer]:
                - /url: "#cite_note-232"
          - figure "D1 motorway" [ref=e2688]:
            - link [ref=e2689] [cursor=pointer]:
              - /url: /wiki/File:Dia%C4%BEnica_D1._Pre%C5%A1ov_z%C3%A1pad_21_Slovakia_13.jpg
              - img [ref=e2690]
            - link "D1 motorway" [ref=e2692] [cursor=pointer]:
              - /url: /wiki/Motorway_D1_(Slovakia)
          - paragraph [ref=e2693]:
            - text: Slovakia has three international airports.
            - link "Bratislava Airport" [ref=e2694] [cursor=pointer]:
              - /url: /wiki/Bratislava_Airport
            - text: is the main and largest
            - link "international airport" [ref=e2695] [cursor=pointer]:
              - /url: /wiki/International_airport
            - text: . It is located 9 km northeast of the city centre. It serves civil and governmental, scheduled and unscheduled domestic and international flights. The current runways support the landing of all common types of aircraft currently used. The airport has enjoyed rapidly growing passenger traffic in recent years; it served 279,028 passengers in 2000 and 2,292,712 in 2018.
            - superscript [ref=e2696]:
              - link "[230]" [ref=e2697] [cursor=pointer]:
                - /url: "#cite_note-233"
            - link "Košice International Airport" [ref=e2698] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice_International_Airport
            - text: is an airport serving
            - link "Košice" [ref=e2699] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: . It is the second-largest
            - link "international airport" [ref=e2700] [cursor=pointer]:
              - /url: /wiki/International_airport
            - text: in Slovakia. The
            - link "Poprad–Tatry Airport" [ref=e2701] [cursor=pointer]:
              - /url: /wiki/Poprad%E2%80%93Tatry_Airport
            - text: is the third busiest airport, the airport is located 5 km west-northwest of
            - link "Poprad" [ref=e2702] [cursor=pointer]:
              - /url: /wiki/Poprad
            - text: . It is an airport with one of the highest elevations in Central Europe, at 718 m, which is 150 m higher than
            - link "Innsbruck Airport" [ref=e2703] [cursor=pointer]:
              - /url: /wiki/Innsbruck_Airport
            - text: in Austria.
          - paragraph [ref=e2704]:
            - link "Railways of the Slovak Republic" [ref=e2705] [cursor=pointer]:
              - /url: /wiki/Railways_of_the_Slovak_Republic
            - text: (Železnice Slovenskej Republiky) provides railway transport services on national and international lines.
          - paragraph [ref=e2706]:
            - text: The
            - link "Port of Bratislava" [ref=e2707] [cursor=pointer]:
              - /url: /wiki/Port_of_Bratislava
            - text: is one of the two international
            - link "river ports" [ref=e2708] [cursor=pointer]:
              - /url: /wiki/Port
            - text: in Slovakia. The port connects Bratislava to international boat traffic, especially the interconnection from the
            - link "North Sea" [ref=e2709] [cursor=pointer]:
              - /url: /wiki/North_Sea
            - text: to the
            - link "Black Sea" [ref=e2710] [cursor=pointer]:
              - /url: /wiki/Black_Sea
            - text: via the
            - link "Rhine-Main-Danube Canal" [ref=e2711] [cursor=pointer]:
              - /url: /wiki/Rhine%E2%80%93Main%E2%80%93Danube_Canal
            - text: . Additionally, tourist boats operate from Bratislava's passenger port, including routes to
            - link "Devín" [ref=e2712] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn
            - text: ","
            - link "Vienna" [ref=e2713] [cursor=pointer]:
              - /url: /wiki/Vienna
            - text: and elsewhere. The Port of Komárno is the second largest port in Slovakia with an area of over 20 hectares and is located approximately 100 km east of Bratislava. It lies at the confluence of two rivers – the
            - link "Danube" [ref=e2714] [cursor=pointer]:
              - /url: /wiki/Danube
            - text: and
            - link "Váh" [ref=e2715] [cursor=pointer]:
              - /url: /wiki/V%C3%A1h
            - text: .
          - heading "Tourism" [level=3] [ref=e2717]
          - note [ref=e2718]:
            - text: "Main article:"
            - link "Tourism in Slovakia" [ref=e2719] [cursor=pointer]:
              - /url: /wiki/Tourism_in_Slovakia
          - note [ref=e2720]:
            - text: "See also:"
            - link "List of castles in Slovakia" [ref=e2721] [cursor=pointer]:
              - /url: /wiki/List_of_castles_in_Slovakia
            - text: and
            - link "List of World Heritage Sites in Slovakia" [ref=e2722] [cursor=pointer]:
              - /url: /wiki/List_of_World_Heritage_Sites_in_Slovakia
          - figure "Bojnice Castle" [ref=e2723]:
            - link [ref=e2724] [cursor=pointer]:
              - /url: /wiki/File:Bojnice_Castle_Slovakia.jpg
              - img [ref=e2725]
            - generic [ref=e2726]: Bojnice Castle
          - paragraph [ref=e2727]:
            - text: Tourism is one of the main sectors of the Slovakia's economy, although still underserved. It is based on domestic tourism, as most of the tourists are the Slovak nationals and residents travelling for leisure within the country. Slovakia features natural landscapes, mountains,
            - link "caves" [ref=e2728] [cursor=pointer]:
              - /url: /wiki/List_of_caves_in_Slovakia
            - text: ", medieval"
            - link "castles" [ref=e2729] [cursor=pointer]:
              - /url: /wiki/List_of_castles_in_Slovakia
            - text: and towns, folk architecture, spas and
            - link "ski resorts" [ref=e2730] [cursor=pointer]:
              - /url: /wiki/Ski_and_winter_sports_in_Slovakia
            - text: . More than 5,4 million tourists visited Slovakia in 2017. The most attractive destinations are the capital of
            - link "Bratislava" [ref=e2731] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: and the
            - link "High Tatras" [ref=e2732] [cursor=pointer]:
              - /url: /wiki/High_Tatras
            - text: .
            - superscript [ref=e2733]:
              - link "[231]" [ref=e2734] [cursor=pointer]:
                - /url: "#cite_note-234"
            - text: Most visitors come from the
            - link "Czech Republic" [ref=e2735] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: (about 26%), Poland (15%) and Germany (11%).
            - superscript [ref=e2736]:
              - link "[232]" [ref=e2737] [cursor=pointer]:
                - /url: "#cite_note-235"
          - paragraph [ref=e2738]:
            - text: Slovakia contains many castles, most of which are in ruins. The best known castles include
            - link "Bojnice Castle" [ref=e2739] [cursor=pointer]:
              - /url: /wiki/Bojnice_Castle
            - text: (often used as a filming location),
            - link "Spiš Castle" [ref=e2740] [cursor=pointer]:
              - /url: /wiki/Spi%C5%A1_Castle
            - text: ", (on the UNESCO list),"
            - link "Orava Castle" [ref=e2741] [cursor=pointer]:
              - /url: /wiki/Orava_Castle
            - text: ","
            - link "Bratislava Castle" [ref=e2742] [cursor=pointer]:
              - /url: /wiki/Bratislava_Castle
            - text: ", and the ruins of"
            - link "Devín Castle" [ref=e2743] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn_Castle
            - text: .
            - link "Čachtice Castle" [ref=e2744] [cursor=pointer]:
              - /url: /wiki/%C4%8Cachtice_Castle
            - text: was once the home of the world's most prolific female serial killer, the 'Bloody Lady',
            - link "Elizabeth Báthory" [ref=e2745] [cursor=pointer]:
              - /url: /wiki/Elizabeth_B%C3%A1thory
            - text: .
          - figure "The centre of Bardejov – a UNESCO World Heritage Site" [ref=e2746]:
            - link [ref=e2747] [cursor=pointer]:
              - /url: /wiki/File:Bardejov,_rynek_(HB1).jpg
              - img [ref=e2748]
            - generic [ref=e2749]:
              - text: The centre of
              - link "Bardejov" [ref=e2750] [cursor=pointer]:
                - /url: /wiki/Bardejov
              - text: – a
              - link "UNESCO World Heritage Site" [ref=e2751] [cursor=pointer]:
                - /url: /wiki/UNESCO_World_Heritage_Site
          - paragraph [ref=e2752]:
            - text: Slovakia's position in Europe and the country's past (part of the
            - link "Kingdom of Hungary" [ref=e2753] [cursor=pointer]:
              - /url: /wiki/Kingdom_of_Hungary
            - text: ", the"
            - link "Habsburg" [ref=e2754] [cursor=pointer]:
              - /url: /wiki/Habsburg
            - text: monarchy and
            - link "Czechoslovakia" [ref=e2755] [cursor=pointer]:
              - /url: /wiki/Czechoslovakia
            - text: ) made many cities and towns similar to the cities in the
            - link "Czech Republic" [ref=e2756] [cursor=pointer]:
              - /url: /wiki/Czech_Republic
            - text: (such as
            - link "Prague" [ref=e2757] [cursor=pointer]:
              - /url: /wiki/Prague
            - text: ), Austria (such as
            - link "Salzburg" [ref=e2758] [cursor=pointer]:
              - /url: /wiki/Salzburg
            - text: ) or Hungary (such as
            - link "Budapest" [ref=e2759] [cursor=pointer]:
              - /url: /wiki/Budapest
            - text: ). A historical centre with at least one square has been preserved in many towns. Large historical centres can be found in
            - link "Bratislava" [ref=e2760] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: ","
            - link "Trenčín" [ref=e2761] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8D%C3%ADn
            - text: ","
            - link "Košice" [ref=e2762] [cursor=pointer]:
              - /url: /wiki/Ko%C5%A1ice
            - text: ","
            - link "Banská Štiavnica" [ref=e2763] [cursor=pointer]:
              - /url: /wiki/Bansk%C3%A1_%C5%A0tiavnica
            - text: ","
            - link "Levoča" [ref=e2764] [cursor=pointer]:
              - /url: /wiki/Levo%C4%8Da
            - text: ", and"
            - link "Trnava" [ref=e2765] [cursor=pointer]:
              - /url: /wiki/Trnava
            - text: . Historical centres have been going through a restoration in recent years.
          - paragraph [ref=e2766]:
            - text: Historical churches can be found in virtually every village and town in Slovakia. Most of them are built in the
            - link "Baroque" [ref=e2767] [cursor=pointer]:
              - /url: /wiki/Baroque_architecture
            - text: style, but there are also many examples of
            - link "Romanesque" [ref=e2768] [cursor=pointer]:
              - /url: /wiki/Romanesque_architecture
            - text: and
            - link "Gothic architecture" [ref=e2769] [cursor=pointer]:
              - /url: /wiki/Gothic_architecture
            - text: ", for example"
            - link "Banská Bystrica" [ref=e2770] [cursor=pointer]:
              - /url: /wiki/Bansk%C3%A1_Bystrica
            - text: ", Bardejov and"
            - link "Spišská Kapitula" [ref=e2771] [cursor=pointer]:
              - /url: /wiki/Spi%C5%A1sk%C3%A1_Kapitula
            - text: . The
            - link "Basilica of St. James" [ref=e2772] [cursor=pointer]:
              - /url: /wiki/Basilica_of_St._James,_Levo%C4%8Da
            - text: in Levoča with the tallest wood-carved altar in the world and the Church of the Holy Spirit in
            - link "Žehra" [ref=e2773] [cursor=pointer]:
              - /url: /wiki/%C5%BDehra
            - text: with medieval
            - link "frescos" [ref=e2774] [cursor=pointer]:
              - /url: /wiki/Fresco
            - text: are UNESCO
            - link "World Heritage Sites" [ref=e2775] [cursor=pointer]:
              - /url: /wiki/World_Heritage_Site
            - text: . The
            - link "St. Martin's Concathedral" [ref=e2776] [cursor=pointer]:
              - /url: /wiki/St._Martin%27s_Concathedral
            - text: in
            - link "Bratislava" [ref=e2777] [cursor=pointer]:
              - /url: /wiki/Bratislava
            - text: served as the
            - link "coronation" [ref=e2778] [cursor=pointer]:
              - /url: /wiki/Coronation
            - text: church for the Kingdom of Hungary. The oldest sacral buildings in Slovakia stem from the
            - link "Great Moravian" [ref=e2779] [cursor=pointer]:
              - /url: /wiki/Great_Moravia
            - text: period in the ninth century.
          - figure "Cable cars at Jasná in the Tatra Mountains" [ref=e2780]:
            - link [ref=e2781] [cursor=pointer]:
              - /url: /wiki/File:Jasn%C3%A1_Ski_Resort_-_gondola_lift_Kosodrevina_-_Chopok_(4).jpg
              - img [ref=e2782]
            - generic [ref=e2783]:
              - text: Cable cars at
              - link "Jasná" [ref=e2784] [cursor=pointer]:
                - /url: /wiki/Jasn%C3%A1
              - text: in the Tatra Mountains
          - paragraph [ref=e2785]:
            - text: Very precious structures are the complete wooden churches of northern and northern-eastern Slovakia. Most were built from the 15th century onwards by
            - link "Catholics" [ref=e2786] [cursor=pointer]:
              - /url: /wiki/Catholic
            - text: ","
            - link "Lutherans" [ref=e2787] [cursor=pointer]:
              - /url: /wiki/Lutheran
            - text: and members of
            - link "eastern-rite" [ref=e2788] [cursor=pointer]:
              - /url: /wiki/Eastern_Christianity
            - text: churches.
          - paragraph [ref=e2789]:
            - text: There are many castles located throughout the country. Among the tourists, some of the most popular are
            - link "Bojnice Castle" [ref=e2790] [cursor=pointer]:
              - /url: /wiki/Bojnice_Castle
            - text: ","
            - link "Spiš Castle" [ref=e2791] [cursor=pointer]:
              - /url: /wiki/Spi%C5%A1_Castle
            - text: ","
            - link "Stará Ľubovňa Castle" [ref=e2792] [cursor=pointer]:
              - /url: /wiki/%C4%BDubov%C5%88a_Castle
            - text: ","
            - link "Krásna Hôrka Castle" [ref=e2793] [cursor=pointer]:
              - /url: /wiki/Kr%C3%A1sna_H%C3%B4rka_Castle
            - text: ","
            - link "Orava Castle" [ref=e2794] [cursor=pointer]:
              - /url: /wiki/Orava_Castle
            - text: (where many scenes of
            - link "Nosferatu" [ref=e2795] [cursor=pointer]:
              - /url: /wiki/Nosferatu
            - text: were filmed),
            - link "Trenčín Castle" [ref=e2796] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8D%C3%ADn_Castle
            - text: ", and"
            - link "Bratislava Castle" [ref=e2797] [cursor=pointer]:
              - /url: /wiki/Bratislava_Castle
            - text: ", and also castles in ruins, such as"
            - link "Beckov Castle" [ref=e2798] [cursor=pointer]:
              - /url: /wiki/Beckov_Castle
            - text: ","
            - link "Devín Castle" [ref=e2799] [cursor=pointer]:
              - /url: /wiki/Dev%C3%ADn_Castle
            - text: ","
            - link "Šariš Castle" [ref=e2800] [cursor=pointer]:
              - /url: /wiki/%C5%A0ari%C5%A1_Castle
            - text: ","
            - link "Považie Castle" [ref=e2801] [cursor=pointer]:
              - /url: /wiki/Pova%C5%BEsk%C3%BD_hrad
            - text: ", and"
            - link "Strečno Castle" [ref=e2802] [cursor=pointer]:
              - /url: /wiki/Stre%C4%8Dno_Castle
            - text: (where
            - link "Dragonheart" [ref=e2803] [cursor=pointer]:
              - /url: /wiki/Dragonheart
            - text: was filmed).
          - figure "Spiš Castle" [ref=e2804]:
            - link [ref=e2805] [cursor=pointer]:
              - /url: /wiki/File:20180503_Zamek_Spiski_2953_DxO.jpg
              - img [ref=e2806]
            - link "Spiš Castle" [ref=e2808] [cursor=pointer]:
              - /url: /wiki/Spi%C5%A1_Castle
          - paragraph [ref=e2809]:
            - text: Slovakia is also known for its numerous spas.
            - link "Piešťany" [ref=e2810] [cursor=pointer]:
              - /url: /wiki/Pie%C5%A1%C5%A5any
            - text: is the biggest and busiest spa town in the country, attracting many visitors from the
            - link "Gulf countries" [ref=e2811] [cursor=pointer]:
              - /url: /wiki/Arab_states_of_the_Persian_Gulf
            - text: ", mostly the"
            - link "United Arab Emirates" [ref=e2812] [cursor=pointer]:
              - /url: /wiki/United_Arab_Emirates
            - text: ","
            - link "Qatar" [ref=e2813] [cursor=pointer]:
              - /url: /wiki/Qatar
            - text: ","
            - link "Kuwait" [ref=e2814] [cursor=pointer]:
              - /url: /wiki/Kuwait
            - text: ", and"
            - link "Bahrain" [ref=e2815] [cursor=pointer]:
              - /url: /wiki/Bahrain
            - text: .
            - link "Bardejov" [ref=e2816] [cursor=pointer]:
              - /url: /wiki/Bardejov
            - text: ","
            - link "Trenčianske Teplice" [ref=e2817] [cursor=pointer]:
              - /url: /wiki/Tren%C4%8Dianske_Teplice
            - text: ","
            - link "Turčianske Teplice" [ref=e2818] [cursor=pointer]:
              - /url: /wiki/Tur%C4%8Dianske_Teplice
            - text: ", and"
            - link "Rajecké Teplice" [ref=e2819] [cursor=pointer]:
              - /url: /wiki/Rajeck%C3%A9_Teplice
            - text: are other major spa towns. Some well-known minor spa towns and villages are
            - link "Štós" [ref=e2820] [cursor=pointer]:
              - /url: /wiki/%C5%A0t%C3%B3s
            - text: ","
            - link "Číž" [ref=e2821] [cursor=pointer]:
              - /url: /wiki/%C4%8C%C3%AD%C5%BE
            - text: ","
            - link "Dudince" [ref=e2822] [cursor=pointer]:
              - /url: /wiki/Dudince
            - text: ","
            - link "Kováčová" [ref=e2823] [cursor=pointer]:
              - /url: /wiki/Kov%C3%A1%C4%8Dov%C3%A1,_Zvolen_District
            - text: ","
            - link "Nimnica" [ref=e2824] [cursor=pointer]:
              - /url: /wiki/Nimnica
            - text: ","
            - link "Smrdáky" [ref=e2825] [cursor=pointer]:
              - /url: /wiki/Smrd%C3%A1ky
            - text: ","
            - link "Lúčky" [ref=e2826] [cursor=pointer]:
              - /url: /wiki/L%C3%BA%C4%8Dky,_Ru%C5%BEomberok_District
            - text: ", and"
            - link "Vyšné Ružbachy" [ref=e2827] [cursor=pointer]:
              - /url: /wiki/Vy%C5%A1n%C3%A9_Ru%C5%BEbachy
            - text: ", among others."
          - paragraph [ref=e2828]:
            - text: Typical souvenirs from Slovakia are dolls dressed in folk costumes, ceramic objects, crystal glass, carved wooden figures, črpáks (wooden pitchers),
            - link "fujaras" [ref=e2829] [cursor=pointer]:
              - /url: /wiki/Fujara
            - text: (a
            - link "folk instrument" [ref=e2830] [cursor=pointer]:
              - /url: /wiki/Folk_instrument
            - text: on the UNESCO list) and
            - link "valaškas" [ref=e2831] [cursor=pointer]:
              - /url: /wiki/Vala%C5%A1ka
            - text: (a decorated folk hatchet) and above all products made from
            - link "corn husks" [ref=e2832] [cursor=pointer]:
              - /url: /wiki/Husk
            - text: and wire, notably human figures. Souvenirs can be bought in the shops run by the state organisation ÚĽUV (Ústredie ľudovej umeleckej výroby—Centre of
            - link "Folk Art" [ref=e2833] [cursor=pointer]:
              - /url: /wiki/Folk_art
            - text: Production).
          - heading "Science" [level=3] [ref=e2835]
          - figure "Observatory at the top of the peak Lomnický štít, at the altitude above sea level of 2,632 m (8,635 ft)." [ref=e2836]:
            - link [ref=e2837] [cursor=pointer]:
              - /url: /wiki/File:STANICA_LANOVKY_S_OBSERVAT%C3%93RIOM.JPG
              - img [ref=e2838]
            - generic [ref=e2839]:
              - link "Observatory" [ref=e2840] [cursor=pointer]:
                - /url: /wiki/Observatory
              - text: at the top of the peak
              - link "Lomnický štít" [ref=e2841] [cursor=pointer]:
                - /url: /wiki/Lomnick%C3%BD_%C5%A1t%C3%ADt
              - text: ", at the altitude above sea level of 2,632 m (8,635 ft)."
          - paragraph [ref=e2842]:
            - text: The
            - link "Slovak Academy of Sciences" [ref=e2843] [cursor=pointer]:
              - /url: /wiki/Slovak_Academy_of_Sciences
            - text: has been the most important scientific and research institution in the country since 1953. Slovaks have made notable scientific and technical contributions during history.
            - superscript [ref=e2844]:
              - link "[233]" [ref=e2845] [cursor=pointer]:
                - /url: "#cite_note-236"
            - text: In 1999, astronaut
            - link "Ivan Bella" [ref=e2846] [cursor=pointer]:
              - /url: /wiki/Ivan_Bella
            - text: ", became the first and only Slovak citizen to fly in space."
            - superscript [ref=e2847]:
              - link "[234]" [ref=e2848] [cursor=pointer]:
                - /url: "#cite_note-237"
          - paragraph [ref=e2849]:
            - text: Observer status to
            - link "European Space Agency" [ref=e2850] [cursor=pointer]:
              - /url: /wiki/European_Space_Agency
            - text: (ESA) was granted in 2010, when Slovakia signed the General Agreement on Cooperation in which information about ongoing education programmes was shared and Slovakia was invited to various negotiations of the ESA.
            - superscript [ref=e2851]:
              - link "[235]" [ref=e2852] [cursor=pointer]:
                - /url: "#cite_note-238"
            - text: In 2015, Slovakia signed the European Cooperating State Agreement based on which Slovakia committed to the finance entrance programme named PECS (Plan for the European Cooperating States) which serves as preparation for full membership. Slovak research and development organisations can apply for funding of projects regarding space technologies advancement. Slovakia became European Space Agency associate member state in 2022.
            - superscript [ref=e2853]:
              - link "[236]" [ref=e2854] [cursor=pointer]:
                - /url: "#cite_note-www.esa.int-239"
            - text: In 2024, the country signed the
            - link "Artemis Accords" [ref=e2855] [cursor=pointer]:
              - /url: /wiki/Artemis_Accords
            - text: with
            - link "NASA" [ref=e2856] [cursor=pointer]:
              - /url: /wiki/NASA
            - text: .
            - superscript [ref=e2857]:
              - link "[237]" [ref=e2858] [cursor=pointer]:
                - /url: "#cite_note-240"
          - paragraph [ref=e2859]:
            - text: Slovakia was ranked 47th in the
            - link "Global Innovation Index" [ref=e2860] [cursor=pointer]:
              - /url: /wiki/Global_Innovation_Index
            - text: in 2025.
            - superscript [ref=e2861]:
              - link "[238]" [ref=e2862] [cursor=pointer]:
                - /url: "#cite_note-241"
            - superscript [ref=e2863]:
              - link "[239]" [ref=e2864] [cursor=pointer]:
                - /url: "#cite_note-242"
          - heading "Demographics" [level=2] [ref=e2866]
          - note [ref=e2867]:
            - text: "Main article:"
            - link "Demographics of Slovakia" [ref=e2868] [cursor=pointer]:
              - /url: /wiki/Demographics_of_Slovakia
          - note [ref=e2869]:
            - text: "Further information:"
            - link "List of Slovaks" [ref=e2870] [cursor=pointer]:
