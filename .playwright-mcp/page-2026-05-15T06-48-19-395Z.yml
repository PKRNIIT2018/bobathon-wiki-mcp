              - /url: /wiki/Foreign_relations_of_Slovakia
            - text: and the management of its
            - link "international diplomatic missions" [ref=e2080] [cursor=pointer]:
              - /url: /wiki/List_of_diplomatic_missions_of_Slovakia
            - text: . The ministry's
            - link "director" [ref=e2081] [cursor=pointer]:
              - /url: /wiki/Minister_of_Foreign_Affairs_(Slovakia)
            - text: is
            - link "Juraj Blanár" [ref=e2082] [cursor=pointer]:
              - /url: /wiki/Juraj_Blan%C3%A1r
            - text: . The ministry oversees Slovakia's affairs with foreign entities, including bilateral relations with individual nations and its representation in international organisations.
          - paragraph [ref=e2083]:
            - text: Slovakia joined the
            - link "European Union" [ref=e2084] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: and
            - link "NATO" [ref=e2085] [cursor=pointer]:
              - /url: /wiki/NATO
            - text: in 2004, the
            - link "Schengen Area" [ref=e2086] [cursor=pointer]:
              - /url: /wiki/Schengen_Area
            - text: in 2007 and the
            - link "eurozone" [ref=e2087] [cursor=pointer]:
              - /url: /wiki/Eurozone
            - text: in 2009.
          - paragraph [ref=e2088]:
            - text: Slovakia is a member of the
            - link "United Nations" [ref=e2089] [cursor=pointer]:
              - /url: /wiki/United_Nations
            - text: (since 1993) and participates in its specialised agencies. The country was, on 10 October 2005, elected to a two-year term on the
            - link "UN Security Council" [ref=e2090] [cursor=pointer]:
              - /url: /wiki/United_Nations_Security_Council
            - text: from 2006 to 2007. It is also a member of the
            - link "Council of Europe" [ref=e2091] [cursor=pointer]:
              - /url: /wiki/Council_of_Europe
            - text: (CoE), the
            - link "Organisation for Security and Co-operation in Europe" [ref=e2092] [cursor=pointer]:
              - /url: /wiki/Organization_for_Security_and_Co-operation_in_Europe
            - text: (OSCE), the
            - link "World Trade Organisation" [ref=e2093] [cursor=pointer]:
              - /url: /wiki/World_Trade_Organization
            - text: (WTO), the
            - link "World Health Organization" [ref=e2094] [cursor=pointer]:
              - /url: /wiki/World_Health_Organization
            - text: (WHO), the
            - link "Organisation for Economic Co-operation and Development" [ref=e2095] [cursor=pointer]:
              - /url: /wiki/OECD
            - text: (OECD), the
            - link "International Monetary Fund" [ref=e2096] [cursor=pointer]:
              - /url: /wiki/International_Monetary_Fund
            - text: (IMF), the
            - link "Union for the Mediterranean" [ref=e2097] [cursor=pointer]:
              - /url: /wiki/Union_for_the_Mediterranean
            - text: (UfM), the
            - link "International Criminal Police Organisation" [ref=e2098] [cursor=pointer]:
              - /url: /wiki/International_Criminal_Police_Organization
            - text: (INTERPOL), the
            - link "United Nations Educational, Scientific and Cultural Organisation" [ref=e2099] [cursor=pointer]:
              - /url: /wiki/United_Nations_Educational,_Scientific_and_Cultural_Organization
            - text: (UNESCO), the
            - link "European Organisation for Nuclear Research" [ref=e2100] [cursor=pointer]:
              - /url: /wiki/European_Organization_for_Nuclear_Research
            - text: (CERN), the
            - link "Bucharest Nine" [ref=e2101] [cursor=pointer]:
              - /url: /wiki/Bucharest_Nine
            - text: (B9) and part of the
            - link "Visegrád Group" [ref=e2102] [cursor=pointer]:
              - /url: /wiki/Visegr%C3%A1d_Group
            - text: "(V4: Slovakia, Hungary, the Czech Republic, and Poland)."
          - figure "Slovak Prime Minister Robert Fico with Russian President Vladimir Putin in Beijing, 2025" [ref=e2103]:
            - link [ref=e2104] [cursor=pointer]:
              - /url: /wiki/File:President_Putin_meeting_PM_of_Slovakia_Robert_Fico_(2025).jpg
              - img [ref=e2105]
            - generic [ref=e2106]:
              - text: Slovak Prime Minister
              - link "Robert Fico" [ref=e2107] [cursor=pointer]:
                - /url: /wiki/Robert_Fico
              - text: with Russian President
              - link "Vladimir Putin" [ref=e2108] [cursor=pointer]:
                - /url: /wiki/Vladimir_Putin
              - text: in
              - link "Beijing" [ref=e2109] [cursor=pointer]:
                - /url: /wiki/Beijing
              - text: ", 2025"
          - paragraph [ref=e2110]:
            - text: In 2025, Slovak citizens had visa-free or visa-on-arrival access to 185 countries and territories, putting the
            - link "Slovak passport" [ref=e2111] [cursor=pointer]:
              - /url: /wiki/Slovak_passport
            - text: at the 6th rank of travel freedom (tied with Hungary, Malta, New Zealand, Poland and Slovenia) on the
            - link "Henley Passport Index" [ref=e2112] [cursor=pointer]:
              - /url: /wiki/Henley_Passport_Index
            - text: .
            - superscript [ref=e2113]:
              - link "[174]" [ref=e2114] [cursor=pointer]:
                - /url: "#cite_note-177"
          - paragraph [ref=e2115]:
            - text: Slovakia maintains
            - link "diplomatic relations" [ref=e2116] [cursor=pointer]:
              - /url: /wiki/Diplomacy
            - text: with 134 countries, primarily through its
            - link "Ministry of Foreign Affairs" [ref=e2117] [cursor=pointer]:
              - /url: /wiki/Ministry_of_Foreign_Affairs_(Slovakia)
            - text: . Slovakia maintained 90 missions abroad, including 64 embassies, seven missions to multilateral organisations, nine consulates-general, one consular office, one Slovak Economic and Cultural Office and eight Slovak Institutes.
            - superscript [ref=e2118]:
              - link "[175]" [ref=e2119] [cursor=pointer]:
                - /url: "#cite_note-178"
            - text: Bratislava hosts 41 foreign
            - link "embassies" [ref=e2120] [cursor=pointer]:
              - /url: /wiki/Diplomatic_mission
            - text: and 22
            - link "consulates" [ref=e2121] [cursor=pointer]:
              - /url: /wiki/Consul_(representative)
            - text: .
            - superscript [ref=e2122]:
              - link "[176]" [ref=e2123] [cursor=pointer]:
                - /url: "#cite_note-179"
          - paragraph [ref=e2124]:
            - text: Largest trading partners are countries of the European Union. In 2024, more than 80% of Slovak exports went to the
            - link "European Union" [ref=e2125] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: ", and more than 65% of Slovak imports came from other European Union member states."
            - superscript [ref=e2126]:
              - link "[177]" [ref=e2127] [cursor=pointer]:
                - /url: "#cite_note-Statistical_Office_of_the_Slovak_Republic-2024-180"
          - paragraph [ref=e2128]:
            - text: Slovakia and the
            - link "United States" [ref=e2129] [cursor=pointer]:
              - /url: /wiki/United_States
            - text: retain strong diplomatic ties and cooperate in the
            - link "military" [ref=e2130] [cursor=pointer]:
              - /url: /wiki/Military
            - text: and
            - link "law enforcement" [ref=e2131] [cursor=pointer]:
              - /url: /wiki/Law_enforcement_agency
            - text: areas. U.S. Department of Defence programmes has contributed significantly to Slovak military reforms. The two countries have a long history tracing back to the
            - link "American Revolutionary War" [ref=e2132] [cursor=pointer]:
              - /url: /wiki/American_Revolutionary_War
            - text: ", when a Slovak Major, Ján Ladislav Polerecký, fought alongside"
            - link "George Washington" [ref=e2133] [cursor=pointer]:
              - /url: /wiki/George_Washington
            - text: in
            - link "Yorktowne" [ref=e2134] [cursor=pointer]:
              - /url: /wiki/Siege_of_Yorktown
            - text: to win the colonies' independence.
            - superscript [ref=e2135]:
              - link "[178]" [ref=e2136] [cursor=pointer]:
                - /url: "#cite_note-181"
            - text: President
            - link "Woodrow Wilson" [ref=e2137] [cursor=pointer]:
              - /url: /wiki/Woodrow_Wilson
            - text: and the United States played a major role in the establishment of the original
            - link "Czechoslovak" [ref=e2138] [cursor=pointer]:
              - /url: /wiki/First_Czechoslovak_Republic
            - text: state on 28 October 1918. Around one million Americans have their roots in Slovakia, and many retain strong cultural and familial ties to the Slovak Republic.
          - heading "Military" [level=3] [ref=e2140]
          - note [ref=e2141]:
            - text: "Main article:"
            - link "Slovak Armed Forces" [ref=e2142] [cursor=pointer]:
              - /url: /wiki/Slovak_Armed_Forces
          - note [ref=e2143]:
            - text: "See also:"
            - link "Slovak Air Force" [ref=e2144] [cursor=pointer]:
              - /url: /wiki/Slovak_Air_Force
          - figure "Slovak members of UNFICYP peacekeepers patrolling the buffer zone in Cyprus" [ref=e2145]:
            - link [ref=e2146] [cursor=pointer]:
              - /url: /wiki/File:UNFICYP_peacekeepers_patrolling_the_buffer_zone.jpg
              - img [ref=e2147]
            - generic [ref=e2148]:
              - text: Slovak members of
              - link "UNFICYP" [ref=e2149] [cursor=pointer]:
                - /url: /wiki/UNFICYP
              - text: peacekeepers patrolling the
              - link "buffer zone" [ref=e2150] [cursor=pointer]:
                - /url: /wiki/United_Nations_Buffer_Zone_in_Cyprus
              - text: in Cyprus
          - paragraph [ref=e2151]:
            - text: The president is formally the
            - link "commander-in-chief" [ref=e2152] [cursor=pointer]:
              - /url: /wiki/Commander-in-chief
            - text: of the Slovak armed forces.
          - paragraph [ref=e2153]:
            - text: Slovakia joined
            - link "NATO" [ref=e2154] [cursor=pointer]:
              - /url: /wiki/NATO
            - text: in March 2004.
            - superscript [ref=e2155]:
              - link "[179]" [ref=e2156] [cursor=pointer]:
                - /url: "#cite_note-182"
            - text: From 2006, the army transformed into a fully professional organisation and compulsory military service was abolished. Slovak armed forces numbered 19,500 uniformed personnel and 4,208 civilians in 2022.
            - superscript [ref=e2157]:
              - link "[180]" [ref=e2158] [cursor=pointer]:
                - /url: "#cite_note-183"
          - paragraph [ref=e2159]:
            - text: As of 2025, Slovakia has 240 military personnel deployed in
            - link "Cyprus" [ref=e2160] [cursor=pointer]:
              - /url: /wiki/Cyprus
            - text: for
            - link "UNFICYP" [ref=e2161] [cursor=pointer]:
              - /url: /wiki/UNFICYP
            - link "United Nations" [ref=e2162] [cursor=pointer]:
              - /url: /wiki/United_Nations
            - text: led
            - link "peace support operations" [ref=e2163] [cursor=pointer]:
              - /url: /wiki/Peacekeeping
            - text: ", 50 troops deployed in"
            - link "Bosnia and Herzegovina" [ref=e2164] [cursor=pointer]:
              - /url: /wiki/Bosnia_and_Herzegovina
            - text: for
            - link "EUFOR Althea" [ref=e2165] [cursor=pointer]:
              - /url: /wiki/EUFOR_Althea
            - text: and 135 troops deployed in
            - link "Latvia" [ref=e2166] [cursor=pointer]:
              - /url: /wiki/Latvia
            - text: for
            - link "NATO Enhanced Forward Presence" [ref=e2167] [cursor=pointer]:
              - /url: /wiki/NATO_Enhanced_Forward_Presence
            - text: .
            - superscript [ref=e2168]:
              - link "[181]" [ref=e2169] [cursor=pointer]:
                - /url: "#cite_note-184"
          - paragraph [ref=e2170]:
            - text: The Slovak
            - link "Ground Forces" [ref=e2171] [cursor=pointer]:
              - /url: /wiki/Ground_Forces_of_the_Slovak_Republic
            - text: are made up of two active
            - link "mechanised infantry" [ref=e2172] [cursor=pointer]:
              - /url: /wiki/Mechanised_infantry
            - link "brigades" [ref=e2173] [cursor=pointer]:
              - /url: /wiki/Brigade
            - text: . The
            - link "Air and Air Defence Forces" [ref=e2174] [cursor=pointer]:
              - /url: /wiki/Slovak_Air_Force
            - text: comprise one
            - link "wing" [ref=e2175] [cursor=pointer]:
              - /url: /wiki/Wing_(military_unit)
            - text: of
            - link "fighters" [ref=e2176] [cursor=pointer]:
              - /url: /wiki/Fighter_aircraft
            - text: ", one wing of utility"
            - link "helicopters" [ref=e2177] [cursor=pointer]:
              - /url: /wiki/Helicopter
            - text: ", and one SAM brigade. Training and support forces comprise a National Support Element (Multifunctional Battalion, Transport Battalion, Repair Battalion), a garrison force of the capital city Bratislava, as well as a training battalion, and various logistics, communication, and information bases. Miscellaneous forces under the direct command of the"
            - link "General Staff" [ref=e2178] [cursor=pointer]:
              - /url: /wiki/Staff_(military)
            - text: include the
            - link "5th Special Forces Regiment" [ref=e2179] [cursor=pointer]:
              - /url: /wiki/5th_Special_Operations_Regiment_(Slovakia)
            - text: .
          - heading "Human rights" [level=3] [ref=e2181]
          - note [ref=e2182]:
            - text: "Main article:"
            - link "Human rights in Slovakia" [ref=e2183] [cursor=pointer]:
              - /url: /wiki/Human_rights_in_Slovakia
          - paragraph [ref=e2184]:
            - text: Human rights in Slovakia are guaranteed by the
            - link "Constitution of Slovakia" [ref=e2185] [cursor=pointer]:
              - /url: /wiki/Constitution_of_Slovakia
            - text: from the year 1992 and by multiple international laws signed in Slovakia between 1948 and 2006.
            - superscript [ref=e2186]:
              - link "[182]" [ref=e2187] [cursor=pointer]:
                - /url: "#cite_note-185"
            - text: Slovakia performs favourably in measurements of
            - link "civil liberties" [ref=e2188] [cursor=pointer]:
              - /url: /wiki/Freedom_in_the_World
            - text: ","
            - link "press freedom" [ref=e2189] [cursor=pointer]:
              - /url: /wiki/Press_Freedom_Index
            - text: ","
            - link "internet freedom" [ref=e2190] [cursor=pointer]:
              - /url: /wiki/Internet_censorship_and_surveillance_by_country
            - text: ","
            - link "democratic governance" [ref=e2191] [cursor=pointer]:
              - /url: /wiki/Democracy_Index
            - text: ", and"
            - link "peacefulness" [ref=e2192] [cursor=pointer]:
              - /url: /wiki/Global_Peace_Index
            - text: .
          - paragraph [ref=e2193]:
            - link "The US State Department" [ref=e2194] [cursor=pointer]:
              - /url: /wiki/United_States_Department_of_State
            - text: "in 2021 reported:"
          - blockquote [ref=e2195]:
            - paragraph [ref=e2196]:
              - text: "The government generally respected the human rights of its citizens; however, there were problems in some areas. Significant human rights issues included credible reports of: corruption; violence and threats of violence against Roma and members of other ethnic and racial minorities; and violence and threats of violence targeting lesbian, gay, bisexual, transgender, queer, and intersex persons."
              - superscript [ref=e2197]:
                - link "[183]" [ref=e2198] [cursor=pointer]:
                  - /url: "#cite_note-186"
          - paragraph [ref=e2199]:
            - text: According to the
            - link "European Roma Rights Centre" [ref=e2200] [cursor=pointer]:
              - /url: /wiki/European_Roma_Rights_Centre
            - text: (ERRC),
            - link "Romani people in Slovakia" [ref=e2201] [cursor=pointer]:
              - /url: /wiki/Romani_people_in_Slovakia
            - text: "\"endure racism in the job market, housing and education fields and are often subjected to forced evictions, vigilante intimidation, disproportionate levels of police brutality and more subtle forms of discrimination.\""
            - superscript [ref=e2202]:
              - link "[184]" [ref=e2203] [cursor=pointer]:
                - /url: "#cite_note-187"
          - paragraph [ref=e2204]:
            - text: According to
            - link "International IDEA" [ref=e2205] [cursor=pointer]:
              - /url: /wiki/International_Institute_for_Democracy_and_Electoral_Assistance
            - text: ’s Global State of Democracy (GSoD) Indices and Democracy Tracker, Slovakia performs in the mid-range on overall democratic measures, with particular strengths in political equality and judicial independence.
            - superscript [ref=e2206]:
              - link "[185]" [ref=e2207] [cursor=pointer]:
                - /url: "#cite_note-188"
            - superscript [ref=e2208]:
              - link "[186]" [ref=e2209] [cursor=pointer]:
                - /url: "#cite_note-189"
            - superscript [ref=e2210]:
              - link "[187]" [ref=e2211] [cursor=pointer]:
                - /url: "#cite_note-190"
          - heading "Administrative divisions" [level=3] [ref=e2213]
          - note [ref=e2214]:
            - text: "Main articles:"
            - link "Regions of Slovakia" [ref=e2215] [cursor=pointer]:
              - /url: /wiki/Regions_of_Slovakia
            - text: ","
            - link "Districts of Slovakia" [ref=e2216] [cursor=pointer]:
              - /url: /wiki/Districts_of_Slovakia
            - text: ", and"
            - link "List of municipalities and towns in Slovakia" [ref=e2217] [cursor=pointer]:
              - /url: /wiki/List_of_municipalities_and_towns_in_Slovakia
          - figure "Bratislava, capital and largest city of Slovakia" [ref=e2218]:
            - link [ref=e2219] [cursor=pointer]:
              - /url: /wiki/File:Hlavn%C3%A9_Namestie_(35096533142).jpg
              - img [ref=e2220]
            - generic [ref=e2221]:
              - link "Bratislava" [ref=e2222] [cursor=pointer]:
                - /url: /wiki/Bratislava
              - text: ", capital and largest city of Slovakia"
          - paragraph [ref=e2223]:
            - text: Slovakia is divided into 8
            - link "kraje" [ref=e2225] [cursor=pointer]:
              - /url: /wiki/Kraj
            - text: (singular—kraj, usually translated as "region"), each of which is named after its principal city. Regions have enjoyed a certain degree of autonomy since 2002. Their
            - link "self-governing" [ref=e2226] [cursor=pointer]:
              - /url: /wiki/Self-governance
            - text: bodies are referred to as Self-governing (or autonomous) Regions (sg. samosprávny kraj, pl. samosprávne kraje) or Upper-Tier Territorial Units (sg. vyšší územný celok, pl. vyššie územné celky, abbr. VÚC).
          - paragraph [ref=e2227]:
            - text: The kraje are subdivided into
            - link "okresy" [ref=e2229] [cursor=pointer]:
              - /url: /wiki/Okres
            - text: (sg. okres, usually translated as districts). Slovakia currently has 79 districts.
          - paragraph [ref=e2230]:
            - text: The okresy are further divided into
            - generic "Slovak-language text" [ref=e2231]:
              - link "obce" [ref=e2233] [cursor=pointer]:
                - /url: /wiki/List_of_municipalities_and_towns_in_Slovakia
            - text: (sg.
            - generic "Slovak-language text" [ref=e2234]: obec
            - text: ", usually translated as \"municipality\"). There are currently 2,890 municipalities."
          - paragraph [ref=e2235]:
            - text: In terms of economics and
            - link "unemployment" [ref=e2236] [cursor=pointer]:
              - /url: /wiki/Unemployment
            - text: rate, the western regions are richer than eastern regions. Bratislava is the 19th-richest region of the
            - link "European Union" [ref=e2237] [cursor=pointer]:
              - /url: /wiki/European_Union
            - text: by GDP (PPP) per capita;
            - superscript [ref=e2238]:
              - link "[188]" [ref=e2239] [cursor=pointer]:
                - /url: "#cite_note-191"
            - text: GDP at purchasing power parity is about three times higher than in other Slovak regions.
            - superscript [ref=e2240]:
              - link "[189]" [ref=e2241] [cursor=pointer]:
                - /url: "#cite_note-finweb.hnonline.sk-192"
            - superscript [ref=e2242]:
              - link "[190]" [ref=e2243] [cursor=pointer]:
                - /url: "#cite_note-193"
