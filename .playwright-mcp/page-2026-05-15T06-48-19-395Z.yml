          - paragraph [ref=e1967]:
            - text: Slovakia is a
            - link "parliamentary democratic" [ref=e1968] [cursor=pointer]:
              - /url: /wiki/Parliamentary_system
            - text: republic with a
            - link "multi-party system" [ref=e1969] [cursor=pointer]:
              - /url: /wiki/Multi-party_system
            - text: . The last
            - link "parliamentary elections" [ref=e1970] [cursor=pointer]:
              - /url: /wiki/2023_Slovak_parliamentary_election
            - text: were held on 30 September 2023 and two rounds of
            - link "presidential elections" [ref=e1971] [cursor=pointer]:
              - /url: /wiki/2024_Slovak_presidential_election
            - text: took place on 23 March and 6 April 2024.
          - paragraph [ref=e1972]:
            - text: The Slovak
            - link "head of state" [ref=e1973] [cursor=pointer]:
              - /url: /wiki/Head_of_state
            - text: and the formal head of the executive is the president (currently
            - link "Peter Pellegrini" [ref=e1974] [cursor=pointer]:
              - /url: /wiki/Peter_Pellegrini
            - text: ), though with very limited powers. The president is elected by direct, popular vote under the
            - link "two-round system" [ref=e1975] [cursor=pointer]:
              - /url: /wiki/Two-round_system
            - text: for a five-year term. Most
            - link "executive" [ref=e1976] [cursor=pointer]:
              - /url: /wiki/Executive_(government)
            - text: power lies with the
            - link "head of government" [ref=e1977] [cursor=pointer]:
              - /url: /wiki/Head_of_government
            - text: ", the prime minister (currently"
            - link "Robert Fico" [ref=e1978] [cursor=pointer]:
              - /url: /wiki/Robert_Fico
            - text: ), who is usually the leader of the winning party and who needs to form a majority coalition in the parliament. The prime minister is appointed by the president. The remainder of the cabinet is appointed by the president on the recommendation of the prime minister.
          - paragraph [ref=e1979]:
            - text: Slovakia's highest
            - link "legislative" [ref=e1980] [cursor=pointer]:
              - /url: /wiki/Legislature
            - text: body is the 150-seat
            - link "unicameral" [ref=e1981] [cursor=pointer]:
              - /url: /wiki/Unicameralism
            - link "National Council of the Slovak Republic" [ref=e1982] [cursor=pointer]:
              - /url: /wiki/National_Council_(Slovakia)
            - text: (Národná rada Slovenskej republiky). Delegates are elected for a four-year term on the basis of
            - link "proportional representation" [ref=e1983] [cursor=pointer]:
              - /url: /wiki/Proportional_representation
            - text: .
          - paragraph [ref=e1984]:
            - text: Slovakia's highest
            - link "judicial body" [ref=e1985] [cursor=pointer]:
              - /url: /wiki/Judiciary
            - text: is the
            - link "Constitutional Court of Slovakia" [ref=e1986] [cursor=pointer]:
              - /url: /wiki/Constitutional_Court_of_Slovakia
            - text: (Ústavný súd), which rules on constitutional issues. The 13 members of this court are appointed by the president from a slate of candidates nominated by parliament.
          - paragraph [ref=e1987]:
            - text: The
            - link "Constitution of the Slovak Republic" [ref=e1988] [cursor=pointer]:
              - /url: /wiki/Constitution_of_Slovakia
            - text: was ratified 1 September 1992, and became effective 1 January 1993. It was amended in September 1998 to allow
            - link "direct election" [ref=e1989] [cursor=pointer]:
              - /url: /wiki/Direct_election
            - text: of the president and again in February 2001 due to EU admission requirements. The
            - link "civil law system" [ref=e1990] [cursor=pointer]:
              - /url: /wiki/Civil_law_(legal_system)
            - text: is based on Austro-Hungarian codes. The
            - link "legal code" [ref=e1991] [cursor=pointer]:
              - /url: /wiki/Code_of_law
            - text: was modified to comply with the obligations of
            - link "Organisation on Security and Cooperation in Europe" [ref=e1992] [cursor=pointer]:
              - /url: /wiki/Organization_for_Security_and_Co-operation_in_Europe
            - text: (OSCE) and to expunge the
            - link "Marxist–Leninist" [ref=e1993] [cursor=pointer]:
              - /url: /wiki/Marxism%E2%80%93Leninism
            - link "legal theory" [ref=e1994] [cursor=pointer]:
              - /url: /wiki/Law
            - text: . Slovakia accepts the compulsory
            - link "International Court of Justice" [ref=e1995] [cursor=pointer]:
              - /url: /wiki/International_Court_of_Justice
            - text: jurisdiction with reservations.
