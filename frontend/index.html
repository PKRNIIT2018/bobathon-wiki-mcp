<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Search - MCP Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="50" height="50" viewBox="0 0 50 50">
                    <circle cx="25" cy="25" r="20" fill="#fff" stroke="#000" stroke-width="2"/>
                    <text x="25" y="32" font-size="24" text-anchor="middle" fill="#000">W</text>
                </svg>
            </div>
            <h1>Wikipedia Search</h1>
            <p class="subtitle">Powered by Model Context Protocol + Playwright</p>
        </header>

        <main>
            <div class="search-section">
                <form id="searchForm" class="search-form">
                    <div class="search-input-wrapper">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Enter a topic to search Wikipedia..."
                            autocomplete="off"
                            required
                        >
                        <button type="submit" id="searchButton">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/>
                            </svg>
                            Search
                        </button>
                    </div>
                </form>

                <div class="examples">
                    <span>Try:</span>
                    <button class="example-btn" data-topic="Artificial Intelligence">Artificial Intelligence</button>
                    <button class="example-btn" data-topic="Model Context Protocol">Model Context Protocol</button>
                    <button class="example-btn" data-topic="Web Scraping">Web Scraping</button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Searching Wikipedia...</p>
            </div>

            <div id="error" class="error" style="display: none;">
                <div class="error-icon">⚠️</div>
                <h3>Search Failed</h3>
                <p id="errorMessage"></p>
                <button id="retryButton" class="retry-btn">Try Again</button>
            </div>

            <div id="results" class="results"></div>
        </main>

        <footer>
            <div class="footer-content">
                <p>
                    <strong>MCP Demo</strong> - This application demonstrates the Model Context Protocol 
                    using Playwright MCP server for automated Wikipedia searches.
                </p>
                <div class="tech-stack">
                    <span class="badge">MCP</span>
                    <span class="badge">Playwright</span>
                    <span class="badge">Node.js</span>
                    <span class="badge">Express</span>
                </div>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
